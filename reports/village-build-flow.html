  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||

      new CustomEvent(&quot;openai:set_globals&quot;, {

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    { capture: true },

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

  syncTheme();

      &lt;div&gt;&lt;code&gt;AUTO&lt;/code&gt; 실행 중 반영 → 조화 검수 → 최대 2회 수정 → 남은 문제 보고&lt;/div&gt;
      &lt;div&gt;&lt;code&gt;review&lt;/code&gt; 초안 작업 → 검수 → 사람이 적용 / &lt;code&gt;step&lt;/code&gt; 의미 있는 단계마다 승인·스냅샷&lt;/div&gt;
      &lt;div&gt;&lt;code&gt;YOLO&lt;/code&gt; 별도 조화 검수·승인 없이 반영. 마을 완료 검사에서 남은 문제는 미완료로 표시&lt;/div&gt;
      &lt;div&gt;&lt;code&gt;run_village_pipeline / start_village_session&lt;/code&gt; 내부 호환용 레거시. Pi에는 노출되지 않음&lt;/div&gt;

  &lt;script&gt;
    (function () {
      var root = document.getElementById(&quot;village-build-flow&quot;);

      var rail = document.getElementById(&quot;vbf-rail&quot;);

      var shot = document.getElementById(&quot;vbf-shot&quot;);

      var src = {
        blank: document.getElementById(&quot;vbf-img-blank&quot;).src,
        detail: document.getElementById(&quot;vbf-img-detail&quot;).src,

      document.getElementById(&quot;vbf-strip-map&quot;).src = src.map;

      var stages = [
        {
          label: &quot;입력&quot;,
          title: &quot;1 · 한 줄이 턴 하나가 된다&quot;,
          sub: &quot;조수 창 입력이 Pi 턴으로 바뀐다&quot;,
          fn: [&quot;send()&quot;, &quot;plainPiCommand()&quot;, &quot;parsePiCommand()&quot;, &quot;ensureConfigReadyForSend()&quot;],
          note: &quot;컴포저 모드(do / ask / plan)와 자율성 다이얼이 이 턴의 권한을 정합니다. 「마을을 지어라」는 do + 균형이면 쓰기가 허용됩니다.&quot;
        },
        {
          label: &quot;의도&quot;,
          title: &quot;2 · 원문을 구조로 읽는다&quot;,
          sub: &quot;문장 판정이 아니라 별도 모델 호출&quot;,
          fn: [&quot;plainPiTurn()&quot;, &quot;declareIntentCached()&quot;, &quot;createLlmIntentDeclarer()&quot;, &quot;buildIntentFacts()&quot;],
          note: &quot;6초 타임아웃의 의도 선언이 mode=create · needsPlan · tools[author_village] · construction.houseCount 를 뽑습니다. 실패하면 전체 카탈로그 폴백입니다.&quot;

        {

          sub: &quot;읽기 전용 여부·턴 예산·추론 강도 + 마을 시공 노트&quot;,
          fn: [&quot;resolvePiRunPlan()&quot;, &quot;buildPiIntentNote()&quot;, &quot;formatPiVillageNote()&quot;, &quot;composePiTask()&quot;, &quot;buildSessionRegistryTools()&quot;, &quot;runPiCommand(조건부 계획)&quot;],
          note: &quot;DB 기본 설계서가 있으면 집 수·고정 자연 설정을 도구가 채웁니다. 설계서가 없고 수량도 없으면 12채를 안내합니다. 단독·쓰기·큰 작업이며 YOLO가 아니면 Ultrabrain 읽기 전용 계획을 먼저 실행합니다.&quot;
        },
        {
          label: &quot;워커&quot;,
          title: &quot;4 · 브라우저가 아니라 동반 워커가 모델을 부른다&quot;,
          sub: &quot;프로젝트 사본을 실어 보내고 NDJSON 진행을 받는다&quot;,
          fn: [&quot;runPiCommand()&quot;, &quot;createPiPublication()&quot;, &quot;runPiAgentViaCompanion()&quot;, &quot;oh-my-pi-worker.ts&quot;, &quot;runPiAgent()&quot;],
          note: &quot;Bun 워커는 5초마다 heartbeat 를 씁니다(30초 침묵은 고장). idleTimeout:0 이 없으면 10초 침묵에 소켓이 끊겨 팀 마을 시공이 통째로 중단됩니다.&quot;

        {
          label: &quot;툴 노출&quot;,
          title: &quot;5 · 이번 턴에 쓸 툴만 레지스트리에서 얹는다&quot;,
          sub: &quot;초기 노출은 의도 기반 이름 목록&quot;,
          fn: [&quot;createPiToolset()&quot;, &quot;selectPiToolDefinitions()&quot;, &quot;runTool()&quot;, &quot;authorVillageToolDef.run()&quot;],
          note: &quot;읽기 전용 턴은 author_village 를 목록에서도 보지 못합니다 — 그래서 3단계 노트가 유일한 이름 공급원입니다.&quot;
        },
        {
          label: &quot;사전 검사·자리&quot;,
          title: &quot;6 · 거부할 것과 비워 둘 자리를 먼저 정한다&quot;,
          sub: &quot;타일 하나 칠하기 전에 맵 수용성과 물·광장 자리를 확정&quot;,
          fn: [&quot;resolveVillageDesignInput()&quot;, &quot;fillMissingVillageDimensions()&quot;, &quot;estimateVillageSize()&quot;, &quot;parseAuthorVillageRequest()&quot;, &quot;assertTargetTilesetUsable()&quot;, &quot;assertTargetCapacity()&quot;, &quot;buildTerrainConstraintMasks()&quot;, &quot;villagePlaza()&quot;, &quot;villageBoulevard()&quot;],
          note: &quot;combined_town 칩셋이 아니면 시공 전에 거부합니다(반쯤 지은 초안 방지). 이미 내용이 있는 맵은 bounds 나 fullMap 없이는 거부합니다. 물 자리는 예약만 하고 실제 물은 10단계에서 칩니다.&quot;
        },
        {
          label: &quot;집&quot;,
          title: &quot;7 · 시공 방식에 맞게 집을 세운다&quot;,
          sub: &quot;집을 먼저 세우고 보호 등록한다&quot;,
          fn: [&quot;buildHouses()&quot;, &quot;buildObjectHouses()&quot;, &quot;buildMorphologyVillage()&quot;, &quot;sketchHouseSites()&quot;, &quot;finishVillageHouseDecor()&quot;, &quot;captureHouseProtection()&quot;, &quot;createVillageHouseInteriors()&quot;],
          note: &quot;author_village는 확정된 houseCount로 시공합니다. 수량 생략은 DB 설계서가 채울 수 있습니다. 내부 시공기는 형태·오브젝트·morphology에 따라 분기하므로 모든 집 함수가 순서대로 호출되는 것은 아닙니다.&quot;

        {
          label: &quot;길&quot;,
          title: &quot;8 · 문 앞을 잇고 길을 한 덩어리로 만든다&quot;,

          fn: [&quot;paintVillageRoadsChecked()&quot;, &quot;villageArteryRoutes()&quot;, &quot;connectHousesToRoads()&quot;, &quot;ensureSingleRoadComponent()&quot;, &quot;breakLongStraightRuns()&quot;],

        },
        {
          label: &quot;나무·숲&quot;,
          title: &quot;9 · 숲 띠와 마을 소품&quot;,
          sub: &quot;밀도는 모델이 넣고, 생략하면 DB 생성 규칙이 정한다&quot;,
          fn: [&quot;runTerrainConstraintPass(trees)&quot;, &quot;placeVillageTrees()&quot;, &quot;plantCompactVillageTrees()&quot;, &quot;completeVillageTrees()&quot;, &quot;treeKitForTileset()&quot;],
          note: &quot;코드는 테마 문장을 정규식으로 읽지 않습니다. 숲=dense, 울창·통행 불가=impassable 처럼 모델이 enum 으로 넘깁니다.&quot;
        },
        {
          label: &quot;물·마당&quot;,
          title: &quot;10 · 예약해 둔 물을 이제 칠한다&quot;,

          fn: [&quot;runTerrainConstraintPass(water)&quot;, &quot;paintOrganicVillageLake()&quot;, &quot;finishVillageDecoration()&quot;, &quot;scrubPlacementConflicts()&quot;],
          note: &quot;물을 먼저 칠하면 집과 길이 물 위에 남습니다. 물 위 소품과 통행불가 위 수관은 마지막에 정리합니다.&quot;
        },
        {
          label: &quot;주민·시작점&quot;,
          title: &quot;11 · 사는 사람과 시작 좌표&quot;,
          sub: &quot;대사는 코드가 지어내지 않는다&quot;,
          fn: [&quot;placeVillageNpcs()&quot;, &quot;ensureVillageStartPosition()&quot;, &quot;npcText()&quot;],
          note: &quot;residents[].lines를 주면 대사가 들어갑니다. 생략하면 Pi 종료 검사에서 새 마을 주민의 빈 페이지를 모아 author_npc_cast 보충을 요청합니다. 최대 2회 수정 후에도 비어 있으면 미완료입니다. 기존 맵 시작점은 복원·보호합니다.&quot;
        },
        {
          label: &quot;감사·게이트&quot;,
          title: &quot;12 · 성공을 주장하기 전에 세는 단계&quot;,
          sub: &quot;필수 랜드마크는 warning 이 아니라 실패&quot;,
          fn: [&quot;auditVillage()&quot;, &quot;critiqueBuiltVillage()&quot;, &quot;countWaterCells()&quot;, &quot;countTreeCells()&quot;, &quot;countMarketCells()&quot;, &quot;assertHouseProtection()&quot;, &quot;inspectVillageBuild()&quot;, &quot;assertVillagePostconditions()&quot;, &quot;assertVillageMutationScope()&quot;, &quot;inspectPiVillageCompletion()&quot;, &quot;piVillageRepairPrompt()&quot;],
          note: &quot;시공 도구는 집 수·문 연결·길 연결과 범위를 검사합니다. Pi는 최종 맵을 inspectPiVillageCompletion으로 다시 평가합니다. 룩·새 주민 대사가 미달이면 보충·수정 후 재검사하고, 해결되지 않으면 미완료 정보를 반환합니다.&quot;
        },
        {
          label: &quot;반영·검수&quot;,
          title: &quot;13 · 반영과 완성 판정은 서로 다르다&quot;,
          sub: &quot;적용 모드가 사람 확인 지점을 정한다&quot;,
          fn: [&quot;map_delta → createPiGhostBridge()&quot;, &quot;mergeMapBundles(명시 범위·팀)&quot;, &quot;applyProposedProject()&quot;, &quot;reviewMapHarmony()&quot;, &quot;recordProjectSnapshot()&quot;],
          note: &quot;DEFAULT/AUTO는 도구 실행 중 실제 맵에 반영하므로 이후 검수 실패가 자동 롤백을 뜻하지 않습니다. review는 초안을 승인한 뒤 반영, step은 단계마다 승인·되돌리기입니다. 다른 모드는 첫 반영 스냅샷을 유지합니다. DB 저장·재로드 성공은 이 그림으로 증명하지 않습니다.&quot;
        }
      ];

      var provenance = {
        blank: &quot;과거 편집기 참고 이미지 · 이번 턴의 시작 상태 또는 단계별 캡처 아님&quot;,
        detail: &quot;결정론 시공 참고 이미지 · 자연어 end-to-end 성공 증거 아님&quot;,
        map: &quot;결정론 시공 전체 지도 · 이번 수정의 실행 결과 아님&quot;,
        applied: &quot;과거 팀 실행 참고 · author_village 경로 증거 아님 · 검수 미완료 기록&quot;
      };
      var shotPlan = [
        { img: &quot;blank&quot;, caption: &quot;아직 잔디와 길만 있는 편집기 화면 — 조수에게 마을을 맡기기 전.&quot; },
        { img: &quot;blank&quot;, caption: &quot;맵은 그대로입니다. 조수는 아직 읽기만 합니다.&quot; },
        { img: &quot;blank&quot;, caption: &quot;여전히 맵 변경 없음 — 실행 계획과 노트만 정해졌습니다.&quot; },
        { img: &quot;blank&quot;, caption: &quot;워커가 돌기 시작했습니다. 아직 초안 단계입니다.&quot; },
        { img: &quot;blank&quot;, caption: &quot;author_village 가 호출됩니다.&quot; },
        { img: &quot;blank&quot;, caption: &quot;광장 자리와 물 자리를 예약한 상태 — 타일은 아직입니다.&quot; },
        { img: &quot;detail&quot;, caption: &quot;집이 섰습니다. 지붕·문·마당이 함께 만들어집니다.&quot; },
        { img: &quot;detail&quot;, caption: &quot;길이 문 앞을 잇고 하나의 성분으로 이어졌습니다.&quot; },
        { img: &quot;map&quot;, caption: &quot;숲 띠와 마을 소품이 들어왔습니다.&quot; },
        { img: &quot;map&quot;, caption: &quot;예약해 둔 물이 칠해지고 마당·울타리·장식이 마감됩니다.&quot; },
        { img: &quot;map&quot;, caption: &quot;주민과 시작 좌표가 자리를 잡았습니다.&quot; },
        { img: &quot;map&quot;, caption: &quot;실측 수치로 구조 QA 를 통과한 상태입니다.&quot; },
        { img: &quot;applied&quot;, caption: &quot;적용 영수증이 남았습니다 — 툴 76회, 바뀐 맵 1개, 되돌리기 가능.&quot; }
      ];

      function render(index) {
        var stage = stages[index];
        var chain = stage.fn.map(function (name) {
          return &quot;&lt;code&gt;&quot; + name + &quot;&lt;/code&gt;&quot;;
        }).join(&#x27;&lt;span class=&quot;text-muted&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&#x27;);
        detail.innerHTML =
          &quot;&lt;h3&gt;&quot; + stage.title + &quot;&lt;/h3&gt;&quot; +
          &#x27;&lt;p class=&quot;text-small&quot;&gt;&#x27; + stage.sub + &quot;&lt;/p&gt;&quot; +
          &#x27;&lt;div class=&quot;vbf-chain&quot;&gt;&#x27; + chain + &quot;&lt;/div&gt;&quot; +
          &quot;&lt;p&gt;&quot; + stage.note + &quot;&lt;/p&gt;&quot;;
        Array.prototype.forEach.call(rail.querySelectorAll(&quot;button&quot;), function (button, i) {
          button.setAttribute(&quot;aria-pressed&quot;, i === index ? &quot;true&quot; : &quot;false&quot;);
        });
        var plan = shotPlan[index];
        shot.src = src[plan.img];
        shotCaption.textContent = provenance[plan.img];
      }

      stages.forEach(function (stage, index) {
        var button = document.createElement(&quot;button&quot;);
        button.type = &quot;button&quot;;
        button.className = &quot;btn&quot;;
        button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        button.textContent = (index + 1) + &quot; &quot; + stage.label;
        button.addEventListener(&quot;click&quot;, function () { render(index); });
        rail.appendChild(button);
      });

      render(0);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();

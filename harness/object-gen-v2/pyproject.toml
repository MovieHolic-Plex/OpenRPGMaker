[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-gen-v2"
version = "0.1.0"
description = "Carbon Medium pure 1-pass 3/4 pixel-art object generator & oprn-store-pack/1 compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "numpy>=1.24.0",
]

[project.scripts]
object-gen-v2 = "objectgen_v2.cli:main"

[tool.setuptools.packages.find]
include = ["objectgen_v2*"]

name: ci-full

# 전체 게이트 — 야간 + 수동. **푸시마다 돌리지 않는다.**
#
# 왜 이 모양인가 (2026-09-17 실측):
#   전체 vitest 는 2,338 파일 / 22,546 케이스 = 약 4.3 CPU-시간이다. 워커 수(8/16/24/32),
#   pool(forks/threads/vmForks), --no-isolate 를 전부 재봤고 **어느 것도 벽시계를 줄이지 못했다**
#   (표본 173파일 고정: 201/201/204/204초, 201/202/246초, no-isolate 는 누적 상호작용으로 행).
#   느린 이유는 스위트가 아니라 박스 경합이었다 — 이 잡은 32코어 중 5.64코어만 받았다.
#   그래서 답은 "빨리 돌리기"가 아니라 "자리를 보장하고 가끔 돌리기"다.
#
#   실행은 self-hosted 러너에서 하고, 러너는 systemd 의 ci.slice(8코어/24GB) 안에 있다.
#   러너가 1개라 잡이 직렬화되므로 전체 vitest 두 개가 동시에 뜨는 일이 구조적으로 없다.
#
# 판정은 verify-gates.mjs 가 한다. 이 스크립트는 .omo/gates-baseline.json 과 대조해
# **새로 생긴 실패만** 회귀로 보고 exit 1 을 낸다. 기준선은 CI 가 절대 갱신하지 않는다 —
# 사람이 `node scripts/verify-gates.mjs --save-baseline` 으로 내리는 결정이다(래칫 보호).

on:
  schedule:
    # 03:17 KST (18:17 UTC 전날). 정각을 피해 잡아 둔다.
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-full
  cancel-in-progress: false

jobs:
  gates:
    runs-on: [self-hosted, oprn-box]
    # 러너가 1개라 앞선 잡을 기다릴 수 있다. self-hosted 잡 상한은 5일이라 여유롭게 잡아도 된다.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 환경 확인 (cgroup 예산이 실제로 걸려 있는지)
        run: |
          echo "node: $(node -v) / npm: $(npm -v)"
          echo "availableParallelism: $(node -e 'console.log(require("os").availableParallelism())')"
          echo "nproc(참고): $(nproc)"

      - run: npm ci

      - name: 자원 스냅샷 (시작)
        run: node scripts/ci-resource-report.mjs start

      # verify-gates 가 typecheck / tests / css / surface 를 모두 돌고 기준선과 대조한다.
      # 회귀가 없으면 exit 0, 있으면 exit 1.
      - name: 전체 게이트 (기준선 대비 회귀만 실패)
        id: gates
        run: node scripts/verify-gates.mjs

      # 게이트가 실패해도 자원 리포트는 반드시 남긴다 — 조용히 죽는 경우가 바로 이걸로 진단된다.
      - name: 자원 리포트
        if: always()
        run: node scripts/ci-resource-report.mjs report "전체 게이트"

      # 리포트를 **박스 디스크에** 남긴다. actions/upload-artifact 를 쓰지 않는 이유:
      # 계정의 아티팩트 저장소 쿼터가 이미 차 있다(2026-09-17 실측, 첫 ci-full 실행에서
      # `Failed to CreateArtifact: Artifact storage quota has been hit`). 이 저장소가 쓰는
      # 아티팩트는 0개·0.0MB 이므로 다른 저장소가 먹은 것이고, 여기서 고칠 수 없다.
      # 어차피 러너가 우리 박스라 업로드는 왕복일 뿐이다 — 로컬에 두면 용량 제한도,
      # 14일 만료도 없고 `jq` 로 바로 열어볼 수 있다.
      - name: vitest 리포트 보관
        if: always()
        run: |
          set -euo pipefail
          dest="$HOME/ci/reports/$(date -u +%Y%m%d-%H%M%S)-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          for f in .omo/gates-vitest-report.json .omo/gates-baseline.json; do
            [ -f "$f" ] && cp "$f" "$dest/" || echo "없음: $f"
          done
          git rev-parse HEAD > "$dest/commit.txt"
          echo "보관 위치: $dest"
          ls -la "$dest"
          {
            echo "### vitest 리포트"
            echo ""
            echo "러너 박스의 \`$dest\` 에 있다 (아티팩트 쿼터 소진으로 업로드 대신 로컬 보관)."
          } >> "$GITHUB_STEP_SUMMARY"
          # 30일 넘은 보관본은 지운다. 리포트 하나가 수 MB 라 방치하면 쌓인다.
          find "$HOME/ci/reports" -maxdepth 1 -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true

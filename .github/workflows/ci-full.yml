name: ci-full

# 전체 게이트 — 4시간마다 main(cron) + 수동.
# 다른 브랜치의 푸시마다 돌리지는 않는다. GitHub 호스티드 러너(ubuntu-latest)에서 돈다.
#
# 왜 테스트를 샤드로 나누는가 (2026-10-12, run 38238570454):
#   ubuntu-latest 는 4코어/16GB 이고 cgroup 은 max 라 run-vitest 가 VM 크기로 예산을 잡는다.
#   16GB 에서는 워커 1개 × 힙 12GB 다. 최악 파일은 8GB 힙에서 `invalid table size` 로 죽어서
#   힙을 더 줄여 워커를 늘릴 수 없다. 그 한 잡이 239분 33초, CPU 18742초, 피크 15.01GiB 를
#   쓰고도 JSON 리포트를 못 남긴 채 240분 상한에 취소됐다.
#   같은 기계를 워커로 쪼개면 힙이 모자라고, 러너를 네 대 쓰면 힙 12GB 를 유지한 채 벽시계가
#   대략 1/4 이 된다. 샤드는 실패 파일만 기준선과 대조하므로 다른 샤드의 파일은 회귀가 아니다.
#
#   예전 32코어 박스에서는 워커를 늘려도 벽시계가 안 줄었다(경합). 그 측정은 호스티드 16GB 에
#   그대로 옮기지 않는다.
#
#   이 저장소는 공개라 소유자 컴퓨터의 self-hosted 러너에서 포크 코드를 돌리지 않는다.
#   "같은 브랜치의 전체 vitest 두 개 동시 실행"은 아래 concurrency group 이 막는다.
#
#   수동 실행(workflow_dispatch)은 브랜치마다 따로 줄을 선다 (2026-10-24, run 40055350951).
#   전에는 저장소 전체가 그룹 하나였고 대기 자리도 하나라, PR 브랜치로 수동 실행을 걸어 두면
#   main 실행이 들어오는 순간 대기 중이던 그 실행이 취소됐다. 앞의 main 실행이 몇 시간씩
#   도는 날에는 PR 브랜치의 전체 vitest 가 영영 시작되지 못한다. 러너는 호스티드라 잡마다
#   VM 이 따로라서 그룹을 나눠도 메모리를 나눠 쓰지 않는다. main cron 은 그대로
#   그룹 하나(`ci-full-main`)를 쓴다.
#
# 판정은 verify-gates.mjs 가 한다. 이 스크립트는 .omo/gates-baseline.json 과 대조해
# **새로 생긴 실패만** 회귀로 보고 exit 1 을 낸다. 기준선은 CI 가 절대 갱신하지 않는다 —
# 사람이 `node scripts/verify-gates.mjs --save-baseline` 으로 내리는 결정이다(래칫 보호).

# 언제 도는가 (2026-10-25 바꿈): main 푸시가 아니라 **4시간마다 cron** 이 그때의 main 머리를 돈다.
#   전에는 main 푸시마다 걸었다. 한 판이 약 3~4시간(샤드 넷 중 가장 느린 것)인데 머지는 시간당 수십 건이라,
#   그룹 `ci-full-main` 의 대기 자리 하나를 새 푸시가 계속 빼앗았다 — 최근 60판 중 51판이 「cancelled」로
#   남았다(실측 2026-10-25). 실제로 끝나는 판은 4시간에 한 번뿐이었고, 그 판이 어느 커밋인지는 우연이었다.
#   cron 이면 같은 4시간에 한 판이 정해진 시각에 돌고, 대기열 취소가 없어 Actions 목록이 「취소」로 덮이지 않는다.
#   러너 예산도 같다(하루 6판 × 잡 5개). PR 머지 전 판정은 ci-fast(pull_request) 몫이다.
#   ci-full 의 일은 「main 이 기준선보다 나빠졌나」를 하루 여러 번 확인하는 것이다.
#   cron 이 앞 판이 끝나기 전에 오면 그 판은 기다렸다가 돈다(cancel-in-progress: false, 대기 자리 하나).
#   급하면 `gh workflow run ci-full.yml --ref main` 으로 당장 한 판 건다.
on:
  schedule:
    # 4시간마다(UTC 0:17·4:17·8:17·12:17·16:17·20:17). 한 판이 4시간을 넘기면 다음 판이 대기 줄에 선다.
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: 환경 확인 (cgroup 예산이 실제로 걸려 있는지)
        run: |
          echo "node: $(node -v) / npm: $(npm -v)"
          echo "nproc(참고, 박스 전체): $(nproc)"
          # ⚠ os.availableParallelism() 은 **믿을 수 없다**. 중첩 슬라이스에서 체인의
          # 가장 느슨한 쿼터를 집는다(2026-09-17 실측: 리프 300% / 부모 600% / 조부모 800%
          # 에서 8 반환). 그래서 cgroup 을 직접 훑어 찍는다 — run-vitest.mjs 도 같은 방식이다.
          node -e '
            const { readFileSync } = require("node:fs");
            const { dirname, join } = require("node:path");
            let dir = join("/sys/fs/cgroup", readFileSync("/proc/self/cgroup", "utf8").trim().split("\n").at(-1).split(":").at(2));
            for (let i = 0; i < 32; i += 1) {
              const read = (f) => { try { return readFileSync(join(dir, f), "utf8").trim(); } catch { return null; } };
              const cpu = read("cpu.max"), mem = read("memory.max");
              if (cpu || mem) console.log(`${dir.replace("/sys/fs/cgroup", "")}  cpu.max=${cpu ?? "-"}  memory.max=${mem ?? "-"}`);
              const parent = dirname(dir);
              if (parent === dir || !parent.startsWith("/sys/fs/cgroup")) break;
              dir = parent;
            }
          '

      - run: npm ci

      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium

      - name: 자원 스냅샷 (시작)
        run: node scripts/ci-resource-report.mjs start

      # vitest 는 tests 잡이 샤드로 돈다. 여기는 나머지 축만.
      - name: 정적 게이트 (기준선 대비 회귀만 실패)
        run: |
          set -euo pipefail
          node scripts/verify-gates.mjs --only typecheck
          node scripts/verify-gates.mjs --only css
          node scripts/verify-gates.mjs --only surface
          node scripts/verify-gates.mjs --only browser

      - name: 자원 리포트
        if: always()
        run: node scripts/ci-resource-report.mjs report "정적 게이트"

      - name: 판정 보관
        if: always()
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/gates-report"
          mkdir -p "$dest"
          for f in .omo/gates-report.json .omo/gates-baseline.json; do
            [ -f "$f" ] && cp "$f" "$dest/" || echo "없음: $f"
          done
          git rev-parse HEAD > "$dest/commit.txt"
          ls -la "$dest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: gates-report-static
          path: ${{ runner.temp }}/gates-report
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-latest
    # 호스티드 잡 상한은 6시간이다. 샤드 하나와 그 샤드의 플레이크 재확인이 여기 들어온다.
    # 2026-10-25: 샤드 넷은 240분에 잘려 리포트 업로드가 건너뛰어졌다 → 샤드 여덟, 잡 300분,
    # vitest 단계는 280분에 스스로 끊겨 뒤의 always() 보관·업로드 단계가 돌 시간을 남긴다.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # 일부 테스트(spatialPlaceCli·npcGoldReward·assistantAcceptanceProvider)가 bun 으로 CLI 를 띄운다.
      # 러너에 bun 이 없어 「spawnSync bun ENOENT」로 실패했다(ci-full 40165485978).
      #    저장소 정책이 GitHub 소유 액션만 허용하므로(oven-sh/setup-bun 은 startup_failure) npm 패키지로 깐다.
      - name: bun 설치
        run: npm install -g bun@1.4.2 && bun --version

      - run: npm ci

      - name: 자원 스냅샷 (시작)
        run: node scripts/ci-resource-report.mjs start

      # --flake-budget-min: 이 샤드에서 「새로 실패」한 파일을 단독으로 다시 보는 시간.
      # 샤드마다 40분. 후보가 상한(30)을 넘으면 재확인 자체를 건너뛴다. 후보가 수십 건이면 기준선이 낡은 것이다.
      - name: vitest 샤드 (기준선 대비 회귀만 실패)
        timeout-minutes: 280
        run: node scripts/verify-gates.mjs --only tests --shard ${{ matrix.shard }}/8 --flake-budget-min=40 --flake-max-candidates=30

      - name: 자원 리포트
        if: always()
        run: node scripts/ci-resource-report.mjs report "vitest 샤드 ${{ matrix.shard }}/8"

      # 호스티드 러너 디스크는 잡이 끝나면 사라진다. 판정 파일은 아티팩트로 올린다.
      # 계정 아티팩트 쿼터가 차 있으면 이 단계가 게이트를 실패시키진 않는다.
      - name: vitest 리포트 보관
        if: always()
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/gates-report"
          mkdir -p "$dest"
          for f in .omo/gates-report.json .omo/gates-vitest-report.json .omo/gates-baseline.json; do
            [ -f "$f" ] && cp "$f" "$dest/" || echo "없음: $f"
          done
          git rev-parse HEAD > "$dest/commit.txt"
          ls -la "$dest"
          {
            echo "### vitest 리포트 (shard ${{ matrix.shard }}/8)"
            echo ""
            echo "판정 파일은 이 잡의 아티팩트 \`gates-report-shard-${{ matrix.shard }}\` 에 있다."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: gates-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/gates-report
          if-no-files-found: warn

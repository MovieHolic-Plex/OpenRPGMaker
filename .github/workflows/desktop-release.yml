name: desktop-release

# 정식 vX.Y.Z 릴리스의 AppImage·윈도우 설치판(NSIS)·portable exe 를 mdc2 에서 만든다.
#
# 윈도우 기본 다운로드를 설치판으로 (2026-11-24, qa1124 항목 1): portable 은 실행할 때마다 1.89GB 를
# 풀어 아이콘을 눌러도 30초 넘게 아무것도 안 뗴다. 설치판은 설치 때 한 번만 푼다. README 의 윈도우 단추는
# OPRN.Studio-windows-setup.exe, 옛 고정 이름 OPRN.Studio-windows.exe 는 portable 로 남겨 옛 링크가 안 깨진다.
# 자산 검사는 4개 → 6개다. 자동 업데이트는 없다(publish: null) — latest.yml 을 만들지 않는다.
# 윈도우 패키지도 wine 없이 리눅스에서 만든다(electron-builder 가 makensis 를 받는다).
#
# 윈도우 zip 을 뺐다 (2026-11-23, app-size): zip 과 portable exe 가 둘 다 무설치 실행이라 같은 앱을
# 1GB 씩 두 번 올렸다. exe 하나만 남기고 자산 검사는 6개 → 4개다. 옛 릴리스의 zip 은 그대로 남는다.

# 순서 계약 (2026-11-07, 오너 지적 「파일이 실제 업로드 된 후에야 README 가 업데이트 되어야하는거아니냐」):
#   ① scripts/release-auto.mjs 가 릴리스를 **초안(draft)** 으로 만든다.
#   ② 이 워크플로가 산출물을 만들어 올리고 이름·크기를 **검증**한다.
#   ③ 검증을 통과한 뒤에만 발행한다(그리고 그 태그가 가장 높은 버전일 때만 latest 로 표시한다).
#   초안을 발행할 때는 CHANGELOG 의 그 절을 본문으로 다시 쓴다(--notes-from-tag 로 # 제목이
#   빠진 초안을 고친다). 이미 발행된 릴리스의 본문은 건드리지 않는다.
#   업로드가 실패하면 초안으로 남는다 → releases/latest 는 이전 정상 릴리스를 계속 준다.
#   실측 사고: 2026-11-06 22:05Z v0.408.0 이 자산 0개로 발행돼 latest 가 됐고, 빌드는
#   scripts/lib/piAgentRuntime.ts 의 깨진 import(`../src/...`)로 매번 실패해 README 의
#   /releases/latest/download/OPRN.Studio-windows.exe 가 404 였다.
#
# 트리거
#   released/published : 발행된 릴리스(과거 경로·사람이 손으로 발행한 경우) — 산출물이 모자라면 채운다.
#   workflow_dispatch  : tag 필수. source_ref 를 주면 **다른 커밋의 트리로 빌드해 그 태그에 올린다**
#                        (자산이 빈 채 발행된 릴리스를 고칠 때. 태그를 다시 쓰지 않는다).
#   schedule           : 30분마다. 자산이 모자란(=초안이거나 빈) 가장 새 릴리스를 스스로 집어 채운다.
#                        release-auto 가 만든 초안을 아무도 디스패치하지 않아 latest 가 비는 일을 막는다.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z (산출물을 올릴 릴리스)
        required: true
        type: string
      source_ref:
        description: 빌드할 커밋(비우면 태그 자체). 자산이 빈 기존 릴리스를 고칠 때 main 을 준다.
        required: false
        type: string
      dry_run:
        description: 만들기만 하고 올리지·발행하지 않는다(패키지 형식·크기 확인용). 브랜치에서 배포 형식을 바꿀 때 머지 전에 한 번 돌린다.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  # 스케줄과 수동 실행도 같은 태그를 고를 수 있다. 업로드·발행은 직렬화한다.
  # 시험 빌드(dry_run)는 올리지도 발행하지도 않으므로 브랜치마다 따로 줄을 선다 — 발행 실행의 대기 자리를 빼앗거나
  # 30~50분짜리 빌드 뒤에 발행을 세우지 않는다(2026-11-25 dev-bottlenecks). 공유 캐시 쓰기는 원자적(임시 폴더 → 이름 바꾸기)이다.
  group: desktop-release${{ inputs.dry_run && format('-dry-{0}', github.ref_name) || '' }}
  cancel-in-progress: false

jobs:
  packages:
    if: github.repository == 'MovieHolic-Plex/OpenRPGMaker' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false))
    runs-on: ${{ github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","mdc2","mdc2-heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      source_ref: ${{ steps.target.outputs.source_ref }}
      needed: ${{ steps.preflight.outputs.needed }}
    steps:
      # ── ① 대상 결정 ────────────────────────────────────────────────────────────
      # 초안이면 이벤트의 release.tag_name 이 비어 오는 경우가 있어(발행 전) 입력·스케줄 순으로 찾는다.
      - name: 대상 릴리스 결정
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [[ -z "$tag" ]]; then tag="${INPUT_TAG:-}"; fi
          if [[ -z "$tag" ]]; then
            # 스케줄: 자산이 모자란 가장 새 vX.Y.Z 릴리스(초안 포함). 없으면 할 일이 없다.
            # 자산이 다 찬 더 새 정식 릴리스가 있으면 그 아래 판은 고르지 않는다(2026-11-25 release-0420):
            # 설치판 도입(0.419) 전의 v0.418.0 이 설치판 없는 «미완성»으로 매번 잡혀, 그 태그 트리(nsis-wine-shim 없음)로
            # 빌드하다 spawn wine ENOENT 로 예약 실행이 계속 실패했다(run 45524084140·45591113927).
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '
              def ver: .tag_name | sub("^v"; "") | split(".") | map(tonumber);
              def need: ver as $p | if ($p[0] > 0 or $p[1] >= 420) then 9 else 6 end;
              [ .[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    | . + { incomplete: (.draft or ((.assets | map(select((.size // 0) > 0)) | length) < need)) } ] as $all
              | ([ $all[] | select(.incomplete | not) | ver ] | max // [-1]) as $floor
              | [ $all[] | select(.incomplete and (ver > $floor)) ]
              | sort_by(ver)
              | last | .tag_name // ""')"
          fi
          if [[ -z "$tag" ]]; then
            echo "미완성 릴리스 없음 — 할 일 없음"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::태그가 vX.Y.Z 가 아님: $tag"
            exit 1
          fi
          src="$tag"
          if [[ -n "${INPUT_SOURCE_REF:-}" ]]; then
            src="$INPUT_SOURCE_REF"
            case "$src" in
              refs/heads/*|refs/tags/*) git check-ref-format "$src" ;;
              refs/*) echo "::error::source_ref 에는 저장소 브랜치·태그·커밋을 사용한다."; exit 1 ;;
              *) git check-ref-format "refs/heads/$src" ;;
            esac
            if [[ "$src" =~ ^[0-9a-fA-F]{40}$ ]]; then
              src=${src,,}
              main=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
              base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$src...$main" --jq '.merge_base_commit.sha' 2>/dev/null || true)
              if [[ "$base" != "$src" ]]; then
                echo "::error::직접 지정한 SHA 는 기본 브랜치 이력에 있어야 한다. 다른 브랜치는 이름으로 지정한다."
                exit 1
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$src" >> "$GITHUB_OUTPUT"
          echo "대상 $tag · 빌드 커밋 $src"

      # ── ② 이미 충분한가 — 무거운 단계 전에 본다 ─────────────────────────────────
      - name: 자산 검사
        id: preflight
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # releases/tags/{tag} 는 초안에 404 를 준다(2026-11-08 v0.410.0 실측) — 초안을 찾으려면 목록에서 고른다.
          json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "map(select(.tag_name == \"$TAG\")) | first // empty")"
          if [[ -z "$json" ]]; then echo "::error::$TAG 릴리스를 찾지 못함"; exit 1; fi
          jq -r '"draft=\(.draft)"' <<< "$json" >> "$GITHUB_OUTPUT"
          version="${TAG#v}"
          # 0.420.0 부터는 자동 업데이트 파일(latest.yml·latest-linux.yml·설치판 blockmap)도 있어야 한다 — scripts/lib/releaseAssets.mjs UPDATE_FEED_SINCE.
          missing="$(printf '%s' "$json" | jq -r --arg v "$version" 'def feed($v): ($v | split(".") | map(tonumber)) as $p | if ($p[0] > 0 or $p[1] >= 420) then ["latest.yml","latest-linux.yml","OPRN.Studio-Setup-\($v).exe.blockmap"] else [] end;
            (.assets // []) as $a
            | ["OPRN.Studio-windows-setup.exe","OPRN.Studio-windows.exe","OPRN.Studio-linux.AppImage",
               "OPRN.Studio-Setup-\($v).exe","OPRN.Studio.\($v).exe","OPRN.Studio-\($v).AppImage"] + feed($v)
            | map(select(. as $n | ($a | map(select(.name == $n and (.size // 0) > 0)) | length) == 0))
            | join(" ")')"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "시험 빌드(dry_run) — 자산과 상관없이 만들기만 한다. 올리기·발행은 건너뛴다."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$missing" ]]; then
            echo "$TAG 은 자산 6개가 모두 있다 — 빌드를 건너뛴다"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG 에 없는/빈 자산: $missing"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: mdc2 도구와 디스크 확인
        if: steps.preflight.outputs.needed == 'true'
        run: |
          set -euo pipefail
          id -un
          git --version
          gh --version
          jq --version
          command -v tar unzip xz curl
          df -h "$RUNNER_TEMP"
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if (( free_kib < 30 * 1024 * 1024 )); then
            echo "::error::데스크톱 빌드에는 30 GiB 이상 여유 공간이 필요하다."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.preflight.outputs.needed == 'true' || steps.preflight.outputs.draft == 'true'
        with:
          # source_ref 는 빌드할 트리, tag 는 올릴 릴리스다.
          ref: ${{ steps.target.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.preflight.outputs.needed == 'true' || steps.preflight.outputs.draft == 'true'
        with:
          node-version: 24

      - name: 릴리스 캐시와 bun
        if: steps.preflight.outputs.needed == 'true'
        env:
          BUN_VERSION: '1.4.2' # ci-fast 와 같은 컴파일러
        run: |
          set -euo pipefail
          # mdc2 러너들은 한 사용자(ghrunner)로 돈다. 캐시를 러너별 _tool 이 아니라 그 사용자의 홈에 둬서 러너끼리 나눈다
          # (2026-11-25 dev-bottlenecks 실측: 릴리스가 mdc2-1·3·4·8·10 에 흩어져 굽기·PNG·npm·electron 캐시가 러너마다 비어 있었다).
          # 홈 디스크가 모자라면 예전처럼 러너별 _tool 을 쓴다. _temp 는 매 잡 정리된다.
          cache="$(dirname "$RUNNER_TEMP")/_tool/oprn-desktop"
          shared="${HOME:-}/.cache/oprn-desktop"
          if [[ -n "${HOME:-}" ]] && mkdir -p "$shared" 2>/dev/null \
            && (( $(df -Pk "$shared" | awk 'NR == 2 {print $4}') > 20 * 1024 * 1024 )); then
            cache="$shared"
          fi
          echo "릴리스 캐시: $cache"
          mkdir -p "$cache"/{electron,electron-builder,npm,demos}
          export npm_config_cache="$cache/npm" NPM_CONFIG_CACHE="$cache/npm"
          printf '%s\n' "ELECTRON_CACHE=$cache/electron" "ELECTRON_BUILDER_CACHE=$cache/electron-builder" \
            "XDG_CACHE_HOME=$cache" "BUN_INSTALL_CACHE_DIR=$cache/bun-cache" \
            "OPRN_BAKE_DEMOS_CACHE_DIR=$cache/demos" "OPRN_PNG_OPTIMIZE_CACHE_DIR=$cache/png" \
            "npm_config_cache=$cache/npm" "NPM_CONFIG_CACHE=$cache/npm" >> "$GITHUB_ENV"
          node --version
          if [[ "$(bun --version 2>/dev/null || true)" == "$BUN_VERSION" ]]; then
            bun --version
            exit 0
          fi
          # 저장소의 GitHub 소유 액션 제한에 맞춰 고정 npm 판을 러너별 경로에 설치한다.
          prefix="$cache/bun-$BUN_VERSION"
          for attempt in 1 2 3; do
            if [[ "$("$prefix/bin/bun" --version 2>/dev/null || true)" == "$BUN_VERSION" ]]; then break; fi
            if timeout 180 npm install --global --prefix "$prefix" "bun@$BUN_VERSION"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          [[ "$("$prefix/bin/bun" --version)" == "$BUN_VERSION" ]]
          "$prefix/bin/bun" --version
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # 태그마다 소스는 다를 수 있으므로 배포 절차는 워크플로에 둔다.
      - name: Electron·렌더러 빌드
        if: steps.preflight.outputs.needed == 'true'
        run: |
          set -euo pipefail
          npm ci
          # Electron 메인·워커(dist-electron/)와 렌더러(dist/)는 서로 산출물을 공유하지 않으므로 병렬로 빌드한다.
          node scripts/build-electron.mjs > "$RUNNER_TEMP/build-electron.log" 2>&1 &
          electron_pid=$!
          OPRN_ASSUME_ALL_BGM_INSTALLED=1 npx --no-install vite build --configLoader runner > "$RUNNER_TEMP/build-vite.log" 2>&1 &
          vite_pid=$!
          status=0
          wait "$electron_pid" || status=$?
          wait "$vite_pid" || status=$?
          echo "::group::build-electron 로그"
          cat "$RUNNER_TEMP/build-electron.log"
          echo "::endgroup::"
          echo "::group::vite build 로그"
          cat "$RUNNER_TEMP/build-vite.log"
          echo "::endgroup::"
          exit "$status"

      - name: 예제 프로젝트 굽기
        if: steps.preflight.outputs.needed == 'true'
        run: |
          npm run bake:demos
          test -s dist/demos/chrono-bell.project.json

      # 공용 초상·장소 내려받기는 패키지에서 빼고, 앱이 처음 쓸 때 이 커밋의 public/ 에서 받는다(electron/main/assetsOnDemand.ts).
      - name: 필요할 때 받을 자산 빼기
        if: steps.preflight.outputs.needed == 'true'
        run: |
          node scripts/desktop-ondemand-assets.mjs
          test -s dist/ondemand-assets.json
          # 패키지에 실릴 PNG 를 무손실로 다시 압축한다(oxipng, 화소 그대로). 저장소 원본은 그대로다.
          node scripts/desktop-png-optimize.mjs

      - name: 데스크톱 패키지 압축
        if: steps.preflight.outputs.needed == 'true'
        env:
          # 26.18 의 기본값은 zip 7, 7z 9다. 같은 포맷에서 압축 CPU 시간을 줄인다.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 3
          SEVENZIP_MEMUSE: 2g
          # 설치판·portable 이 같은 앱(약 1.9GB)을 7z 로 한 번씩 누른다. 스레드 2개에서 각 4~5.5분이었다(v0.419 run 45420794518).
          # 레벨 3 사전은 작아 스레드당 메모리가 수십 MB 이고, 번들 7zz 는 -mmemuse 상한 안으로 스레드를 스스로 줄인다.
          SEVENZIP_THREADS: 8
        run: |
          set -euo pipefail
          printf '%s\n' '{"type":"commonjs"}' > "$ELECTRON_BUILDER_CACHE/package.json"
          if [[ -f node_modules/app-builder-lib/out/toolsets/7zip.js ]]; then
            node -e 'require("app-builder-lib/out/toolsets/7zip").getPath7za().then(file => require("node:fs").writeFileSync(process.argv[1], file))' "$RUNNER_TEMP/7zip-path"
            OPRN_7ZIP=$(cat "$RUNNER_TEMP/7zip-path")
            export OPRN_7ZIP_MEMCAP=true
          else
            OPRN_7ZIP=$(command -v 7zz || command -v 7z || command -v 7za)
          fi
          test -x "$OPRN_7ZIP"
          export OPRN_7ZIP
          wrapper="$RUNNER_TEMP/7za-memcap.sh"
          cat > "$wrapper" << 'EOF'
          #!/bin/sh
          set -eu
          limit=${SEVENZIP_MEMUSE:-2g}
          cmd=${1:-}
          if [ "$cmd" = "a" ] || [ "$cmd" = "u" ]; then
            shift
            # 26.18 의 번들 7-Zip 은 메모리 상한을 지원한다. 구형 시스템 7z 는 스레드만 제한한다.
            if [ "${OPRN_7ZIP_MEMCAP:-}" = true ] || [ "${OPRN_7ZIP##*/}" = 7zz ]; then
              exec "$OPRN_7ZIP" "$cmd" "-mmemuse=$limit" "-mmt=${SEVENZIP_THREADS:-2}" "$@"
            fi
            exec "$OPRN_7ZIP" "$cmd" -mmt=2 "$@"
          fi
          exec "$OPRN_7ZIP" "$@"
          EOF
          chmod +x "$wrapper"
          # NSIS 설치판의 언인스톨러 꺼내기는 wine 을 부른다. 러너에 wine 이 없어 순수 JS 대체를 "wine" 으로 잡힌다
          # (scripts/nsis-wine-shim/extract-uninstaller.cjs).
          export PATH="$PWD/scripts/nsis-wine-shim:$PATH" USE_SYSTEM_WINE=true
          # 윈도 nsis·portable 이 같은 ELECTRON_CACHE / ELECTRON_BUILDER_CACHE(NSIS·rcedit·Electron zip)를 동시에
          # 내려받아 깨지는 경쟁을 막기 위해 공유 도구 캐시를 병렬 실행 전에 한 번 미리 채운다(캐시가 있으면 1초 미만).
          node -e '
            (async () => {
              try {
                const win = require("app-builder-lib/out/toolsets/windows");
                await Promise.all([
                  win.getMakeNsisPath?.(),
                  win.getNsisPluginsPath?.(),
                  win.getNsisElevatePath?.(),
                  win.getRceditBundle?.(),
                ]);
              } catch (err) {
                console.warn("nsis toolset warm skipped:", err?.message || err);
              }
              try {
                const { downloadArtifact } = require("@electron/get");
                const electronVersion = require("electron/package.json").version;
                await downloadArtifact({ version: electronVersion, artifactName: "electron", platform: "win32", arch: "x64" });
              } catch (err) {
                console.warn("win32 electron cache warm skipped:", err?.message || err);
              }
            })();
          '
          # AppImage · Windows NSIS · Windows Portable 세 타깃을 mdc2-heavy(40코어)에서 격리된 출력·TMPDIR 로 동시에 굽는다.
          # 각 타깃이 전체 electron-builder 수명주기(doPack → afterPack → app-update.yml → blockmap → latest*.yml)를 그대로 탄다.
          rm -rf dist-packages dist-packages-linux dist-packages-win-nsis dist-packages-win-portable
          mkdir -p "$RUNNER_TEMP/eb-linux" "$RUNNER_TEMP/eb-win-nsis" "$RUNNER_TEMP/eb-win-portable"

          (
            export TMPDIR="$RUNNER_TEMP/eb-linux"
            ELECTRON_BUILDER_7ZIP_PATH="$wrapper" npx --no-install electron-builder \
              --config scripts/electron-builder.config.mjs --publish never \
              --linux AppImage --x64 \
              -c.directories.output=dist-packages-linux
          ) > "$RUNNER_TEMP/eb-linux.log" 2>&1 &
          pid_linux=$!

          (
            export TMPDIR="$RUNNER_TEMP/eb-win-nsis"
            ELECTRON_BUILDER_7ZIP_PATH="$wrapper" npx --no-install electron-builder \
              --config scripts/electron-builder.config.mjs --publish never \
              --win nsis --x64 \
              -c.directories.output=dist-packages-win-nsis \
              '-c.nsis.artifactName=OPRN.Studio-Setup-${version}.${ext}'
          ) > "$RUNNER_TEMP/eb-win-nsis.log" 2>&1 &
          pid_nsis=$!

          (
            export TMPDIR="$RUNNER_TEMP/eb-win-portable"
            ELECTRON_BUILDER_7ZIP_PATH="$wrapper" npx --no-install electron-builder \
              --config scripts/electron-builder.config.mjs --publish never \
              --win portable --x64 \
              -c.directories.output=dist-packages-win-portable
          ) > "$RUNNER_TEMP/eb-win-portable.log" 2>&1 &
          pid_portable=$!

          status=0
          wait "$pid_linux" || { echo "::error::Linux AppImage 패키징 실패"; status=1; }
          wait "$pid_nsis" || { echo "::error::Windows NSIS 패키징 실패"; status=1; }
          wait "$pid_portable" || { echo "::error::Windows Portable 패키징 실패"; status=1; }

          for target in linux win-nsis win-portable; do
            echo "::group::electron-builder ($target)"
            cat "$RUNNER_TEMP/eb-$target.log"
            echo "::endgroup::"
          done
          if (( status != 0 )); then exit "$status"; fi

          mkdir -p dist-packages
          shopt -s nullglob
          for f in dist-packages-linux/*.AppImage dist-packages-linux/latest-linux.yml; do
            mv -- "$f" dist-packages/
          done
          for f in dist-packages-win-nsis/OPRN.Studio-Setup-*.exe dist-packages-win-nsis/OPRN.Studio-Setup-*.exe.blockmap dist-packages-win-nsis/latest.yml; do
            mv -- "$f" dist-packages/
          done
          for f in dist-packages-win-portable/*.exe; do
            mv -- "$f" dist-packages/
          done
          rm -rf dist-packages-linux dist-packages-win-nsis dist-packages-win-portable

      # 시험 빌드는 여기서 끝난다: 형식(설치판은 NSIS 설치기, portable 은 스플래시를 품은 자기 해제 exe)과 크기를 남긴다.
      - name: 시험 빌드 산출물 보고
        if: steps.preflight.outputs.needed == 'true' && inputs.dry_run
        run: |
          set -euo pipefail
          out=dist-packages
          ls -l "$out"/*.AppImage "$out"/*.exe
          setup=( "$out"/OPRN.Studio-Setup-*.exe )
          portable=( "$out"/*.exe )
          test -s "${setup[0]}"
          test "${#portable[@]}" -eq 2
          sevenzip=$(command -v 7zz || command -v 7z || command -v 7za || true)
          if [[ -z "$sevenzip" ]]; then
            sevenzip=$(node -e 'require("app-builder-lib/out/toolsets/7zip").getPath7za().then(file => process.stdout.write(file))')
          fi
          for f in "$out"/*.exe; do
            echo "== $(basename "$f") $(stat -c %s "$f") bytes"
            # 두 exe 모두 NSIS 자기 해제 파일이다. 포함된 항목으로 설치기인지(제거 프로그램 있음)·portable 인지 가른다.
            "$sevenzip" l "$f" | grep -E 'app-64\.7z|Uninstall|splash\.bmp|\.nsi' || true
          done

      - name: 릴리스 자산 업로드
        if: steps.preflight.outputs.needed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          out=dist-packages
          shopt -s nullglob
          files=()
          for f in "$out"/*.AppImage "$out"/*.exe; do
            size=$(stat -c %s -- "$f")
            if (( size == 0 || size >= 2 * 1024 * 1024 * 1024 )); then
              echo "::error::$f 자산 크기 범위 초과 ($size bytes)"
              exit 1
            fi
            files+=("$f")
          done
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -q 'AppImage'
          printf '%s\n' "${files[@]}" | grep -q 'OPRN.Studio-Setup-.*\.exe'
          test "$(printf '%s\n' "${files[@]}" | grep -c '\.exe$')" -eq 2
          stable=()
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" == *.AppImage ]]; then alias="OPRN.Studio-linux.AppImage"
            elif [[ "$base" == OPRN.Studio-Setup-*.exe ]]; then alias="OPRN.Studio-windows-setup.exe"
            else alias="OPRN.Studio-windows.exe"
            fi
            ln -f -- "$f" "$out/$alias"
            stable+=("$out/$alias")
          done
          # 앱 자동 업데이트 파일(electron/main/appUpdate.ts). 이름을 바꾸지 않는다 — latest.yml 이 버전 이름 설치판을 가리킨다.
          # 0.420.0 전 판의 빌드는 이 파일을 만들지 않으므로 있는 것만 올리고, 있어야 하는지는 발행 검증이 판으로 가른다.
          feed=()
          for f in "$out"/latest.yml "$out"/latest-linux.yml "$out"/OPRN.Studio-Setup-*.exe.blockmap; do
            if [[ -s "$f" ]]; then feed+=("$f"); fi
          done
          # 자산 9개(약 4.2GB)를 직렬로 올리면 2분 넘게 걸린다. 서로 다른 파일명이므로 최대 4개씩 병렬 업로드하고,
          # 일시 오류는 자산별 3회까지 재시도한다. 하나라도 실패하면 스텝이 실패해 초안으로 남는다.
          assets=("${files[@]}" "${stable[@]}" "${feed[@]}")
          upload_one() {
            local file="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "  uploaded: $(basename "$file")"
                return 0
              fi
              if (( attempt < 3 )); then
                echo "  retrying ($(basename "$file"), attempt $attempt/3)..." >&2
                sleep "$((attempt * 5))"
              fi
            done
            echo "::error::업로드 실패: $file" >&2
            return 1
          }
          max_parallel=4
          pids=()
          upload_status=0
          for asset in "${assets[@]}"; do
            upload_one "$asset" &
            pids+=("$!")
            if (( ${#pids[@]} >= max_parallel )); then
              wait "${pids[0]}" || upload_status=1
              pids=("${pids[@]:1}")
            fi
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || upload_status=1
          done
          if (( upload_status != 0 )); then exit "$upload_status"; fi
          echo "업로드 완료: $TAG (총 ${#assets[@]}개, 업데이트 파일 ${#feed[@]}개)"

      # ── ③ 검증 → 발행 ──────────────────────────────────────────────────────────
      # 이름·크기를 한 번 더 읽어 확인한다. 발행은 그 뒤에만. 검증에 실패하면 스텝이 실패해
      # 릴리스는 초안으로 남고 latest 는 이전 정상 릴리스를 계속 가리킨다.
      - name: 자산 검증 후 발행
        if: (steps.preflight.outputs.needed == 'true' || steps.preflight.outputs.draft == 'true') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # releases/tags/{tag} 는 초안에 404 를 준다(2026-11-08 v0.410.0 실측) — 초안을 찾으려면 목록에서 고른다.
          json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "map(select(.tag_name == \"$TAG\")) | first // empty")"
          if [[ -z "$json" ]]; then echo "::error::$TAG 릴리스를 찾지 못함"; exit 1; fi
          report="$(printf '%s' "$json" | jq -r --arg v "$version" 'def feed($v): ($v | split(".") | map(tonumber)) as $p | if ($p[0] > 0 or $p[1] >= 420) then ["latest.yml","latest-linux.yml","OPRN.Studio-Setup-\($v).exe.blockmap"] else [] end;
            (.assets // []) as $a
            | ["OPRN.Studio-windows-setup.exe","OPRN.Studio-windows.exe","OPRN.Studio-linux.AppImage",
               "OPRN.Studio-Setup-\($v).exe","OPRN.Studio.\($v).exe","OPRN.Studio-\($v).AppImage"] + feed($v)
            | map(. as $n | { name: $n, size: (($a | map(select(.name == $n)) | first | .size) // 0) })')"
          echo "$report" | jq -r '.[] | "  \(.name): \(.size) bytes"'
          bad="$(echo "$report" | jq -r '[.[] | select(.size <= 0) | .name] | join(" ")')"
          if [[ -n "$bad" ]]; then
            echo "::error::$TAG 자산 검증 실패(없거나 빈 파일): $bad — 발행하지 않는다(초안 유지)."
            exit 1
          fi
          # 이 태그가 가장 높은 버전일 때만 latest 로 표시한다(옛 초안을 뒤늦게 발행하며 latest 를 되돌리지 않는다).
          highest="$(git ls-remote --tags origin 'v*' | sed 's|.*refs/tags/||; s|\^{}$||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          latest_flag="false"
          if [[ "$highest" == "$TAG" ]]; then latest_flag="true"; fi
          id="$(printf '%s' "$json" | jq -r '.id')"
          draft="$(printf '%s' "$json" | jq -r '.draft')"
          # 초안만 CHANGELOG 절로 본문을 맞춘다. 이미 발행된 릴리스는 패치 노트를 덮지 않는다.
          if [[ "$draft" == "true" ]]; then
            notes_file="$(mktemp)"
            if node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              import { changelogEntryFor } from "./scripts/lib/releaseFiles.mjs";
              const version = process.argv[1];
              const out = process.argv[2];
              const entry = changelogEntryFor(readFileSync("CHANGELOG.md", "utf8"), version);
              if (!entry) process.exit(2);
              writeFileSync(out, entry.endsWith("\n") ? entry : `${entry}\n`);
            ' "$version" "$notes_file"; then
              gh release edit "$TAG" --notes-file "$notes_file"
            else
              echo "CHANGELOG 에서 $version 절을 못 읽음 — 기존 본문을 유지하고 발행한다."
            fi
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -F make_latest="$latest_flag" > /dev/null
          echo "$TAG 발행 완료 (latest=$latest_flag, 가장 높은 태그=$highest)"

      # 다운로드가 실제로 되는지 마지막으로 확인한다 — 이 링크가 README 의 주소다.
      - name: latest 다운로드 확인
        if: (steps.preflight.outputs.needed == 'true' || steps.preflight.outputs.draft == 'true') && !inputs.dry_run
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          for name in OPRN.Studio-windows-setup.exe OPRN.Studio-windows.exe OPRN.Studio-linux.AppImage; do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name")"
            len="$(curl -sIL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')"
            echo "$name HTTP=$code Content-Length=${len:-0}"
            if [[ "$code" != "200" || -z "${len:-}" || "${len:-0}" -le 0 ]]; then
              echo "::error::$TAG/$name 다운로드 불가(HTTP $code, ${len:-0} bytes)"
              exit 1
            fi
          done

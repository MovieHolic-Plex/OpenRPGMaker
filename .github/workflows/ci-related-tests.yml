name: ci-related-tests

# PR 이 바꾼 코드와 import 그래프로 이어진 vitest 파일을 돌린다 — pull_request(→ main) 와 수동(workflow_dispatch).
#
# 2026-11-25 ci-speed: 깊이 1 → 런타임 import 그래프(가까운 것부터) + 조각(matrix) + 넓은 변경.
#   깊이 1 만 보던 판은 v0.420 을 막은 ci-full 새 실패를 PR 단계에서 거의 못 잡았다(재현 표: http://mdc2:18301/ci-speed.html).
#   select 잡이 scripts/vitest-related.mjs 로 고르고 조각 수(1~8)를 정한다. 조각마다 같은 시간 상한(480초 예상·720초 시간 상자)이 걸린다. 예상 워커 수는 scripts/lib/vitestBudget.mjs 로 run-vitest.mjs 와 동일하게 유도한다 — 호스티드 4코어/16GB 에서 2워커 × 6.5GB 힙(지연 번들 JSON·타일셋 적용, 2026-11-27).
#   «넓은 변경»(그래프로 닿는 시험 > 1200 또는 바뀐 파일 > 80 — 공용 허브 모듈을 건드린 PR)은 상한 없이 닿는 시험 전부를 12조각으로 돈다(ci-full 의 그 PR 판).
#   조각 잡 이름은 `related-tests (n)` 이다. 정보용인 것은 그대로다(merge-pr 필수 체크 아님).
#   아래 «깊이 1» 설명은 옛 판의 근거로 남긴다.
# 러너는 ci-vitest-files.yml 과 같은 GitHub 호스티드(ubuntu-latest)다(#5022 가 무거운 잡을 호스티드로 옮겼다).
#
# 왜 (2026-11-24): PR 에는 ci-fast(타입체크·빌드·패리티·정적)만 돌고 전체 vitest(약 3,000파일, 시험 시간 합 16.5시간)는 ci-full 만 돈다.
#   그래서 «내가 바꾼 코드의 시험» 이 빨간 채 머지돼 4시간 뒤 ci-full 에서야 잡혔다. `npm run test:changed`(vitest --changed)는 import 그래프를
#   끝까지 타서 소요가 예측 불가라 쓰지 않는다(ci-fast.yml 머리말). 이 잡은 **깊이 1** 만 본다 — 바뀐 파일을 직접 import 하는 시험 + 바뀐 시험 +
#   (코드가 아닌 바뀐 파일은) 그 경로·이름을 문자열로 든 시험. 최근 PR 20건 실측: 중앙 12파일·약 4분, p75 16파일·8.5분(깊이 2 는 중앙 21분).
#   고르는 규칙·시간 상한·안전망은 scripts/vitest-related.mjs 머리말에 있다. 시간 상한(예상 벽시계 380초 — 파일당 고정 비용·시작 비용 포함, mdc2 실측)을 넘는 만큼은 «nightly 로 미룸 n개» 로
#   요약에 찍고 돌리지 않는다 — 미룬 파일은 ci-full(밤 1회·릴리스 전)이 본다. 안전망 파일(package.json·vitest 설정·ci-*.yml …)이 바뀌어도 전체로 넓히지 않는다.
#
# vitest 는 시간 상자(720초)에 걸려 있다 — 넘으면 끊고 «끝까지 본 만큼» 을 `RESULT: INCOMPLETE` 로 보고하고 **빨강**으로 끝난다(돌리지 못한 파일 목록을 남긴다, 2026-11-26).
#
# 이 체크는 **정보용**이다 (필수 체크 아님 — scripts/merge-pr.mjs 는 `fast`·`fast-static`·`fast-parity` 만 기다린다). 판정은 ci-vitest-files 와 같은 기준선 대조다:
#   vitest 가 실패해도 떨어진 파일이 모두 .omo/gates-baseline.json 의 tests.failedFiles(main 에서 이미 빨간 파일)이면 초록이다.
#   기준선에 없는 파일(NEW-FAIL)이 하나라도 있거나 가를 수 없으면(UNKNOWN) 빨강이다. 로그·요약 끝줄은 ci-vitest-files 와 같은 다섯 줄이다
#   (RESULT · NEW-FAIL · KNOWN-FAIL · NOW-PASSING · VERDICT). 고른 파일이 0개면 설정 스텝을 건너뛰고 한 줄만 찍고 초록으로 끝난다.
#
# 수동 실행(상한·선택 규칙을 지난 PR 로 재 볼 때): gh workflow run ci-related-tests --ref <브랜치> -f base=<커밋> [-f head=<커밋>]
#   base...head 의 변경으로 고른다(head 기본 HEAD). 이때 체크아웃은 전체 이력이다.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base:
        description: "비교 기준 커밋/참조 (git diff base...head)"
        required: true
        type: string
      head:
        description: "비교 대상 커밋/참조 (기본 HEAD)"
        required: false
        type: string
      selector_args:
        description: "scripts/vitest-related.mjs 에 더 넘길 인자 (예: --budget-seconds 300) — 상한·배율 실험용"
        required: false
        type: string

concurrency:
  group: ci-related-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: related-select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.select.outputs.count }}
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # pull_request 체크아웃은 「PR 머리 + 지금 main」 병합 커밋이라 HEAD^1 = main 이다(ci-fast.yml 과 같다) — 이력은 둘이면 된다.
      # 선택기는 git diff 이름과 코드·시험의 import 그래프만 읽는다 — public/·tiledata/·바이너리(1.5GB+)는 받지 않는다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !public/**
            !tiledata/**
            !*.png
            !*.gif
            !*.mp3
            !*.ogg
            !*.wav

      # 선택기는 node 내장 모듈과 git 만 쓴다 — 고른 파일이 0개면 조각 잡이 아예 뜨지 않는다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: 관련 시험 고르기
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
          SELECTOR_ARGS: ${{ inputs.selector_args }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then base="HEAD^1"; head="HEAD"; else base="$BASE"; head="${HEAD_REF:-HEAD}"; fi
          mkdir -p "$RUNNER_TEMP/related"
          # shellcheck disable=SC2086 — SELECTOR_ARGS 는 공백으로 나눈 인자 목록이다(수동 실행 전용).
          node scripts/vitest-related.mjs --base "$base" --head "$head" --out "$RUNNER_TEMP/related/all.list" --matrix "$RUNNER_TEMP/related/matrix.json" --summary "$GITHUB_STEP_SUMMARY" $SELECTOR_ARGS
          count=$(grep -c . "$RUNNER_TEMP/related/all.list" || true)
          {
            echo "count=${count}"
            echo "mode=$(cat "$RUNNER_TEMP/related/mode.txt")"
            echo "matrix=$(cat "$RUNNER_TEMP/related/matrix.json")"
          } >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "관련 vitest 파일 없음 — 건너뛴다. 전체는 ci-full 이 본다." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # 조각 잡이 같은 목록을 쓰게 넘긴다(선택기를 다시 돌리지 않는다).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.select.outputs.count != '0'
        with:
          name: related-lists
          path: ${{ runner.temp }}/related
          retention-days: 3

  related-tests:
    name: related-tests (${{ matrix.chunk }})
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    # 넓은 변경은 시간 상자 없이 닿는 시험 전부를 돈다(조각 12개 — 한 조각 예상 40분 안팎).
    timeout-minutes: ${{ needs.select.outputs.mode == 'wide' && 120 || 20 }}
    strategy:
      fail-fast: false
      # 넓은 변경은 조각 12개를 한 번에 돈다(보통은 상한 8). 2026-11-26 Pro 한도 40(05:39Z 동시 41 실측), ci-full 이 25자리를 써도 15가 남는다.
      # 전에는 6/4(호스티드 20 시절 값)이라 넓은 변경 PR 이 조각 절반을 40분씩 기다렸다(#5187: 6개 실행·6개 대기).
      max-parallel: ${{ needs.select.outputs.mode == 'wide' && 12 || 8 }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      VITEST_WORKERS: "4"
      # vitest 시간 상자(초). 넘으면 vitest 를 끊고 빨강이다. 720 = 예상 480초 조각의 실제 최대(×1.15) 위(2026-11-26 153 조각 재보정, PR 본문).
      VITEST_TIMEBOX_SECONDS: ${{ needs.select.outputs.mode == 'wide' && '6600' || '720' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: related-lists
          path: ${{ runner.temp }}/related

      - name: 조각 목록
        env:
          CHUNK: ${{ matrix.chunk }}
        run: cp "$RUNNER_TEMP/related/chunk-${CHUNK}.list" "$RUNNER_TEMP/related.list" && wc -l "$RUNNER_TEMP/related.list"

      - uses: ./.github/actions/linux-ci
        with:
          bun-version: '1.4.2'

      - name: python 의존성 (numpy·Pillow)
        run: |
          venv="$RUNNER_TEMP/vitest-python"
          python3 -m venv "$venv"
          "$venv/bin/pip" install numpy==2.4.4 pillow==12.1.1
          echo "$venv/bin" >> "$GITHUB_PATH"

      # 실패는 이 스텝이 아니라 아래 «결과» 스텝이 판정한다(기준선에 있는 실패는 새 실패가 아니다). 설정 스텝의 실패는 그대로 잡을 실패시킨다.
      - name: vitest (관련 파일만)
        id: vitest
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e   # 기본 셸(bash -e)에서도 파이프라인 종료 코드를 읽어 아래 결과 스텝에 넘긴다
          mapfile -t files < "$RUNNER_TEMP/related.list"
          echo "vitest ${#files[@]}개 (시간 상자 ${VITEST_TIMEBOX_SECONDS}초): ${files[*]}"
          # timeout 은 자기 프로세스 그룹 전체를 끊는다 — run-vitest.mjs 가 띄운 vitest 와 워커까지.
          timeout --kill-after=20 "$VITEST_TIMEBOX_SECONDS" node scripts/run-vitest.mjs run --configLoader bundle --reporter=verbose --reporter=json --outputFile "$RUNNER_TEMP/vitest.json" --maxWorkers="$VITEST_WORKERS" --minWorkers=1 "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/vitest.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/vitest.exit"
          exit "$code"

      - name: 결과 (RESULT)
        if: always()
        env:
          OUTCOME: ${{ steps.vitest.outcome }}
          CHUNK: ${{ matrix.chunk }}
          MODE: ${{ needs.select.outputs.mode }}
        run: |
          set -uo pipefail
          mapfile -t files < "$RUNNER_TEMP/related.list"
          total=${#files[@]}
          failed=""
          incomplete=""
          # 시간 상자에 끊겼는가(timeout 종료 코드 124, 끊은 뒤 강제 종료 137). 끊기면 JSON 리포트가 없다 — 로그의 ×(실패 케이스) 줄로 실패 파일을 읽는다.
          code=$(cat "$RUNNER_TEMP/vitest.exit" 2>/dev/null || echo "")
          if [ "$OUTCOME" = "failure" ] && { [ "$code" = "124" ] || [ "$code" = "137" ]; }; then
            incomplete=1
            seen=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" | grep -oE '^ *(✓|×) +test/[^ ]+\.test\.ts' | awk '{print $2}' | sort -u | grep -c . || true)
            failed=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" | grep -oE '^ *× +test/[^ ]+\.test\.ts' | awk '{print $2}' | sort -u || true)
          fi
          case "$OUTCOME" in
            success)
              line="RESULT: PASS ${total} files" ;;
            failure)
              if [ -n "$incomplete" ]; then
                line="RESULT: INCOMPLETE ${total} files (시간 상자 ${VITEST_TIMEBOX_SECONDS}초에 끊겼다, 조각 ${CHUNK} — 결과가 보인 파일 ${seen}개)"
              else
              failed=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" 2>/dev/null \
                | grep -oE 'FAIL +[^ >]+\.(test|spec)\.[cm]?[jt]sx?' | awk '{print $2}' | sort -u || true)
              n=$(printf '%s' "$failed" | grep -c . || true)
              if [ "$n" -gt 0 ]; then
                line="RESULT: FAIL ${n} files ($(printf '%s\n' "$failed" | paste -sd, - | sed 's/,/, /g'))"
              else
                line="RESULT: FAIL ${total} files (실패 파일 이름을 로그에서 읽지 못했다 — 위 로그를 본다)"
              fi
              fi ;;
            *)
              line="RESULT: ERROR ${total} files (vitest 스텝이 실행되지 않았다: ${OUTCOME:-없음} — 앞선 설정 스텝 실패)" ;;
          esac
          printf '%s\n' "$failed" > "$RUNNER_TEMP/vitest-failed.list"
          more=$(node scripts/ci-vitest-files-verdict.mjs --outcome "$OUTCOME" --report "$RUNNER_TEMP/vitest.json" --failed-list "$RUNNER_TEMP/vitest-failed.list" --baseline .omo/gates-baseline.json -- "${files[@]}") \
            || more=$(printf 'NEW-FAIL: (가르지 못했다)\nKNOWN-FAIL: (가르지 못했다)\nNOW-PASSING(기준선에서 뺄 것): (알 수 없다)\nVERDICT: UNKNOWN (scripts/ci-vitest-files-verdict.mjs 가 실패했다)')
          # 끊긴 실행은 «기준선에서 뺄 것» 을 말할 수 없다(안 끝난 파일이 통과로 보인다).
          if [ -n "$incomplete" ]; then more=$(printf '%s\n' "$more" | grep -v '^NOW-PASSING'); fi
          verdict=$(printf '%s\n' "$more" | tail -n 1)
          printf '### vitest 결과 (조각 %s · %s)\n\n' "$CHUNK" "$MODE" >> "$GITHUB_STEP_SUMMARY"; printf '```\n%s\n%s\n```\n' "$line" "$more" >> "$GITHUB_STEP_SUMMARY"
          echo "$line"
          echo "$more"
          note=$({ printf '%s\n' "$verdict"; printf '%s\n' "$more" | head -n 3; } | paste -sd'|' - | sed 's/|/ · /g')
          # 통과: vitest 가 성공했거나, 실패한 파일이 전부 기준선에 있다(VERDICT: CLEAN). 그 밖(NEW-FAIL · UNKNOWN · 설정 실패)은 빨강.
          # 끊긴 실행(INCOMPLETE)은 빨강이다(2026-11-26 리드): 돌리지 못한 시험은 «통과» 가 아니다. 예전에는 새 실패가 안 보이면 경고만 남기고
          # 초록이라, 시간 상자 뒤의 파일이 깨져도 PR 이 초록으로 머지됐다(ci-full 45844823105). 돌리지 못한 파일 목록을 남긴다.
          if [ -n "$incomplete" ]; then
            seen_list=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" | grep -oE '^ *(✓|×) +test/[^ ]+\.test\.ts' | awk '{print $2}' | sort -u || true)
            unrun=$(printf '%s\n' "${files[@]}" | sort -u | comm -23 - <(printf '%s\n' "$seen_list" | grep . || true) | paste -sd, - | sed 's/,/, /g')
            printf '돌리지 못한 파일: %s\n' "${unrun:-(알 수 없음)}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=ci-related-tests::${line} · 돌리지 못한 파일이 있다 — 시간 상자 ${VITEST_TIMEBOX_SECONDS}초 · ${note}"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ] || { [ "$OUTCOME" = "failure" ] && [ "$verdict" = "VERDICT: CLEAN" ]; }; then
            echo "::notice title=ci-related-tests::${line} · ${note}"
          else
            echo "::error title=ci-related-tests::${line} · ${note}"
            exit 1
          fi

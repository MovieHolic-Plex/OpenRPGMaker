name: ci-vitest-files

# 지정한 vitest 파일만 GitHub 호스티드(ubuntu-latest)에서 돌린다 — 수동(workflow_dispatch) 전용.
# 2026-11-24 mdc2-heavy 에서 옮겼다(ci-github-offload): 하루 65판쯤 도는 무거운 잡이라 mdc2 메모리를 가장 많이 썼다.
#
# 왜 (2026-10-25): 테스트는 CI 에서만 돈다(로컬 vitest 는 금지). 그런데 ci-full 은 샤드 넷에 약 3시간 20분이 걸려
# (run 40165485978), 실패 묶음 하나를 고친 뒤 그 파일 몇 개가 정말 통과하는지 보려고 ci-full 을 돌리면 하루에 몇 번 못 본다.
# 이 워크플로는 고른 파일만 돌려 몇 분 안에 답한다. 래칫(기준선을 줄이고 지키는 일)은 여전히 ci-full 이 맡는다 —
# 이 워크플로는 기준선을 읽어 «떨어진 파일이 이미 알려진 빨강인가» 를 끝줄에 적어 줄 뿐이다(아래 «끝줄 다섯»).
#
# 쓰는 법:
#   gh workflow run ci-vitest-files --ref <브랜치> -f files="test/a.test.ts test/b.test.ts"
#   gh run list --workflow ci-vitest-files --branch <브랜치>   →   gh run view <id> --log
#   files 를 비우면 아무것도 돌리지 않고 실패한다(전체 스위트는 ci-full 몫).
#
# agent/* 브랜치에서는 vitest 가 실패해도 실행(run)을 빨갛게 만들지 않는다 (2026-11-11).
#   왜: 최근 24시간 실패 실행 77건 중 63건이 이 워크플로를 다른 레인이 agent/* 브랜치에서 작업 도중 수동으로 돌린 것이었다.
#   수정 중에 돌리는 도구라 빨간 결과가 정상이고, 그 실패마다 오너 메일이 한 통씩 갔다. 알림을 끄는 대신 원인을 없앤다.
#   결과는 그대로 보인다 — 마지막 스텝이 로그 끝줄에 `RESULT: PASS n files` / `RESULT: FAIL n files (a.test.ts, ...)` 를 찍고,
#   요약(GITHUB_STEP_SUMMARY)과 ::error:: 주석(메일이 가지 않는다)에도 같은 내용을 남긴다. 읽을 곳은 run 의 conclusion 이 아니라 이 줄이다.
#   main·diag/*·fix/* 같은 agent/ 가 아닌 ref 는 예전처럼 vitest 실패가 곧 실행 실패다.
#   설정 스텝(files 검사·bun·python·npm ci·playwright)의 실패는 어느 ref 에서도 실행 실패다 — continue-on-error 는 vitest 스텝에만 건다.
#
# 끝줄 다섯 (2026-11-15) — 실행 결론은 위 규칙 그대로 두고, `RESULT:` 줄(글자는 그대로) 뒤에 넷을 더 찍는다:
#   RESULT: PASS n files | RESULT: FAIL n files (a.test.ts, ...)
#   NEW-FAIL: <이번에 떨어졌고 기준선에 없는 파일>
#   KNOWN-FAIL: <이번에 떨어졌고 기준선에 있는 파일 — main 에서 이미 빨갛다>
#   NOW-PASSING(기준선에서 뺄 것): <기준선에 실패로 적혀 있는데 이번에 통과한 파일. 태그가 timeout 인 것은 빼고>
#   VERDICT: CLEAN | VERDICT: NEW-FAIL n files | VERDICT: UNKNOWN (까닭)
#   왜: main 에 알려진 빨강이 많아 FAIL 이 곧 «내가 깨뜨렸다» 가 아닌데, `RESULT:` 줄은 그 둘을 가르지 않았다. 결론은 늘 success 라
#   «CI 초록» 이라는 잘못된 보고가 나왔고, 읽는 사람이 매번 기준선과 손으로 대조했다. 읽을 줄은 `VERDICT:` 다.
#   기준선은 그 실행의 체크아웃에 있는 .omo/gates-baseline.json 의 tests.failedFiles 다(판정: scripts/lib/vitestFilesVerdict.mjs).
#   같은 다섯 줄이 요약(GITHUB_STEP_SUMMARY)에, VERDICT 와 목록이 주석(annotation)에도 남는다 — `gh run view <id>` 에 주석이 보인다.
#   로그로 읽기: gh run view <id> --log | grep -E 'Z (RESULT|NEW-FAIL|KNOWN-FAIL|NOW-PASSING|VERDICT)'

on:
  workflow_dispatch:
    inputs:
      files:
        description: "공백으로 나눈 테스트 파일 경로(또는 vitest 필터)"
        required: true
        type: string
      force:
        description: "같은 커밋의 ci-related-tests 가 이미 이 파일들을 돌아도 다시 돌린다"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-vitest-files-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 같은 커밋을 PR 의 ci-related-tests 가 이미 돌고 있거나 통과했고, 요청한 파일이 그 선택(all.list)에 모두 들어 있으면
  # vitest 를 다시 돌리지 않는다 (2026-11-26 dev-bottlenecks-r2).
  # 왜: 30시간 248판 중 239판이 agent/* 레인의 수동 실행이었고(잡-시간 56시간), 호스티드 동시 자리를 ci-fast 와 나눠 쓴다.
  # 레인은 PR 을 연 브랜치에서 같은 커밋의 관련 시험을 다시 거는 일이 많았다, 그 판의 답은 ci-related-tests 에 이미 있다.
  # 체크아웃 없이 gh 로 그 판의 아티팩트만 본다(10초 안팎). 실패하거나 판단할 수 없으면 그냥 돌린다.
  # 끝줄은 `VERDICT: COVERED (ci-related-tests <url>)` 다. 그래도 돌리려면 `-f force=true`.
  covered:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      covered: ${{ steps.check.outputs.covered }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FILES: ${{ inputs.files }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          echo "covered=false" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then echo "force=true, 그대로 돌린다"; exit 0; fi
          run=$(gh api "repos/$REPO/actions/workflows/ci-related-tests.yml/runs?head_sha=$SHA&event=pull_request&per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | sort_by(.created_at) | last | "\(.id) \(.html_url)"' 2>/dev/null) || run=""
          if [ -z "$run" ] || [ "$run" = "null null" ]; then echo "같은 커밋($SHA)의 ci-related-tests 판 없음, 돌린다"; exit 0; fi
          id=${run%% *}; url=${run#* }
          dir="$RUNNER_TEMP/related"
          if ! gh run download "$id" -R "$REPO" -n related-lists -D "$dir" >/dev/null 2>&1 || [ ! -s "$dir/all.list" ]; then
            echo "ci-related-tests $url 에 선택 목록이 아직 없다, 돌린다"; exit 0
          fi
          missing=""
          for f in $FILES; do grep -qxF "$f" "$dir/all.list" || missing="$missing $f"; done
          if [ -n "$missing" ]; then echo "ci-related-tests 선택에 없는 파일:$missing, 돌린다"; exit 0; fi
          echo "covered=true" >> "$GITHUB_OUTPUT"
          line="VERDICT: COVERED (ci-related-tests $url 가 같은 커밋에서 이 파일들을 돈다. 결과는 그 판의 RESULT·VERDICT 줄. 그래도 돌리려면 -f force=true)"
          echo "$line"
          printf '### ci-vitest-files\n\n```\n%s\n```\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ci-vitest-files::$line"

  vitest:
    needs: covered
    if: needs.covered.outputs.covered != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-ci
        with:
          bun-version: '1.4.2'

      - name: python 의존성 (numpy·Pillow)
        run: |
          venv="$RUNNER_TEMP/vitest-python"
          python3 -m venv "$venv"
          "$venv/bin/pip" install numpy==2.4.4 pillow==12.1.1
          echo "$venv/bin" >> "$GITHUB_PATH"

      # ci-full 의 정적 잡과 같다 — *.browser.test.ts 의 bench 가 chromium 을 띄운다. 없으면
      # 「Executable doesn't exist ... chrome-headless-shell」로 테스트 전에 죽는다(42472679539).
      - name: Playwright 브라우저
        if: contains(inputs.files, '.browser.test.ts')
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${OPRN_CI_CACHE:-$RUNNER_TEMP}/playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          if [[ -n "${OPRN_CI_CACHE:-}" ]]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # files 검사는 vitest 스텝과 따로 둔다 — vitest 스텝에만 continue-on-error 가 걸리므로, 빈 입력은 어느 ref 에서도 실행을 실패시켜야 한다.
      - name: files 검사
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -z "${FILES// /}" ]; then echo "files 가 비었다 — 전체 스위트는 ci-full 로 돌린다." >&2; exit 2; fi

      - name: vitest (지정 파일만)
        id: vitest
        # agent/* 에서만 실패를 실행 결론에 올리지 않는다(위 머리말). 그 밖의 ref 는 false 라서 예전과 같다.
        continue-on-error: ${{ startsWith(github.ref_name, 'agent/') }}
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          # 마지막 스텝이 실패한 파일 이름을 읽도록 로그를 남긴다. pipefail 이라 vitest 종료 코드는 그대로 전달된다.
          # JSON 리포트는 마지막 스텝이 «무엇이 돌았고 무엇이 떨어졌나» 를 읽는 데 쓴다(verify-gates 와 같은 조합 — verbose 출력은 그대로다).
          # shellcheck disable=SC2086 — 공백으로 나눈 목록을 인자로 펼친다.
          node scripts/run-vitest.mjs run --configLoader bundle --reporter=verbose --reporter=json --outputFile "$RUNNER_TEMP/vitest.json" --maxWorkers=4 --minWorkers=1 $FILES 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      # 결과 — 로그의 끝줄 다섯(RESULT · NEW-FAIL · KNOWN-FAIL · NOW-PASSING · VERDICT), 요약, 주석. 이 스텝 자체는 실패하지 않는다.
      # vitest 스텝이 skipped 면 앞선 설정 스텝이 이미 실행을 실패시킨 것이므로 그 사실만 적는다.
      - name: 결과 (RESULT)
        if: always()
        env:
          FILES: ${{ inputs.files }}
          OUTCOME: ${{ steps.vitest.outcome }}
        run: |
          # shellcheck disable=SC2086
          set -- $FILES
          total=$#
          failed=""
          case "$OUTCOME" in
            success)
              line="RESULT: PASS ${total} files" ;;
            failure)
              failed=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" 2>/dev/null \
                | grep -oE 'FAIL +[^ >]+\.(test|spec)\.[cm]?[jt]sx?' | awk '{print $2}' | sort -u || true)
              n=$(printf '%s' "$failed" | grep -c . || true)
              if [ "$n" -gt 0 ]; then
                line="RESULT: FAIL ${n} files ($(printf '%s\n' "$failed" | paste -sd, - | sed 's/,/, /g'))"
              else
                line="RESULT: FAIL ${total} files (실패 파일 이름을 로그에서 읽지 못했다 — 위 로그를 본다)"
              fi ;;
            *)
              line="RESULT: ERROR ${total} files (vitest 스텝이 실행되지 않았다: ${OUTCOME:-없음} — 앞선 설정 스텝 실패)" ;;
          esac
          # 기준선과 대조한 넷(머리말 «끝줄 다섯»). 스크립트가 죽어도 CLEAN 이라고 하지 않는다.
          printf '%s\n' "$failed" > "$RUNNER_TEMP/vitest-failed.list"
          # shellcheck disable=SC2086
          more=$(node scripts/ci-vitest-files-verdict.mjs --outcome "$OUTCOME" --report "$RUNNER_TEMP/vitest.json" --failed-list "$RUNNER_TEMP/vitest-failed.list" --baseline .omo/gates-baseline.json -- $FILES) \
            || more=$(printf 'NEW-FAIL: (가르지 못했다)\nKNOWN-FAIL: (가르지 못했다)\nNOW-PASSING(기준선에서 뺄 것): (알 수 없다)\nVERDICT: UNKNOWN (scripts/ci-vitest-files-verdict.mjs 가 실패했다)')
          verdict=$(printf '%s\n' "$more" | tail -n 1)
          printf '### ci-vitest-files\n\n```\n%s\n%s\n```\n\n입력 파일 %s개: %s\n' "$line" "$more" "$total" "$FILES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ]; then echo "::error title=ci-vitest-files::${line}"; fi
          # 주석 하나에 넷을 다 담는다(VERDICT 가 맨 앞) — 새로 떨어진 것이 없으면 notice, 아니면 error. 주석은 메일을 보내지 않는다.
          note=$({ printf '%s\n' "$verdict"; printf '%s\n' "$more" | head -n 3; } | paste -sd'|' - | sed 's/|/ · /g')
          if [ "$verdict" = "VERDICT: CLEAN" ]; then echo "::notice title=ci-vitest-files::${note}"; else echo "::error title=ci-vitest-files::${note}"; fi
          echo "$line"
          echo "$more"

name: ci-vitest-files

# 지정한 vitest 파일만 GitHub 호스티드 러너에서 돌린다 — 수동(workflow_dispatch) 전용.
#
# 왜 (2026-10-25): 테스트는 CI 에서만 돈다(로컬 vitest 는 금지). 그런데 ci-full 은 샤드 넷에 약 3시간 20분이 걸려
# (run 40165485978), 실패 묶음 하나를 고친 뒤 그 파일 몇 개가 정말 통과하는지 보려고 ci-full 을 돌리면 하루에 몇 번 못 본다.
# 이 워크플로는 고른 파일만 돌려 몇 분 안에 답한다. 판정·기준선과는 무관하다 — 래칫은 여전히 ci-full 이 맡는다.
#
# 쓰는 법:
#   gh workflow run ci-vitest-files --ref <브랜치> -f files="test/a.test.ts test/b.test.ts"
#   gh run list --workflow ci-vitest-files --branch <브랜치>   →   gh run view <id> --log
#   files 를 비우면 아무것도 돌리지 않고 실패한다(전체 스위트는 ci-full 몫).
#
# agent/* 브랜치에서는 vitest 가 실패해도 실행(run)을 빨갛게 만들지 않는다 (2026-11-11).
#   왜: 최근 24시간 실패 실행 77건 중 63건이 이 워크플로를 다른 레인이 agent/* 브랜치에서 작업 도중 수동으로 돌린 것이었다.
#   수정 중에 돌리는 도구라 빨간 결과가 정상이고, 그 실패마다 오너 메일이 한 통씩 갔다. 알림을 끄는 대신 원인을 없앤다.
#   결과는 그대로 보인다 — 마지막 스텝이 로그 끝줄에 `RESULT: PASS n files` / `RESULT: FAIL n files (a.test.ts, ...)` 를 찍고,
#   요약(GITHUB_STEP_SUMMARY)과 ::error:: 주석(메일이 가지 않는다)에도 같은 내용을 남긴다. 읽을 곳은 run 의 conclusion 이 아니라 이 줄이다.
#   main·diag/*·fix/* 같은 agent/ 가 아닌 ref 는 예전처럼 vitest 실패가 곧 실행 실패다.
#   설정 스텝(files 검사·bun·python·npm ci·playwright)의 실패는 어느 ref 에서도 실행 실패다 — continue-on-error 는 vitest 스텝에만 건다.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "공백으로 나눈 테스트 파일 경로(또는 vitest 필터)"
        required: true
        type: string

concurrency:
  group: ci-vitest-files-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # 일부 테스트(spatialPlaceCli·npcGoldReward·assistantAcceptanceProvider)가 bun 으로 CLI 를 띄운다.
      # 러너에 bun 이 없어 「spawnSync bun ENOENT」로 실패했다(ci-full 40165485978).
      #    저장소 정책이 GitHub 소유 액션만 허용하므로(oven-sh/setup-bun 은 startup_failure) npm 패키지로 깐다.
      - name: bun 설치
        run: npm install -g bun@1.4.2 && bun --version

      # ci-full 과 같다 — joseonBaram 하네스 테스트의 python 관문 스크립트가 numpy·Pillow 를 쓴다.
      - name: python 의존성 (numpy·Pillow)
        run: python3 -m pip install --user --break-system-packages numpy==2.4.4 pillow==12.1.1 && python3 -c "import numpy, PIL; print(numpy.__version__, PIL.__version__)"

      - run: npm ci

      # ci-full 의 정적 잡과 같다 — *.browser.test.ts 의 bench 가 chromium 을 띄운다. 없으면
      # 「Executable doesn't exist ... chrome-headless-shell」로 테스트 전에 죽는다(42472679539).
      - name: Playwright 브라우저
        if: contains(inputs.files, '.browser.test.ts')
        run: npx playwright install --with-deps chromium

      # files 검사는 vitest 스텝과 따로 둔다 — vitest 스텝에만 continue-on-error 가 걸리므로, 빈 입력은 어느 ref 에서도 실행을 실패시켜야 한다.
      - name: files 검사
        env:
          FILES: ${{ inputs.files }}
        run: |
          if [ -z "${FILES// /}" ]; then echo "files 가 비었다 — 전체 스위트는 ci-full 로 돌린다." >&2; exit 2; fi

      - name: vitest (지정 파일만)
        id: vitest
        # agent/* 에서만 실패를 실행 결론에 올리지 않는다(위 머리말). 그 밖의 ref 는 false 라서 예전과 같다.
        continue-on-error: ${{ startsWith(github.ref_name, 'agent/') }}
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          # 마지막 스텝이 실패한 파일 이름을 읽도록 로그를 남긴다. pipefail 이라 vitest 종료 코드는 그대로 전달된다.
          # shellcheck disable=SC2086 — 공백으로 나눈 목록을 인자로 펼친다.
          node scripts/run-vitest.mjs run --configLoader bundle --reporter=verbose --maxWorkers=4 --minWorkers=1 $FILES 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      # 결과 한 줄 — 로그의 마지막 줄, 요약, ::error:: 주석(실패일 때). 이 스텝 자체는 실패하지 않는다.
      # vitest 스텝이 skipped 면 앞선 설정 스텝이 이미 실행을 실패시킨 것이므로 그 사실만 적는다.
      - name: 결과 (RESULT)
        if: always()
        env:
          FILES: ${{ inputs.files }}
          OUTCOME: ${{ steps.vitest.outcome }}
        run: |
          # shellcheck disable=SC2086
          set -- $FILES
          total=$#
          case "$OUTCOME" in
            success)
              line="RESULT: PASS ${total} files" ;;
            failure)
              failed=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" 2>/dev/null \
                | grep -oE 'FAIL +[^ >]+\.(test|spec)\.[cm]?[jt]sx?' | awk '{print $2}' | sort -u || true)
              n=$(printf '%s' "$failed" | grep -c . || true)
              if [ "$n" -gt 0 ]; then
                line="RESULT: FAIL ${n} files ($(printf '%s\n' "$failed" | paste -sd, - | sed 's/,/, /g'))"
              else
                line="RESULT: FAIL ${total} files (실패 파일 이름을 로그에서 읽지 못했다 — 위 로그를 본다)"
              fi ;;
            *)
              line="RESULT: ERROR ${total} files (vitest 스텝이 실행되지 않았다: ${OUTCOME:-없음} — 앞선 설정 스텝 실패)" ;;
          esac
          printf '### ci-vitest-files\n\n`%s`\n\n입력 파일 %s개: %s\n' "$line" "$total" "$FILES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ]; then echo "::error title=ci-vitest-files::${line}"; fi
          echo "$line"

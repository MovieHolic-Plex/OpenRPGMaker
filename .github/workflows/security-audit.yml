name: Security Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, mdc2, mdc2-fast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Report file names only. Never print a suspected credential to the Actions log.
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9+/=])(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{40,}|glpat-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----)([^A-Za-z0-9+/=]|$)'
          files="$(git grep -IlE "$pattern" -- . ':(exclude)package-lock.json' || true)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files" | while IFS= read -r file; do
              echo "::error file=$file::Potential credential pattern found; inspect locally without printing its contents."
            done
            exit 1
          fi

      - name: Audit production dependencies
        uses: ./.github/actions/linux-ci
        with:
          ignore-scripts: 'true'

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high

name: ci-fast

# 푸시·PR 마다 도는 **가벼운** 레인. 여기에 전체 vitest 를 넣지 않는다.
#
# 무엇을 넣었나: 2026-08-04 마지막 CI 실행에서 **실제로 초록이었던 것들**만 넣었다
# (editor-player-parity ✅, build ✅). 빨간 잡(unit-tests / e2e / ax-gates)은 여기 없다 —
# 빨간불을 푸시마다 띄우면 아무도 안 보게 되고, 그래서 이 저장소의 Actions 가 꺼졌다.
# 전체 스위트는 ci-full.yml(야간+수동)이 기준선 대비 회귀만 잡는다.
#
# 왜 `npm run test:changed` 가 아닌가: 이 래퍼는 import 그래프를 타고 번져서 소요가
# 예측 불가다 — 실측으로 변경 6건이면 454파일 254초지만, 코어 모듈을 스치면 1,247파일로
# 번져 30분을 넘긴다. 푸시 레인의 게이트로 쓸 수 없다. 로컬 반복용 도구로 남긴다.
#
# 러너는 GitHub 호스티드다. 이 저장소는 공개라서, 포크 PR 의 코드를 소유자 컴퓨터의
# self-hosted 러너에서 실행하지 않는다 (2026-10-12).

on:
  push:
    branches:
      - main
      - 'release/**'
  # PR 에도 돈다 (2026-10-25). 전에는 push 만 있어서 PR 에 체크가 하나도 없었고(`gh pr checks` →
  # "no checks reported"), 에이전트가 `gh pr merge` 로 바로 머지해 빨간 코드가 main 에 들어왔다
  # (run 40185571034: #3464 의 TS18048 이 머지 뒤에야 잡혔다). 이제 PR 머지 전 판정은 이 잡이 한다 —
  # `node scripts/merge-pr.mjs <번호>` 가 이 체크 초록을 기다린 뒤에만 머지한다.
  # pull_request 체크아웃은 「PR 머리 + 지금 main」 병합 커밋이라 HEAD~1 = main 이다(jp_city 핀 검사가 그대로 맞다).
  # 포크 PR 도 호스티드 러너·읽기 전용 토큰으로 돈다. 비밀은 쓰지 않는다.
  pull_request:
    branches:
      - main

concurrency:
  # push 와 pull_request 가 같은 브랜치면 메모리 예산을 같이 쓴다.
  # PR 브랜치는 새 푸시가 옛 잡을 끊는다.
  # main 은 끊지 않는다. 2026-09-26 에 머지 간격이 잡(타입체크만 약 3분)보다 짧아서,
  # 타입체크가 통과한 main 잡이 parity 도중에 취소되고 완료된 체크가 하나도 남지 않았다.
  # 진행 중인 main 잡은 끝내고, 아직 시작 전인 대기 잡만 최신 커밋으로 바뀐다.
  group: ci-fast-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 잡이 둘인 이유 (2026-11-08 실측): 성공 51회의 단계 합은 중앙 440초인데 벽시계도 448초였다 —
# 즉 **전부 직렬**이었다. 가장 긴 사슬(parity 200초)과 그 뒤의 앱 빌드만 한 러너에 남기고
# 서로 독립인 정적 검사(핀·타입체크·배럴·CSS 래칫·openwiki·런타임 에셋)를 다른 러너로 옮기면
# 임계 경로가 약 338초가 되어 100초 남짓(약 24%) 줄어든다. 두 잡은 서로를 기다리지 않는다.
#
# **필수 체크 이름 `fast` 는 그대로 둔다** — 저장소의 브랜치 보호와 `scripts/merge-pr.mjs` 가
# 그 이름을 본다. 두 번째 잡 `fast-static` 도 머지 조건에 넣었으므로(merge-pr.mjs 의
# REQUIRED_CHECKS) 게이트는 약해지지 않고 넓어진다.
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2   # jp_city 핀 검사가 바로 앞 커밋(HEAD~1)의 pins.json 과 비교한다

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 릴리스(desktop-release)는 **태그 트리**를 체크아웃해 `node scripts/build-electron.mjs` 로 AI 워커를
      # `bun build --compile` 한다. 이 저장소의 어느 게이트도 그 엔트리포인트를 컴파일하지 않았다 —
      # typecheck:app 은 src 만, windows-worker-smoke 는 paths 필터에 scripts/lib/** 가 없다.
      # 그래서 #4373 이 scripts/lib/piAgentRuntime.ts 에 없는 경로(`../src/...`)를 넣은 채 머지됐고,
      # desktop-release 가 2026-11-06 22:05Z 부터 매번 실패해 v0.408.0 이 빈 채 latest 가 됐다(404).
      # 릴리스와 같은 엔트리포인트·플래그로 컴파일해 못 푸는 import 를 머지 전에 잡는다.
      #
      # 설치 경로를 바꾼 이유 (2026-11-08 실측, 최근 100판): 이 단계 실패 18건이 **전부**
      # `Failed to download bun from "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"`
      # (curl 22 + 503/504)였다. 옛 명령 `curl -fsSL https://bun.sh/install | bash` 는 «latest» 를
      # GitHub 릴리스에서 받고 재시도도 없다 — PR 코드와 무관한 실패이고, 그 18판은 초록이 될 수 없었다.
      # 이제 npm 레지스트리에서 **고정판**을 받는다: (1) 버전이 고정되어 릴리스와 같은 컴파일러를 쓰고,
      # (2) npm ci 가 이미 쓰는 레지스트리라 별도 CDN 장애에 걸리지 않으며, (3) ci-full·ci-vitest-files 가
      # 처음부터 쓰던 방식과 같다. 컴파일 대상·플래그는 릴리스와 동일하게 그대로 둔다(무엇을 굽는지는 불변).
      - name: AI 워커 컴파일 (릴리스와 같은 엔트리포인트)
        env:
          BUN_VERSION: '1.4.2'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 180 npm install -g "bun@${BUN_VERSION}"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::bun@${BUN_VERSION} 설치가 3회 실패했다."; exit 1; fi
            echo "::warning::bun@${BUN_VERSION} 설치 실패 (시도 ${attempt}/3) — $((attempt * 10))초 뒤 재시도한다."
            sleep $((attempt * 10))
          done
          bun --version
          if [ "$(bun --version)" != "${BUN_VERSION}" ]; then
            echo "::error::bun 이 ${BUN_VERSION} 이 아니다: $(bun --version)"
            exit 1
          fi
          bun build scripts/oh-my-pi-worker.ts \
            --compile --target=bun-linux-x64 \
            --outfile="$RUNNER_TEMP/oh-my-pi-worker"
          test -s "$RUNNER_TEMP/oh-my-pi-worker"

      # 생성기 고정판(tiledata/gen-kits.lock.json)은 로컬에서만 본다: npm run gen-kits:check.
      # object-gen 도 char-gen·tile-gen 과 같이 비공개라 호스티드 러너는 복제할 수 없다(2026-10-22 실측:
      # git clone 이 Username 을 묻다 실패하고, 그 뒤의 타입체크·패리티가 시작도 못 했다).
      # 공개로 바뀌기 전에는 이 워크플로에 넣지 않는다. 자격 없는 러너에 비공개 지시문을 받지 않는다.
      - name: 캐릭터 하네스 계약
        run: |
          python3 -m venv "$RUNNER_TEMP/charset-harness-venv"
          "$RUNNER_TEMP/charset-harness-venv/bin/pip" install 'Pillow>=10,<14'
          "$RUNNER_TEMP/charset-harness-venv/bin/python" src/harnesses/charset-actor/verify.py

      # 2026-10-04 타입체크 상주 집합이 7GB 를 넘어 7168 힙에서 exit 134 로 죽었다.
      # 호스티드 러너 메모리는 16GB 다. 힙은 10GB 만 연다.
      - name: 타입체크 (src 만)
        env:
          NODE_OPTIONS: --max-old-space-size=10240
        run: npm run typecheck:app

      # 에디터↔플레이어 데이터 왕복 계약. 9파일이라 바운드가 확실하다.
      # 잡은 러너마다 격리되므로 호스트 락은 없다.
      - name: parity 스위트
        run: npm run test:parity

      # 앱 번들만. 전체 npm run build(플레이어·standalone·아카이브까지)는 ci-full 몫이다.
      - name: 앱 빌드
        run: npm run build:app

  # 정적 검사 묶음. `fast` 와 **동시에** 돌고 서로를 기다리지 않는다 — 위 주석의 100초 절감이 여기서 나온다.
  # 각 항목은 순수 함수/정적 분석이라 다른 단계의 산출물을 쓰지 않는다(러너도 따로다).
  fast-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2   # jp_city 핀 검사가 바로 앞 커밋(HEAD~1)의 pins.json 과 비교한다

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # jp_city 칸 번호 핀은 덧붙이기 전용. 2026-10-14~18 에 낡은 pins.json 으로 구운 PR 이 머지되며 번호가 밀려
      # 게시한 장소 32곳·사용자 맵이 엉뚱한 칸을 그렸다(#2899 에서 11,329칸). node 만 쓰고 1초 안에 끝난다.
      - name: jp_city 핀 불변
        run: node scripts/content/jp-city/check-pins.mjs --base HEAD~1

      # typecheck:app 은 electron/ 을 보지 않는다. #2856 이 assetStoreClient.ts 의 import 를 지운 채 머지돼
      # 컨셉 피드가 늘 실패했다(2026-10-20). 스토어 중계·편집기 스토어 모듈·그 테스트와 import 만 본다 — electron/main 전체는
      # main.ts·protocols.ts·serve/runtime.ts 에 묵은 오류가 남아 있어 아직 게이트로 못 쓴다.
      - name: 타입체크 (Electron 스토어 중계)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck:electron-store

      # typecheck:app 은 src 만 본다. test/ · scripts/ · evals/ 의 import 계약은 아무도 안 보는데
      # (`npx tsc --noEmit` 전체는 이 저장소에서 4GB 힙으로 OOM 이라 게이트로 못 쓴다),
      # 실제로 #882/#883 이 머지되면서 e2e 스펙 2개가 배럴에서 빠진 심볼을 다시 가져왔다.
      - name: 배럴 수출 계약
        run: npm run gates:barrel

      # 워크플로가 소유자 컴퓨터(self-hosted)로 돌아가지 않는지.
      - name: 호스티드 러너 계약
        run: npm run gates:self-hosted

      # 플레이어·웹 내보내기가 선언한 런타임 에셋이 public/ 에 실제로 있는지(저작권 정리로 지운 그림을
      # 계속 선언해 모든 Web ZIP 내보내기가 실패했던 회귀를 막는다). 브라우저·빌드 없이 수십 초.
      - name: 런타임 에셋 존재
        run: npm run check:runtime-assets

      # CSS 래칫 6종(budget·graph·live-classes·surfaces·winners·dead-classes). 몇 초면 끝난다.
      # 왜 (2026-10-26): ci-full 에만 있어서 머지마다 드리프트가 쌓였다 — #3541·#3611 로 두 번 다시 올렸는데
      # 그 사이 #3628 이 hex 1개·표면 밖 선택자 1개를 또 넣었다. PR 에서 막는다.
      #
      # 실패 14건의 원인 (2026-11-08 실측): 12건이 «PR 이 시트를 고쳤는데 css-winners 기준선을 다시 뜨지
      # 않은 것», 1건이 같은 이유의 surfaces, 1건이 hex 신규 1건이었다. 게이트 자체는 결정적이다 —
      # 깨끗한 origin/main 에서 두 번 돌려 출력 md5 가 같았다. 그래서 판정은 그대로 두고,
      # **어느 기준선을 어떻게 다시 뜨는지**를 한 줄로 알려 준다(verify-gates 의 cssGate 가
      # `::error::` 로 `npm run gates:css:save` 를 찍는다).
      - name: CSS 래칫
        run: node scripts/verify-gates.mjs --only css

      # openwiki/INDEX.md 는 생성 파일이고 커밋하지 않는다(.gitignore, 2026-11-11). 전에는 커밋해 두고 「최신인가」를
      # 여기서 대조했는데, 문서를 건드리는 PR 이 저마다 그 파일을 다시 써서 main 에 문서 PR 하나가 들어갈 때마다
      # 열려 있는 문서 PR 전부가 충돌했다. 이제는 생성기가 도는지만 본다(생성기가 깨지면 에이전트가 목차를 못 만든다).
      - name: openwiki 색인 생성기 동작
        run: node scripts/openwiki-index.mjs

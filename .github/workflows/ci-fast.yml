name: ci-fast

# 푸시·PR 마다 도는 **가벼운** 레인. 여기에 전체 vitest 를 넣지 않는다.
#
# 무엇을 넣었나: 2026-08-04 마지막 CI 실행에서 **실제로 초록이었던 것들**만 넣었다
# (editor-player-parity ✅, build ✅). 빨간 잡(unit-tests / e2e / ax-gates)은 여기 없다 —
# 빨간불을 푸시마다 띄우면 아무도 안 보게 되고, 그래서 이 저장소의 Actions 가 꺼졌다.
# 전체 스위트는 ci-full.yml(4시간 cron·수동)이 기준선 대비 회귀만 잡는다.
#
# 왜 `npm run test:changed` 가 아닌가: 이 래퍼는 import 그래프를 타고 번져서 소요가
# 예측 불가다 — 실측으로 변경 6건이면 454파일 254초지만, 코어 모듈을 스치면 1,247파일로
# 번져 30분을 넘긴다. 푸시 레인의 게이트로 쓸 수 없다. 로컬 반복용 도구로 남긴다.
#
# 러너는 모두 GitHub 호스티드(ubuntu-latest)다 (2026-11-24, ci-github-offload).
# 왜: mdc2 러너(18대)는 에이전트 레인·VM 과 메모리 251GB 를 나눠 쓴다. CI 가 몰리면 MemAvailable 20GB·load 200 까지
# 가고 러너가 전부 offline 이 됐다(2026-11-24 12:09~12:56Z). 그 하루 mdc2 위 ci-fast 잡의 대기는 중앙 145~243초,
# 최대 2,589초였고, 호스티드는 같은 기간 대기 p90 2초였다. 공개 저장소라 호스티드는 무료이고 분 제한이 없다.
# 한도는 **동시 잡 20개**다(개인 계정, 2026-11-22T16:54Z 에 20 에서 막힌 것을 실측). 그래서 이 워크플로는
# 푸시 한 번에 잡 4개(fast·fast-static·fast-parity 2샤드)만 쓴다 — ci-full 이 13개를 써도 PR 몫 7개가 남는다.
# 포크 PR 도 같은 호스티드 러너·읽기 전용 토큰으로 돈다. mdc2 에는 포크 코드가 가지 않는다.

on:
  push:
    branches:
      - main
      - 'release/**'
  # PR 에도 돈다 (2026-10-25). 전에는 push 만 있어서 PR 에 체크가 하나도 없었고(`gh pr checks` →
  # "no checks reported"), 에이전트가 `gh pr merge` 로 바로 머지해 빨간 코드가 main 에 들어왔다
  # (run 40185571034: #3464 의 TS18048 이 머지 뒤에야 잡혔다).
  # `node scripts/merge-pr.mjs <번호>` 가 `fast`·`fast-static`·패리티 전 샤드의 초록을 기다린 뒤에만 머지한다.
  # pull_request 체크아웃은 「PR 머리 + 지금 main」 병합 커밋이라 HEAD~1 = main 이다(jp_city 핀 검사가 그대로 맞다).
  # 포크 PR 도 호스티드 러너·읽기 전용 토큰으로 돈다. 비밀은 쓰지 않는다.
  pull_request:
    branches:
      - main

concurrency:
  # PR 번호로 묶어 포크의 같은 브랜치 이름이 다른 PR/푸시를 취소하지 않게 한다.
  # main 은 이미 실행 중인 검사를 완료한다.
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 2026-11-08 실측에서 직렬 실행의 단계 합은 중앙 440초, 벽시계는 448초였다.
# 독립적인 정적 검사를 fast-static 으로 떼어 병렬로 돌려 임계 경로를 약 100초 줄이는 구성이었다.
#
# 2026-11-19 실측(run 44483882406)에서 fast 는 6분 28초 걸렸고, parity 230초(가져오기 40%)·
# 타입체크 44초·체크아웃 46초가 직렬이었다. `fast`(빌드)·`fast-parity` 2샤드·`fast-static` 은
# 서로 기다리지 않고 병렬로 돈다. 같은 날 실측(run 44531254883, 44533700673, 44536145289):
# ci-full 과 여러 PR 이 겹치면 4초짜리 집계 잡도 선행 잡 완료 뒤 101~733초 동안 러너를 기다렸다.
# 집계를 머지 도우미에서 해 PR 한 판에 잡 6개만 실행하고, 마지막 러너 대기를 없앤다.
permissions:
  contents: read

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-ci
        with:
          bun-version: '1.4.2' # 데스크톱 릴리스와 같은 컴파일러

      - name: AI 워커 컴파일 (릴리스와 같은 엔트리포인트)
        run: |
          bun build scripts/oh-my-pi-worker.ts \
            --compile --target=bun-linux-x64 \
            --outfile="$RUNNER_TEMP/oh-my-pi-worker"
          test -s "$RUNNER_TEMP/oh-my-pi-worker"

      # 생성기 고정판(tiledata/gen-kits.lock.json)은 로컬에서만 본다: npm run gen-kits:check.
      # object-gen 도 char-gen·tile-gen 과 같이 비공개라 호스티드 러너는 복제할 수 없다(2026-10-22 실측:
      # git clone 이 Username 을 묻다 실패하고, 그 뒤의 타입체크·패리티가 시작도 못 했다).
      # 공개로 바뀌기 전에는 이 워크플로에 넣지 않는다. 자격 없는 러너에 비공개 지시문을 받지 않는다.
      # 2026-10-04 타입체크 상주 집합이 7GB 를 넘어 7168 힙에서 exit 134 로 죽었다.
      # Python 하네스는 타입체크와 파일이나 산출물을 공유하지 않는다.
      - name: 타입체크 (src 만) 및 캐릭터 하네스 계약
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          charset() {
            local venv="$RUNNER_TEMP/charset-harness-venv"
            python3 -m venv "$venv"
            "$venv/bin/pip" install 'Pillow>=10,<14'
            "$venv/bin/python" src/harnesses/charset-actor/verify.py
          }
          check_types() {
            if [[ -n "${OPRN_CI_CACHE:-}" ]]; then
              npm run typecheck:app -- --tsBuildInfoFile "$OPRN_CI_CACHE/app.tsbuildinfo"
            else
              npm run typecheck:app
            fi
          }
          TIMEFORMAT='캐릭터 하네스: %3Rs'
          (time charset) > "$RUNNER_TEMP/charset.log" 2>&1 &
          charset_pid=$!
          TIMEFORMAT='앱 타입체크: %3Rs'
          status=0
          time check_types || status=$?
          wait "$charset_pid" || status=$?
          cat "$RUNNER_TEMP/charset.log"
          exit "$status"

      # 앱 번들만. 전체 npm run build(플레이어·standalone·아카이브까지)는 ci-full 몫이다.
      - name: 앱 빌드
        run: npm run build:app

  # 샤드 둘인 이유 (2026-11-24): 호스티드 동시 잡 20개가 한도라 푸시마다 쓰는 잡 수가 곧 대기 시간이다.
  # mdc2 4샤드는 샤드당 시험 79~141초였고, 호스티드 `fast`·`fast-static` 이 약 3분이다. 둘로 나눠도
  # parity 는 그 임계 경로 안에 든다. parity 가 임계 경로가 되면 그때 샤드를 늘린다.
  fast-parity:
    name: fast-parity (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-ci

      # 에디터↔플레이어 데이터 왕복 계약. 9파일이라 바운드가 확실하다.
      # Node 환경의 Vitest 스위트라 고정 포트나 X 디스플레이를 쓰지 않는다.
      # vitest 내장 --shard 는 파일 경로의 SHA-1 해시로 정렬해 연속 구간으로 자른다.
      # 분할은 결정적이고 두 샤드의 합집합이 test/parity 전체다(누락·중복 없음).
      # 샤드 수가 파일 수보다 많으면 vitest 가 에러로 멈춘다.
      # 겹쳐 도는 편집기 저장·로드 사례는 기본 15초를 넘길 수 있다.
      - name: parity 스위트 (샤드 ${{ matrix.shard }}/2)
        run: npm run test:parity -- --shard=${{ matrix.shard }}/2 --testTimeout=60000

  # 정적 검사 묶음. `fast`·`fast-parity` 와 **동시에** 돌고 서로를 기다리지 않는다(2026-11-08 의 100초 절감이 여기서 나온다).
  # 각 항목은 순수 함수/정적 분석이라 다른 단계의 산출물을 쓰지 않는다(러너도 따로다).
  fast-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2   # jp_city 핀 검사가 HEAD~1 의 pins.json 과 비교한다
          persist-credentials: false

      - uses: ./.github/actions/linux-ci

      # jp_city 칸 번호 핀은 덧붙이기 전용. 2026-10-14~18 에 낡은 pins.json 으로 구운 PR 이 머지되며 번호가 밀려
      # 게시한 장소 32곳·사용자 맵이 엉뚱한 칸을 그렸다(#2899 에서 11,329칸). node 만 쓰고 1초 안에 끝난다.
      - name: jp_city 핀 불변
        run: node scripts/content/jp-city/check-pins.mjs --base HEAD~1

      # typecheck:app 은 electron/ 을 보지 않는다. #2856 이 assetStoreClient.ts 의 import 를 지운 채 머지돼
      # 컨셉 피드가 늘 실패했다(2026-10-20). 스토어 중계·편집기 스토어 모듈·그 테스트와 import 만 본다 — electron/main 전체는
      # main.ts·protocols.ts·serve/runtime.ts 에 묵은 오류가 남아 있어 아직 게이트로 못 쓴다.
      - name: 타입체크 (Electron 스토어 중계)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if [[ -n "${OPRN_CI_CACHE:-}" ]]; then
            npm run typecheck:electron-store -- --incremental --tsBuildInfoFile "$OPRN_CI_CACHE/electron-store.tsbuildinfo"
          else
            npm run typecheck:electron-store
          fi

      # typecheck:app 은 src 만 본다. test/ · scripts/ · evals/ 의 import 계약은 아무도 안 보는데
      # (`npx tsc --noEmit` 전체는 이 저장소에서 4GB 힙으로 OOM 이라 게이트로 못 쓴다),
      # 실제로 #882/#883 이 머지되면서 e2e 스펙 2개가 배럴에서 빠진 심볼을 다시 가져왔다.
      - name: 배럴 수출 계약
        run: npm run gates:barrel

      # 작은 일 코어가 번호 유닛을 다시 import 하거나 유닛 id 로 분기하지 못하게 한다.
      - name: 작은 일 코어·유닛 계층
        run: npm run gates:small-task-layering

      # self-hosted 분기는 포크 PR 과 pull_request_target 을 호스티드로 보내는 식에서만 허용한다.
      - name: 러너 선택 계약
        run: npm run gates:self-hosted

      - name: 러너 선택 계약 테스트
        run: node --test scripts/check-self-hosted-workflows.test.mjs

      # 플레이어·웹 내보내기가 선언한 런타임 에셋이 public/ 에 실제로 있는지(저작권 정리로 지운 그림을
      # 계속 선언해 모든 Web ZIP 내보내기가 실패했던 회귀를 막는다). 브라우저·빌드 없이 수십 초.
      # vite-node 기본 힙(약 2GB)을 넘겼던 검사에 6GB 힙을 준다(2026-11-20, fast-static exit 134).
      # CSS 래칫 6종(budget·graph·live-classes·surfaces·winners·dead-classes)도 확인한다.
      # verify-gates 의 cssGate 가 실패한 하위 기준선을 다시 뜨는 명령을 ::error:: 로 찍는다.
      # css-winners 기준선은 2026-11-24 부터 엔트리×승자 파일 조각(scripts/css-winners/**)이다 — 서로 다른
      # CSS 를 건드린 PR 끼리는 같은 조각을 쓰지 않고, 같은 조각이 충돌하면 `npm run css-baseline:rebase` 가 다시 뜬다.
      - name: 런타임 에셋 존재, CSS 래칫 및 openwiki 색인 생성기
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          # 런타임 에셋 검사 중 독립적인 CSS 래칫과 생성기 검사를 끝낸다.
          TIMEFORMAT='런타임 에셋: %3Rs'
          (time npm run check:runtime-assets) > "$RUNNER_TEMP/runtime-assets.log" 2>&1 &
          assets_pid=$!
          status=0
          TIMEFORMAT='CSS 래칫: %3Rs'
          time node scripts/verify-gates.mjs --only css || status=$?
          TIMEFORMAT='openwiki 색인: %3Rs'
          time node scripts/openwiki-index.mjs || status=$?
          wait "$assets_pid" || status=$?
          cat "$RUNNER_TEMP/runtime-assets.log"
          exit "$status"

name: Mac onboarding

# Dormant while repository Actions are disabled. This is not evidence of Mac QA.
# 2026-11-23 오너 결정(B): macOS 호스티드 대신 mdc2 리눅스에서 돈다. 단계가 bash -n·node --check·계약 테스트·타입체크라
# mac 전용 동작이 없다. 워크플로는 여전히 disabled_manually 다.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Start RPG Maker.command'
      - 'scripts/mac-launch.mjs'
      - 'scripts/setup-local.mjs'
      - 'test/macLauncher.test.mjs'
      - 'test/setupLocal.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mac-onboarding.yml'

permissions:
  contents: read

jobs:
  launcher-and-private-setup:
    if: github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, mdc2, mdc2-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-ci
      - name: Syntax and executable wrapper
        run: |
          /bin/bash -n 'Start RPG Maker.command'
          test -x 'Start RPG Maker.command'
          node --check scripts/mac-launch.mjs
          node --check scripts/setup-local.mjs
      - name: mac:launch and setup:local contracts (no secrets or live database)
        run: npm run test:mac-onboarding
      - run: npm run typecheck:app

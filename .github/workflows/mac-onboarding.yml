name: Mac onboarding

# Dormant while repository Actions are disabled. This is not evidence of Mac QA.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Start RPG Maker.command'
      - 'scripts/mac-launch.mjs'
      - 'scripts/setup-local.mjs'
      - 'test/macLauncher.test.mjs'
      - 'test/setupLocal.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mac-onboarding.yml'

permissions:
  contents: read

jobs:
  launcher-and-private-setup:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax and executable wrapper
        run: |
          /bin/bash -n 'Start RPG Maker.command'
          test -x 'Start RPG Maker.command'
          node --check scripts/mac-launch.mjs
          node --check scripts/setup-local.mjs
      - name: mac:launch and setup:local contracts (no secrets or live database)
        run: npm run test:mac-onboarding
      - run: npm run typecheck:app

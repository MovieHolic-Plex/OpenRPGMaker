<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OPRN Player</title>
    <style>
      /* 불러오는 동안 검은 빈 화면 대신 움직이는 막대가 보인다(글자 없음 — 게임 언어를 아직 모른다).
         앱이 #app 에 무엇이든 붙이면 :empty 가 풀려 저절로 사라진다. */
      #app:empty::before, #app:empty::after { content: ""; position: fixed; left: 50%; top: 50%; height: 4px; border-radius: 2px; }
      #app:empty::before { width: 160px; margin: -2px 0 0 -80px; background: #1c2a2e; }
      #app:empty::after { width: 48px; margin: -2px 0 0 -80px; background: #8ab; animation: oprn-boot-bar 1.1s ease-in-out infinite alternate; }
      @keyframes oprn-boot-bar { to { transform: translateX(112px); } }
      /* 움직임 줄이기: 미끄러지는 조각 대신 막대 전체가 천천히 밝아졌다 어두워진다(위치 이동 없음). */
      @media (prefers-reduced-motion: reduce) {
        #app:empty::after { width: 160px; animation: oprn-boot-pulse 2.4s ease-in-out infinite alternate; }
        @keyframes oprn-boot-pulse { from { opacity: 0.35; } to { opacity: 0.8; } }
      }
    </style>
  </head>
<body style="margin:0;background:#000;color:#fff">
    <div id="app"></div>
    <script type="module" src="/src/player/exportEntry.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="브라우저에서 돌아가는 AI 협업 탑다운 RPG 제작 워크벤치" />
    <meta name="theme-color" content="#131722" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
    <title>OPRN Studio</title>
    <!--
      첫 로드 스플래시: 편집기 번들이 평가·마운트되기까지(실측 웜 4초·콜드 8~10초, 큰 프로젝트 첫 부팅은 25초+) 빈 화면이 보이던 자리.
      이 파일의 인라인 CSS·마크업만으로 첫 프레임에 그려진다(외부 자원·이미지 없음). 단계 표시·시간 안내·오류+다시 시도는
      public/boot-splash.js(작은 클래식 스크립트 — 번들과 무관하게 먼저 돈다)가 맡고, 번들은 reportBootStage 로 단계만 넘긴다.
      편집기가 입력 가능해지면 src/app/bootLoader.ts 가 걷는다. #app 안이 아니라 형제로 둔다 — bootApp 은 #app 을 비우지 않고 append 하므로.
      진행 줄은 가짜 퍼센트가 아니라 4개의 이산 단계다. 10초·60초 안내는 CSS 지연 애니메이션이라 메인 스레드가 막혀도 뜬다.
      글자 번역은 boot-splash.js 가 직접 한다(src/i18n 에 기대지 않는다) — data-i18n-skip 으로 DOM 번역기를 비킨다.
    -->
    <style>
      html { background: #f7f8f8; }
      #oprn-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        box-sizing: border-box;
        background: #f7f8f8;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        transition: opacity 160ms ease-out;
      }
      #oprn-boot-loader[data-leaving] { opacity: 0; pointer-events: none; }
      #oprn-boot-loader .oprn-boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #oprn-boot-loader .oprn-boot-logo { width: 28px; height: 28px; flex: none; }
      #oprn-boot-loader .oprn-boot-text {
        min-height: 1.4em;
        font-size: 14px;
        color: #334155;
        text-align: center;
      }
      /* 진행 줄: 4개 단계 칸. 끝난 칸은 꽉 차고, 지금 칸은 transform 만 움직이는 띠가 오간다(합성 스레드라 메인이 막혀도 돈다). */
      #oprn-boot-loader .oprn-boot-steps {
        display: flex;
        gap: 6px;
        width: min(100% - 32px, 20rem);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #oprn-boot-loader .oprn-boot-steps li {
        position: relative;
        flex: 1;
        height: 5px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.1);
        overflow: hidden;
      }
      #oprn-boot-loader .oprn-boot-steps li::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #4a57d6;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 240ms ease-out;
      }
      #oprn-boot-loader .oprn-boot-steps li[data-state="done"]::after { transform: scaleX(1); }
      #oprn-boot-loader .oprn-boot-steps li[data-state="active"] { background: rgba(74, 87, 214, 0.22); }
      #oprn-boot-loader .oprn-boot-steps li[data-state="active"]::after {
        width: 42%;
        transform: translateX(-100%);
        animation: oprn-boot-slide 1.3s ease-in-out infinite;
        transition: none;
      }
      @keyframes oprn-boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(240%); }
      }
      #oprn-boot-loader .oprn-boot-lines {
        width: min(100% - 32px, 22rem);
        height: 2.8em;
        overflow: hidden;
        text-align: center;
      }
      #oprn-boot-loader .oprn-boot-track { animation: oprn-boot-lines 5.4s ease-out forwards; }
      #oprn-boot-loader .oprn-boot-track p {
        height: 2.8em;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #64748b;
      }
      @keyframes oprn-boot-lines {
        0%, 30% { transform: translateY(0); }
        38%, 64% { transform: translateY(-2.8em); }
        72%, 100% { transform: translateY(-5.6em); }
      }
      /* 시간 안내: 10초 / 60초가 지나도 아직 떠 있으면 나타난다. 지연 애니메이션이라 JS 없이도(메인이 막혀도) 뜬다. */
      #oprn-boot-loader .oprn-boot-note {
        max-width: 24rem;
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #475569;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        animation: oprn-boot-reveal 0s linear 10s forwards;
      }
      #oprn-boot-loader .oprn-boot-stall {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: 24rem;
        margin: 0;
        font-size: 12.5px;
        color: #475569;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        animation: oprn-boot-reveal 0s linear 60s forwards;
      }
      @keyframes oprn-boot-reveal { to { opacity: 1; visibility: visible; } }
      #oprn-boot-loader .oprn-boot-retry {
        display: inline-block;
        text-decoration: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #4a57d6;
        border: 0;
        border-radius: 8px;
        padding: 8px 18px;
        cursor: pointer;
      }
      #oprn-boot-loader .oprn-boot-retry:hover { background: #3d49b8; }
      #oprn-boot-loader .oprn-boot-retry:focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
      /* 실패: 돌아가는 줄·안내는 끄고 메시지 + 다시 시도만 보인다. 다시 시도는 <a href=""> 라 JS·인라인 핸들러(CSP 가 막는다) 없이 같은 주소를 다시 연다. 영원히 도는 스플래시는 없다. */
      #oprn-boot-loader .oprn-boot-fail { display: none; flex-direction: column; align-items: center; gap: 10px; max-width: 26rem; text-align: center; }
      #oprn-boot-loader[data-failed] .oprn-boot-fail { display: flex; }
      #oprn-boot-loader[data-failed] .oprn-boot-text,
      #oprn-boot-loader[data-failed] .oprn-boot-steps,
      #oprn-boot-loader[data-failed] .oprn-boot-lines,
      #oprn-boot-loader[data-failed] .oprn-boot-note,
      #oprn-boot-loader[data-failed] .oprn-boot-stall { display: none; }
      #oprn-boot-loader .oprn-boot-fail-title { margin: 0; font-size: 15px; font-weight: 700; color: #991b1b; }
      #oprn-boot-loader .oprn-boot-fail-msg { margin: 0; font-size: 13px; line-height: 1.5; color: #334155; }
      #oprn-boot-loader .oprn-boot-fail details { font-size: 11.5px; color: #64748b; max-width: 100%; }
      #oprn-boot-loader .oprn-boot-fail code { display: block; margin-top: 6px; white-space: pre-wrap; word-break: break-all; text-align: left; max-height: 6em; overflow: auto; }
      /* 마지막 편집 화면(데스크톱, electron/main/lastView.ts → public/boot-splash.js): 지난번에 닫을 때의 편집기 그림을 읽기 전용 자리표시로
         깔고, 단계 글자를 아래 가운데 작은 칩으로 바꾼다. 그림을 묻는 동안(최대 400ms)은 로고·줄을 숨겨 흰 로더가 한 번 비치지 않게 한다. */
      #oprn-boot-loader[data-resume-pending]:not([data-failed]) > * { visibility: hidden; }
      #oprn-boot-loader .oprn-boot-resume { display: none; }
      #oprn-boot-loader[data-resume]:not([data-failed]) { cursor: progress; }
      #oprn-boot-loader[data-resume]:not([data-failed]) .oprn-boot-resume {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left top;
        user-select: none;
        -webkit-user-drag: none;
      }
      #oprn-boot-loader[data-resume]:not([data-failed]) > :not(.oprn-boot-resume):not(.oprn-boot-text):not(.oprn-boot-stall) { display: none; }
      #oprn-boot-loader[data-resume]:not([data-failed]) .oprn-boot-text {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 0;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.82);
        color: #fff;
        font-size: 12.5px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.25);
        white-space: nowrap;
      }
      #oprn-boot-loader[data-resume]:not([data-failed]) .oprn-boot-text::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8b96ff;
        animation: oprn-boot-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes oprn-boot-pulse { from { opacity: 0.35; } to { opacity: 1; } }
      #oprn-boot-loader[data-resume]:not([data-failed]) .oprn-boot-stall {
        position: absolute;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        padding: 10px 14px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
      }
      @media (prefers-reduced-motion: reduce) {
        #oprn-boot-loader[data-resume] .oprn-boot-text::before { animation: none; }
        #oprn-boot-loader { transition: none; }
        #oprn-boot-loader .oprn-boot-track { animation: none; }
        #oprn-boot-loader .oprn-boot-steps li[data-state="active"]::after { animation: none; width: 100%; transform: none; opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="oprn-boot-loader" data-testid="boot-loader" data-stage="app" role="status" aria-live="polite" data-i18n-skip translate="no">
      <div class="oprn-boot-brand">
        <svg class="oprn-boot-logo" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect width="28" height="28" rx="7" fill="#4a57d6" />
          <rect x="6" y="6" width="7" height="7" rx="1.5" fill="#fff" />
          <rect x="15" y="6" width="7" height="7" rx="1.5" fill="#fff" fill-opacity="0.55" />
          <rect x="6" y="15" width="7" height="7" rx="1.5" fill="#fff" fill-opacity="0.55" />
          <rect x="15" y="15" width="7" height="7" rx="1.5" fill="#fff" />
        </svg>
        <span>OPRN Studio</span>
      </div>
      <div class="oprn-boot-text">앱 불러오는 중…</div>
      <ol class="oprn-boot-steps" aria-hidden="true">
        <li data-state="active"></li>
        <li data-state="pending"></li>
        <li data-state="pending"></li>
        <li data-state="pending"></li>
      </ol>
      <div class="oprn-boot-lines">
        <div class="oprn-boot-track">
          <p>맵·이벤트 편집</p>
          <p>AI 어시스턴트</p>
          <p>자동 저장</p>
        </div>
      </div>
      <p class="oprn-boot-note">큰 프로젝트라 시간이 걸려요. 새 버전을 처음 여는 때가 가장 오래 걸리고, 다음부터는 빨라져요.</p>
      <div class="oprn-boot-stall">
        <span class="oprn-boot-stall-text">아직 열리지 않았어요. 계속 기다리거나 다시 시도할 수 있어요.</span>
        <a class="oprn-boot-retry" href="">다시 시도</a>
      </div>
      <div class="oprn-boot-fail">
        <p class="oprn-boot-fail-title">OPRN Studio를 열지 못했어요</p>
        <p class="oprn-boot-fail-msg"></p>
        <a class="oprn-boot-retry" href="">다시 시도</a>
        <details><summary>자세히</summary><code class="oprn-boot-fail-detail"></code></details>
      </div>
    </div>
    <script src="/boot-splash.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>칩셋 조각 고르기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#1d1b20; --panel:#26232a; --line:#3a3640; --text:#e8e3dc; --dim:#9b958d; --ok:#7fbf6a; --bad:#e0685a; --sel:#f2c14e; --acc:#8fb3e8; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Noto Sans KR", sans-serif; }
header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
header h1 { font-size:15px; margin:0 8px 0 0; }
header .prog { color:var(--dim); }
header select, header button, header label { font:inherit; color:var(--text); background:#302c35; border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
header button.on { background:#4a4252; border-color:var(--sel); }
header label { display:inline-flex; gap:4px; align-items:center; }
.wrap { display:flex; height:calc(100vh - 50px); }
nav { width:260px; flex:none; overflow:auto; border-right:1px solid var(--line); }
nav .it { display:flex; gap:8px; align-items:center; padding:5px 10px; cursor:pointer; border-bottom:1px solid #2c2930; }
nav .it:hover { background:#2d2932; }
nav .it.cur { background:#3a3442; }
nav .dot { width:9px; height:9px; border-radius:50%; background:#555; flex:none; }
nav .dot.done { background:var(--ok); }
nav .memo { width:9px; height:9px; border-radius:50%; background:#3b82f6; box-shadow:0 0 6px #3b82f6; flex:none; }
nav .memo.off { visibility:hidden; }
nav .q { flex:none; width:16px; height:16px; line-height:16px; text-align:center; border-radius:50%; background:#f59e0b; color:#1a1a1a; font-weight:700; font-size:12px; }
.addressed { background:#3a3320; border:1px solid #f59e0b; border-radius:6px; padding:6px 10px; margin:0 0 10px; }
nav .it .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
nav .it .c { color:var(--dim); font-size:12px; }
main { flex:1; overflow:auto; padding:14px 18px 60px; }
.head h2 { margin:0; font-size:18px; }
.head .meta { color:var(--dim); margin:2px 0 10px; }
.cards { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }
.card { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:8px; cursor:pointer; position:relative; max-width:560px; }
.card:hover { border-color:#6a6070; }
.card.sel { border-color:var(--sel); box-shadow:0 0 0 2px var(--sel) inset; }
.card.var { border-color:#3b82f6; box-shadow:0 0 0 2px #3b82f6 inset; }
.card .vb { background:#3b82f6; color:#fff; border-radius:4px; padding:0 6px; font-weight:700; font-size:12px; }
nav .vc { flex:none; color:#8fb8ff; font-size:12px; font-weight:700; }
.card .k { position:absolute; top:6px; left:6px; background:#000a; border-radius:4px; padding:0 6px; font-weight:700; }
.card .lab { margin-left:28px; font-weight:600; }
.card .lab .d { color:var(--acc); font-weight:400; }
.imgs { display:flex; gap:10px; align-items:flex-end; margin:6px 0; }
.imgs img { image-rendering:pixelated; display:block; }
.x1 { background:#5d4632; padding:4px; box-sizing:content-box; }
.x4 { background:#2e2833 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="8" height="8" fill="%23353039"/><rect x="8" y="8" width="8" height="8" fill="%23353039"/></svg>'); }
.ctx { outline:1px solid #000; }
.st { font-size:12px; color:var(--dim); }
.st .ok { color:var(--ok); } .st .bad { color:var(--bad); }
.hard { color:var(--bad); font-size:12px; }
.note { font-size:13px; font-style:italic; color:#d8cfc3; max-width:520px; }
.memo { margin-top:14px; max-width:900px; }
.memo textarea { width:100%; min-height:54px; background:#221f25; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
.memo .saved { color:var(--dim); font-size:12px; }
.keys { color:var(--dim); font-size:12px; margin-top:10px; }
.row { display:flex; gap:10px; align-items:flex-end; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.row .rn { width:150px; flex:none; }
.row .card { padding:5px; }
.sum span { margin-right:14px; }
.toast { position:fixed; right:16px; bottom:16px; background:#3c3444; border:1px solid var(--sel); padding:8px 12px; border-radius:8px; display:none; }
.outs img { image-rendering:pixelated; max-width:100%; display:block; margin:6px 0 18px; }
.empty { color:var(--dim); padding:20px; }
#setTabs { display:inline-flex; gap:4px; margin-right:8px; }
#setTabs button.on { background:#5a4a2a; border-color:var(--sel); color:#fff; font-weight:700; }
#setTabs .n { color:var(--dim); font-size:12px; margin-left:4px; }
.members { margin:10px 0 4px; } .members img { image-rendering:pixelated; display:block; background:#2e2833; margin-top:4px; }
.refs { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:0 0 10px; padding:6px 8px; border:1px dashed var(--line); border-radius:8px; }
.refs .ref { display:inline-flex; gap:6px; align-items:flex-end; } .refs img { image-rendering:pixelated; }
.about { color:var(--dim); font-size:13px; margin:0 0 8px; }
.memo .saved.ing { color:#e8b04a; } .memo .saved.ok { color:var(--ok); } .memo .saved.bad { color:var(--bad); font-weight:700; }
#alert { display:none; position:sticky; top:0; z-index:9; background:#7a1f1a; color:#fff; padding:8px 14px; border-bottom:2px solid var(--bad); }
#alert button, #recover button { font:inherit; margin-left:8px; background:#fff2; color:#fff; border:1px solid #fff6; border-radius:5px; padding:1px 8px; cursor:pointer; }
#recover { display:none; background:#3a3320; border-bottom:2px solid #f59e0b; padding:8px 14px; }
#recover .r { margin:3px 0; }
details.hist { margin-top:14px; max-width:900px; }
nav .kb { flex:none; font-size:11px; font-weight:700; border-radius:4px; padding:0 5px; background:#2f5d3a; color:#d8f5de; }
nav .kb.mv { background:#4a3a2a; color:#e8c9a0; }
nav .it.moved .n { color:var(--dim); text-decoration:line-through; }
.moved-note { background:#2b2a22; border:1px dashed #b08a4a; border-radius:6px; padding:8px 12px; margin:0 0 10px; }
.moved-note a, .kitlink { color:#f2c14e; cursor:pointer; text-decoration:underline; }
.kcard { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:10px 12px; margin:0 0 16px; position:relative; }
.kcard.sel { border-color:var(--sel); box-shadow:0 0 0 2px var(--sel) inset; }
.kcard.var { border-color:#3b82f6; box-shadow:0 0 0 2px #3b82f6 inset; }
.kcard .khead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
.kcard .khead .k { position:static; }
.kcard .khead button { font:inherit; color:var(--text); background:#3b3444; border:1px solid var(--sel); border-radius:6px; padding:2px 10px; cursor:pointer; }
.kcard .khead button.v { border-color:#3b82f6; }
.kex { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.kex figure { margin:0; } .kex figcaption { font-size:12px; color:var(--dim); margin-bottom:3px; }
.kex figcaption.bad { color:var(--bad); }
.kex img { image-rendering:pixelated; display:block; outline:1px solid #000; }
.kcard details { margin-top:8px; } .kcard details summary { cursor:pointer; color:var(--acc); font-size:13px; }
.kcard details img { image-rendering:pixelated; display:block; margin-top:6px; max-width:100%; }
.kwarn { font-size:12px; color:#d8b36a; max-height:160px; overflow:auto; white-space:pre-wrap; }
.contract { font-size:12px; color:var(--dim); margin:0 0 10px; padding-left:18px; }
details.old { margin-top:10px; } details.old summary { cursor:pointer; color:var(--dim); }
details.hist summary { cursor:pointer; color:var(--acc); }
.hist table { border-collapse:collapse; margin-top:6px; font-size:13px; width:100%; }
.hist td, .hist th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; vertical-align:top; }
.hist th { color:var(--dim); font-weight:400; }
.hist td.nt { white-space:pre-wrap; max-width:420px; }
.hist tr.now td { background:#2d2a22; }
.hist button { font:inherit; font-size:12px; color:var(--text); background:#302c35; border:1px solid var(--line); border-radius:5px; padding:1px 7px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>칩셋 조각 고르기</h1><span id="setTabs"></span>
  <span class="prog" id="prog"></span>
  <button id="vItem" class="on">기물별</button>
  <span>방향별 <select id="vDir"><option value="">—</option></select></span>
  <button id="vOut" style="display:none">적용 결과</button>
  <select id="fWorker"><option value="">작업자 전체</option></select>
  <select id="fCat"><option value="">장면 전체</option></select>
  <label><input type="checkbox" id="fTodo"> 안 고른 것만</label>
  <label><input type="checkbox" id="fDone" checked> 완료 숨기기</label>
  <label><input type="checkbox" id="fMemo"> 메모만</label>
  <label><input type="checkbox" id="fReview"> ? 확인할 것만</label>
  <label title="현재판이 있는 세트(현대)는 현재판도 센다"><input type="checkbox" id="fHas" checked> 볼 것 있는 것만</label>
  <label title="조립형 킷으로 옮긴 옛 한 장 기물(선택·메모 기록은 그대로 남아 있다)"><input type="checkbox" id="fMoved"> 킷으로 옮긴 옛 기물</label>
  <label title="조립 예 위에 통행 표시: 빨강 막힘 · 파랑 테 드나드는 칸 · 노랑 점 사람 위로 지나감 · 초록 지나가는 길"><input type="checkbox" id="fWalk"> 통행 표시</label>
  <button id="reload" title="후보 다시 읽기">다시 읽기</button>
</header>
<div id="alert"></div>
<div id="recover"></div>
<div class="wrap">
  <nav id="list"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let S = null, cur = null, view = 'item', dirView = '';
let DIRS = {A:'결 따르기', B:'명암·그림자', C:'실루엣 재해석'};
let SET = (location.hash || '').slice(1) || localStorage.getItem('atp-set') || 'modern', SETS = [];
const BASE = () => S && S.baseline;   // 현재판 이름(현대 = v0). 없는 세트는 null
async function loadSets() {
  try { SETS = await (await fetch('/api/sets')).json(); } catch (e) { SETS = []; }
  if (!SETS.find(x => x.id === SET) && SETS.length) SET = SETS[0].id;
  $('#setTabs').innerHTML = SETS.map(x => `<button data-s="${esc(x.id)}" class="${x.id===SET?'on':''}" title="${esc(x.about)}">${esc(x.name)}<span class="n">${x.picked}/${x.items}${x.candidates?' · 후보 '+x.candidates:''}</span></button>`).join('');
  $('#setTabs').querySelectorAll('button').forEach(b => b.onclick = () => switchSet(b.dataset.s));
}
async function switchSet(id) {
  if (id === SET) return;
  flushNote(); await saveQ;
  SET = id; location.hash = id; try { localStorage.setItem('atp-set', id); } catch (e) {}
  cur = null; view = 'item'; dirView = ''; $('#vDir').value = ''; $('#fWorker').value = ''; $('#fCat').value = '';
  await loadSets(); await load();
}

async function load() {
  const r = await fetch('/api/state?set=' + encodeURIComponent(SET)); S = await r.json();
  if (S.directions) DIRS = S.directions;
  const fw = $('#fWorker'), fc = $('#fCat'), vd = $('#vDir');
  const keep = [fw.value, fc.value, vd.value];
  fw.innerHTML = '<option value="">작업자 전체</option>' + S.workers.map(w => `<option>${w}</option>`).join('');
  fc.innerHTML = '<option value="">장면 전체</option>' + S.categories.map(c => `<option>${c}</option>`).join('');
  const dirs = [...new Set(S.items.flatMap(i => i.candidates.map(c => c.dir)))].sort();
  vd.innerHTML = '<option value="">—</option>' + dirs.map(d => `<option value="${d}">${d} ${DIRS[d]||''}</option>`).join('');
  [fw.value, fc.value, vd.value] = keep;
  if (!cur || !S.items.find(i => i.id === cur)) cur = (filtered()[0] || S.items[0] || {}).id;
  render(); offerRecover();
}
// ── 메모 임시 보관(localStorage) — 저장이 서버에서 확인될 때까지 남는다 ──
const DK = () => 'atp-draft:' + SET + ':';
function draftSet(id, note) { try { localStorage.setItem(DK() + id, JSON.stringify({note, at: new Date().toISOString()})); } catch (e) {} }
function draftGet(id) { try { return JSON.parse(localStorage.getItem(DK() + id)); } catch (e) { return null; } }
function draftDel(id) { try { localStorage.removeItem(DK() + id); } catch (e) {} }
function serverNote(id) { const it = S && S.items.find(i => i.id === id); return (it && it.pick && it.pick.note) || ''; }
function offerRecover() {
  const rows = [];
  for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (!key || !key.startsWith(DK())) continue;
    const id = key.slice(DK().length), d = draftGet(id);
    if (!d || !S.items.find(i => i.id === id) || d.note === serverNote(id)) { draftDel(id); k--; continue; }
    rows.push([id, d]); }
  const e = $('#recover');
  if (!rows.length) { e.style.display = 'none'; return; }
  e.innerHTML = '<b>저장 안 된 메모가 이 브라우저에 남아 있습니다.</b>' + rows.map(([id, d]) => { const it = S.items.find(i => i.id === id);
    return `<div class="r" data-id="${esc(id)}">${esc(it.name)} (${esc(new Date(d.at).toLocaleString())}): 「${esc(d.note)}」 <span class="st">지금 서버: 「${esc(serverNote(id))}」</span>
      <button data-a="save">이 메모로 저장</button><button data-a="drop">버리기</button><button data-a="go">보기</button></div>`; }).join('');
  e.style.display = 'block';
  e.querySelectorAll('.r').forEach(r => r.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const id = r.dataset.id, d = draftGet(id);
    if (b.dataset.a === 'save' && d) { if (await post({id, note: d.note})) { if (id === cur) render(); toast('복구한 메모 저장'); } }
    else if (b.dataset.a === 'drop') draftDel(id);
    else { cur = id; view = 'item'; render(); return; }
    offerRecover(); }));
}
function alertFail(msg) {
  const e = $('#alert'); if (!msg) { e.style.display = 'none'; return; }
  e.innerHTML = `저장 실패 — ${esc(msg)}. 입력한 메모는 이 브라우저에 임시 보관했습니다. <button id="retry">다시 저장</button><button id="alertClose">닫기</button>`;
  e.style.display = 'block';
  $('#retry').onclick = () => { alertFail(null); const p = pendingFor(); if (p) saveNote(p.id, p.note); else if (cur && $('#memo')) saveNote(cur, $('#memo').value); };
  $('#alertClose').onclick = () => alertFail(null);
}
function filtered() {
  const w = $('#fWorker').value, c = $('#fCat').value, todo = $('#fTodo').checked, has = $('#fHas').checked;
  return S.items.filter(i => (!w || i.worker === w || i.candidates.some(x => x.worker === w)) && (!c || i.category === c)
    && (!todo || !(i.pick && i.pick.choice)) && (!has || i.candidates.length || i.hasBaseline)
    && (!$('#fMemo')?.checked || i.hasNote) && (!$('#fReview')?.checked || i.review)
    && (!$('#fDone')?.checked || !isDone(i) || i.id === cur)
    && (!i.movedTo || $('#fMoved')?.checked || i.id === cur));
}
// 완료 = 골랐고, 반영 안 된 메모가 없고, 확인할 ?도 없다. (지금 보고 있는 기물은 방금 골라도 사라지지 않게 둔다)
function isDone(i) { return !!(i.pick && i.pick.choice) && !(i.hasNote && !i.addressed) && !i.review;
}
function vars(i) { return (i.pick && i.pick.variants) || []; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function render() {
  flushNote();   // 다른 기물로 넘어가기 전에 미저장 메모를 바로 보낸다
  renderList();
  $('#vItem').classList.toggle('on', view === 'item'); $('#vOut').classList.toggle('on', view === 'out');
  if (view === 'item') renderItem(); else if (view === 'dir') renderDir(); else renderOut();
  const c = $('#list .cur'); if (c) c.scrollIntoView({block:'nearest'});
}
function renderList() {
  const items = filtered();
  const nv = S.items.filter(i => vars(i).length), tv = nv.reduce((a, i) => a + vars(i).length, 0);
  const live = S.items.filter(i => !i.movedTo), nk = live.filter(i => i.kind === 'kit').length, nm = S.items.length - live.length;
  $('#prog').textContent = `고름 ${live.filter(i => i.pick && i.pick.choice).length} / ${live.length}` + (nk ? ` (킷 ${nk})` : '') + ` · 완료 ${live.filter(isDone).length} · 보이는 ${items.length}` + (tv ? ` · 함께 쓰기 ${nv.length}개 기물 +${tv}` : '') + (nm ? ` · 킷으로 옮김 ${nm}` : '');
  $('#list').innerHTML = items.map(i => `<div class="it ${i.id===cur?'cur':''} ${i.movedTo?'moved':''}" data-id="${esc(i.id)}">${i.kind==='kit'?'<span class="kb" title="조립형 킷 — 후보 = 부품 한 벌">킷</span>':''}${i.movedTo?`<span class="kb mv" title="${esc(i.movedTo)} 로 옮김">→킷</span>`:''}
      <span class="dot ${i.pick&&i.pick.choice?'done':''}"></span><span class="memo ${i.hasNote?'':'off'}" title="메모 있음"></span><span class="n">${esc(i.name)}</span>${vars(i).length?`<span class="vc" title="함께 쓰기 ${vars(i).join(', ')}">+${vars(i).length}</span>`:''}${i.review?'<span class="q" title="메모 반영됨 — 확인해 주세요">?</span>':''}
      <span class="c">${i.candidates.length} · ${esc(i.worker)}</span></div>`).join('') || ('<div class="empty">조건에 맞는 기물 없음' + ($('#fHas').checked ? ' — 아직 후보가 없으면 「볼 것 있는 것만」을 끄면 목록이 보인다' : '') + '</div>');
  $('#list').querySelectorAll('.it').forEach(e => e.onclick = () => { cur = e.dataset.id; view = 'item'; setView(); render(); });
}
// 0번 = 현재판(있는 세트만, 없으면 빈 자리), 1번부터 후보 — 키 0~9 와 같다
function opts(it) { if (it.kind === 'kit') return [null].concat(it.candidates.map(c => ({...c, label:c.name})));
  const b = BASE() && it.hasBaseline ? {name:BASE(), label:BASE()+' 현재판 (유지)', v:BASE()} : null; return [b].concat(it.candidates.map(c => ({...c, label:c.name}))); }
function imgs(it, o, big=4, ctx) {
  if (ctx === undefined) ctx = (S && S.ctxScale) || 2;
  const [W, H] = it.canvas;
  const src = o.name === BASE() ? `/c/${SET}/${it.slug}/${o.name}.png` : `/c/${SET}/${it.slug}/${o.name}.png?v=${o.v}`;
  const ctxsrc = `/ctx/${SET}/${it.slug}/${o.name}.png?v=${o.v||0}`;
  if (o.name !== BASE() && !o.v) return '<div class="imgs st">아직 그림을 굽기 전(작업자가 찍는 중 — 검사를 돌리면 보인다)</div>';
  return `<div class="imgs">
    <img class="x1" src="${src}" width="${W}" height="${H}" alt="원 크기">
    <img class="x4" src="${src}" width="${W*big}" height="${H*big}" alt="4배">
    ${ctx && !(S && S.ctxFirst) ? `<img class="ctx" src="${ctxsrc}" data-ctx="${ctx}" onload="this.width=this.naturalWidth*${ctx}" alt="맥락">` : ''}
  </div>${ctx && S && S.ctxFirst ? `<div class="st">깔아 본 지도</div><img class="ctx" style="image-rendering:pixelated;display:block" src="${ctxsrc}" onload="this.width=this.naturalWidth*${ctx}" alt="깔아 본 지도">` : ''}`;
}
function status(o) {
  if (o.name === BASE()) return '<div class="st">지금 시트에 든 판 (그대로 두려면 이것)</div>';
  if (o.stale) return '<div class="st bad">검사 전 — check_candidate.py 를 돌려야 한다</div>';
  const lint = o.lintPass ? '<span class="ok">pxlint16 합</span>' : `<span class="bad">pxlint16 불</span> ${esc((o.lintFailed||[]).join(', '))}`;

  if (await post(body)) { toast(`${it ? it.name : id} → ${c === BASE() ? '현재판 유지' : c} 저장`); render(); }
}
async function toggleVar(id, c) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  if (c === BASE()) { toast('현재판은 함께 쓰기로 못 넣는다 (그대로 둔다)'); return; }
  const ch = it.pick && it.pick.choice;
  if (!ch || ch === BASE()) { toast('먼저 주 선택(후보)을 고르세요'); return; }
  if (c === ch) { toast('주 선택은 이미 쓴다 — 다른 후보를 Shift+클릭'); return; }
  const cur = vars(it), on = !cur.includes(c);
  const order = opts(it).map(o => o && o.name), next = (on ? cur.concat([c]) : cur.filter(v => v !== c)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (await post({id, variants: next})) { toast(`${it.name}: ${c} 함께 쓰기 ${on ? '켬' : '끔'} (+${next.length})`); render(); }
}
function saveNote(id, note) {
  saveQ = saveQ.then(async () => {
    const it = S.items.find(i => i.id === id); if (!it) return;
    if ((it.pick && it.pick.note || '') === note) { draftDel(id); if (id === cur) noteStatus('ok', '저장됨 ' + (it.pick ? it.pick.at : '')); return; }
    if (id === cur) noteStatus('ing', '저장 중…');
    const j = await post({id, note});
    if (id !== cur) { if (j) renderList(); return; }
    if (j) { noteStatus(pend && pend.id === id ? 'ing' : 'ok', (pend && pend.id === id ? '입력 중… · ' : '') + '메모 저장됨 ' + it.pick.at); renderList(); }
    else noteStatus('bad', '저장 실패 — 이 브라우저에 임시 보관함');
  }).catch(e => { alertFail(e.message); });
  return saveQ;
}
// 창을 닫거나 숨길 때: 미저장 메모를 sendBeacon 으로 (응답은 못 받으니 임시 보관본은 다음 로드 때 서버 값과 대조해 지운다)
function beacon() {
  clearTimeout(pendT); const p = pend; if (!p) return; pend = null;
  draftSet(p.id, p.note);
  const ok = navigator.sendBeacon && navigator.sendBeacon('/api/pick', new Blob([JSON.stringify({set: SET, id: p.id, note: p.note, client: 'beacon'})], {type: 'application/json'}));
  if (!ok) saveNote(p.id, p.note);
}
window.addEventListener('beforeunload', beacon);
window.addEventListener('pagehide', beacon);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') beacon(); });
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 1800); }
function move(k) { const it = filtered(); let i = it.findIndex(x => x.id === cur); i = Math.max(0, Math.min(it.length - 1, i + k)); if (it[i]) { cur = it[i].id; render(); $('#main').scrollTop = 0; } }
function setView() { if (view !== 'dir') $('#vDir').value = ''; }
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (view !== 'item') return;
  const it = S && S.items.find(i => i.id === cur); if (!it) return;
  if (ev.shiftKey && /^Digit[0-9]$/.test(ev.code)) { const o = opts(it)[+ev.code.slice(5)]; if (o) toggleVar(it.id, o.name); }
  else if (/^[0-9]$/.test(ev.key)) { const o = opts(it)[+ev.key]; if (o) pick(it.id, o.name); }
  else if (ev.key === 'n') move(1); else if (ev.key === 'p') move(-1);
  else if (ev.key === 'u') { const f = filtered(); const i = f.findIndex(x => x.id === cur);
    const nx = f.slice(i + 1).concat(f.slice(0, i)).find(x => !(x.pick && x.pick.choice)); if (nx) { cur = nx.id; render(); } }
  else if (ev.key === 'x') post({id:it.id, clear:true}).then(render);
});
$('#vItem').onclick = () => { view = 'item'; setView(); render(); };
$('#vOut').onclick = () => { view = 'out'; setView(); render(); };
$('#vDir').onchange = () => { dirView = $('#vDir').value; view = dirView ? 'dir' : 'item'; render(); };
['#fWorker', '#fCat', '#fTodo', '#fHas', '#fMemo', '#fReview', '#fDone', '#fMoved', '#fWalk'].forEach(s => $(s).onchange = render);
$('#reload').onclick = () => loadSets().then(load);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== SET) switchSet(h); });
loadSets().then(load);
</script>
</body>

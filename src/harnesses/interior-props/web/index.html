<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소품 고르기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#1b191e; --panel:#25222a; --panel2:#2d2932; --line:#3a3640; --text:#ece7e0; --dim:#9b958d; --ok:#7fbf6a; --bad:#e0685a; --sel:#f2c14e; --acc:#8fb3e8; --rej:#c2410c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Noto Sans KR", sans-serif; }
button, input, textarea, select { font:inherit; color:var(--text); }
header { display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; height:50px; }
header h1 { font-size:16px; margin:0 6px 0 0; white-space:nowrap; }
.tab { background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 12px; cursor:pointer; }
.tab.on { background:#3a3442; border-color:var(--sel); }
.chip { border-radius:999px; padding:2px 10px; font-size:12px; background:#33303a; color:var(--dim); white-space:nowrap; }
.chip b { color:var(--text); }
.pool { margin-left:auto; color:var(--dim); font-size:12px; white-space:nowrap; }
.pool .live { color:var(--ok); }
.wrap { display:flex; height:calc(100vh - 50px); }
nav { width:250px; flex:none; overflow:auto; border-right:1px solid var(--line); background:#1f1d23; }
button.chip { border:0; cursor:pointer; font:inherit; font-size:12px; }
nav h3.fold { cursor:pointer; }
nav h3.fold:hover { color:var(--text); }
nav h3 { margin:0; padding:10px 12px 4px; font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.02em; }
nav .it { display:flex; gap:8px; align-items:center; padding:6px 10px; cursor:pointer; border-left:3px solid transparent; }
nav .it:hover { background:var(--panel2); }
nav .it.cur { background:#38323f; border-left-color:var(--sel); }
nav .th { width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; background:#5d4632; border-radius:4px; overflow:hidden; }
nav .th img { image-rendering:pixelated; max-width:32px; max-height:32px; }
nav .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
nav .b { font-size:11px; border-radius:4px; padding:0 6px; flex:none; }
.b.ready { background:var(--sel); color:#1a1a1a; font-weight:700; }
.b.drawing { background:#2b3b55; color:#cfe0ff; }
.b.done { background:#2f4a2c; color:#cdeac6; }
main { flex:1; overflow:auto; padding:14px 20px 140px; }
.empty { color:var(--dim); padding:40px; text-align:center; font-size:15px; }
.head { display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
.head h2 { margin:0; font-size:34px; letter-spacing:.02em; }   /* 물건 이름 — 가운데 위에 크게(2026-10-03) */
.head .meta { color:var(--dim); font-size:12px; }
.rounds { display:flex; gap:6px; margin:8px 0 2px; flex-wrap:wrap; }
.rounds button { background:#2c2932; border:1px solid var(--line); border-radius:6px; padding:2px 10px; cursor:pointer; font-size:12px; }
.rounds button.on { border-color:var(--sel); background:#3a3442; }
.rnote { color:#e9d9a8; font-size:13px; margin:2px 0 6px; }
.tools { display:flex; gap:14px; align-items:center; margin:10px 0 12px; color:var(--dim); font-size:13px; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { background:#2a2730; border:0; padding:3px 10px; cursor:pointer; }
.seg button.on { background:#4a4252; color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(172px, 1fr)); gap:10px; align-items:stretch; }
.grid.ctxmode { grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); }   /* 방 안만 보기: 방 그림을 크게 — 어느 것이 가장 자연스러운지 고른다 */
.grid.ctxmode .card .nt { display:none; }
.card { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; position:relative; display:flex; flex-direction:column; min-width:0; transition:border-color .1s; }
.card:hover { border-color:#6d6377; }
.card.sel { border-color:var(--sel); box-shadow:0 0 0 3px #f2c14e55; }
.card.cur { background:#2a2a24; }
.card.rej { opacity:.45; }
.card.rej .pic { filter:grayscale(.7); }
.card .top { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.card .key { background:#000a; border-radius:5px; padding:0 7px; font-weight:800; font-size:13px; }
.card .dir { font-size:12px; color:var(--acc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.card .x { margin-left:4px; background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; padding:0 7px; color:var(--dim); }
.card .x:hover { color:var(--bad); border-color:var(--bad); }
.card.rej .x { color:#fff; background:var(--rej); border-color:var(--rej); }
.pic { display:flex; align-items:flex-end; justify-content:center; border-radius:6px; padding:8px; flex:1; min-height:80px; overflow:hidden; }
.pic img.ld { opacity:0; }
.pic.wait { background-image:linear-gradient(90deg,#0000,#ffffff10,#0000) !important; background-size:200% 100% !important; animation:sh 1.2s linear infinite; }
@keyframes sh { to { background-position:-200% 0; } }
.pic img { image-rendering:pixelated; display:block; }
.bg-wood .pic { background:#8a6b4c; }
.bg-dark .pic { background:#151417; }
.bg-check .pic { background:#3a3540 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="8" height="8" fill="%234a4450"/><rect x="8" y="8" width="8" height="8" fill="%234a4450"/></svg>'); }
.mode-ctx .pic { padding:0; background:#000 !important; }
.card .nt { font-size:12px; color:#cfc6ba; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .bad { color:var(--bad); font-size:12px; margin-top:4px; }
.vb { font-size:11px; font-weight:800; border-radius:4px; padding:0 6px; white-space:nowrap; }
.vb.pass { background:#2f4a2c; color:#cdeac6; } .vb.fail { background:#5a2320; color:#ffd9d3; } .vb.unk { background:#3a3640; color:var(--dim); }
.rv { font-size:12px; margin-top:4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.rv.pass { color:#a9d79a; } .rv.fail { color:#ff9d8f; }
.hist { font-size:11px; color:var(--dim); margin-top:3px; cursor:help; text-decoration:underline dotted; }
.card.vfail { border-color:#6a2a24; }
.pic.over { position:relative; } .pic.over::after { content:attr(data-over); position:absolute; inset:auto 6px 6px auto; background:#000c; color:#cfe0ff; font-size:11px; padding:1px 6px; border-radius:4px; }
.reasons { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.reasons button { font-size:11px; border-radius:999px; border:1px solid var(--line); background:#2a2730; padding:1px 8px; cursor:pointer; }
.reasons button.on { background:var(--rej); border-color:var(--rej); color:#fff; }
.spin { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--dim); min-height:120px; min-width:120px; }
.spin i { width:22px; height:22px; border:3px solid #444; border-top-color:var(--acc); border-radius:50%; animation:r 1s linear infinite; }
@keyframes r { to { transform:rotate(360deg); } }
.cmp { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
.cmp h4 { margin:0 0 8px; font-size:13px; color:var(--dim); font-weight:600; }
.cmp .row { display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
.cmp .col .pic.ctxp { min-width:336px; min-height:336px; }
.cmp .col { text-align:center; color:var(--dim); font-size:12px; }
.cmp .col .pic { padding:12px; }
.bar { position:fixed; left:250px; right:0; bottom:0; background:#211e25ee; backdrop-filter:blur(4px); border-top:1px solid var(--line); padding:10px 20px; display:flex; gap:10px; align-items:center; z-index:9; }
.bar textarea { flex:1; min-height:38px; max-height:120px; resize:vertical; background:#1a181d; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.btn { border:1px solid var(--line); background:#34303b; border-radius:8px; padding:8px 14px; cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:#776d82; }
.btn.go { background:var(--sel); color:#1a1a1a; font-weight:800; border-color:var(--sel); }
.btn.go:disabled { opacity:.4; cursor:default; }
.btn.redo { background:#2b3b55; border-color:#3e5b8a; }
.bar label { color:var(--dim); font-size:12px; display:flex; gap:4px; align-items:center; white-space:nowrap; }
.keys { color:var(--dim); font-size:12px; margin-top:14px; }
.keys kbd { background:#2f2b35; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; }
.toast { position:fixed; right:18px; bottom:18px; background:#2f4a2c; color:#e6f6e1; padding:8px 16px; border-radius:8px; z-index:20; display:none; pointer-events:none; box-shadow:0 2px 10px #0008; }   /* 오른쪽 아래(2026-10-03, 사용자 「위에 띄우지 말고 오른쪽 아래」) — 위는 기물 이름이라 가린다 */
.toast.err { background:#5a2320; }
/* 기물 고르기(새 판) */
.objtools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.objtools input { background:#1a181d; border:1px solid var(--line); border-radius:8px; padding:6px 10px; width:260px; }
.cats { display:flex; gap:5px; flex-wrap:wrap; }
.cats button { font-size:12px; border-radius:999px; border:1px solid var(--line); background:#2a2730; padding:2px 10px; cursor:pointer; }
.cats button.on { background:#4a4252; border-color:var(--sel); }
.objs { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; }
.obj { background:var(--panel); border:2px solid var(--line); border-radius:9px; padding:6px; cursor:pointer; position:relative; text-align:center; }
.obj:hover { border-color:#6d6377; }
.obj.on { border-color:var(--sel); background:#3a3426; }
.obj .pic { min-height:70px; padding:6px; background:#8a6b4c; }
.obj .nm { font-size:12px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.obj .ck { position:absolute; top:4px; right:6px; color:var(--sel); font-weight:900; display:none; }
.obj.on .ck { display:block; }
.obj .newpic { color:#f2c14e; font-size:12px; font-weight:800; align-self:center; line-height:1.3; }
.obj .newpic small { color:#e9d9a8; font-weight:600; }
.nb { background:#f2c14e; color:#1a1a1a; border-radius:3px; padding:0 4px; font-size:10px; }
.eng { font-size:10px; font-weight:800; border-radius:4px; padding:0 5px; letter-spacing:.02em; flex:none; }
.eng.codex { background:#1f4d3a; color:#9ff0c6; }
.eng.claude { background:#5a3a22; color:#ffc99a; }
.it .eng { margin-left:4px; }
.engf { position:sticky; top:0; z-index:2; background:#1f1d23; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; padding:8px 10px 6px; color:var(--dim); font-size:12px; }
.card .ctxw { margin-top:6px; background:#000; border-radius:4px; overflow:hidden; line-height:0; }
.card .ctxw img { width:100%; height:auto; image-rendering:pixelated; display:block; }
.card.olsel { border-style:dashed; }
.card .olk { font-size:11px; padding:0 6px; border-radius:3px; background:#3a3640; color:var(--text); white-space:nowrap; }
.card.olsel .olk { background:#5a4a20; color:var(--sel); }
.facts { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.fact { font-size:11px; border-radius:4px; padding:0 6px; background:#33303a; color:var(--dim); white-space:nowrap; cursor:help; }
.fact.ok { background:#2f4a2c; color:#cdeac6; } .fact.no { background:#5a2320; color:#ffd9d3; } .fact.warn { background:#4a3d1c; color:#f5dc9a; }
.card .nt { -webkit-line-clamp:1; }
.waitbox { max-width:560px; margin:60px auto; text-align:center; color:var(--dim); font-size:15px; }
.waitbox b { color:var(--text); }
.waitbox .spin { min-height:60px; }
.prog { display:inline-flex; align-items:center; gap:6px; }
.prog .pb { width:120px; height:6px; background:#33303a; border-radius:3px; overflow:hidden; }
.prog .pb i { display:block; height:100%; background:var(--ok); }
.obj .rb { position:absolute; top:4px; left:6px; font-size:10px; background:#2b3b55; color:#cfe0ff; border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <h1>소품 고르기</h1>
  <button class="tab on" data-v="pick">후보 고르기</button>
  <button class="tab" data-v="objs">기물 골라 새로 뽑기</button>
  <span class="chip">고를 차례 <b id="cReady">0</b></span>
  <span class="chip">그리는·검수 중 <b id="cDraw">0</b></span>
  <button class="chip" id="cDoneBtn" title="끝난 기물(이미 고른 것)은 목록에서 접어 둔다 — 눌러서 펼치기/접기">끝남 <b id="cDone">0</b></button>
  <span class="chip" id="cEng" title="마지막으로 그린 쪽 — 다시 그린 후보는 마지막 그림의 엔진"></span>
  <span class="pool" id="pool"></span>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>
<script>
const ENG = {codex:'Codex', claude:'Sonnet'};
const ENG_FULL = {codex:'Codex gpt-6.1-sol', claude:'Claude Sonnet 5.5'};
const S = { showDone:false, eng:'all', view:'pick', data:null, cur:null, round:null, sel:null, rej:{}, mode:'ctx', bg:'wood', zoom:'fit', sigNav:'', sigPick:'', waitNext:false, flip:false,
            objs:null, objSel:new Set(), cat:'전체', q:'', memo:'', fromSel:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIRS = {A:'최소 수정', B:'최소 수정 2', C:'기준 맞추기', D:'기준 맞추기 2', E:'자유'};
function toast(t, err) { const e = $('#toast'); e.textContent = t; e.className = 'toast' + (err ? ' err' : ''); e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2200); }
async function api(p, body) {
  const r = await fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j;
}
const item = () => S.data?.items.find(i => i.id === S.cur);
const rnd = () => { const it = item(); return it && (it.rounds.find(r => r.id === S.round) || it.rounds[it.rounds.length - 1]); };
const curSrc = it => `/c/${it.slug}/${it.current === 'v5' ? 'v5' : it.current}.png`;
const imgSrc = (it, c, v) => S.mode === 'ctx' ? `/ctx/${it.slug}/${c}.png?v=${v||0}` : `/c/${it.slug}/${c}.png?v=${v||0}`;
const ctxSrc = (it, c, v) => `/ctx/${it.slug}/${c}.png?v=${v||0}`;
function sized(img, z) {
  const fit = () => {
    if (z === 'big') z = Math.max(2, Math.min(12, Math.floor(260 / img.naturalHeight), Math.floor(360 / img.naturalWidth)));   // 나란히 보기
    if (z === 'fit') {   // 카드 폭에 맞춘 정수 배율(작은 16px 그림도 크게, 큰 그림은 높이 240px 까지)
      const w = (img.parentElement.clientWidth || 160) - 16;
      z = Math.max(1, Math.min(12, Math.floor(w / img.naturalWidth), Math.floor(240 / img.naturalHeight)));
    }
    img.style.width = img.naturalWidth * z + 'px'; img.classList.remove('ld'); img.parentElement.classList.remove('wait'); };
  img.classList.add('ld'); img.parentElement.classList.add('wait');
  img.onload = fit; img.onerror = () => { img.parentElement.classList.remove('wait'); img.parentElement.title = '그림을 못 불러왔다'; };
  if (img.complete && img.naturalWidth) fit();
}

async function load(keep) {
  try { S.data = await api('/api/harness/state'); } catch (e) { toast('상태를 못 읽었다: ' + e.message, 1); return; }
  const its = S.data.items;
  $('#cReady').textContent = its.filter(i => i.status === 'ready').length;
  $('#cDraw').textContent = its.filter(i => i.status === 'drawing').length;
  $('#cDone').textContent = its.filter(i => i.status === 'done').length;
  const all = its.flatMap(i => i.rounds.flatMap(r => r.runs));
  $('#cEng').innerHTML = `<span class="eng codex">Codex</span> ${all.filter(r => r.engine === 'codex').length}장 · <span class="eng claude">Sonnet</span> ${all.filter(r => r.engine === 'claude').length}장`;
  const p = S.data.pool;
  const left = p.queued + p.running, eta = Math.round(left / Math.max(1, p.par) * 5.7);   // 실측: 16명에서 1분에 약 2.8장 = 한 사람 5.7분/장
  const drawing = its.filter(i => i.status === 'drawing').length;
  $('#pool').innerHTML = (drawing ? `<span class="prog" title="그리는·검수 중 기물 ${drawing}개 · 남은 작업 ${left}장(다시 그리기 포함 전 추정)"><span class="pb"><i style="width:${Math.round(100 * its.filter(i => i.status !== 'drawing').length / its.length)}%"></i></span>약 ${eta < 60 ? eta + '분' : Math.floor(eta / 60) + '시간 ' + (eta % 60) + '분'} 남음</span> · ` : '') + `<span title=""그리기 ${esc(p.effort)} · 검수 ${esc(p.reviewEffort)} · 한 장 최대 ${p.attempts}번 그림(검수 탈락 시 다시)">${esc(p.model)} · 그림 ${esc(p.effort)} · 검수 ${esc(p.reviewEffort)} · 동시 ${p.par}</span> · ` + (p.alive ? `<span class="live">● 작업 중 ${p.running} · 대기 ${p.queued}</span>` : '쉼');
  const ready = its.filter(i => i.status === 'ready');
  if (S.waitNext && ready.length) { S.cur = ready[0].id; S.round = null; S.sel = null; S.rej = {}; S.waitNext = false; S.sigPick = ''; }
  if (!S.waitNext && (!S.cur || !item())) { const f = ready[0] || its[0]; S.cur = f?.id || null; S.round = null; S.sel = null; S.rej = {}; }
  if (!keep) S.round = null;
  if (S.view === 'pick') {
    // 바뀐 것이 있을 때만 다시 그린다 — 3초마다 통째로 다시 그리면 그림이 다시 로드되며 깜빡이고 검게 보인다
    const sn = JSON.stringify([S.eng, its.map(i => [i.id, i.status, i.busy, i.readyCount, i.rounds.at(-1).runs.map(r => r.engine)])]);
    const sp = JSON.stringify([S.waitNext, item() || null]);
    if (sn !== S.sigNav || !keep) { S.sigNav = sn; renderNav(); }
    if (sp !== S.sigPick || !keep) { S.sigPick = sp; const y = $('#main').scrollTop; renderPick(); $('#main').scrollTop = y; }
  }
  clearTimeout(S._poll); S._poll = setTimeout(() => load(true), (p.alive || its.some(i => i.status === 'drawing')) ? 3000 : 15000);
}

function toggleDone() { S.showDone = !S.showDone; renderNav(); }

function renderNav() {
  const g = {ready:'고를 차례', drawing:'그리는·검수 중', done:'끝남'};
  const engOf = i => [...new Set(i.rounds.at(-1).runs.map(r => r.engine).filter(Boolean))];
  const its = S.data.items.filter(i => S.eng === 'all' || engOf(i).includes(S.eng));
  let h = `<div class="engf">그린 쪽 <span class="seg">${[['all', '전체'], ['codex', 'Codex'], ['claude', 'Sonnet']].map(([k, v]) => `<button data-eng="${k}" class="${S.eng === k ? 'on' : ''}">${v}</button>`).join('')}</span></div>`;
  for (const k of ['ready', 'drawing', 'done']) {
    const L = its.filter(i => i.status === k); if (!L.length) continue;
    if (k === 'done') { if (!its.some(i => i.status !== 'done')) h += '<div class="empty" style="padding:14px 12px">고를 차례인 기물이 없다.<br>새로 뽑으려면 위 「기물 골라 새로 뽑기」.</div>'; h += `<h3 class="fold" data-fold>${g[k]} · ${L.length} ${S.showDone ? '▾ 접기' : '▸ 펼치기'}</h3>`; if (!S.showDone) continue; }
    else h += `<h3>${g[k]} · ${L.length}</h3>`;
    for (const i of L) {
      const b = k === 'drawing' ? `${i.rounds.at(-1).runs.length - i.busy}/${i.rounds.at(-1).runs.length}` : k === 'ready' ? `${i.readyCount}장` : '✓';
      h += `<div class="it ${i.id === S.cur ? 'cur' : ''}" data-id="${esc(i.id)}"><span class="th"><img src="/api/harness/thumb/${i.slug}.png" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'nb',textContent:'새'}))"></span>
            <span class="n" title="${esc(i.desc)}">${esc(i.name)}</span>${engOf(i).map(e => `<span class="eng ${e}" title="마지막 판을 ${ENG_FULL[e]} 가 그렸다">${ENG[e][0]}</span>`).join('')}<span class="b ${k}">${b}</span></div>`;
    }
  }
  $('#nav').innerHTML = h || '<div class="empty" style="padding:20px">아직 판이 없다.<br>위 「기물 골라 새로 뽑기」에서 시작.</div>';
  $('#nav').querySelectorAll('[data-fold]').forEach(b => b.onclick = toggleDone);
  $('#nav').querySelectorAll('[data-eng]').forEach(b => b.onclick = () => { S.eng = b.dataset.eng; renderNav(); });
  $('#nav').querySelectorAll('.it').forEach(e => e.onclick = () => { S.waitNext = false; S.cur = e.dataset.id; S.round = null; S.sel = null; S.rej = {}; S.memo = ''; renderNav(); renderPick(); });
}

function vbadge(o) {
  if (o.cur || o.busy || o.failed || o.bad || !o.review) return '';
  const v = o.review.verdict;
  return v === 'PASS' ? '<span class="vb pass" title="검수자(AI)가 통과시켰다 — 보증이 아니다. 꼭대기 면 규칙(2026-10-02) 전 검수는 특히 너그럽다">검수 통과</span>'
       : v === 'FAIL' ? `<span class="vb fail" title="시도 ${o.attempt}번 모두 검수에서 떨어졌다 — 그래도 고를 수 있다">검수 ✗</span>`
       : '<span class="vb unk">검수?</span>';
}

function card(it, key, c, opt) {
  const sel = S.sel === c, rej = S.rej[c];
  let h = `<div class="card ${opt.olsel ? 'olsel' : ''} ${opt.cur ? 'cur' : ''} ${sel ? 'sel' : ''} ${rej ? 'rej' : ''} ${!opt.busy && opt.review && opt.review.verdict === 'FAIL' ? 'vfail' : ''}" data-c="${esc(c)}" ${opt.disabled ? 'data-dis="1"' : ''}>
    <div class="top"><span class="key">${key}</span>${opt.engine ? `<span class="eng ${opt.engine}" title="그림: ${ENG_FULL[opt.engine]}${opt.reviewEngine ? ' · 검수: ' + ENG_FULL[opt.reviewEngine] : ''}">${ENG[opt.engine]}</span>` : ''}${opt.ol ? `<span class="olk" title="테두리: ${esc(opt.ol)}">${esc(opt.ol)}</span>` : ''}<span class="dir" title="${esc(opt.label)}">${esc(opt.label)}</span>${opt.cur ? '' : `<button class="x" data-x="${esc(c)}" title="이 후보 버리기 (X)">✕</button>`}</div>`;
  const att = opt.attempt > 1 ? ` (시도 ${opt.attempt}/${S.data.pool.attempts})` : '';
  if (opt.busy && opt.phase === 'review' && opt.v) h += `<div class="pic over" data-over="${opt.busy === 'queued' ? '검수 대기' : '3/4 검수 중…'}"><img data-src="${imgSrc(it, c, opt.v)}"></div>`;
  else if (opt.busy) h += `<div class="spin"><i></i>${opt.busy === 'queued' ? '대기 중' + att : (opt.attempt > 1 ? '검수에서 떨어져 다시 그리는 중' + att : '그리는 중…')}</div>`;
  else if (opt.failed) h += `<div class="spin" style="color:var(--bad)">못 그림<br><small>${esc(opt.failed).slice(0, 80)}</small></div>`;
  else {
    if (S.mode !== 'ctx') h += `<div class="pic"><img data-src="/c/${it.slug}/${c}.png?v=${opt.v || 0}"></div>`;
    if (S.mode !== 'one' && !(opt.cur && it.isNew && c === 'v5')) h += `<div class="ctxw" title="같은 방 안(1배 크기 그대로 늘림)"><img data-ctx="1" data-src="${ctxSrc(it, c, opt.v)}"></div>`;
  }
  // 한 줄 요약: 꼭대기 행 수 · 검수 · 다시 그린 횟수 — 긴 글은 마우스를 올리면 보인다
  const rv = opt.review, f = [];
  if (rv && !opt.busy && rv.topRows != null) f.push(`<span class="fact ${rv.topRows >= 3 ? 'ok' : 'no'}" title="${esc(rv.top || '')}">꼭대기 ${rv.topRows}행</span>`);
  if (rv && !opt.busy && rv.verdict === 'FAIL') f.push(`<span class="fact no" title="${esc(rv.reasons + (rv.surfaces ? '\n면: ' + rv.surfaces : '') + (rv.fix ? '\n고칠 것: ' + rv.fix : ''))}">검수 ✗ ${esc((rv.codes || []).join(','))}</span>`);
  else if (rv && !opt.busy && rv.verdict === 'PASS') f.push(`<span class="fact" title="${esc(rv.reasons + (rv.surfaces ? '\n면: ' + rv.surfaces : ''))}">검수 통과</span>`);
  if (opt.history && opt.history.length) f.push(`<span class="fact warn" title="${esc(opt.history.map(x => `시도 ${x.attempt} ${x.stage === 'hard' ? '깨짐' : '검수'} ✗: ${x.why}`).join('\n'))}">${opt.history.filter(x => x.stage !== 'review-error').length}번 다시 그림</span>`);
  if (opt.bad) f.push(`<span class="fact no" title="${esc(opt.bad)}">검사 ✗</span>`);
  if (f.length) h += `<div class="facts">${f.join('')}</div>`;
  if (opt.note) h += `<div class="nt" title="${esc(opt.note)}">${esc(opt.note)}</div>`;
  if (rej) h += `<div class="reasons">` + Object.entries(S.data.reasons).map(([k, v]) => `<button data-r="${k}" data-rc="${esc(c)}" class="${rej.includes(k) ? 'on' : ''}">${v}</button>`).join('') + `</div>`;
  return h + '</div>';
}

function renderPick() {
  const it = item(); const m = $('#main');
  if (S.waitNext || !it) {
    const p = S.data.pool, d = S.data.items.filter(i => i.status === 'drawing').length;
    m.innerHTML = d ? `<div class="waitbox"><div class="spin"><i></i></div>고를 차례가 끝났다. <b>${d}</b>개 기물을 그리는 중(작업 중 ${p.running} · 대기 ${p.queued}).<br>다음 기물이 다 되면 <b>자동으로 연다</b> — 이 화면을 켜 두면 된다.</div>`
      : '<div class="empty">고를 판이 없다. 「기물 골라 새로 뽑기」에서 기물을 고르면 작업자 다섯 명이 후보를 찍는다.</div>';
    if (d) S.waitNext = true;
    renderBar(); return;
  }
  const r = rnd(); S.round = r.id;
  const cur = it.current === 'v5' ? 'v5' : it.current;
  let h = `<div class="head"><h2>${esc(it.name)}</h2><span class="meta">${esc(it.category)} · ${esc(it.kind)} · ${it.canvas[0]}×${it.canvas[1]}px · <code>${esc(it.id)}</code></span></div>
    <div class="meta" style="color:var(--dim)">${it.isNew ? '<b class="nb">새</b> ' : ''}${esc(it.desc)}${it.use && it.use.length ? ` <span class="chip">쓰임 ${esc(it.use.join(' · '))}</span>` : ''}</div>
    <div class="rounds">` + it.rounds.map(x => `<button data-r="${x.id}" class="${x.id === r.id ? 'on' : ''}">판 h${x.id}${x.decided ? (x.decided.verdict === 'keep' ? ' · 그대로' : ' · ' + pickName(x.decided.cand)) : ''}</button>`).join('') + `</div>`;
  if (r.note) h += `<div class="rnote">메모: ${esc(r.note)}</div>`;
  if (r.base) h += `<div class="rnote">출발점: ${esc(r.base)}</div>`;
  h += `<div class="tools">
    <span>보기 <span class="seg">${[['both', '둘 다'], ['one', '단품'], ['ctx', '방 안']].map(([k, v]) => `<button data-mode="${k}" class="${S.mode === k ? 'on' : ''}">${v}</button>`).join('')}</span></span>
    <span>배경 <span class="seg">${['wood:나무', 'dark:어둠', 'check:체크'].map(x => { const [k, v] = x.split(':'); return `<button data-bg="${k}" class="${S.bg === k ? 'on' : ''}">${v}</button>`; }).join('')}</span></span>
    <span>확대 <span class="seg">${['fit', 3, 4, 6, 8].map(z => `<button data-z="${z}" class="${S.zoom === z ? 'on' : ''}">${z === 'fit' ? '맞춤' : z + '배'}</button>`).join('')}</span></span></div>`;
  h += `<div class="grid bg-${S.bg} ${S.mode === 'ctx' ? 'ctxmode' : ''}">` + card(it, '0', cur, {cur:1, label:it.isNew && cur === 'v5' ? '지금 그림 없음(새 기물)' : '지금 그림', v:0});
  r.runs.forEach((x, k) => {   // 후보마다 두 장(2026-10-03): 그린 그대로 · 테두리 꼭 필요한 곳만(outline_select.py, 이름 끝 .sel)
    const opt = {label:x.direction || DIRS[x.letter], v:x.v, note:x.note, phase:x.phase, attempt:x.attempt, review:x.review, history:x.history, engine:x.engine, reviewEngine:x.reviewEngine,
      busy:['queued', 'running'].includes(x.status) ? x.status : null, failed:x.status === 'failed' ? (x.error || '실패') : null,
      bad:x.status === 'done' && !x.ok ? (x.error || '하드 검사 불합격') : null};
    const two = x.status === 'done' && x.ok && !NOSEL.has(it.kind) && x.selDiff >= SEL_MIN;   // 거의 같으면 한 장만
    h += card(it, String(k + 1), x.cand, two ? {...opt, ol:'테두리 전부'} : opt);
    if (two) h += card(it, String(k + 1) + '′', x.cand + '.sel', {...opt, ol:'꼭 필요한 곳만', olsel:1, note:'', history:null});
  });
  h += `</div>`;
  const pick = S.sel && S.sel !== cur ? S.sel : null;
  if (pick) h += `<div class="cmp bg-${S.bg}"><h4>나란히 — 지금 그림 · 고른 후보 (Space 를 누르고 있으면 고른 자리에 지금 그림이 겹쳐 보인다)</h4><div class="row">
      <div class="col"><div class="pic"><img id="cmpA" src="${curSrc(it)}"></div>지금</div>
      <div class="col"><div class="pic"><img id="cmpB" src="/c/${it.slug}/${pick}.png"></div>고른 것 · ${esc(pickName(pick))}</div>
      <div class="col"><div class="pic ctxp" style="padding:0;background:#000"><img id="cmpC" src="/ctx/${it.slug}/${pick}.png"></div>방 안</div></div></div>`;
  h += `<div class="keys"><kbd>1</kbd>~<kbd>5</kbd> 후보 고르기(한 번 더 누르면 「꼭 필요한 곳만」) · <kbd>0</kbd> 지금 그대로 · <kbd>Enter</kbd> 또는 두 번 누르기 = 확정하고 다음 · <kbd>X</kbd> 고른 카드 버리기 · <kbd>R</kbd> 다시 뽑기 · <kbd>V</kbd> 둘 다/단품/방 안 · <kbd>F</kbd> 맞춤 · <kbd>B</kbd> 배경 · <kbd>+</kbd><kbd>-</kbd> 확대 · <kbd>↑</kbd><kbd>↓</kbd> 이전/다음 기물 · <kbd>Space</kbd> 겹쳐 보기</div>`;
  m.innerHTML = h;
  m.querySelectorAll('.grid .pic img').forEach(img => { sized(img, S.zoom); img.src = img.dataset.src; });
  m.querySelectorAll('.grid .ctxw img').forEach(img => { img.src = img.dataset.src; });
  preloadNext(it);
  ['cmpA', 'cmpB'].forEach(id => { const e = document.getElementById(id); if (e) sized(e, 'big'); });
  const cc = document.getElementById('cmpC'); if (cc) sized(cc, 3);
  m.querySelectorAll('.card').forEach(e => e.onclick = ev => {
    if (ev.target.dataset.x) { toggleRej(ev.target.dataset.x); return; }
    if (ev.target.dataset.r) { const c = ev.target.dataset.rc, k = ev.target.dataset.r; const L = S.rej[c]; L.includes(k) ? L.splice(L.indexOf(k), 1) : L.push(k); renderPick(); return; }
    if (e.dataset.dis || e.querySelector('.spin')) return;
    const c = e.dataset.c, t = Date.now(), again = S.lastClick && S.lastClick.c === c && t - S.lastClick.t < 450;
    S.lastClick = again ? null : {c, t};   // 같은 카드를 두 번 누르면 확정(그리면서 카드가 다시 만들어져 dblclick 은 안 온다)
    S.sel = c; if (S.rej[S.sel]) delete S.rej[S.sel];
    if (again) { const it2 = item(), cur2 = it2.current === 'v5' ? 'v5' : it2.current; decide(c === cur2 ? 'keep' : c); return; }
    renderPick();
  });
  m.querySelectorAll('.rounds button').forEach(b => b.onclick = () => { S.round = +b.dataset.r; S.sel = null; S.rej = {}; renderPick(); });
  m.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderPick(); });
  m.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { S.bg = b.dataset.bg; renderPick(); });
  m.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { S.zoom = b.dataset.z === 'fit' ? 'fit' : +b.dataset.z; renderPick(); });
  renderBar();
}

function toggleRej(c) { if (S.rej[c]) delete S.rej[c]; else { S.rej[c] = []; if (S.sel === c) S.sel = null; } renderPick(); }

function renderBar() {
  const b = $('#bar');
  if (S.view === 'objs') {
    b.innerHTML = `<span><b>${S.objSel.size}</b>개 골랐다</span>
      <textarea id="memo" placeholder="작업자에게 줄 메모(모든 기물에 같이 간다) — 예: 의자 다리가 너무 굵다, 원래 디자인 살려라">${esc(S.memo)}</textarea>
      <button class="btn" id="clr">선택 지우기</button><button class="btn go" id="go" ${S.objSel.size ? '' : 'disabled'}>후보 5장씩 뽑기</button>`;
    $('#memo').oninput = e => S.memo = e.target.value;
    $('#clr').onclick = () => { S.objSel.clear(); renderObjs(); };
    $('#go').onclick = startDraw;
    return;
  }
  const it = item(); if (!it) { b.innerHTML = ''; return; }
  const r = rnd(); const cur = it.current === 'v5' ? 'v5' : it.current;
  const can = S.sel && !r.runs.some(x => ['queued', 'running'].includes(x.status) && x.cand === S.sel);
  const busy = r.runs.some(x => ['queued', 'running'].includes(x.status));
  b.innerHTML = `<textarea id="memo" placeholder="메모 — 다시 뽑을 때 작업자에게 그대로 간다. 고를 때 남기면 다음 판의 기억이 된다.">${esc(S.memo)}</textarea>
    <label title="다시 뽑을 때 지금 고른 후보를 출발점으로"><input type="checkbox" id="fromSel" ${S.fromSel ? 'checked' : ''}> 고른 후보에서 출발</label>
    <button class="btn redo" id="redo" title="R">다시 뽑기 ${busy ? '(그리는 중)' : ''}</button>
    <button class="btn" id="keep" title="0 → Enter">지금 그대로</button>
    <button class="btn go" id="ok" ${can ? '' : 'disabled'} title="Enter">${S.sel && S.sel !== cur ? `✓ ${esc(pickName(S.sel))} 로 확정` : '✓ 확정'}</button>`;
  $('#memo').oninput = e => S.memo = e.target.value;
  $('#fromSel').onchange = e => S.fromSel = e.target.checked;
  $('#ok').onclick = () => decide(S.sel === cur ? 'keep' : S.sel);
  $('#keep').onclick = () => decide('keep');
  $('#redo').onclick = redraw;
}

// 다음에 열 기물의 그림을 미리 받아 둔다 — 확정하자마자 그림이 바로 뜨게(서버도 고를 차례 기물의 방 안 그림을 미리 굽는다)
function preloadNext(it) {
  // 지금 기물 그림이 다 뜬 뒤에 시작한다 — 같이 받으면 지금 그림이 늦어진다(브라우저는 한 서버에 6개씩만 받는다)
  const cur = [...document.querySelectorAll('#main .grid img')].filter(i => !i.complete);
  if (cur.length) { const t = S._preT = {}; Promise.all(cur.map(i => new Promise(r => { i.addEventListener('load', r, {once:true}); i.addEventListener('error', r, {once:true}); })))
    .then(() => { if (S._preT === t && item() === it) preloadNext(it); }); return; }
  const nx = S.data.items.filter(i => i.status === 'ready' && i.id !== it.id).slice(0, 3);
  S._pre = nx.flatMap(n => {
    const urls = [];
    if (!(n.isNew && n.current === 'v5')) urls.push(S.mode === 'ctx' ? ctxSrc(n, n.current, 0) : imgSrc(n, n.current, 0));
    n.rounds.at(-1).runs.forEach(x => {
      if (x.status !== 'done') return;
      const cs = [x.cand]; if (x.ok && !NOSEL.has(n.kind) && x.selDiff >= SEL_MIN) cs.push(x.cand + '.sel');
      cs.forEach(c => { if (S.mode !== 'one') urls.push(ctxSrc(n, c, x.v)); if (S.mode !== 'ctx') urls.push(`/c/${n.slug}/${c}.png?v=${x.v || 0}`); });
    });
    return urls.map(u => Object.assign(new Image(), {src:u}));
  });
}

function nextItem() {
  const its = S.data.items.filter(i => i.status === 'ready' && i.id !== S.cur);
  if (its[0]) S.cur = its[0].id; else S.waitNext = true;   // 없으면 다음 것이 다 될 때까지 기다렸다가 자동으로 연다
  S.round = null; S.sel = null; S.rej = {}; S.memo = ''; S.sigPick = '';
}
const SEL_MIN = 12;   // 「꼭 필요한 곳만」 벌이 이보다 적게 다르면 같은 그림으로 보고 숨긴다
const NOSEL = new Set(['바닥 무늬(밟을 수 있음)']);   // 깔개는 테두리 둘째 벌이 없다(check_candidate 도 안 만든다)
const pickName = c => (c.split('-')[1] || c).replace(/\.sel$/, ' (테두리 필요한 곳만)');
async function decide(choice) {
  const it = item(), r = rnd(); if (!it) return;
  try {
    await api('/api/harness/decide', {id:it.id, round:r.id, choice, rejects:S.rej, note:S.memo});
    toast(choice === 'keep' ? `${it.name}: 지금 그대로` : `${it.name}: ${pickName(choice)} 로 확정`);
    // 다음 기물은 상태를 다시 받기 전에 바로 연다(상태 1.8MB 를 기다리면 한 박자 늦다). 상태는 뒤에서 받아 맞춘다.
    it.status = 'done'; nextItem(); renderNav(); renderPick(); load(true);
  } catch (e) { toast('저장 실패: ' + e.message, 1); }
}
async function redraw() {
  const it = item(), r = rnd(); if (!it) return;
  const base = S.fromSel && S.sel && S.sel !== (it.current === 'v5' ? 'v5' : it.current) ? S.sel : '';
  if (!S.memo.trim() && !Object.keys(S.rej).length && !confirm('메모도 버린 후보도 없이 다시 뽑을까? (뭐가 별로였는지 적으면 다음 판이 나아진다)')) return;
  try {
    await api('/api/harness/draw', {ids:[it.id], note:S.memo, base, n:5, round:r.id, rejects:S.rej});
    toast(`${it.name}: 다시 뽑는 중 — 5장`); S.sel = null; S.rej = {}; S.memo = ''; S.round = null;
    setTimeout(() => load(), 1500);
  } catch (e) { toast('실패: ' + e.message, 1); }
}

async function loadObjs() { if (!S.objs) S.objs = await api('/api/harness/objects'); renderObjs(); }
function renderObjs() {
  const cats = ['전체', ...new Set(S.objs.map(o => o.category))];
  const q = S.q.trim().toLowerCase();
  const L = S.objs.filter(o => (S.cat === '전체' || o.category === S.cat) && (!q || (o.name + ' ' + o.id + ' ' + o.desc).toLowerCase().includes(q)));
  $('#nav').innerHTML = `<h3>고른 기물 · ${S.objSel.size}</h3>` + [...S.objSel].map(id => { const o = S.objs.find(x => x.id === id);
    return `<div class="it" data-un="${esc(id)}"><span class="th"><img src="/api/harness/thumb/${o.slug}.png" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'nb',textContent:'새'}))"></span><span class="n">${esc(o.name)}</span><span class="b drawing">빼기</span></div>`; }).join('');
  $('#nav').querySelectorAll('[data-un]').forEach(e => e.onclick = () => { S.objSel.delete(e.dataset.un); renderObjs(); });
  $('#main').innerHTML = `<div class="objtools"><input id="q" placeholder="찾기 — 이름·영문 id·설명" value="${esc(S.q)}">
     <div class="cats">${cats.map(c => `<button data-cat="${esc(c)}" class="${S.cat === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div></div>
     <div class="objs">` + L.map(o => `<div class="obj ${S.objSel.has(o.id) ? 'on' : ''}" data-id="${esc(o.id)}" title="${esc(o.desc)}">
       ${o.rounds ? `<span class="rb">판 ${o.rounds}</span>` : ''}<span class="ck">✓</span>
       <div class="pic">${o.isNew && o.current === 'v5' ? `<div class="newpic">새 기물<br><small>${esc((o.use || []).join(' · '))}</small></div>` : `<img data-src="/api/harness/thumb/${o.slug}.png">`}</div><div class="nm">${o.isNew ? '<b class="nb">새</b> ' : ''}${esc(o.name)}</div></div>`).join('') + `</div>
     <div class="keys">기물을 눌러 고르고(여러 개 가능), 아래에서 메모를 달고 「후보 5장씩 뽑기」. 기물마다 작업자 다섯 명(${esc(S.data?.pool?.model || '')})이 방향을 나눠 한 장씩 찍는다(있는 기물: 최소 수정 2 · 기준 맞추기 2 · 자유 1 / <b class="nb">새</b> 기물: 설명 충실 · 같은 방 화풍 · 단순 · 장식 · 자유 해석). 찍은 뒤 독립 검수자가 3/4 를 보고, 떨어지면 다시 그린다.</div>`;
  $('#main').querySelectorAll('.obj img').forEach(img => { sized(img, 3); img.src = img.dataset.src; });
  const qi = $('#q'); qi.oninput = e => { S.q = e.target.value; const p = qi.selectionStart; renderObjs(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $('#main').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderObjs(); });
  $('#main').querySelectorAll('.obj').forEach(e => e.onclick = () => { const id = e.dataset.id; S.objSel.has(id) ? S.objSel.delete(id) : S.objSel.add(id); renderObjs(); });
  renderBar();
}
async function startDraw() {
  const ids = [...S.objSel]; if (!ids.length) return;
  try {
    await api('/api/harness/draw', {ids, note:S.memo, n:5});
    toast(`${ids.length}개 기물 — 후보 5장씩 뽑기 시작`); S.objSel.clear(); S.memo = ''; S.objs = null;
    setView('pick'); setTimeout(() => load(), 1500);
  } catch (e) { toast('실패: ' + e.message, 1); }
}

function setView(v) {
  S.view = v; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  if (v === 'objs') loadObjs(); else { renderNav(); renderPick(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.v));

document.addEventListener('keydown', e => {
  if (S.view !== 'pick' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const it = item(); if (!it) return; const r = rnd(); const cur = it.current === 'v5' ? 'v5' : it.current;
  if (e.key === ' ') { e.preventDefault(); const b = document.getElementById('cmpB'); if (b && !S.flip) { S.flip = true; b.dataset.o = b.src; b.src = curSrc(it); } return; }
  if (/^[0-5]$/.test(e.key)) { const k = +e.key; if (k === 0) { S.sel = cur; } else { const x = r.runs[k - 1]; if (x && x.status === 'done') { S.sel = S.sel === x.cand && x.ok && !NOSEL.has(it.kind) && x.selDiff >= SEL_MIN ? x.cand + '.sel' : x.cand; delete S.rej[S.sel]; } } renderPick(); }
  else if (e.key === 'Enter') { if (S.sel) decide(S.sel === cur ? 'keep' : S.sel); }
  else if (e.key === 'x' || e.key === 'X') { if (S.sel && S.sel !== cur) toggleRej(S.sel); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); $('#memo')?.focus(); }
  else if (e.key === 'v' || e.key === 'V') { S.mode = {both:'one', one:'ctx', ctx:'both'}[S.mode]; renderPick(); }
  else if (e.key === 'b' || e.key === 'B') { S.bg = {wood:'dark', dark:'check', check:'wood'}[S.bg]; renderPick(); }
  else if (e.key === '+' || e.key === '=') { S.zoom = {fit:3, 3:4, 4:6, 6:8, 8:8}[S.zoom]; renderPick(); }
  else if (e.key === '-') { S.zoom = {fit:'fit', 3:'fit', 4:3, 6:4, 8:6}[S.zoom]; renderPick(); }
  else if (e.key === 'f' || e.key === 'F') { S.zoom = 'fit'; renderPick(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const L = [...$('#nav').querySelectorAll('.it')].map(x => x.dataset.id); const i = L.indexOf(S.cur);
    const n = L[(i + (e.key === 'ArrowDown' ? 1 : -1) + L.length) % L.length]; if (n) { S.cur = n; S.round = null; S.sel = null; S.rej = {}; renderNav(); renderPick(); }
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ' && S.flip) { S.flip = false; const b = document.getElementById('cmpB'); if (b && b.dataset.o) b.src = b.dataset.o; } });
$('#cDoneBtn').onclick = toggleDone;
load();
</script>
</body>

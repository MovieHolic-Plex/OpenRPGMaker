<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>슈퍼하네싱 · 기물·파생</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#1b191e; --panel:#25222a; --panel2:#2d2932; --line:#3a3640; --text:#ece7e0; --dim:#9b958d; --ok:#7fbf6a; --bad:#e0685a; --sel:#f2c14e; --acc:#8fb3e8; --rej:#c2410c; }
* { box-sizing:border-box; }
body { display:flex; flex-direction:column; height:100vh; overflow:hidden; margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Noto Sans KR", sans-serif; }
button, input, textarea, select { font:inherit; color:var(--text); }
header { display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; height:50px; flex:none; }
header h1 { font-size:16px; margin:0 6px 0 0; white-space:nowrap; }
.tab { background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 12px; cursor:pointer; }
.tab.on { background:#3a3442; border-color:var(--sel); }
.chip { border-radius:999px; padding:2px 10px; font-size:12px; background:#33303a; color:var(--dim); white-space:nowrap; }
.chip b { color:var(--text); }
.pool { min-width:0; overflow:hidden; text-overflow:ellipsis; margin-left:auto; color:var(--dim); font-size:12px; white-space:nowrap; }
.pool .live { color:var(--ok); }
.wrap { display:flex; flex:1; min-height:0; }
nav { width:250px; flex:none; overflow:auto; border-right:1px solid var(--line); background:#1f1d23; }
button.chip { border:0; cursor:pointer; font:inherit; font-size:12px; }
nav h3.fold { cursor:pointer; }
nav h3.fold:hover { color:var(--text); }
nav h3 { margin:0; padding:10px 12px 4px; font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.02em; }
nav .it { display:flex; gap:8px; align-items:center; padding:6px 10px; cursor:pointer; border-left:3px solid transparent; }
nav .it:hover { background:var(--panel2); }
nav .it.cur { background:#38323f; border-left-color:var(--sel); }
nav .th { width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; background:#5d4632; border-radius:4px; overflow:hidden; }
nav .th img { image-rendering:pixelated; max-width:32px; max-height:32px; }
nav .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
nav .b { font-size:11px; border-radius:4px; padding:0 6px; flex:none; }
.b.ready { background:var(--sel); color:#1a1a1a; font-weight:700; }
.b.drawing { background:#2b3b55; color:#cfe0ff; }
.b.done { background:#2f4a2c; color:#cdeac6; }
main { flex:1; overflow:auto; padding:14px 20px 140px; }
.empty { color:var(--dim); padding:40px; text-align:center; font-size:15px; }
.head { display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
.head h2 { margin:0; font-size:34px; letter-spacing:.02em; }   /* 물건 이름 — 가운데 위에 크게(2026-10-03) */
.head .meta { color:var(--dim); font-size:12px; }
.rounds { display:flex; gap:6px; margin:8px 0 2px; flex-wrap:wrap; }
.rounds button { background:#2c2932; border:1px solid var(--line); border-radius:6px; padding:2px 10px; cursor:pointer; font-size:12px; }
.rounds button.on { border-color:var(--sel); background:#3a3442; }
.rnote { color:#e9d9a8; font-size:13px; margin:2px 0 6px; }
.tools { display:flex; gap:14px; align-items:center; margin:10px 0 12px; color:var(--dim); font-size:13px; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { background:#2a2730; border:0; padding:3px 10px; cursor:pointer; }
.seg button.on { background:#4a4252; color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(172px, 1fr)); gap:10px; align-items:stretch; }
.grid.ctxmode { grid-template-columns:repeat(4, minmax(0, 230px)); }   /* 방 안만 보기: 한 줄에 4장(2026-10-03 사용자 「절반으로 줄여서 한 줄에 4개씩」) */
.grid.ctxmode .card .nt { display:none; }
.card { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; position:relative; display:flex; flex-direction:column; min-width:0; transition:border-color .1s; }
.card:hover { border-color:#6d6377; }
.card.sel { border-color:var(--sel); box-shadow:0 0 0 3px #f2c14e55; }
.card.cur { background:#2a2a24; }
.card.rej { opacity:.45; }
.card.rej .pic { filter:grayscale(.7); }
.card .top { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.card .key { background:#000a; border-radius:5px; padding:0 7px; font-weight:800; font-size:13px; }
.card .dir { font-size:12px; color:var(--acc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.card .x { margin-left:4px; background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; padding:0 7px; color:var(--dim); }
.card .x:hover { color:var(--bad); border-color:var(--bad); }
.card.rej .x { color:#fff; background:var(--rej); border-color:var(--rej); }
.pic { display:flex; align-items:flex-end; justify-content:center; border-radius:6px; padding:8px; flex:1; min-height:80px; overflow:hidden; }
.pic img.ld { opacity:0; }
.pic.wait { background-image:linear-gradient(90deg,#0000,#ffffff10,#0000) !important; background-size:200% 100% !important; animation:sh 1.2s linear infinite; }
@keyframes sh { to { background-position:-200% 0; } }
.pic img { image-rendering:pixelated; display:block; }
.bg-wood .pic { background:#8a6b4c; }
.bg-dark .pic { background:#151417; }
.bg-check .pic { background:#3a3540 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="8" height="8" fill="%234a4450"/><rect x="8" y="8" width="8" height="8" fill="%234a4450"/></svg>'); }
.mode-ctx .pic { padding:0; background:#000 !important; }
.card .nt { font-size:12px; color:#cfc6ba; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .bad { color:var(--bad); font-size:12px; margin-top:4px; }
.vb { font-size:11px; font-weight:800; border-radius:4px; padding:0 6px; white-space:nowrap; }
.vb.pass { background:#2f4a2c; color:#cdeac6; } .vb.fail { background:#5a2320; color:#ffd9d3; } .vb.unk { background:#3a3640; color:var(--dim); }
.rv { font-size:12px; margin-top:4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.rv.pass { color:#a9d79a; } .rv.fail { color:#ff9d8f; }
.hist { font-size:11px; color:var(--dim); margin-top:3px; cursor:help; text-decoration:underline dotted; }
.card.vfail { border-color:#6a2a24; }
.pic.over { position:relative; } .pic.over::after { content:attr(data-over); position:absolute; inset:auto 6px 6px auto; background:#000c; color:#cfe0ff; font-size:11px; padding:1px 6px; border-radius:4px; }
.reasons { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.reasons button { font-size:11px; border-radius:999px; border:1px solid var(--line); background:#2a2730; padding:1px 8px; cursor:pointer; }
.reasons button.on { background:var(--rej); border-color:var(--rej); color:#fff; }
.spin { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--dim); min-height:120px; min-width:120px; }
.spin i { width:22px; height:22px; border:3px solid #444; border-top-color:var(--acc); border-radius:50%; animation:r 1s linear infinite; }
@keyframes r { to { transform:rotate(360deg); } }
.cmp { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
.cmp h4 { margin:0 0 8px; font-size:13px; color:var(--dim); font-weight:600; }
.cmp .row { display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
.cmp .col .pic.ctxp { min-width:336px; min-height:336px; }
.cmp .col { text-align:center; color:var(--dim); font-size:12px; }
.cmp .col .pic { padding:12px; }
.bar { position:fixed; left:250px; right:0; bottom:0; background:#211e25ee; backdrop-filter:blur(4px); border-top:1px solid var(--line); padding:10px 20px; display:flex; gap:10px; align-items:center; z-index:9; }
.bar textarea { flex:1; min-height:38px; max-height:120px; resize:vertical; background:#1a181d; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.btn { border:1px solid var(--line); background:#34303b; border-radius:8px; padding:8px 14px; cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:#776d82; }
.btn.go { background:var(--sel); color:#1a1a1a; font-weight:800; border-color:var(--sel); }
.btn.go:disabled { opacity:.4; cursor:default; }
.btn.redo { background:#2b3b55; border-color:#3e5b8a; }
.bar label { color:var(--dim); font-size:12px; display:flex; gap:4px; align-items:center; white-space:nowrap; }
.keys { color:var(--dim); font-size:12px; margin-top:14px; }
.keys kbd { background:#2f2b35; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; }
.toast { position:fixed; right:18px; bottom:76px; background:#2f4a2c; color:#e6f6e1; padding:8px 16px; border-radius:8px; z-index:20; display:none; pointer-events:none; box-shadow:0 2px 10px #0008; }   /* 오른쪽 아래(2026-10-03, 사용자 「위에 띄우지 말고 오른쪽 아래」) — 위는 기물 이름이라 가린다. 아래 바 단추를 가리지 않게 바 위에 */
.toast.err { background:#5a2320; }
.toast.act { pointer-events:auto; }
.proposal-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-top:16px; }
.proposal { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:14px; }
.proposal-head { display:flex; gap:14px; align-items:center; margin-bottom:10px; }
.proposal-head img { width:64px; max-height:96px; object-fit:contain; image-rendering:pixelated; }
.proposal h3 { margin:0 0 4px; font-size:16px; }
.proposal p { margin:8px 0; color:var(--dim); font-size:12px; }
.proposal .btn { margin-top:10px; }
.derive-hint { padding:8px 12px; margin:10px 0; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-size:12px; }
/* 파생(2026-10-04): 묶음 그림 칸 이름표 · 움직임 미리보기 · 파생 창 */
.card.wide { grid-column:span 2; }
.strip { display:inline-block; position:relative; padding-bottom:16px; line-height:0; }
.strip .sl { position:absolute; bottom:0; height:14px; font-size:10px; line-height:14px; text-align:center; color:var(--dim); border-left:1px solid #fff2; white-space:nowrap; overflow:hidden; }
.strip .sl.lk { color:var(--acc); }
.anim { display:block; margin:6px auto 0; image-rendering:pixelated; }
.dlgbg { position:fixed; inset:0; background:#0009; z-index:30; display:flex; align-items:center; justify-content:center; }
.dlg { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; width:min(560px, 92vw); display:flex; flex-direction:column; gap:10px; }
.dlg h3 { margin:0 0 4px; }
.dlg .row { display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
.dlg .row.off { opacity:.45; }
.dlg .row b { display:block; }
.dlg .row small { color:var(--dim); }
.dlg input[type=number] { width:48px; background:#1a181d; border:1px solid var(--line); border-radius:6px; padding:2px 4px; }
.dlg input[type=text] { width:90px; background:#1a181d; border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
.dlg textarea { min-height:52px; background:#1a181d; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.dlg .made { color:var(--dim); font-size:12px; }
.slotredo { display:flex; gap:4px; align-items:center; color:var(--dim); font-size:12px; white-space:nowrap; }
.toast button { margin-left:12px; background:#0003; border:1px solid #fff5; border-radius:6px; padding:2px 10px; cursor:pointer; color:inherit; }
.pool .bad { color:var(--bad); }
.card .ctxw { min-height:48px; }
.card .ctxw.err { min-height:48px; cursor:pointer; position:relative; }
.card .ctxw.err::after { content:'그림 없음 — 눌러서 다시 받기'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; line-height:1.3; }
/* 기물 고르기(새 판) */
.objtools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.objtools input { background:#1a181d; border:1px solid var(--line); border-radius:8px; padding:6px 10px; width:260px; }
.cats { display:flex; gap:5px; flex-wrap:wrap; }
.cats button { font-size:12px; border-radius:999px; border:1px solid var(--line); background:#2a2730; padding:2px 10px; cursor:pointer; }
.cats button.on { background:#4a4252; border-color:var(--sel); }
.objs { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; }
.obj { background:var(--panel); border:2px solid var(--line); border-radius:9px; padding:6px; cursor:pointer; position:relative; text-align:center; }
.obj:hover { border-color:#6d6377; }
.obj.on { border-color:var(--sel); background:#3a3426; }
.obj .pic { min-height:70px; padding:6px; background:#8a6b4c; }
.obj .nm { font-size:12px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.obj .ck { position:absolute; top:4px; right:6px; color:var(--sel); font-weight:900; display:none; }
.obj.on .ck { display:block; }
.obj .newpic { color:#f2c14e; font-size:12px; font-weight:800; align-self:center; line-height:1.3; }
.obj .newpic small { color:#e9d9a8; font-weight:600; }
.nb { background:#f2c14e; color:#1a1a1a; border-radius:3px; padding:0 4px; font-size:10px; }
.eng { font-size:10px; font-weight:800; border-radius:4px; padding:0 5px; letter-spacing:.02em; flex:none; }
.eng.codex { background:#1f4d3a; color:#9ff0c6; }
.eng.claude { background:#5a3a22; color:#ffc99a; }
.it .eng { margin-left:4px; }
.engf { position:sticky; top:0; z-index:2; background:#1f1d23; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; padding:8px 10px 6px; color:var(--dim); font-size:12px; }
.card.redocard { cursor:pointer; border-style:dashed; display:flex; flex-direction:column; }
.card.redocard .redobig { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:22px; line-height:1.3; color:var(--dim); min-height:160px; text-align:center; }
.card.redocard .redobig small { font-size:11px; }
.card.redocard:hover .redobig { color:#e9b44c; }
.card.redocard.busy { cursor:default; opacity:.55; }
.card .ctxw { margin-top:6px; background:#000; border-radius:4px; overflow:hidden; line-height:0; }
.card .ctxw img { width:100%; height:auto; image-rendering:pixelated; display:block; }
.card.olsel { border-style:dashed; }
.card .olk { font-size:11px; padding:0 6px; border-radius:3px; background:#3a3640; color:var(--text); white-space:nowrap; }
.card.olsel .olk { background:#5a4a20; color:var(--sel); }
.facts { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.fact { font-size:11px; border-radius:4px; padding:0 6px; background:#33303a; color:var(--dim); white-space:nowrap; cursor:help; }
.fact.ok { background:#2f4a2c; color:#cdeac6; } .fact.no { background:#5a2320; color:#ffd9d3; } .fact.warn { background:#4a3d1c; color:#f5dc9a; }
.card .nt { -webkit-line-clamp:1; }
.waitbox { max-width:560px; margin:60px auto; text-align:center; color:var(--dim); font-size:15px; }
.waitbox b { color:var(--text); }
.waitbox .spin { min-height:60px; }
.prog { display:inline-flex; align-items:center; gap:6px; }
.prog .pb { width:120px; height:6px; background:#33303a; border-radius:3px; overflow:hidden; }
.prog .pb i { display:block; height:100%; background:var(--ok); }
.obj .rb { position:absolute; top:4px; left:6px; font-size:10px; background:#2b3b55; color:#cfe0ff; border-radius:4px; padding:0 4px; }

<body data-view="pick">
<div class="wrap">
<aside class="rail" aria-label="기물 작업과 목록">
<header>
  <h1>기물·파생</h1>
  <button class="tab on" data-v="pick">후보 고르기</button>
  <button class="tab" data-v="objs">기물 찾기·제작</button>
  <button class="tab" data-v="suggest">자동 제안</button>
  <span class="chip">고를 차례 <b id="cReady">0</b></span>
  <span class="chip">그리는·검수 중 <b id="cDraw">0</b></span>
  <button class="chip" id="cDoneBtn" title="끝난 기물(이미 고른 것)은 목록에서 접어 둔다 — 눌러서 펼치기/접기">끝남 <b id="cDone">0</b></button>
  <span class="chip" id="cEng" title="마지막으로 그린 쪽 — 다시 그린 후보는 마지막 그림의 엔진"></span>
  <span class="pool" id="pool"></span>
</header>
<nav id="nav"></nav>
<div id="sharedPub" role="status" style="flex:none;padding:5px 14px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)"></div>
</aside>
  <main id="main"></main>
</div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>
<script>
const ENG = {codex:'Codex', claude:'Sonnet'};
const ENG_FULL = {codex:'Codex gpt-6.1-sol', claude:'Claude Sonnet 5.5'};
const S = { navQ:'', navStatus:'ready', outline:{}, pending:{}, showDone:false, eng:'all', view:'pick', data:null, cur:null, round:null, sel:null, rej:{}, mode:'ctx', bg:'wood', zoom:'fit', sigNav:'', sigPick:'', waitNext:false, flip:false,
            suggestions:null, suggestQ:'', suggestKind:'all', suggestHad:false, suggestGen:0, objs:null, objSel:new Set(), cat:'전체', q:'', memo:'', fromSel:false, drafts:{}, fail:0, errSeen:null };
try { const prefs=JSON.parse(localStorage.getItem('prop-review-prefs')||'{}'); for(const k of ['mode','bg','zoom'])if(['ctx','one','both','wood','dark','check','fit',3,4,6,8].includes(prefs[k]))S[k]=prefs[k]; } catch {}
function rememberView(){try{localStorage.setItem('prop-review-prefs',JSON.stringify({mode:S.mode,bg:S.bg,zoom:S.zoom}));}catch{}}
const DRAW_N = 2;        // 다시 뽑기·새로 뽑기 한 번에 그리는 후보 수(서버 n). 화면 문구도 이것 하나에서 만든다
const UNDO_MS = 5000;    // 확정·다시 뽑기는 이만큼 기다렸다가 서버에 보낸다 — 그 사이 「되돌리기」(Z)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIRS = {A:'최소 수정', B:'최소 수정 2', C:'기준 맞추기', D:'기준 맞추기 2', E:'자유'};
// 오류는 닫을 때까지 남는다(✕). 되돌리기 단추가 있으면 그동안 눌 수 있다.
function toast(t, err, undo) {
  const e = $('#toast'); clearTimeout(e._t);
  if (e._sticky && !err) { e._queued = [t, undo]; return; }   // 오류를 읽기 전에 정상 알림이 덮지 않게
  e.className = 'toast' + (err ? ' err' : '') + (err || undo ? ' act' : ''); e.textContent = t; e._sticky = !!err;
  if (undo) e.append(Object.assign(document.createElement('button'), {textContent:'되돌리기 (Z)', onclick:() => { undo(); hideToast(); }}));
  if (err) e.append(Object.assign(document.createElement('button'), {textContent:'✕', title:'닫기', onclick:hideToast}));
  e.style.display = 'block';
  if (!err) e._t = setTimeout(hideToast, undo ? UNDO_MS : 2200);
}
function hideToast() { const e = $('#toast'); e.style.display = 'none'; e._sticky = false; const q = e._queued; e._queued = null; if (q) toast(q[0], 0, q[1]); }
async function api(p, body) {
  const r = await fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || r.status), {status:r.status}); return j;
}
const engOf = i => [...new Set(i.rounds.at(-1).runs.map(r => r.engine).filter(Boolean))];
const shown = i => (S.eng === 'all' || engOf(i).includes(S.eng)) && (!S.navQ || `${i.name} ${i.id} ${i.category}`.toLowerCase().includes(S.navQ.toLowerCase()));   // 왼쪽 「그린 쪽」 거르개
// 기물마다 고르던 것(선택·버림·메모)을 따로 들고 있다 — 다른 기물을 봤다 돌아와도 그대로, 다른 기물로 따라가지도 않는다
function saveDraft() {
  if (!S.cur) return;
  if (S.sel || S.memo.trim() || Object.keys(S.rej).length) S.drafts[S.cur] = {sel:S.sel, rej:S.rej, memo:S.memo}; else delete S.drafts[S.cur];
}
function openItem(id) {
  saveDraft(); const d = S.drafts[id];
  S.memoOpen=!!d?.memo;
  S.cur = id; S.round = null; S.waitNext = false; S.sigPick = '';
  S.sel = d ? d.sel : null; S.rej = d ? d.rej : {}; S.memo = d ? d.memo : '';
}
const item = () => S.data?.items.find(i => i.id === S.cur);
const rnd = () => { const it = item(); return it && (it.rounds.find(r => r.id === S.round) || it.rounds[it.rounds.length - 1]); };
// 왼쪽 목록 그림: 지금 고른 그림 이름을 주소에 붙여 브라우저가 하루 동안 다시 받지 않게 하고(목록은 3초마다 다시 그려진다),
// 보이는 것만 받는다(loading=lazy). 새 기물은 완료된 첫 후보를 썸네일로 보여 주며, 후보도 없을 때만 「새」로 표시한다.
const thumbSrc = o => `/api/harness/thumb/${o.slug}.png?v=${encodeURIComponent(o.current || 'v5')}`;
const thumbImg = o => {
  const fresh=o.isNew&&(o.current||'v5')==='v5', candidate=fresh&&Array.isArray(o.rounds)?o.rounds.at(-1)?.runs.find(r=>r.status==='done'):null;
  if(fresh&&!candidate)return '<b class="nb">새</b>';
  return `<img loading="lazy" decoding="async" src="${candidate?`/c/${o.slug}/${candidate.cand}.png?v=${candidate.v||0}`:thumbSrc(o)}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'nb',textContent:'새'}))">`;
};
const curSrc = it => `/c/${it.slug}/${it.current === 'v5' ? 'v5' : it.current}.png`;
const imgSrc = (it, c, v) => S.mode === 'ctx' ? `/ctx/${it.slug}/${c}.png?v=${v||0}` : `/c/${it.slug}/${c}.png?v=${v||0}`;
const ctxSrc = (it, c, v) => `/ctx/${it.slug}/${c}.png?v=${v||0}`;
function sized(img, z) {
  const fit = () => {
    if (z === 'big') z = Math.max(2, Math.min(12, Math.floor(260 / img.naturalHeight), Math.floor(360 / img.naturalWidth)));   // 나란히 보기
    if (z === 'fit') {   // 카드 폭에 맞춘 정수 배율(작은 16px 그림도 크게, 큰 그림은 높이 240px 까지)
      const w = ((img.closest('.pic') || img.parentElement).clientWidth || 160) - 16;
      z = Math.max(1, Math.min(12, Math.floor(w / img.naturalWidth), Math.floor(240 / img.naturalHeight)));
    }
    const box = img.closest('.pic') || img.parentElement;
    img.style.width = img.naturalWidth * z + 'px'; img.classList.remove('ld'); box.classList.remove('wait'); img.dispatchEvent(new Event('fitted')); };
  const box = img.closest('.pic') || img.parentElement;
  img.classList.add('ld'); box.classList.add('wait');
  img.onload = fit; img.onerror = () => { box.classList.remove('wait'); box.title = '그림을 못 불러왔다'; };
  if (img.complete && img.naturalWidth) fit();
}

async function load(keep) {
  // 상태 요청이 겹치면(3초 폴링 + 확정 직후) 늦게 도착한 옛 답이 새 답을 덮어 방금 고른 기물이 「고를 차례」로 되살아났다.
  // 마지막에 보낸 요청의 답만 쓰고, 서버가 아직 못 따라온 확정(S.pending)은 화면 쪽 값을 덮어 둔다.
  const gen = S.gen = (S.gen || 0) + 1; let d;
  try { d = await api('/api/harness/state'); }
  catch (e) {   // 한 번 실패해도 폴링은 계속한다(예전엔 여기서 멈춰 새로고침 전까지 화면이 얼었다)
    if (gen !== S.gen) return;
    S.fail++; const wait = Math.min(15, 3 * S.fail);
    $('#pool').innerHTML = `<span class="bad" title="${esc(e.message)}">● 서버 연결 끊김 — ${wait}초 뒤 다시 시도</span>`;
    clearTimeout(S._poll); S._poll = setTimeout(() => load(true), wait * 1000); return;
  }
  if (gen !== S.gen) return;
  S.fail = 0;
  const errs = d.drawErrors || {}, eseq = d.drawErrSeq || 0;
  if (S.errSeen != null && eseq > S.errSeen) {   // 뒤에서 그리기가 실패했다 — 알려 준다
    const L = Object.entries(errs).filter(([, v]) => v.seq > S.errSeen);
    if (L.length) toast(`그리기 실패 — ${L.map(([k, v]) => `${k}: ${v.error}`).join(' / ')}`, 1);
  }
  S.errSeen = eseq;
  for (const i of d.items) {
    const p = S.pending[i.id]; if (!p) continue;
    const lr = i.rounds.at(-1);
    if (p.kind === 'redraw') {   // 다시 뽑기: 서버에 새 판이 생길 때까지 고를 차례에서 빼 둔다
      const er = errs[i.id];
      if (lr.id > p.last || (p.sent && er && er.seq > p.errSeq) || (p.sent && Date.now() - p.at > 15 * 60e3)) { delete S.pending[i.id]; continue; }
      i.status = 'drawing'; continue;
    }
    const dc = lr.decided && (lr.decided.verdict === 'keep' ? 'keep' : lr.decided.cand);
    if (p.sent && (lr.id > p.last || dc === p.body.choice)) { delete S.pending[i.id]; continue; }   // 서버가 따라왔다
    i.status = 'done'; if (p.body.choice !== 'keep') i.current = p.body.choice;
  }
  S.data = d;
  const its = S.data.items;
  $('#cReady').textContent = its.filter(i => i.status === 'ready').length;
  $('#cDraw').textContent = its.filter(i => i.status === 'drawing').length;
  $('#cDone').textContent = its.filter(i => i.status === 'done').length;
  const all = its.flatMap(i => i.rounds.flatMap(r => r.runs));
  $('#cEng').innerHTML = `<span class="eng codex">Codex</span> ${all.filter(r => r.engine === 'codex').length}장 · <span class="eng claude">Sonnet</span> ${all.filter(r => r.engine === 'claude').length}장`;
  const pub = S.data.sharedPublish || {state:'idle'};
  renderPublication();
  const p = S.data.pool;
  const left = p.queued + p.running, eta = Math.round(left / Math.max(1, p.par) * 5.7);   // 실측: 16명에서 1분에 약 2.8장 = 한 사람 5.7분/장
  const drawing = its.filter(i => i.status === 'drawing').length;
  $('#pool').innerHTML = (drawing ? `<span class="prog" title="그리는·검수 중 기물 ${drawing}개 · 남은 작업 ${left}장(다시 그리기 포함 전 추정)"><span class="pb"><i style="width:${Math.round(100 * its.filter(i => i.status !== 'drawing').length / its.length)}%"></i></span>${eta < 1 ? '곧 끝남' : '약 '}${eta < 1 ? '' : eta < 60 ? eta + '분' : Math.floor(eta / 60) + '시간 ' + (eta % 60) + '분'}${eta < 1 ? '' : ' 남음'}</span> · ` : '') + `<span title="그리기 ${esc(p.effort)} · 검수 ${esc(p.reviewEffort)} · 한 장 최대 ${p.attempts}번 그림(검수 탈락 시 다시)">${esc(p.model)} · 그림 ${esc(p.effort)} · 검수 ${esc(p.reviewEffort)} · 동시 ${p.par}</span> · ` + (p.alive ? `<span class="live">● 작업 중 ${p.running} · 대기 ${p.queued}</span>` : '쉼');
  const ready = its.filter(i => i.status === 'ready' && shown(i));
  if (S.waitNext && ready.length) openItem(ready[0].id);
  if (!S.waitNext && (!S.cur || !item())) { const f = ready[0] || its.find(shown) || its[0]; if (f) openItem(f.id); else S.cur = null; }
  if (!keep) S.round = null;
  if (S.view === 'pick') {
    // 바뀐 것이 있을 때만 다시 그린다 — 3초마다 통째로 다시 그리면 그림이 다시 로드되며 깜빡이고 검게 보인다
    const sn = JSON.stringify([S.eng, its.map(i => [i.id, i.status, i.busy, i.readyCount, i.rounds.at(-1).runs.map(r => r.engine)])]);
    const sp = JSON.stringify([S.waitNext, item() || null]);
    if (sn !== S.sigNav || !keep) { S.sigNav = sn; renderNav(); }
    if (sp !== S.sigPick || !keep) { S.sigPick = sp; const y = $('#main').scrollTop; renderPick(); $('#main').scrollTop = y; }
  }
  if (S.view === 'suggest') loadSuggestions();
  clearTimeout(S._poll); S._poll = setTimeout(() => load(true), (p.alive || ['publishing','queued','error'].includes(pub.state) || its.some(i => i.status === 'drawing')) ? 3000 : 15000);
}

function toggleDone() { S.navStatus=S.navStatus==='done'?'ready':'done'; S.showDone = !S.showDone; if (S.view === 'pick') renderNav(); }   // 기물 고르기 화면에선 목록을 덮지 않는다

function renderNav() {
  if(!S.data)return;
  const nav=$('#nav'), focus=document.activeElement?.id==='navSearch', pos=focus?$('#navSearch').selectionStart:0;
  const scroll=nav.querySelector('.navlist')?.scrollTop||0;
  const labels={ready:'고를 차례',drawing:'제작 중',done:'선택 완료',all:'전체'};
  const all=S.data.items, matches=all.filter(shown).filter(i=>S.navStatus==='all'||i.status===S.navStatus);
  nav.innerHTML=`<div class="navhead"><input id="navSearch" type="search" aria-label="기물 검색" placeholder="기물 이름으로 찾기" value="${esc(S.navQ)}">
    <div class="navfilters">${Object.entries(labels).map(([k,v])=>`<button data-status="${k}" class="${S.navStatus===k?'on':''}" aria-pressed="${S.navStatus===k}">${v} ${k==='all'?all.length:all.filter(i=>i.status===k).length}</button>`).join('')}</div>
    <div class="navcount">${matches.length}개 · ↑↓ 이동 · 1/2 → Enter</div></div>
    <div class="navlist">${matches.map(i=>`<button class="it ${i.id===S.cur?'cur':''}" data-id="${esc(i.id)}" aria-current="${i.id===S.cur}"><span class="th">${thumbImg(i)}</span><span class="n">${esc(i.name)}<small>${esc(i.category)}</small></span><span class="b ${i.status}">${i.status==='ready'?i.readyCount+'장':i.status==='done'?'✓':'진행'}</span></button>`).join('')||'<div class="empty">조건에 맞는 기물이 없어요.<br>전체 목록이나 다른 이름으로 찾아보세요.</div>'}</div>`;
  $('#navSearch').oninput=e=>{S.navQ=e.target.value;renderNav();};
  nav.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{S.navStatus=b.dataset.status;renderNav();});
  nav.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{openItem(b.dataset.id);renderNav();renderPick();$('#main').scrollTop=0;});
  nav.querySelector('.navlist').scrollTop=scroll;
  if(focus){$('#navSearch').focus();$('#navSearch').setSelectionRange?.(pos,pos);}
}
function moveItem(direction){const ids=[...$('#nav').querySelectorAll('[data-id]')].map(e=>e.dataset.id);if(!ids.length)return;const n=ids[(ids.indexOf(S.cur)+direction+ids.length)%ids.length];openItem(n);renderNav();renderPick();$('#main').scrollTop=0;}
function renderPublication(){
 const pub=S.data?.sharedPublish||{}, pending=Object.values(S.pending), waiting=pending.filter(p=>!p.sent).length, saving=pending.some(p=>p.kind==='decide'&&p.sent&&!p.saved);
 const text=waiting?`확정 ${waiting}건 전송 대기 · 5초 안에 되돌릴 수 있어요`:saving?'선택 저장 확인 중…':pub.state==='done'?`공용 반영 완료 · 선택 ${pub.receipt?.selected??0}종`:['queued','publishing'].includes(pub.state)?'선택 저장됨 · 공용 반영 중':pub.state==='error'?'선택 저장됨 · 공용 반영 재시도 중':'선택을 확정하면 공용으로 자동 반영됩니다';
 const e=$('#sharedPub');e.classList.toggle('error',pub.state==='error');e.innerHTML=`<span class="${waiting?'pending':''}">${esc(text)}</span><button class="btn" id="showShared">저장·공용 상태 확인 ↗</button>`;
 $('#showShared').onclick=()=>{if(parent!==window)parent.postMessage({type:'prop-harness:materials'},location.origin);else window.open('/harness#materials','_blank','noopener');};
}

function vbadge(o) {
  if (o.cur || o.busy || o.failed || o.bad || !o.review) return '';
  const v = o.review.verdict;
  return v === 'PASS' ? '<span class="vb pass" title="검수자(AI)가 통과시켰다 — 보증이 아니다. 꼭대기 면 규칙(2026-10-02) 전 검수는 특히 너그럽다">검수 통과</span>'
       : v === 'FAIL' ? `<span class="vb fail" title="시도 ${o.attempt}번 모두 검수에서 떨어졌다 — 그래도 고를 수 있다">검수 ✗</span>`
       : '<span class="vb unk">검수?</span>';
}

const DERIVE_KO = {facing:'방향', state:'상태', loop:'움직임', size:'크기'};
// 묶음 그림(파생): 칸 이름표를 그림 밑에 칸 폭 비율로 단다. 움직임 묶음은 프레임을 돌려 보는 작은 미리보기도
function stripHtml(it, src) {
  const s = it.set, W = s.slots.reduce((a, x) => Math.max(a, x.x + x.w), 0);
  return `<span class="strip"><img data-src="${src}"${s.derive === 'loop' ? ' data-loop="1"' : ''}>` +
    s.slots.map(x => `<span class="sl ${x.locked ? 'lk' : ''}" style="left:${100 * x.x / W}%;width:${100 * x.w / W}%" title="${esc(x.child || '')}">${esc(x.label)}</span>`).join('') + `</span>`;
}
function card(it, key, c, opt) {
  const sel = S.sel === c, rej = S.rej[c];
  const mode = it.set ? 'one' : S.mode;   // 묶음 그림은 방 안 그림이 없다
  let h = `<div class="card ${it.set ? 'wide' : ''} ${opt.olsel ? 'olsel' : ''} ${opt.cur ? 'cur' : ''} ${sel ? 'sel' : ''} ${rej ? 'rej' : ''} ${!opt.busy && opt.review && opt.review.verdict === 'FAIL' ? 'vfail' : ''}" data-c="${esc(c)}" ${opt.disabled || opt.busy ? 'data-dis="1"' : ''}>
    <div class="top"><span class="key">${key}</span>${opt.engine ? `<span class="eng ${opt.engine}" title="그림: ${ENG_FULL[opt.engine]}${opt.reviewEngine ? ' · 검수: ' + ENG_FULL[opt.reviewEngine] : ''}">${ENG[opt.engine]}</span>` : ''}${opt.ol ? `<span class="olk" title="테두리: ${esc(opt.ol)}">${esc(opt.ol)}</span>` : ''}<span class="dir" title="${esc(opt.label)}">${esc(opt.label)}</span>${opt.cur ? '' : `<button class="x" data-x="${esc(c)}" title="이 후보 버리기 (X)">✕</button>`}</div>`;
  const att = opt.attempt > 1 ? ` (시도 ${opt.attempt}/${S.data.pool.attempts})` : '';
  if (opt.busy && opt.phase === 'review' && opt.v && !it.set) h += `<div class="pic over" data-over="${opt.busy === 'queued' ? '검수 대기' : '3/4 검수 중…'}"><img data-src="${imgSrc(it, c, opt.v)}"></div>`;
  else if (opt.busy && it.set && opt.v && opt.phase === 'review') h += `<div class="pic over" data-over="${opt.busy === 'queued' ? '검수 대기' : '묶음 검수 중…'}">${stripHtml(it, imgSrc(it, c, opt.v).replace('/ctx/', '/c/'))}</div>`;
  else if (opt.busy) h += `<div class="spin"><i></i>${opt.busy === 'queued' ? '대기 중' + att : (opt.attempt > 1 ? '검수에서 떨어져 다시 그리는 중' + att : '그리는 중…')}</div>`;
  else if (opt.failed) h += `<div class="spin" style="color:var(--bad)">못 그림<br><small>${esc(opt.failed).slice(0, 80)}</small></div>`;
  else {
    if (it.set) h += `<div class="pic">${stripHtml(it, `/c/${it.slug}/${c}.png?v=${opt.v || 0}`)}</div>`;
    else if (mode !== 'ctx') h += `<div class="pic"><img data-src="/c/${it.slug}/${c}.png?v=${opt.v || 0}"></div>`;
    if (mode !== 'one' && !(opt.cur && it.isNew && c === 'v5')) h += `<div class="ctxw" title="같은 방 안(1배 크기 그대로 늘림)"><img data-ctx="1" data-src="${ctxSrc(it, c, opt.v)}"></div>`;
  }
  // 한 줄 요약: 꼭대기 행 수 · 검수 · 다시 그린 횟수 — 긴 글은 마우스를 올리면 보인다
  const rv = opt.review, f = [];
  if (rv && !opt.busy && rv.topRows != null) f.push(`<span class="fact ${rv.topRows >= 3 ? 'ok' : 'no'}" title="${esc(rv.top || '')}">꼭대기 ${rv.topRows}행</span>`);
  if (rv && !opt.busy && rv.verdict === 'FAIL') f.push(`<span class="fact no" title="${esc(rv.reasons + (rv.surfaces ? '\n면: ' + rv.surfaces : '') + (rv.fix ? '\n고칠 것: ' + rv.fix : ''))}">검수 ✗ ${esc((rv.codes || []).join(','))}</span>`);
  else if (rv && !opt.busy && rv.verdict === 'PASS') f.push(`<span class="fact" title="${esc(rv.reasons + (rv.surfaces ? '\n면: ' + rv.surfaces : ''))}">검수 통과</span>`);
  if (opt.history && opt.history.length) f.push(`<span class="fact warn" title="${esc(opt.history.map(x => `시도 ${x.attempt} ${x.stage === 'hard' ? '깨짐' : '검수'} ✗: ${x.why}`).join('\n'))}">${opt.history.filter(x => x.stage !== 'review-error').length}번 다시 그림</span>`);
  if (opt.bad) f.push(`<span class="fact no" title="${esc(opt.bad)}">검사 ✗</span>`);
  if (f.length) h += `<div class="facts">${f.join('')}</div>`;
  if (opt.note) h += `<div class="nt" title="${esc(opt.note)}">${esc(opt.note)}</div>`;
  if (rej) h += `<div class="reasons">` + Object.entries(S.data.reasons).map(([k, v]) => `<button data-r="${k}" data-rc="${esc(c)}" class="${rej.includes(k) ? 'on' : ''}">${v}</button>`).join('') + `</div>`;
  return h + '</div>';
}

function renderPick() {
  rememberView();
  const it = item(); const m = $('#main');
  if (S.waitNext || !it) {
    const p = S.data.pool, d = S.data.items.filter(i => i.status === 'drawing').length;
    m.innerHTML = d ? `<div class="waitbox"><div class="spin"><i></i></div>고를 차례가 끝났다. <b>${d}</b>개 기물을 그리는 중(작업 중 ${p.running} · 대기 ${p.queued}).<br>다음 기물이 다 되면 <b>자동으로 연다</b> — 이 화면을 켜 두면 된다.</div>`
      : `<div class="empty">고를 판이 없다. 「기물 골라 새로 뽑기」에서 기물을 고르면 작업자 ${DRAW_N}명이 후보를 찍는다.</div>`;
    if (d) S.waitNext = true;
    renderBar(); return;
  }
  const r = rnd(); S.round = r.id;
  const cur = it.current === 'v5' ? 'v5' : it.current;
  const par = (it.set && it.set.parent) || it.parent;
  const pending=S.pending[it.id];
  const noCurrent=it.isNew && cur==='v5' && !it.set;
  let h = `<div class="itemtop"><div class="head"><h2>${esc(it.name)}</h2><span class="meta">${esc(it.category)} · ${it.canvas[0]}×${it.canvas[1]}px${par?' · 파생 '+esc(DERIVE_KO[it.set?.derive||it.derive]||''):''}${pending?' · 저장 대기':it.current!=='v5'?' · 선택 저장됨':''}</span></div><div class="itemnav"><span class="review-tip">더블클릭 → 확정하고 다음</span>${canDerive(it)?'<button class="btn derive-btn" id="dvBtn">＋ 파생</button>':''}<button class="btn" id="prevItem" aria-label="이전 기물">←</button><button class="btn" id="nextItem" aria-label="다음 기물">→</button></div></div>`;
  let details = `<details class="itemdetails"><summary>설명 · 제작 요청 · 이전 후보</summary><div class="meta">${esc(it.desc)} · <code>${esc(it.id)}</code>${par?' · 원본 '+esc(par):''}${it.use?.length?' · 쓰임 '+esc(it.use.join(' · ')):''}</div><div class="rounds">`+it.rounds.map(x=>`<button data-r="${x.id}" class="${x.id===r.id?'on':''}">판 h${x.id}${x.decided?' · '+(x.decided.verdict==='keep'?'그대로':pickName(x.decided.cand)):''}</button>`).join('')+`</div>${r.note?'<div class="rnote">메모: '+esc(r.note)+'</div>':''}${r.base?'<div class="rnote">출발점: '+esc(r.base)+'</div>':''}</details>`;
  const tools = `<div class="tools"><span class="seg">${[['ctx','방 안'],['one','단품'],['both','둘 다']].map(([k,v])=>`<button data-mode="${k}" class="${S.mode===k?'on':''}">${v}</button>`).join('')}</span><span class="tools-extra"><span class="seg">${['wood:나무','dark:어둠','check:체크'].map(x=>{const[k,v]=x.split(':');return `<button data-bg="${k}" class="${S.bg===k?'on':''}">${v}</button>`}).join('')}</span><span class="seg">${['fit',3,4,6,8].map(z=>`<button data-z="${z}" class="${S.zoom===z?'on':''}">${z==='fit'?'맞춤':z+'배'}</button>`).join('')}</span></span></div>`;
  h += `<div class="grid bg-${S.bg} ${S.mode==='ctx'&&!it.set?'ctxmode':''} ${it.set?'setgrid':''} ${noCurrent?'no-current':''}">`+(noCurrent?'':card(it,'0',cur,{cur:1,label:it.set&&cur==='v5'?'출발 원본':'현재 그림',v:0}));
  r.runs.forEach((x, k) => {   // 후보마다 두 장(2026-10-03): 그린 그대로 · 테두리 꼭 필요한 곳만(outline_select.py, 이름 끝 .sel)
    const opt = {label:x.direction || DIRS[x.letter], v:x.v, note:x.note, phase:x.phase, attempt:x.attempt, review:x.review, history:x.history, engine:x.engine, reviewEngine:x.reviewEngine,
      busy:['queued', 'running'].includes(x.status) ? x.status : null, failed:x.status === 'failed' ? (x.error || '실패') : null,
      bad:x.status === 'done' && !x.ok ? (x.error || '하드 검사 불합격') : null};
    const two = x.status === 'done' && x.ok && !NOSEL.has(it.kind) && x.selDiff >= SEL_MIN;   // 거의 같으면 한 장만
    const selectedOutline=S.sel===x.cand+'.sel'||(S.sel!==x.cand&&S.outline[x.cand]==='light');
    const candidate=two&&selectedOutline?x.cand+'.sel':x.cand;
    let html=card(it,String(k+1),candidate,{...opt,label:'후보 '+(k+1),ol:two?(selectedOutline?'필요한 테두리':'원래 테두리'):null});
    const controls=two?`<div class="outline-switch" aria-label="후보 ${k+1} 테두리"><button data-outline="${esc(x.cand)}" data-light="0" class="${selectedOutline?'':'on'}">원래 테두리</button><button data-outline="${esc(x.cand)}" data-light="1" class="${selectedOutline?'on':''}">필요한 테두리만</button></div>`:'';
    html=html.slice(0,-6)+controls+`<div class="candidate-hint">${S.sel===candidate?'✓ 선택됨 · 더블클릭하면 다음':'더블클릭하면 확정하고 다음'}</div></div>`;
    h+=html;
  });
  // 후보 다음 자리 = 「다시 뽑기」 카드(2026-10-03 사용자 「1번과 2번만 만들고, 3번은 다시 뽑기 버튼으로」). 그 숫자 키도 같다.
  const rbusy = r.runs.some(x => ['queued', 'running'].includes(x.status));
  h += `<div class="card redocard ${rbusy ? 'busy' : ''}" data-redo="1"><div class="top"><span class="key">${r.runs.length + 1}</span><span class="dir">다시 뽑기</span></div>
    <div class="redobig">${rbusy ? '그리는 중…' : '↻<br>다시 뽑기'}<small>메모·버린 후보가 다음 판으로 간다</small></div></div>`;
  h += `</div><div class="resize-actions" id="resizeActions"></div>`+tools+details+(canDerive(it)?'<div class="derive-hint" id="deriveHint">자동 파생 제안을 읽는 중…</div>':'');
  h += '<div id="comparison">'+comparisonHtml(it,cur)+'</div>';
  h += `<details class="keys"><summary>단축키 보기 · 1/2 선택 → Enter 확정 · ↑↓ 이동</summary><kbd>1</kbd> <kbd>2</kbd> 후보 고르기(한 번 더 누르면 「꼭 필요한 곳만」) · 후보 다음 숫자 = 다시 뽑기 · <kbd>0</kbd> 지금 그대로 · <kbd>Enter</kbd> = 확정하고 다음 · <kbd>X</kbd> 고른 카드 버리기 · <kbd>Z</kbd> 방금 확정·다시 뽑기 되돌리기 · <kbd>R</kbd> 메모 쓰기(메모에서 <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 확정, <kbd>Esc</kbd> 나가기) · <kbd>D</kbd> 파생 만들기(방향·상태·움직임·크기) · <kbd>V</kbd> 둘 다/단품/방 안 · <kbd>F</kbd> 맞춤 · <kbd>B</kbd> 배경 · <kbd>+</kbd><kbd>-</kbd> 확대 · <kbd>↑</kbd><kbd>↓</kbd> 이전/다음 기물 · <kbd>Space</kbd> 겹쳐 보기</details>`;
  m.innerHTML = h;
  renderResizeActions(it);
  $('#prevItem').onclick=()=>moveItem(-1);$('#nextItem').onclick=()=>moveItem(1);
  m.querySelectorAll('[data-outline]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=b.dataset.outline,light=b.dataset.light==='1';S.outline[c]=light?'light':'full';if(S.sel===c||S.sel===c+'.sel')S.sel=c+(light?'.sel':'');renderPick();});
  m.querySelectorAll('.grid .pic img').forEach(img => { sized(img, S.zoom); img.src = img.dataset.src; });
  startAnims(m, it);
  const dv = document.getElementById('dvBtn'); if (dv) dv.onclick = () => openDerive(it.id);
  if (canDerive(it)) loadDeriveHint(it.id);
  m.querySelectorAll('.grid .ctxw img').forEach(img => {
    img.onerror = () => { const w = img.parentElement; w.classList.add('err'); w.onclick = ev => { ev.stopPropagation(); w.classList.remove('err'); w.onclick = null; img.src = img.dataset.src + '&r=' + Date.now(); }; };
    img.src = img.dataset.src; });
  preloadNext(it);
  ['cmpA', 'cmpB'].forEach(id => { const e = document.getElementById(id); if (e) sized(e, 'big'); });
  const cc = document.getElementById('cmpC'); if (cc) sized(cc, 3);
  m.querySelectorAll('.card[data-c]:not([data-dis])').forEach(e=>{e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label',(e.classList.contains('cur')?'현재 그림':e.querySelector('.dir').textContent)+' 선택');e.setAttribute('aria-pressed',String(e.classList.contains('sel')));e.onkeydown=ev=>{if(ev.target===e&&['Enter',' '].includes(ev.key)){ev.preventDefault();ev.stopPropagation();e.click();}};});
  m.querySelectorAll('.card').forEach(e => e.onclick = ev => {
    if (ev.target.dataset.x) { toggleRej(ev.target.dataset.x); return; }
    if (ev.target.dataset.r) { const c = ev.target.dataset.rc, k = ev.target.dataset.r; const L = S.rej[c]; L.includes(k) ? L.splice(L.indexOf(k), 1) : L.push(k); renderPick(); return; }
    if (e.dataset.redo) { redraw(); return; }
    if (e.dataset.dis || e.querySelector('.spin')) return;
    if(ev.target.closest('[data-outline]'))return;
    const c = e.dataset.c;
    S.sel=c; if(S.rej[S.sel])delete S.rej[S.sel];
    updateSelection(it,cur);
  });
  m.querySelectorAll('.card[data-c]:not([data-dis])').forEach(e=>e.ondblclick=ev=>{
    if(ev.target.closest('button')||e.querySelector('.spin')||S.cur!==it.id||S.round!==r.id)return;
    ev.preventDefault();S.sel=e.dataset.c;confirmSel();
  });
  m.querySelectorAll('.rounds button').forEach(b => b.onclick = () => { S.round = +b.dataset.r; S.sel = null; S.rej = {}; renderPick(); });   // 메모는 기물 것이라 둔다
  m.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderPick(); });
  m.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { S.bg = b.dataset.bg; renderPick(); });
  m.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { S.zoom = b.dataset.z === 'fit' ? 'fit' : +b.dataset.z; renderPick(); });
  renderBar();
}

function comparisonHtml(it,cur) {
  const pick = S.sel && S.sel !== cur && !it.set ? S.sel : null;   // 묶음은 띠 자체가 나란히 보기다
  return pick ? `<details class="cmp bg-${S.bg}"><summary>크게 나란히 비교하기</summary><h4>나란히 — 지금 그림 · 고른 후보 (Space 를 누르고 있으면 고른 자리에 지금 그림이 겹쳐 보인다)</h4><div class="row">
      <div class="col"><div class="pic"><img id="cmpA" src="${curSrc(it)}"></div>지금</div>
      <div class="col"><div class="pic"><img id="cmpB" src="/c/${it.slug}/${pick}.png"></div>고른 것 · ${esc(pickName(pick))}</div>
      <div class="col"><div class="pic ctxp" style="padding:0;background:#000"><img id="cmpC" src="/ctx/${it.slug}/${pick}.png"></div>방 안</div></div></details>` : '';
}
function updateSelection(it,cur) {
  $('#main').querySelectorAll('.card[data-c]').forEach(e=>{
    const selected=e.dataset.c===S.sel;
    e.classList.toggle('sel',selected);e.setAttribute('aria-pressed',String(selected));
    if(selected){e.classList.remove('rej');e.querySelector('.reasons')?.remove();}
    const hint=e.querySelector('.candidate-hint');if(hint)hint.textContent=selected?'✓ 선택됨 · 더블클릭하면 다음':'더블클릭하면 확정하고 다음';
  });
  $('#comparison').innerHTML=comparisonHtml(it,cur);
  ['cmpA','cmpB'].forEach(id=>{const e=document.getElementById(id);if(e)sized(e,'big');});
  if($('#cmpC'))sized($('#cmpC'),3);
  renderBar();
}

function toggleRej(c) { if (S.rej[c]) delete S.rej[c]; else { S.rej[c] = []; if (S.sel === c) S.sel = null; } renderPick(); }

// 메모 칸은 한 번만 만들고 값만 맞춘다 — 3초 폴링이 바를 통째로 다시 그리면 쓰던 한글 조합·커서가 날아갔다
function memoBox(view, key, ph) {
  const b = $('#bar'); let m = $('#memo');
  if (!m || m.dataset.view !== view) {
    b.innerHTML = `<span id="barL" style="display:contents"></span><textarea id="memo"></textarea><span id="barR" style="display:contents"></span>`;
    m = $('#memo'); m.dataset.view = view;
    m.oninput = e => S.memo = e.target.value;
    m.onkeydown = e => {
      if (e.key === 'Escape') { m.blur(); return; }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); m.blur(); view === 'objs' ? startDraw() : confirmSel(); }
    };
  }
  if (m.dataset.key !== key || document.activeElement !== m) { if (m.value !== S.memo) m.value = S.memo; m.dataset.key = key; }
  m.placeholder = ph; return m;
}
function renderBar() {
  const b = $('#bar');
  b.classList.toggle('memo-open',!!S.memoOpen);
  if (S.view === 'suggest') { b.innerHTML = ''; return; }
  if (S.view === 'objs') {
    memoBox('objs', 'objs', '작업자에게 줄 메모(모든 기물에 같이 간다) — 예: 의자 다리가 너무 굵다, 원래 디자인 살려라 · 「2x2」처럼 쓰면 크기도 바뀐다(기물 하나일 때)');
    $('#barL').innerHTML = `<span><b>${S.objSel.size}</b>개 골랐다</span>`;
    $('#barR').innerHTML = `<button class="btn" id="odv" ${S.objSel.size === 1 ? '' : 'disabled'} title="기물 하나를 고르면 방향 4·상태·움직임·큰 판을 뽑는다">＋ 파생 만들기</button><button class="btn" id="clr">선택 지우기</button><button class="btn go" id="go" ${S.objSel.size ? '' : 'disabled'} title="메모에서 Ctrl+Enter">후보 ${DRAW_N}장씩 뽑기</button>`;
    $('#clr').onclick = () => { S.objSel.clear(); renderObjs(); };
    $('#odv').onclick = () => openDerive([...S.objSel][0]);
    $('#go').onclick = startDraw;
    return;
  }
  const it = item(); if (!it || S.waitNext) { b.innerHTML = ''; return; }
  const r = rnd(); const cur = it.current === 'v5' ? 'v5' : it.current;
  const busy = r.runs.some(x => ['queued', 'running'].includes(x.status));

const canPick = (it, r) => S.sel && !r.runs.some(x => ['queued', 'running'].includes(x.status) && (x.cand === S.sel || x.cand + '.sel' === S.sel));

// 다음에 열 기물의 그림을 미리 받아 둔다 — 확정하자마자 그림이 바로 뜨게(서버도 고를 차례 기물의 방 안 그림을 미리 굽는다)
function preloadNext(it) {

  const cur = [...document.querySelectorAll('#main .grid img')].filter(i => !i.complete);
  if (cur.length) { const t = S._preT = {}; Promise.all(cur.map(i => new Promise(r => { i.addEventListener('load', r, {once:true}); i.addEventListener('error', r, {once:true}); })))
    .then(() => { if (S._preT === t && item() === it) preloadNext(it); }); return; }

    n.rounds.at(-1).runs.forEach(x => {
      if (x.status !== 'done') return;

}

function nextItem() {
  const its = S.data.items.filter(i => i.status === 'ready' && i.id !== S.cur && shown(i));
  if (its[0]) openItem(its[0].id);
  else { S.waitNext = true; S.sel = null; S.rej = {}; S.memo = ''; S.sigPick = ''; }   // 없으면 다음 것이 다 될 때까지 기다렸다가 자동으로 연다

// 보내다 실패하면 그 기물로 돌아가 고르던 것(선택·버림·메모)을 되살리고 오류를 닫을 때까지 띄운다.
function commit(kind, it, body, msg) {

}

}
async function send(id) {

    p.saved=true;

    if (res.resized) toast(`${p.name}: 크기를 ${res.resized.w}×${res.resized.h}칸(${res.resized.canvas.join('×')}px)으로 바꿔 다시 뽑는 중`);

// 창을 닫거나 새로고침해도 기다리던 확정·다시 뽑기는 보낸다
addEventListener('pagehide', () => {

function decide(choice) {

  const body = {id:it.id, round:it.rounds.at(-1).id, choice, rejects:S.rej, note:S.memo.trim()};
  commit('decide', it, body, choice === 'keep' ? `${it.name}: 지금 그대로` : `${it.name}: ${pickName(choice)} 로 확정`);

function redraw(slot) {
  const it = item(), r = rnd(); if (!it || S.waitNext) return;

  if (slot) {   // 묶음에서 칸 하나만: 고른 묶음 후보에서 출발, 다른 칸은 그대로(서버 검사가 잰다)
    const lab = it.set.slots.find(x => x.key === slot)?.label || slot;
    const body = {ids:[it.id], note:S.memo.trim(), base:S.sel, slot, n:DRAW_N, round:it.rounds.at(-1).id, rejects:S.rej};
    commit('redraw', it, body, `${it.name}: 「${lab}」 칸만 다시 — 후보 ${DRAW_N}장`); return;
  }

  // 확정과 같이: 이 기물을 고를 차례에서 빼고 바로 다음 기물로. 새 판이 다 그려지면 다시 「고를 차례」에 들어온다.
  const body = {ids:[it.id], note:S.memo.trim(), base, n:DRAW_N, round:it.rounds.at(-1).id, rejects:S.rej};
  commit('redraw', it, body, `${it.name}: 다시 뽑기 — 후보 ${DRAW_N}장${S.memo.trim() ? '' : ' (메모 없음)'}`);
}

// Size controls use the existing derive metadata and draw-note resize contract.
// Cache only for this item/round/canvas; never infer ground footprint from image height.
const resizeMeta = new Map();
const resizeKey = it => JSON.stringify([it.id,it.canvas,it.rounds.at(-1).id]);
function resizeDimensions(it,g) {

}

  const key=resizeKey(it);
  if(retry)resizeMeta.delete(key);
  if(!resizeMeta.has(key))resizeMeta.set(key,api('/api/harness/derive/'+encodeURIComponent(it.id)));
  el.innerHTML='<span>크기 변경 정보를 읽는 중…</span>';
  try {
    const g=await resizeMeta.get(key);
    if(!el.isConnected||S.cur!==it.id||resizeKey(item())!==key)return;
    if(!g.size.ok){el.textContent='이 기물은 크기를 변경할 수 없어요.';return;}
    const d=resizeDimensions(it,g),big=resizeTarget(d,true),small=resizeTarget(d,false),busy=resizeBusy(item());
    const same=t=>t[0]===d.w&&t[1]===d.h;
    el.innerHTML=`<span class="size-label">크기 바꿔 다시 뽑기 <small>현재 ${d.w}×${d.h}칸 · ${it.canvas.join('×')}px</small></span><button class="btn" id="resizeLarger" ${busy||same(big)?'disabled':''} title="${same(big)?'최대 크기입니다':resizePixels(d,...big)}">＋ 크게 · ${big.join('×')}칸</button><button class="btn" id="resizeSmaller" ${busy||same(small)?'disabled':''} title="${same(small)?'최소 크기입니다':resizePixels(d,...small)}">− 작게 · ${small.join('×')}칸</button><button class="btn" id="resizeCustom" ${busy?'disabled':''}>크기 직접 지정…</button>`;

}
function openResize(it,key,g) {

    ${row('state', suggested('state'), g.state.ok, '상태 전환', ' 원본 + 다른 상태 한 칸. 이벤트가 그림을 바꾼다', ` <input type="text" id="dvState" value="${esc(g.state.label)}" title="상태 이름(열림·켬·깨짐…)">`)}
    ${row('loop', suggested('loop'), g.loop.ok, `움직임 ${g.loop.frames}프레임`, ` 원본 + 움직이는 부분만 바꾼 ${g.loop.frames - 1}장, ${g.loop.ms}ms 마다.${g.loop.why ? ' (' + esc(g.loop.why) + ')' : ''} 고른 움직임은 칩셋에 따로 추가`)}
    ${row('size', g.size.checked, g.size.ok, '큰 판', ' 원본을 출발 그림으로 새 칸 수에 다시 그린다(늘리기 금지)', ` <input type="number" id="dvW" min="1" max="8" value="${g.size.w}">×<input type="number" id="dvH" min="1" max="8" value="${g.size.h}">칸`)}
    <textarea id="dvNote" placeholder="작업자에게 줄 메모(모든 파생에 같이 간다) — 예: 열린 상자 안에 금화가 보이게"></textarea>
    ${had.length ? `<div class="made">이미 만든 파생: ${had.map(x => esc(x.name)).join(' · ')} — 같은 것을 다시 주문하면 원본의 지금 그림으로 새 판을 연다</div>` : ''}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="dvX">닫기 (Esc)</button><button class="btn go" id="dvGo">선택한 파생 후보 만들기</button></div></div>`;
  document.body.append(bg);
  bg.onclick = e => { if (e.target === bg) closeDerive(); };
  $('#dvX').onclick = closeDerive;
  $('#dvGo').onclick = async () => {
    const on = k => bg.querySelector(`[data-k="${k}"]`)?.checked;
    const body = {id:g.id, facing:on('facing'), state:on('state') ? $('#dvState').value.trim() || g.state.label : '', loop:on('loop'),
                  size:on('size') ? [+$('#dvW').value, +$('#dvH').value] : null, note:$('#dvNote').value.trim()};
    if (!body.facing && !body.state && !body.loop && !body.size) { toast('하나는 체크하세요'); return; }
    $('#dvGo').disabled = true;
    try { const r = await api('/api/harness/derive', body); closeDerive(); S.suggestions = null; toast(`주문: ${r.made.map(x => x.name).join(' · ')} — 후보 ${DRAW_N}장씩 그리는 중`); load(true); }
    catch (e) { $('#dvGo').disabled = false; toast('파생 주문 실패: ' + e.message, 1); }
  };
}
// 제안은 자동 계산하지만 주문은 사용자가 확인한다(기존 세션의 C안).
async function loadDeriveHint(id) {
  const target = $('#deriveHint'); if (!target) return;
  try {
    const g = await api('/api/harness/derive/' + encodeURIComponent(id));
    if (!target.isConnected) return;
    const labels = {facing:'방향 4',state:g.state.label + ' 상태',loop:'움직임'};
    const keys = Object.keys(labels).filter(k => g[k].ok && g[k].checked);
    target.textContent = keys.length ? '자동 제안: ' + keys.map(k => labels[k] + (g.sets.some(x => x.derive === k) ? ' (이미 주문)' : '')).join(' · ') + ' ' : '자동 추천 항목이 없습니다. 방향·상태·움직임·크기를 직접 주문할 수 있습니다. ';
    const button = document.createElement('button'); button.className = 'chip'; button.textContent = '제안 확인·수정';
    button.onclick = () => openDerive(id, keys.some(k => !g.sets.some(x => x.derive === k)));
    target.append(button);
  } catch (e) { if (target.isConnected) target.textContent = '자동 제안을 못 읽었습니다: ' + e.message; }
}
const PROPOSAL_STATUS = {done:'선택 완료',drawing:'그리는 중',ready:'고를 차례',failed:'후보 생성 실패',ordered:'주문 있음'};
async function loadSuggestions() {
  const gen = ++S.suggestGen;
  if (!S.suggestions) { $('#nav').innerHTML = ''; $('#main').innerHTML = '<div class="empty">기존 기물의 파생을 자동으로 제안하는 중…</div>'; }
  try {
    const data = await api('/api/harness/suggestions');
    if (S.view !== 'suggest' || gen !== S.suggestGen) return;
    const changed = !S.suggestions || JSON.stringify(data) !== JSON.stringify(S.suggestions);
    S.suggestions = data;
    if (changed || !$('#suggestQ')) { const y = $('#main').scrollTop; renderSuggestions(); $('#main').scrollTop = y; }
  } catch (e) { if (S.view === 'suggest' && gen === S.suggestGen) $('#main').innerHTML = `<div class="empty">제안을 못 읽었습니다: ${esc(e.message)}<br>잠시 후 다시 읽습니다.</div>`; }
}
function renderSuggestions() {
  const data = S.suggestions, q = S.suggestQ.trim().toLowerCase();
  const rows = data.items.filter(o => (S.suggestHad || o.pending) && (S.suggestKind === 'all' || o.proposals.some(p => p.key === S.suggestKind)) &&
    (!q || (o.name + ' ' + o.id + ' ' + o.category).toLowerCase().includes(q)));
  $('#nav').innerHTML = `<h3>자동 파생 제안</h3><div class="empty" style="padding:12px">아직 주문하지 않은 기물 <b>${data.pending}</b>개<br>추천 파생을 이미 주문한 기물 ${data.alreadyOrdered}개<br><br>앉기·눕기 → 방향 4<br>열기·장치 → 상태 전환<br>불빛 → 반복 움직임<br><br>크기는 제안 확인 창에서 직접 추가합니다.</div>`;
  $('#main').innerHTML = `<div class="head"><h2>자동 파생 제안</h2></div>
    <p class="meta">원본의 쓰임새를 보고 필요한 파생을 먼저 제안합니다. 「제안 확인」에서 더하거나 빼고 주문하세요.</p>
    <div class="objtools"><input id="suggestQ" placeholder="기물 이름·분류로 찾기" value="${esc(S.suggestQ)}">
    <div class="cats">${[['all','전체'],['facing','방향'],['state','상태'],['loop','움직임']].map(([k,v])=>`<button data-skind="${k}" class="${S.suggestKind===k?'on':''}">${v}</button>`).join('')}</div>
    <label><input type="checkbox" id="suggestHad" ${S.suggestHad?'checked':''}> 이미 주문한 파생 포함</label></div>
    <div class="proposal-list">${rows.map(o=>`<article class="proposal" data-proposal="${esc(o.id)}"><div class="proposal-head"><img loading="lazy" src="${o.current==='v5'?thumbSrc(o):`/c/${o.slug}/${o.current}.png`}" alt="${esc(o.name)} 원본"><div><h3>${esc(o.name)}</h3><span class="meta">${esc(o.category)}</span></div></div>
      ${o.proposals.map(p=>`<div><b>${esc(p.title)}</b> ${p.existing.length?`<span class="chip">${p.existing.map(x=>PROPOSAL_STATUS[x.status]).join(' · ')}</span>`:'<span class="chip">새 제안</span>'}<p>${esc(p.reason)}</p></div>`).join('')}
      <button class="btn ${o.pending?'go':''}" data-propose="${esc(o.id)}">${o.pending?'제안 확인':'파생 보기·다시 주문'}</button></article>`).join('')}</div>
    ${rows.length?'':'<div class="empty">이 조건에 맞는 제안이 없습니다.</div>'}`;
  $('#suggestQ').oninput = e => { S.suggestQ = e.target.value; const p=e.target.selectionStart; renderSuggestions(); $('#suggestQ').focus(); $('#suggestQ').setSelectionRange(p,p); };
  $('#suggestHad').onchange = e => { S.suggestHad = e.target.checked; renderSuggestions(); };
  $('#main').querySelectorAll('[data-skind]').forEach(b=>b.onclick=()=>{S.suggestKind=b.dataset.skind;renderSuggestions();});
  $('#main').querySelectorAll('[data-propose]').forEach(b=>b.onclick=()=>openDerive(b.dataset.propose,!!data.items.find(o=>o.id===b.dataset.propose).pending));
  renderBar();
}
// 움직임 묶음: 고른 띠에서 프레임을 잘라 돌려 본다(카드 밑 작은 캔버스)
function startAnims(m, it) {
  clearInterval(S._anim);
  if (!it.set || it.set.derive !== 'loop') return;
  const L = [];
  m.querySelectorAll('.card:not(.cur) img[data-loop]').forEach(img => {   // 출발 그림(원본만 복사한 띠)은 움직임이 없다
    const cv = document.createElement('canvas'); cv.className = 'anim'; cv.title = '움직임 미리보기'; img.closest('.pic').after(cv);
    const go = () => { const z = Math.max(1, Math.round(img.getBoundingClientRect().width / img.naturalWidth)), f = it.set.slots[0];
      cv.width = f.w * z; cv.height = f.h * z; L.push({img, cv, z}); };
    img.addEventListener('fitted', go, {once:true}); if (img.complete && img.naturalWidth && img.style.width) go();
  });
  let k = 0;
  S._anim = setInterval(() => { k++; for (const a of L) { const f = it.set.slots[k % it.set.slots.length], c = a.cv.getContext('2d');
    c.imageSmoothingEnabled = false; c.clearRect(0, 0, a.cv.width, a.cv.height); c.drawImage(a.img, f.x, f.y, f.w, f.h, 0, 0, f.w * a.z, f.h * a.z); } }, it.set.ms || 150);
}

async function loadObjs() { if (!S.objs) S.objs = await api('/api/harness/objects'); renderObjs(); }
function renderObjs() {
  const cats = ['전체', ...new Set(S.objs.map(o => o.category))];
  const q = S.q.trim().toLowerCase();
  const L = S.objs.filter(o => (S.cat === '전체' || o.category === S.cat) && (!q || (o.name + ' ' + o.id + ' ' + o.desc).toLowerCase().includes(q)));
  $('#nav').innerHTML = `<h3>고른 기물 · ${S.objSel.size}</h3>` + [...S.objSel].map(id => { const o = S.objs.find(x => x.id === id);
    return `<div class="it" data-un="${esc(id)}"><span class="th">${thumbImg(o)}</span><span class="n">${esc(o.name)}</span><span class="b drawing">빼기</span></div>`; }).join('');
  $('#nav').querySelectorAll('[data-un]').forEach(e => e.onclick = () => { S.objSel.delete(e.dataset.un); renderObjs(); });
  $('#main').innerHTML = `<div class="objtools"><input id="q" placeholder="찾기 — 이름·영문 id·설명" value="${esc(S.q)}">
     <div class="cats">${cats.map(c => `<button data-cat="${esc(c)}" class="${S.cat === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div></div>
     <div class="objs">` + L.map(o => `<div class="obj ${S.objSel.has(o.id) ? 'on' : ''}" data-id="${esc(o.id)}" title="${esc(o.desc)}">
       ${o.rounds ? `<span class="rb">판 ${o.rounds}</span>` : ''}<span class="ck">✓</span>
       <div class="pic">${o.isNew && o.current === 'v5' ? `<div class="newpic">새 기물<br><small>${esc((o.use || []).join(' · '))}</small></div>` : `<img data-src="${thumbSrc(o)}">`}</div><div class="nm">${o.isNew ? '<b class="nb">새</b> ' : ''}${esc(o.name)}</div></div>`).join('') + `</div>
     <div class="keys">기물을 눌러 고르고(여러 개 가능), 아래에서 메모를 달고 「후보 ${DRAW_N}장씩 뽑기」. 기물마다 작업자 ${DRAW_N}명(${esc(S.data?.pool?.model || '')})이 방향을 나눠 한 장씩 찍는다. 찍은 뒤 독립 검수자가 3/4 를 보고, 떨어지면 다시 그린다.</div>`;
  $('#main').querySelectorAll('.obj img').forEach(img => { sized(img, 3); img.src = img.dataset.src; });
  const qi = $('#q'); qi.oninput = e => { S.q = e.target.value; const p = qi.selectionStart; renderObjs(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $('#main').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderObjs(); });
  $('#main').querySelectorAll('.obj').forEach(e => e.onclick = () => { const id = e.dataset.id; S.objSel.has(id) ? S.objSel.delete(id) : S.objSel.add(id); renderObjs(); });
  renderBar();
}
async function startDraw() {
  const ids = [...S.objSel]; if (!ids.length) return;
  try {
    await api('/api/harness/draw', {ids, note:S.memo.trim(), n:DRAW_N});
    toast(`${ids.length}개 기물 — 후보 ${DRAW_N}장씩 뽑기 시작`); S.objSel.clear(); S.memo = ''; S.objs = null;
    setView('pick'); setTimeout(() => load(), 1500);
  } catch (e) { toast('실패: ' + e.message, 1); }
}

function setView(v) {
  saveDraft(); S.view = v; document.body.dataset.view=v; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  if (v === 'objs') loadObjs(); else if (v === 'suggest') { renderBar(); loadSuggestions(); } else { renderNav(); renderPick(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.v));

document.addEventListener('keydown', e => {
  if (document.querySelector('.dlgbg')) { if (e.key === 'Escape') closeDerive(); return; }
  if (S.view !== 'pick' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'z' || e.key === 'Z') { if (S.lastUndo) undo(); else toast('되돌릴 것이 없다(5초가 지나면 서버에 보낸다)'); return; }
  if (e.target.closest('button,select,summary,a')&&['Enter',' '].includes(e.key))return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const L = [...$('#nav').querySelectorAll('.it')].map(x => x.dataset.id); const i = L.indexOf(S.cur);
    const n = L[i < 0 ? 0 : (i + (e.key === 'ArrowDown' ? 1 : -1) + L.length) % L.length]; if (n) { openItem(n); renderNav(); renderPick(); $('#main').scrollTop = 0; }
    return;
  }
  // 「다음 판 기다리는 중」 화면에선 판 키를 받지 않는다 — 예전엔 방금 끝낸 기물에 또 확정·다시 뽑기를 보냈다
  const it = item(); if (!it || S.waitNext) return; const r = rnd(); const cur = it.current === 'v5' ? 'v5' : it.current;
  if (e.key === ' ') { e.preventDefault(); const b = document.getElementById('cmpB'); if (b && !S.flip) { S.flip = true; b.dataset.o = b.src; b.src = curSrc(it); } return; }
  if (/^[0-9]$/.test(e.key) && +e.key === r.runs.length + 1) { redraw(); return; }
  if (/^[0-9]$/.test(e.key)) { const k = +e.key; if (k === 0) { S.sel = cur; } else { const x = r.runs[k - 1]; if (x && x.status === 'done') { S.sel = S.sel === x.cand && x.ok && !NOSEL.has(it.kind) && x.selDiff >= SEL_MIN ? x.cand + '.sel' : x.cand; delete S.rej[S.sel]; } } renderPick(); }
  else if (e.key === 'Enter') confirmSel();
  else if (e.key === 'x' || e.key === 'X') { if (S.sel && S.sel !== cur) toggleRej(S.sel); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); S.memoOpen=true;$('#bar').classList.add('memo-open');$('#memoToggle')?.setAttribute('aria-expanded','true');$('#memo')?.focus(); }
  else if (e.key === 'd' || e.key === 'D') { if (canDerive(it)) openDerive(it.id); else toast('파생은 원본 기물에서 — 그림이 있는 기물만'); }
  else if (e.key === 'v' || e.key === 'V') { S.mode = {both:'one', one:'ctx', ctx:'both'}[S.mode]; renderPick(); }
  else if (e.key === 'b' || e.key === 'B') { S.bg = {wood:'dark', dark:'check', check:'wood'}[S.bg]; renderPick(); }
  else if (e.key === '+' || e.key === '=') { S.zoom = {fit:3, 3:4, 4:6, 6:8, 8:8}[S.zoom]; renderPick(); }
  else if (e.key === '-') { S.zoom = {fit:'fit', 3:'fit', 4:3, 6:4, 8:6}[S.zoom]; renderPick(); }
  else if (e.key === 'f' || e.key === 'F') { S.zoom = 'fit'; renderPick(); }
});
document.addEventListener('keyup', e => { if (e.key === ' ' && S.flip) { S.flip = false; const b = document.getElementById('cmpB'); if (b && b.dataset.o) b.src = b.dataset.o; } });
$('#cDoneBtn').onclick = toggleDone;
load();
</script>

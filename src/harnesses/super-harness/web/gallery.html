<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈퍼하네스</title>
<style>
:root{--bg:#141619;--card:#1d2025;--line:#2c3037;--ink:#ececee;--dim:#9a9fa8;--ok:#5cbf83;--run:#5aaed0;--wait:#d6a24a;--bad:#e06a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Pretendard","Noto Sans KR",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0 8px 0 0}
#line{color:var(--dim)}
#pause{margin-left:auto}
button{background:#2a2e35;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#4a505a}
.tabs{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:16px 20px 40px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.c:hover{border-color:#4a505a}
.c .pic{aspect-ratio:4/3;background:#0e0f11;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px}
.c .pic img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.c .t{padding:10px 12px 12px}
.c b{font-size:15px}
.c .s{font-size:12px;margin:2px 0 4px}
.c .a{font-size:12px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s.done{color:var(--ok)} .s.work{color:var(--run)} .s.wait{color:var(--wait)} .s.stop{color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--run);margin-right:5px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.empty{color:var(--dim);padding:40px 20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:1000px;width:100%;padding:20px 22px}
.box h2{margin:0 0 2px;font-size:20px}
.box .about{color:var(--ink);margin:10px 0}
.box .muted{color:var(--dim);font-size:13px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:12px 0}
.pics figure{margin:0}
.pics img{width:100%;border-radius:6px;background:#0e0f11;cursor:zoom-in}
.pics figcaption{font-size:12px;color:var(--dim)}
.box h3{font-size:14px;margin:16px 0 6px}
.box ul{margin:0;padding-left:18px}
.box li{margin:2px 0}
textarea{width:100%;min-height:70px;background:#121418;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.primary{background:#2d5d8a;border-color:#2d5d8a}
.danger{background:#5a2a26;border-color:#5a2a26}
.close{float:right}
#big{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;overflow:auto;cursor:zoom-out}
#big.on{display:block}
#big img{display:block;margin:20px auto;max-width:none;image-rendering:pixelated}
a{color:var(--run)}
</style>
</head>
<body>
<header>
  <h1>슈퍼하네스</h1>
  <span id="line">불러오는 중…</span>
  <button id="pause"></button>
</header>
<div class="tabs" id="tabs"></div>
<main id="grid"></main>
<div id="modal"><div class="box" id="box"></div></div>
<div id="big"><img></div>
<script>
const TABS = [['all', '전체'], ['done', '완성'], ['work', '만드는 중'], ['wait', '기다림'], ['stop', '막힘·폐기']];
let L = null, tab = localStorage.getItem('sh-tab') || 'all', openId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thumb = (im, w) => `/thumb?p=${encodeURIComponent(im.path)}&w=${w}&v=${im.v}`;
const cards = new Map();

function cardHtml(it) {
  return `<div class="pic">${it.thumb ? `<img loading="lazy" src="${thumb(it.thumb, 360)}" alt="">` : '아직 그림 없음'}</div>
    <div class="t"><b>${esc(it.title)}</b><div class="s ${it.group}">${it.running ? '<span class="dot"></span>' : ''}${esc(it.status)}</div><div class="a">${esc(it.about)}</div></div>`;
}

function render() {
  const n = (g) => L.items.filter((i) => g === 'all' || i.group === g).length;
  $('tabs').innerHTML = TABS.map(([k, t]) => `<button class="${k === tab ? 'on' : ''}" onclick="setTab('${k}')">${t} ${n(k)}</button>`).join('');
  const order = { work: 0, wait: 1, done: 2, stop: 3 };
  const list = L.items.filter((i) => tab === 'all' || i.group === tab)
    .sort((a, b) => (order[a.group] - order[b.group]) || (b.updated > a.updated ? 1 : -1));
  const grid = $('grid');
  if (!list.length) { grid.innerHTML = '<p class="empty">없다</p>'; cards.clear(); return; }
  if (grid.querySelector('.empty')) grid.innerHTML = '';
  const keep = new Set(list.map((i) => i.id));
  for (const [id, el] of cards) if (!keep.has(id)) { el.remove(); cards.delete(id); }
  list.forEach((it, idx) => {
    const key = JSON.stringify([it.title, it.status, it.about, it.running, it.thumb?.v, it.group]);
    let el = cards.get(it.id);
    if (!el) { el = document.createElement('div'); el.className = 'c'; el.onclick = () => openConcept(it.id); cards.set(it.id, el); }
    if (el.dataset.k !== key) { el.innerHTML = cardHtml(it); el.dataset.k = key; }
    if (grid.children[idx] !== el) grid.insertBefore(el, grid.children[idx] || null);
  });
}

function setTab(k) { tab = k; localStorage.setItem('sh-tab', k); render(); }

async function refresh() {
  if (document.hidden) return;
  try { L = await (await fetch('/api/list')).json(); } catch { return; }
  const work = L.items.filter((i) => i.running).length, done = L.items.filter((i) => i.group === 'done').length;
  $('line').textContent = `${L.paused ? '멈춤' : '자동으로 도는 중'} · 지금 ${work}개 작업 · 완성 ${done}개 · 전체 ${L.items.length}개`;
  $('pause').textContent = L.paused ? '▶ 다시 돌리기' : '❚❚ 멈추기';
  $('pause').onclick = () => post({ action: L.paused ? 'resume' : 'pause' });
  render();
}

async function openConcept(id) {
  openId = id;
  const d = await (await fetch('/api/concept?id=' + encodeURIComponent(id))).json();
  const pics = (list) => list.map((im) => `<figure><img loading="lazy" src="${thumb(im, 900)}" data-full="/data/${encodeURI(im.path)}" onclick="big(this)"><figcaption>${esc(im.label)}</figcaption></figure>`).join('');
  $('box').innerHTML = `
    <button class="close" onclick="closeModal()">닫기</button>
    <h2>${esc(d.title)}</h2>
    <div class="muted">${esc(d.status)}${d.parent ? ` · 「${esc(d.parent)}」의 하위` : ''}${d.pr ? ` · <a href="${esc(d.pr)}" target="_blank">PR</a>` : ''}</div>
    <p class="about">${esc(d.about)}</p>
    ${d.variants.length ? `<div class="muted">${d.variants.map(esc).join('<br>')}</div>` : ''}
    ${d.images.length ? `<div class="pics">${pics(d.images)}</div>` : '<p class="muted">아직 그림이 없다.</p>'}
    ${d.tried.length ? `<h3>조수에게 「만들어줘」라고 시켜 본 결과</h3><div class="pics">${pics(d.tried)}</div>` : ''}
    ${d.why.length ? `<h3>지금 고치는 이유</h3><ul>${d.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    ${d.orders.length ? `<h3>주문한 그림 ${d.orders.length}건</h3><ul>${d.orders.map((o) => `<li><b>${esc(o.ko)}</b> ${esc(o.size)} — ${esc(o.desc)}</li>`).join('')}</ul>` : ''}
    ${d.children.length ? `<h3>여기서 자란 것</h3><div class="muted">${d.children.map((k) => esc(k.title)).join(' · ')}</div>` : ''}
    ${d.feedback.length ? `<h3>내가 준 교정</h3><ul>${d.feedback.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
    <h3>교정</h3>
    <textarea id="fix" placeholder="마음에 안 드는 점, 이렇게 고쳐라"></textarea>
    <div class="acts"><button class="primary" onclick="act('fix')">교정 지시</button><button class="danger" onclick="act('discard')">폐기</button></div>`;
  $('modal').classList.add('on');
}

function closeModal() { $('modal').classList.remove('on'); openId = null; }
$('modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
document.onkeydown = (e) => { if (e.key === 'Escape') { if ($('big').classList.contains('on')) $('big').classList.remove('on'); else closeModal(); } };
function big(img) { $('big').querySelector('img').src = img.dataset.full; $('big').classList.add('on'); }
$('big').onclick = () => $('big').classList.remove('on');

async function act(kind) {
  const text = $('fix')?.value ?? '';
  if (kind === 'discard' && !confirm('폐기할까요? 이미 들어간 것이면 에디터에서 뺍니다.')) return;
  await post({ cid: openId, action: kind, text });
  closeModal();
}
async function post(body) {
  const r = await (await fetch('/api/action', { method: 'POST', body: JSON.stringify(body) })).json();
  if (!r.ok) alert(r.error);
  refresh();
}

refresh();
setInterval(refresh, 15000);
document.addEventListener('visibilitychange', refresh);
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 GIF 공방</title>
<style>
:root{color-scheme:dark;--bg:#15171b;--panel:#202329;--line:#343943;--dim:#a3aab6;--fg:#edf0f5;--green:#88d9a1;--red:#f19f9a;--accent:#a2baff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);padding:9px 14px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.keep{background:#224831;color:var(--green);border-color:#407755}.trash{background:#482d2e;color:var(--red);border-color:#785253}button.on{border-color:var(--accent);color:var(--accent)}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}p{margin:5px 0;color:var(--dim)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{position:sticky;top:0;z-index:2;padding:12px 28px;background:#15171bf2;border-bottom:1px solid var(--line)}input,select,textarea{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}select{max-width:260px}#search{max-width:200px}#stats{color:var(--dim);margin-left:auto}.production{margin:16px 28px 0;background:var(--panel);padding:12px 16px;border:1px solid var(--line);border-radius:10px}.production strong{font-weight:500}.progress{height:5px;background:var(--line);margin:9px 0;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}main{padding:22px 28px 80px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:16px}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.card-head{display:flex;justify-content:space-between;padding:12px 16px;gap:8px;align-items:center}.card-head h2{font-size:15px;margin:0}.badge{font-size:12px;color:var(--dim);white-space:nowrap}.card.kept{border-color:#407755}.card.rejected{opacity:.7;border-color:#785253}.walk{display:block;width:100%;image-rendering:pixelated;background:#557b3b;min-height:120px;object-fit:contain}.waiting{display:grid;place-items:center;height:160px;color:var(--dim)}.card-foot{padding:12px 16px;display:flex;gap:8px}.card-foot .keep,.card-foot .trash{flex:1}.inspect{padding:10px 16px}.inspect img{display:block;image-rendering:pixelated;max-width:100%;margin:8px 0}.inspect .sheet{width:144px}.inspect summary{cursor:pointer;color:var(--dim)}.empty{padding:65px 10px;text-align:center;color:var(--dim)}#notice{color:var(--accent);min-height:22px;padding:0 28px}.error{color:var(--red)!important}.modal{position:fixed;inset:0;background:#000b;z-index:5;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.modal form{width:min(540px,100%);max-height:95vh;overflow:auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px}.modal h2{margin:0;font-size:20px}.modal label{display:grid;gap:6px;color:var(--dim)}textarea{min-height:85px;resize:vertical}.prev{image-rendering:pixelated;max-height:180px;max-width:100%;object-fit:contain}.focus .gallery{max-width:640px;margin:auto;grid-template-columns:1fr}.focus .card-foot{position:sticky;bottom:0;background:var(--panel)}kbd{font:11px system-ui;color:var(--dim)}a{color:var(--accent)}@media(max-width:650px){header,.toolbar{padding:14px}main{padding:16px 14px 60px}.production{margin:14px 14px 0}#stats{margin-left:0;width:100%}.toolbar .row{gap:6px}button{padding:8px 10px}.gallery{gap:14px}}
</style>
</head>
<body>
<header><div><h1>캐릭터 GIF 공방</h1><p>AI가 만들면, GIF를 보고 남기거나 폐기하세요.</p></div><div class="row"><button id="download">남긴 캐릭터 다운로드</button><button class="keep" id="generate">새 캐릭터 만들기</button></div></header>
<section class="toolbar"><div class="row"><div id="tabs" class="row"><button data-tab="todo" class="on">검토 대기</button><button data-tab="accept">남김</button><button data-tab="reject">폐기</button><button data-tab="all">전체</button></div><select id="runs" aria-label="실행 선택"><option value="all">모든 실행</option></select><input id="search" type="search" placeholder="캐릭터 찾기" aria-label="캐릭터 검색"><button id="view">하나씩 보기</button><span id="stats"></span></div></section>
<div id="production"></div><p id="notice" role="status" aria-live="polite"></p>
<main id="main"><p class="empty">GIF 불러오는 중…</p></main>
<div class="modal" id="modal" hidden><form id="form"><h2>AI 자유 저작</h2><p>GPT 6.1 sol high가 인물과 복식을 정하고 걷는 GIF를 만듭니다.</p><label>몇 명 만들까요?<input id="count" type="number" min="1" max="500" value="100" required></label><label>전체 방향 (선택)<textarea id="prompt" placeholder="비우면 한국풍·판타지·현대·SF를 섞어 자유롭게 만듭니다."></textarea></label><label>참고 캐릭터 시트 (선택)<input id="file" type="file" accept="image/png,image/gif,image/bmp"></label><p>72×128 한 명 / 288×256 여덟 명. 비우면 기본 캐릭터를 뼈대로 만듭니다.</p><img id="preview" class="prev" hidden><div class="row"><button class="keep" id="start" type="submit">생성 시작</button><button id="close" type="button">닫기</button></div><p id="formMsg" role="status"></p></form></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
let state={items:[],runs:[]}, tab=['todo','accept','reject','all'].includes(params.get('show'))?params.get('show'):'todo', run=params.get('run')||'all', focus=params.get('view')==='detail', current=null, query='', image=null, busy=false, loading=false, initial=true;
const seen=new Set();
const binding=it=>Object.fromEntries(['version','sourceSha256','baseSha256','strength'].map(k=>[k,it.gate?.[k]]));
const url=(it,file)=>`/f/${encodeURIComponent(it.run)}/${encodeURIComponent(it.dir)}/${file}?t=${encodeURIComponent(it.gate?.sourceSha256||'')}`;
const name=it=>it.desc?.label||it.name;
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
async function post(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'저장 실패');return result}
function scoped(){return state.items.filter(it=>run==='all'||it.run===run)}
function visible(){return scoped().filter(it=>{const decision=it.decision?.decision;if(tab==='todo'&&(decision||it.status!=='done'))return false;if(tab==='accept'&&decision!=='accept')return false;if(tab==='reject'&&decision!=='reject')return false;return [name(it),it.desc?.appearance,it.desc?.role,...(it.desc?.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase())})}
async function load(){if(loading)return;loading=true;try{const response=await fetch('/api/state');if(!response.ok)throw Error('불러오기 실패');state=await response.json();if(initial){initial=false;if(!params.has('run')&&state.runs.length)run=state.runs[0].run}render()}catch(error){notice(error.message,true)}finally{loading=false}}
function render(){
  const all=scoped(), kept=all.filter(it=>it.decision?.decision==='accept').length, rejected=all.filter(it=>it.decision?.decision==='reject').length, todo=all.filter(it=>it.status==='done'&&!it.decision).length;
  $('stats').textContent=`대기 ${todo} · 남김 ${kept} · 폐기 ${rejected}`;
  $('download').disabled=!kept||busy;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const runs=[...new Set([...state.runs.map(r=>r.run),...state.items.map(it=>it.run)])];
  const opts='<option value="all">모든 실행</option>'+runs.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');
  if($('runs').innerHTML!==opts)$('runs').innerHTML=opts;$('runs').value=run;
  $('view').textContent=focus?'모아 보기':'하나씩 보기';$('main').classList.toggle('focus',focus);
  const phase={running:'AI가 그리는 중',pausing:'현재 묶음 완성 후 일시 정지',paused:'일시 정지됨',completed:'생성 작업 종료',failed:'작업 오류',interrupted:'작업 중단됨'};
  $('production').innerHTML=state.runs.filter(r=>run==='all'||r.run===run).slice(0,run==='all'?3:1).map(r=>`<section class="production"><div class="row"><strong>${esc(phase[r.phase]||r.phase)} · ${r.ready}/${r.planned}명 GIF</strong><span class="badge">결손 차단 ${r.blocked}명</span><button data-control="${r.phase==='running'?'pause':'resume'}" data-run="${esc(r.run)}" ${r.phase==='pausing'||r.phase==='completed'?'disabled':''}>${r.phase==='running'||r.phase==='pausing'?'일시 정지':'이어 만들기'}</button></div><div class="progress"><i style="width:${r.ready/Math.max(1,r.planned)*100}%"></i></div>${r.error?`<p class="error">${esc(r.error)}</p>`:''}<p>완성되는 대로 이곳에 나타납니다. 결손 차단 후보는 검토 대기열에 넣지 않습니다.</p></section>`).join('');
  $('production').querySelectorAll('[data-control]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await post('/api/'+b.dataset.control,{run:b.dataset.run});notice(b.dataset.control==='pause'?'현재 묶음이 끝나면 생성을 멈춥니다.':'생성을 재개했습니다.');await load()}catch(e){notice(e.message,true);b.disabled=false}});
  let rows=visible();if(focus){if(!rows.some(it=>it.id===current))current=rows[0]?.id;rows=rows.filter(it=>it.id===current)}
  const existing=new Map([...$('main').querySelectorAll('[data-card]')].map(el=>[el.dataset.card,el]));
  if(!rows.length){$('main').innerHTML=`<div class="empty">${tab==='todo'?'지금 검토할 GIF가 없습니다. 새 캐릭터가 완성되면 여기에 나타납니다.':'표시할 캐릭터가 없습니다.'}</div>`;return}
  if(!$('main').querySelector('.gallery'))$('main').innerHTML='<div class="gallery"></div>';
  const gallery=$('main').querySelector('.gallery');const ids=new Set(rows.map(it=>it.id));for(const [id,el]of existing)if(!ids.has(id))el.remove();
  for(const it of rows){const key=JSON.stringify([it.status,it.gate?.sourceSha256,it.render_fresh,it.decision,it.desc,it.quality]);let card=existing.get(it.id);if(card?.dataset.version===key)continue;
    const d=it.decision?.decision, ready=it.status==='done'&&it.render_fresh, canKeep=ready&&it.gate?.ok&&(it.review_mode==='human'?true:it.review&&!it.review.stale&&!it.review.discard&&!it.review.fatal?.length);
    const html=`<div class="card-head"><h2>${esc(name(it))}</h2><span class="badge">${d==='accept'?'남김':d==='reject'?'폐기':ready?'검토 대기':it.status==='running'?'그리는 중':'작업 미완료'}</span></div>${ready?`<img class="walk" src="${url(it,'views/walk.gif')}" alt="${esc(name(it))} 네 방향 걷기 GIF">`:`<div class="waiting">${it.status==='running'?'GIF를 만드는 중…':'아직 완성된 GIF가 없습니다'}</div>`}<div class="card-foot"><button class="keep" data-action="accept" ${!canKeep?'disabled':''}>남기기 <kbd>A</kbd></button><button class="trash" data-action="reject" ${!ready?'disabled':''}>폐기 <kbd>R</kbd></button>${d?'<button data-action="clear" title="이 선택 되돌리기">되돌리기</button>':''}</div>${ready?`<details class="inspect"><summary>게임 속 걷기 · 원본 비교 · 시트</summary><img src="${url(it,'views/stroll.gif')}" alt="칸 위를 걷기"><p>${esc(it.desc?.appearance||'')}</p><p>원본</p><img src="${url(it,'base-views/walk.gif')}" alt="원본 네 방향 걷기"><img class="sheet" src="${url(it,'views/sheet.png')}" alt="12프레임 시트">${it.review_mode==='legacy'?'<p>이전 검수 방식으로 만든 후보입니다.</p>':''}${it.decision_stale?'<p class="error">그림이 바뀌어 이전 선택을 다시 확인해야 합니다.</p>':''}</details>`:''}`;
    if(!card){card=document.createElement('article');card.dataset.card=it.id;gallery.append(card)}card.className='card'+(d==='accept'?' kept':d==='reject'?' rejected':'');card.dataset.version=key;card.innerHTML=html;
    card.querySelector('.walk')?.addEventListener('load',()=>seen.add(it.id+':'+it.gate.sourceSha256),{once:true});
    card.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>decide(it,b.dataset.action));
  }
}
async function decide(it,decision){if(busy)return;if(decision!=='clear'&&!seen.has(it.id+':'+it.gate.sourceSha256)){notice('GIF를 불러온 다음 결정해 주세요.',true);return}busy=true;const rows=visible(),idx=rows.findIndex(i=>i.id===it.id);try{await post('/api/decide',{id:it.id,decision,inspected:binding(it)});current=rows[idx+1]?.id||rows[idx-1]?.id;notice(`${name(it)} · ${decision==='accept'?'남겼습니다':decision==='reject'?'폐기했습니다':'선택을 되돌렸습니다'}`);await load()}catch(error){notice(error.message,true)}finally{busy=false;render()}}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;current=null;render()});$('runs').onchange=()=>{run=$('runs').value;current=null;render()};$('search').oninput=()=>{query=$('search').value;current=null;render()};$('view').onclick=()=>{focus=!focus;current=null;render()};
$('download').onclick=async()=>{if(busy)return;busy=true;$('download').disabled=true;notice('남긴 캐릭터를 묶는 중…');try{const result=await post('/api/export',{run});const link=document.createElement('a');link.href=result.url;link.download='';link.click();notice(`${result.count}명 다운로드 팩을 만들었습니다.`)}catch(e){notice(e.message,true)}finally{busy=false;render()}};
$('generate').onclick=()=>{$('modal').hidden=false;$('formMsg').textContent='';$('count').focus()};$('close').onclick=()=>{$('modal').hidden=true};$('file').onchange=()=>{const file=$('file').files[0];image=null;$('preview').hidden=true;if(!file)return;const reader=new FileReader();reader.onload=()=>{image=reader.result;$('preview').src=image;$('preview').hidden=false};reader.readAsDataURL(file)};
$('form').onsubmit=async event=>{event.preventDefault();$('start').disabled=true;$('formMsg').textContent='자유 저작을 시작하는 중…';try{const result=await post('/api/produce',{count:Number($('count').value),prompt:$('prompt').value,image});run=result.run;tab='todo';current=null;$('modal').hidden=true;notice(`${result.count}명 생성 시작. 완성된 GIF부터 검토할 수 있습니다.`);await load()}catch(e){$('formMsg').textContent=e.message}finally{$('start').disabled=false}};
addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape')$('modal').hidden=true;return}if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||busy)return;const rows=visible(),it=focus?rows.find(i=>i.id===current):rows[0];if(!it)return;if(e.key.toLowerCase()==='a'){e.preventDefault();decide(it,'accept')}else if(e.key.toLowerCase()==='r'){e.preventDefault();decide(it,'reject')}else if(focus&&['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();const idx=rows.findIndex(i=>i.id===current),step=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;current=rows[Math.max(0,Math.min(rows.length-1,idx+step))].id;render()}});
load();setInterval(()=>{if($('modal').hidden&&!busy)load()},5000);
</script>
</body>
</html>

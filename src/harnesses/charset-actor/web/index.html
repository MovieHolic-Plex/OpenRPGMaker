<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 GIF 공방</title>
<style>
:root{color-scheme:dark;--bg:#15171b;--panel:#202329;--line:#343943;--dim:#a3aab6;--fg:#edf0f5;--green:#88d9a1;--red:#f19f9a;--accent:#a2baff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);padding:9px 14px}
button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.keep{background:#224831;color:var(--green);border-color:#407755}.trash{background:#482d2e;color:var(--red);border-color:#785253}button.on{border-color:var(--accent);color:var(--accent)}
header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}p{margin:5px 0;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{padding:10px 28px;border-bottom:1px solid var(--line)}
input,select,textarea{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}select{max-width:260px}#search{max-width:200px}#stats{color:var(--dim);margin-left:auto}
.production{margin:10px 28px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px}.production strong{font-weight:500}.production button{padding:4px 10px}

main{max-width:1240px;margin:auto;padding:10px 28px 24px;outline:none}.review-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.review-nav p{margin:0}.review-nav button{padding:6px 12px}
.gallery{display:block}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel)}.card-head{display:flex;justify-content:space-between;padding:16px 20px 8px;gap:12px;align-items:center}.card-head h2{font-size:23px;margin:0}.badge{font-size:12px;color:var(--dim);white-space:nowrap}
.card.kept{border-color:#407755}.card.rejected{border-color:#785253}.preview-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;padding:8px 20px 16px}
figure{margin:0;min-width:0}figcaption{color:var(--dim);margin-bottom:8px;font-size:13px}.direction-labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:6.6667%;color:var(--fg);text-align:center;margin-bottom:8px}
.walk-stage,.stroll-stage{display:grid;place-items:center;min-height:240px;border:1px solid #426035;border-radius:10px;overflow:hidden;background:#292c35}
.preview-controls{padding:0 20px 8px}.preview-controls button{padding:5px 10px}.preview-controls span{color:var(--dim);font-size:12px}
.walk,.stroll{display:block;width:100%;height:auto;image-rendering:pixelated}.stroll{max-width:336px}.waiting{display:grid;place-items:center;height:240px;color:var(--dim)}
.card-foot{position:sticky;bottom:0;z-index:1;padding:14px 20px;display:flex;gap:12px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 14px 14px}.card-foot .keep,.card-foot .trash{flex:1;font-size:18px;padding:13px 18px}
.description{padding:0 20px 12px}.description p{margin:0}.inspect{padding:0 20px 14px}.inspect img{display:block;image-rendering:pixelated;max-width:100%;margin:8px 0}.inspect .sheet{width:216px;background:repeating-conic-gradient(#e141d2 0% 25%,#2d3039 0% 50%) 0 / 24px 24px}.inspect summary{cursor:pointer;color:var(--dim)}
.empty{padding:65px 10px;text-align:center;color:var(--dim)}#notice{color:var(--accent);min-height:22px;padding:0 28px}.error{color:var(--red)!important}
.modal{position:fixed;inset:0;background:#000b;z-index:5;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.modal form{width:min(540px,100%);max-height:95vh;overflow:auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:grid;gap:12px}.modal h2{margin:0;font-size:20px}.modal label{display:grid;gap:6px;color:var(--dim)}textarea{min-height:85px;resize:vertical}.prev{image-rendering:pixelated;max-height:180px;max-width:100%;object-fit:contain}kbd{font:12px system-ui;color:var(--dim)}a{color:var(--accent)}
@media(max-width:700px){header,.toolbar{padding:10px 14px}header{gap:8px}header p{font-size:12px}header button{padding:7px 10px}main{padding:8px 14px 18px}.production{margin:8px 14px 0}#notice{padding:0 14px}#stats{margin-left:0;width:100%}.toolbar .row{gap:6px}button{padding:7px 9px}#runs{max-width:190px}#search{max-width:145px}.review-nav{font-size:12px;gap:6px}.review-nav button{padding:5px 9px}.card-head{padding:12px 12px 8px}.card-head h2{font-size:19px}.preview-grid{grid-template-columns:1fr;padding:4px 12px 10px;gap:10px}.walk-stage{min-height:0}.stroll-stage{min-height:0}.stroll{width:224px}.direction-labels{font-size:12px;margin-bottom:4px}figcaption{font-size:12px;margin-bottom:4px}.description,.inspect{padding:0 12px 10px}.description{font-size:12px}.card-foot{padding:10px 12px;gap:8px}.card-foot .keep,.card-foot .trash{font-size:16px;padding:10px}}
</style>
</head>
<body>
<header><div><h1>캐릭터 GIF 공방</h1><p>한 명씩 보고 남기거나 폐기하세요. 선택하면 바로 다음 캐릭터로 넘어갑니다.</p></div><div class="row"><button id="download">남긴 캐릭터 다운로드</button><button class="keep" id="generate">새 캐릭터 만들기</button></div></header>
<section class="toolbar"><div class="row"><div id="tabs" class="row"><button data-tab="todo" class="on">검토 대기</button><button data-tab="accept">남김</button><button data-tab="reject">폐기</button><button data-tab="all">전체</button></div><select id="runs" aria-label="실행 선택"><option value="all">모든 실행</option></select><input id="search" type="search" placeholder="캐릭터 찾기" aria-label="캐릭터 검색"><button id="undo" hidden>직전 선택 되돌리기</button><span id="saveStatus" role="status" aria-live="polite"></span><button id="saveRetry" hidden>저장 재시도</button><span id="stats"></span></div></section>
<div id="production"></div><p id="notice" role="status" aria-live="polite"></p>
<main id="main" tabindex="-1"><nav class="review-nav" aria-label="캐릭터 이동"><button id="previous" disabled>← 이전</button><p id="position" role="status">GIF 불러오는 중…</p><button id="next" disabled>다음 →</button></nav><div id="stage"><p class="empty">GIF 불러오는 중…</p></div></main>
<div class="modal" id="modal" hidden><form id="form"><h2>AI 자유 저작</h2><p>GPT 6.1 sol high가 인물과 복식을 정하고 걷는 GIF를 만듭니다.</p><label>몇 명 만들까요?<input id="count" type="number" min="1" max="500" value="100" required></label><label>전체 방향 (선택)<textarea id="prompt" placeholder="비우면 한국풍·판타지·현대·SF를 섞어 자유롭게 만듭니다."></textarea></label><label>참고 캐릭터 시트 (선택)<input id="file" type="file" accept="image/png,image/gif,image/bmp"></label><p>72×128 한 명 / 288×256 여덟 명. 비우면 기본 캐릭터를 뼈대로 만듭니다.</p><img id="preview" class="prev" hidden><div class="row"><button class="keep" id="start" type="submit">생성 시작</button><button id="close" type="button">닫기</button></div><p id="formMsg" role="status"></p></form></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
let state={items:[],runs:[]}, tab=['todo','accept','reject','all'].includes(params.get('show'))?params.get('show'):'todo', run=params.get('run')||'all', current=null, query='', image=null, busy=false, loading=false, initial=true, lastAction=null;
let reviewBackground='checker';try{reviewBackground=localStorage.getItem('charset-review-background')||'checker'}catch{}if(!['checker','white','black','lawn'].includes(reviewBackground))reviewBackground='checker';
const dismissed=new Set(), prefetched=new Set();
const seen=new Set(), confirmed=new Map(), OUTBOX_PREFIX='charset-review-mutation:', ACK_KEY='charset-review-last-ack';
const senderId=globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let outbox=[], flushing=false, retryTimer=null, ackVersion=0, lastSaveError='', syncDb=null;
function readOutbox(){const result=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key?.startsWith(OUTBOX_PREFIX))continue;try{const op=JSON.parse(localStorage.getItem(key));if(op&&typeof op.id==='string'&&['accept','reject','clear'].includes(op.decision)&&op.inspected&&typeof op.mutationId==='string')result.push(op)}catch{}}return result.sort((a,b)=>(a.queuedAt||0)-(b.queuedAt||0)||a.mutationId.localeCompare(b.mutationId))}
try{const old=JSON.parse(localStorage.getItem('charset-review-outbox-v1')||'[]');if(Array.isArray(old))old.forEach((op,i)=>{if(op?.mutationId)localStorage.setItem(OUTBOX_PREFIX+op.mutationId,JSON.stringify({...op,queuedAt:op.queuedAt||Date.now()+i}))});localStorage.removeItem('charset-review-outbox-v1');outbox=readOutbox()}catch{}
async function lease(action){
  if(!syncDb)syncDb=new Promise((resolve,reject)=>{const req=indexedDB.open('charset-review-sync',1);req.onupgradeneeded=()=>req.result.createObjectStore('locks');req.onsuccess=()=>resolve(req.result);req.onerror=()=>{syncDb=null;reject(req.error)}});
  const db=await syncDb;return new Promise((resolve,reject)=>{const tx=db.transaction('locks','readwrite'),store=tx.objectStore('locks'),req=store.get('sender');let granted=false;
    req.onsuccess=()=>{const lock=req.result;if(action==='release'){if(lock?.owner===senderId)store.delete('sender')}else if((action==='claim'&&(!lock||lock.until<Date.now()))||lock?.owner===senderId){granted=true;store.put({owner:senderId,until:Date.now()+20000},'sender')}};
    tx.oncomplete=()=>resolve(granted);tx.onerror=tx.onabort=()=>reject(tx.error||Error('저장 전송자를 준비하지 못했습니다'))});
}
function rememberAck(op,rec){const prior=confirmed.get(op.id);if(!prior||prior.queuedAt<op.queuedAt||(prior.queuedAt===op.queuedAt&&(prior.record.mutationId||'').localeCompare(op.mutationId)<0))confirmed.set(op.id,{record:rec,queuedAt:op.queuedAt,version:++ackVersion})}
function pendingFor(id){return outbox.findLast(op=>op.id===id)}
function displayed(it){const pending=pendingFor(it.id), saved=confirmed.get(it.id)?.record, overlay=pending||saved;
  if(!overlay||JSON.stringify(overlay.inspected)!==JSON.stringify(binding(it)))return it;
  return {...it,decision:overlay.decision==='clear'?null:overlay,save_pending:!!pending};}
function badge(it){return (it.decision?.decision==='accept'?'남김':it.decision?.decision==='reject'?'폐기':it.status==='done'?'검토 대기':it.status==='running'?'그리는 중':'작업 미완료')+(it.save_pending?' · 저장 중':'')}
function retrySave(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}lastSaveError='';flushDecisions()}
async function flushDecisions(){
  if(flushing||retryTimer||!outbox.length)return;flushing=true;render();let owned=false,heartbeat=null;
  try{owned=await lease('claim');if(!owned){retryTimer=setTimeout(()=>{retryTimer=null;flushDecisions()},500);return}
    heartbeat=setInterval(()=>{lease('renew').catch(()=>{})},5000);
    while((outbox=readOutbox()).length){const op=outbox[0];
      try{const rec=await post('/api/decide',op);if(!await lease('renew')){outbox=readOutbox();load();break}
        rememberAck(op,rec);localStorage.setItem(ACK_KEY,JSON.stringify({op,rec}));localStorage.removeItem(OUTBOX_PREFIX+op.mutationId);outbox=readOutbox();render();}
      catch(error){lastSaveError=error.message;
        if(error.status>=400&&error.status<500){localStorage.removeItem(OUTBOX_PREFIX+op.mutationId);outbox=readOutbox();if(!pendingFor(op.id))dismissed.delete(op.id+':'+JSON.stringify(op.inspected));if(lastAction?.mutationId===op.mutationId)lastAction=null;notice(`${op.label} · 저장하지 못해 선택을 되돌렸습니다: ${error.message}`,true);render();load();continue}
        notice('선택은 이 브라우저에 보관했습니다. 서버 저장을 재시도하는 중입니다.',true);retryTimer=setTimeout(()=>{retryTimer=null;flushDecisions()},2000);render();break;
      }
    }
  }catch(error){lastSaveError=error.message;notice('선택을 임시 보관했습니다. 저장 재시도를 눌러 주세요.',true)}
  finally{if(heartbeat)clearInterval(heartbeat);if(owned)await lease('release').catch(()=>{});flushing=false;render();if(!outbox.length){if(!lastSaveError)notice('선택을 모두 저장했습니다.');load()}}
}
addEventListener('storage',event=>{if(event.key===ACK_KEY&&event.newValue){try{const {op,rec}=JSON.parse(event.newValue);rememberAck(op,rec)}catch{}}if(event.key?.startsWith(OUTBOX_PREFIX)||event.key===ACK_KEY){outbox=readOutbox();render();flushDecisions();if(!outbox.length)load()}});
const binding=it=>Object.fromEntries(['version','sourceSha256','baseSha256','strength'].map(k=>[k,it.gate?.[k]]));
const imageKey=it=>it.id+':'+JSON.stringify(binding(it));
const url=(it,file)=>`/f/${encodeURIComponent(it.run)}/${encodeURIComponent(it.dir)}/${file}?t=${encodeURIComponent(JSON.stringify(binding(it)))}`;
const name=it=>it.desc?.label||it.name;
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
async function post(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:path==='/api/decide'?AbortSignal.timeout(12000):undefined});const result=await response.json();if(!response.ok){const error=Error(result.error||'저장 실패');error.status=response.status;throw error}return result}
function scoped(){return state.items.map(displayed).filter(it=>run==='all'||it.run===run)}
function visible(){return scoped().filter(it=>{if(dismissed.has(imageKey(it)))return false;const decision=it.decision?.decision;if(tab==='todo'&&(decision||it.status!=='done'))return false;if(tab==='accept'&&decision!=='accept')return false;if(tab==='reject'&&decision!=='reject')return false;return [name(it),it.desc?.appearance,it.desc?.role,...(it.desc?.tags||[])].join(' ').toLowerCase().includes(query.toLowerCase())})}
function move(step){const rows=visible(),idx=rows.findIndex(it=>it.id===current);if(!rows.length)return;current=rows[Math.max(0,Math.min(rows.length-1,idx+step))].id;render()}
const walkFile=it=>it.alpha_previews_fresh&&reviewBackground!=='lawn'?`views/walk_${reviewBackground}.gif`:'views/walk.gif';
function prefetch(it){if(!it||it.status!=='done'||!it.render_fresh||prefetched.has(imageKey(it)+reviewBackground))return;prefetched.add(imageKey(it)+reviewBackground);for(const file of [walkFile(it),'views/stroll.gif']){const img=new Image();img.src=url(it,file)}}
async function load(){if(loading)return;loading=true;try{const started=ackVersion;const response=await fetch('/api/state');if(!response.ok)throw Error('불러오기 실패');state=await response.json();for(const [id,receipt]of confirmed)if(receipt.version<=started)confirmed.delete(id);if(initial){initial=false;if(!params.has('run')&&state.runs.length)run=state.runs[0].run}render();flushDecisions()}catch(error){notice(error.message,true)}finally{loading=false}}
function render(){
  const all=scoped(), kept=all.filter(it=>it.decision?.decision==='accept').length, rejected=all.filter(it=>it.decision?.decision==='reject').length, todo=all.filter(it=>it.status==='done'&&!it.decision).length;
  $('stats').textContent=`대기 ${todo} · 남김 ${kept} · 폐기 ${rejected}`+(state.sharedLibraryError?' · 공용 등록 재시도 필요':state.sharedLibrary?` · 공용 ${state.sharedLibrary.count}명`:'');
  $('download').disabled=!kept||busy||!!outbox.length;
  $('saveStatus').textContent=outbox.length?`저장 ${lastSaveError?'대기':'중'} ${outbox.length}건`:'';
  $('saveRetry').hidden=!outbox.length||!lastSaveError;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const runs=[...new Set([...state.runs.map(r=>r.run),...state.items.map(it=>it.run)])];
  const opts='<option value="all">모든 실행</option>'+runs.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');
  if($('runs').innerHTML!==opts)$('runs').innerHTML=opts;$('runs').value=run;
  $('undo').hidden=!lastAction;
  const phase={running:'AI가 그리는 중',pausing:'현재 묶음 완성 후 일시 정지',paused:'일시 정지됨',completed:'생성 작업 종료',failed:'작업 오류',interrupted:'작업 중단됨'};
  $('production').innerHTML=state.runs.filter(r=>run==='all'||r.run===run).slice(0,run==='all'?3:1).map(r=>`<section class="production"><div class="row"><strong>${esc(phase[r.phase]||r.phase)} · ${r.ready}/${r.planned}명 GIF</strong><span class="badge">결손 차단 ${r.blocked}명</span>${r.phase==='completed'?'':`<button data-control="${r.phase==='running'?'pause':'resume'}" data-run="${esc(r.run)}" ${r.phase==='pausing'?'disabled':''}>${r.phase==='running'||r.phase==='pausing'?'일시 정지':'이어 만들기'}</button>`}</div><div class="progress"><i style="width:${r.ready/Math.max(1,r.planned)*100}%"></i></div>${r.error?`<p class="error">${esc(r.error)}</p>`:''}</section>`).join('');
  $('production').querySelectorAll('[data-control]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await post('/api/'+b.dataset.control,{run:b.dataset.run});notice(b.dataset.control==='pause'?'현재 묶음이 끝나면 생성을 멈춥니다.':'생성을 재개했습니다.');await load()}catch(e){notice(e.message,true);b.disabled=false}});
  const rows=visible();if(!rows.some(it=>it.id===current))current=rows[0]?.id;const idx=rows.findIndex(it=>it.id===current);
  $('position').textContent=rows.length?`${idx+1} / ${rows.length}명 · 한 번 선택하면 다음으로`:'현재 목록이 비었습니다';$('previous').disabled=idx<=0;$('next').disabled=idx<0||idx>=rows.length-1;
  const existing=new Map([...$('stage').querySelectorAll('[data-card]')].map(el=>[el.dataset.card,el]));
  if(!rows.length){$('stage').innerHTML=`<div class="empty">${tab==='todo'?'지금 검토할 GIF가 없습니다. 새 캐릭터가 완성되면 여기에 나타납니다.':'표시할 캐릭터가 없습니다.'}</div>`;return}
  if(!$('stage').querySelector('.gallery'))$('stage').innerHTML='<div class="gallery"></div>';
  const gallery=$('stage').querySelector('.gallery');for(const [id,el]of existing)if(id!==current)el.remove();prefetch(rows[idx+1]);
  for(const it of rows.filter(it=>it.id===current)){const key=JSON.stringify([it.status,binding(it),it.render_fresh,it.alpha_previews_fresh,reviewBackground,it.decision?.decision,it.desc,it.review?.stale,it.review?.discard]);let card=existing.get(it.id);if(card?.dataset.version===key){card.querySelector('.badge').textContent=badge(it);continue}
    const d=it.decision?.decision, ready=it.status==='done'&&it.render_fresh, canKeep=ready&&it.gate?.ok&&(it.review_mode==='human'?true:it.review&&!it.review.stale&&!it.review.discard&&!it.review.fatal?.length);
    const html=`<div class="card-head"><h2>${esc(name(it))}</h2><span class="badge">${esc(badge(it))}</span></div>${ready?`<div class="row preview-controls" role="group" aria-label="걷기 배경"><span>투명 확인</span>${[['checker','체커'],['white','흰색'],['black','검정'],['lawn','잔디']].map(([bg,label])=>`<button data-background="${bg}" class="${reviewBackground===bg?'on':''}" aria-pressed="${reviewBackground===bg}" ${!it.alpha_previews_fresh&&bg!=='lawn'?'disabled':''}>${label}</button>`).join('')}</div><div class="preview-grid"><figure><figcaption>네 방향 걷기</figcaption><div class="direction-labels"><span>위</span><span>오른쪽</span><span>아래</span><span>왼쪽</span></div><div class="walk-stage"><img class="walk review-media" src="${url(it,walkFile(it))}" width="480" height="160" alt="${esc(name(it))} 위·오른쪽·아래·왼쪽 네 방향 걷기 GIF"></div></figure><figure><figcaption>게임 속 이동</figcaption><div class="stroll-stage"><img class="stroll review-media" src="${url(it,'views/stroll.gif')}" width="336" height="240" alt="${esc(name(it))} 칸 위를 걸어 다니는 GIF"></div></figure></div><div class="description"><p>${esc(it.desc?.appearance||it.desc?.role||'')}</p></div><details class="inspect"><summary>원본 비교 · 12프레임 시트</summary><img loading="lazy" src="${url(it,'base-views/walk.gif')}" alt="원본 네 방향 걷기"><img loading="lazy" class="sheet" src="${url(it,it.alpha_previews_fresh?'views/sheet_rgba.png':'views/sheet.png')}" alt="12프레임 시트">${it.review_mode==='legacy'?'<p>이전 검수 방식으로 만든 후보입니다.</p>':''}${it.decision_stale?'<p class="error">그림이 바뀌어 이전 선택을 다시 확인해야 합니다.</p>':''}</details>`:`<div class="waiting">${it.status==='running'?'GIF를 만드는 중…':'아직 완성된 GIF가 없습니다'}</div>`}<div class="card-foot"><button class="keep" data-action="accept" ${!canKeep?'disabled':''}>남기기 <kbd>A</kbd></button><button class="trash" data-action="reject" ${!ready?'disabled':''}>폐기 <kbd>R</kbd></button>${d?'<button data-action="clear" title="이 선택 되돌리기">되돌리기</button>':''}</div>`;
    if(!card){card=document.createElement('article');card.dataset.card=it.id;gallery.append(card)}card.className='card'+(d==='accept'?' kept':d==='reject'?' rejected':'');card.dataset.version=key;card.innerHTML=html;
    const media=[...card.querySelectorAll('.review-media')],loaded=()=>{if(media.length&&media.every(img=>img.complete&&img.naturalWidth))seen.add(imageKey(it))};media.forEach(img=>img.addEventListener('load',loaded,{once:true}));loaded();
    card.querySelectorAll('[data-background]').forEach(b=>b.onclick=()=>{reviewBackground=b.dataset.background;try{localStorage.setItem('charset-review-background',reviewBackground)}catch{}render()});
    card.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>decide(it,b.dataset.action));
  }
}
function decide(it,decision,restore=false){
  if(decision!=='clear'&&!seen.has(imageKey(it))){notice('GIF를 불러온 다음 결정해 주세요.',true);return}
  const rows=visible(),idx=rows.findIndex(i=>i.id===it.id);
  const op={id:it.id,decision,inspected:binding(it),mutationId:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),label:name(it),queuedAt:Math.max(Date.now(),...readOutbox().map(x=>(x.queuedAt||0)+1))};
  try{localStorage.setItem(OUTBOX_PREFIX+op.mutationId,JSON.stringify(op))}catch{notice('선택 임시 저장을 사용할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.',true);return}
  outbox=readOutbox();lastSaveError='';dismissed.add(imageKey(it));current=rows[idx+1]?.id||rows[idx-1]?.id;
  if(restore){dismissed.delete(imageKey(it));tab='todo';if(run!=='all')run=it.run;query='';$('search').value='';current=it.id;lastAction=null}else if(decision!=='clear')lastAction={it,mutationId:op.mutationId};else if(lastAction?.it.id===it.id)lastAction=null;
  notice(`${name(it)} · ${decision==='accept'?'남기기':decision==='reject'?'폐기':'되돌리기'} 저장 중…`);render();flushDecisions();
  $('main').focus({preventScroll:true});
}
$('saveRetry').onclick=retrySave;
addEventListener('online',retrySave);
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;current=null;dismissed.clear();render()});$('runs').onchange=()=>{run=$('runs').value;current=null;dismissed.clear();render()};$('search').oninput=()=>{query=$('search').value;current=null;dismissed.clear();render()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('undo').onclick=()=>{if(lastAction)decide(lastAction.it,'clear',true)};
$('download').onclick=async()=>{if(busy||outbox.length)return;busy=true;$('download').disabled=true;notice('남긴 캐릭터를 묶는 중…');try{const result=await post('/api/export',{run});const link=document.createElement('a');link.href=result.url;link.download='';link.click();notice(`${result.count}명 다운로드 팩을 만들었습니다.`)}catch(e){notice(e.message,true)}finally{busy=false;render()}};
$('generate').onclick=()=>{$('modal').hidden=false;$('formMsg').textContent='';$('count').focus()};$('close').onclick=()=>{$('modal').hidden=true};$('file').onchange=()=>{const file=$('file').files[0];image=null;$('preview').hidden=true;if(!file)return;const reader=new FileReader();reader.onload=()=>{image=reader.result;$('preview').src=image;$('preview').hidden=false};reader.readAsDataURL(file)};
$('form').onsubmit=async event=>{event.preventDefault();$('start').disabled=true;$('formMsg').textContent='자유 저작을 시작하는 중…';try{const result=await post('/api/produce',{count:Number($('count').value),prompt:$('prompt').value,image});run=result.run;tab='todo';current=null;$('modal').hidden=true;notice(`${result.count}명 생성 시작. 완성된 GIF부터 검토할 수 있습니다.`);await load()}catch(e){$('formMsg').textContent=e.message}finally{$('start').disabled=false}};
addEventListener('keydown',e=>{if(!$('modal').hidden){if(e.key==='Escape')$('modal').hidden=true;return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||busy||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const rows=visible(),it=rows.find(i=>i.id===current);if(!it)return;if(e.key.toLowerCase()==='a'){e.preventDefault();decide(it,'accept')}else if(e.key.toLowerCase()==='r'){e.preventDefault();decide(it,'reject')}else if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();move(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)}});
load();setInterval(()=>{if($('modal').hidden)load()},5000);
</script>

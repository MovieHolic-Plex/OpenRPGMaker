<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오브젝트 게이트 — 사람 검토 대기열</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #1d1f24; color: #e8e6e1; }
  header { padding: 12px 20px; background: #26292f; border-bottom: 1px solid #3a3d44; position: sticky; top: 0; z-index: 2; }
  header h1 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: #a9a59c; font-size: 13px; }
  header label { margin-left: 14px; }
  input[type=text] { background: #15171b; color: #e8e6e1; border: 1px solid #4a4d55; padding: 3px 6px; border-radius: 4px; }
  select { background: #15171b; color: #e8e6e1; border: 1px solid #4a4d55; padding: 3px 6px; border-radius: 4px; }
  .totals b { color: #e8e6e1; }
  #batches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 120px; overflow: auto; }
  .chip { border: 1px solid #4a4d55; background: #1d1f24; color: #e8e6e1; border-radius: 14px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { background: #3b5a86; border-color: #5d82b8; }
  .chip.auto { opacity: .7; }
  .chip .n { color: #e7c27a; font-weight: 600; }
  #batchbar { margin-top: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #batchbar .title { font-weight: 600; }
  main { padding: 16px 20px; display: grid; gap: 14px; }
  .card { background: #26292f; border: 1px solid #3a3d44; border-radius: 8px; padding: 12px 14px; }
  .card.done { opacity: .6; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 15px; }
  .sub { color: #a9a59c; font-size: 12px; word-break: break-all; }
  .advice { margin: 6px 0; font-size: 13px; }
  .advice .tag { display: inline-block; padding: 0 7px; border-radius: 4px; font-weight: 600; margin-right: 6px; }
  .t-pass { background: #2f5a3a; } .t-refer { background: #6b5a2a; } .t-fail { background: #6b2f2f; }
  .why { color: #e7c27a; }
  .pix { image-rendering: pixelated; background: repeating-conic-gradient(#c8b48c 0 25%, #b9a57d 0 50%) 0 0 / 16px 16px; display: block; }
  figure { margin: 0; }
  figcaption { color: #a9a59c; font-size: 12px; margin-top: 4px; }
  .refs { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  button { font-size: 14px; padding: 6px 16px; margin-right: 8px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
  .allow { background: #2f6b3d; color: #fff; }
  .reject { background: #7a2f2f; color: #fff; }
  .allall { background: #2f6b3d; color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .status { margin-left: 6px; font-weight: 600; }
  .empty { color: #a9a59c; padding: 30px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>사람 검토 대기열 — 허용 / 거절 (최종 판정은 사람)</h1>
  <div class="meta totals" id="meta">불러오는 중…</div>
  <div class="meta" style="margin-top:6px">결정한 사람 <input type="text" id="who" size="12" placeholder="이름">
    <label>AI 조언 <select id="ai"><option value="">전부</option><option value="refer">보류</option><option value="fail">불합격</option><option value="pass">통과(미보정)</option><option value="none">판정 없음</option></select></label>
    <label><input type="checkbox" id="decided"> 이미 결정한 것도 보기</label></div>
  <div class="meta" style="margin-top:4px">AI 판정은 조언이다. 허용은 이 그림(화소 해시)·이 종류에만 묶이고, 서명되어 모든 출구(번들·공용·스토어·공방)를 연다. 거절은 최종이다. 그림이 한 화소라도 바뀌면 새로 판정·결정해야 한다.</div>
  <div id="batches"></div>
  <div id="batchbar"></div>
</header>
<main id="list"></main>
<script>
let csrf = '', current = null, data = null;
const who = document.getElementById('who');
who.value = localStorage.getItem('og-holds-who') || '';
who.addEventListener('change', () => localStorage.setItem('og-holds-who', who.value.trim()));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const word = v => v === 'pass' ? '통과' : v === 'refer' ? '보류' : v === 'fail' ? '불합격' : '-';
async function load(batch) {
  if (!csrf) csrf = (await (await fetch('/api/session')).json()).csrf;
  const q = new URLSearchParams();
  if (batch ?? current) q.set('batch', batch ?? current);
  if (document.getElementById('decided').checked) q.set('decided', '1');
  data = await (await fetch('/api/queue?' + q)).json();
  current = data.batch;
  const t = data.totals;
  document.getElementById('meta').innerHTML = `판정 프로필 ${esc(data.currentProfile)} (${esc(data.profileStatus)}) · 대기 <b>${t.waiting}</b> · 허용 <b>${t.allowed}</b> · 거절 <b>${t.rejected}</b> · 보정 프로필 자동 통과 ${t.autoPass}`;
  document.getElementById('batches').innerHTML = data.batches.map(b => `<span class="chip ${b.id === current ? 'on' : ''} ${b.auto ? 'auto' : ''}" data-id="${esc(b.id)}" title="${esc(b.title)}">${esc(b.auto ? b.id.slice(5) : b.title)} <span class="n">${b.waiting}</span>${b.allowed ? ` · 허용 ${b.allowed}` : ''}${b.rejected ? ` · 거절 ${b.rejected}` : ''}</span>`).join('');
  for (const c of document.querySelectorAll('.chip')) c.onclick = () => load(c.dataset.id);
  render();
}
function render() {
  const b = data.batches.find(x => x.id === current);
  const ai = document.getElementById('ai').value;
  const items = data.items.filter(i => !ai || (ai === 'none' ? !i.aiVerdict : i.aiVerdict === ai));
  const ready = data.items.filter(i => i.status === 'waiting' && i.hasImage);
  document.getElementById('batchbar').innerHTML = b ? `<span class="title">${esc(b.title)}</span>
    <span class="meta">전체 ${b.total} · 대기 ${b.waiting}(AI 통과 ${b.ai.pass} · 보류 ${b.ai.refer} · 불합격 ${b.ai.fail}) · 허용 ${b.allowed} · 거절 ${b.rejected}${b.noReceipt ? ` · AI 판정 대기 ${b.noReceipt}` : ''}${b.autoPass ? ` · 자동 통과 ${b.autoPass}` : ''}${b.waiting - b.withImage ? ` · 그림 없음 ${b.waiting - b.withImage}` : ''}</span>
    <button class="allall" id="allall" ${ready.length ? '' : 'disabled'}>이 묶음 전부 허용 (${ready.length}장)</button>
    ${b.note ? `<div class="meta" style="flex-basis:100%">${esc(b.note)}</div>` : ''}` : '';
  const all = document.getElementById('allall'); if (all) all.onclick = () => allowBatch(b, ready);
  const list = document.getElementById('list');
  if (!items.length) { list.innerHTML = '<div class="empty">이 묶음에는 사람 결정을 기다리는 그림이 없다.</div>'; return; }
  list.innerHTML = items.map(i => {
    const z4 = 4, w = i.width, h = i.height;
    const img = i.hasImage && w ? `<figure><img class="pix" loading="lazy" src="/img/${i.sha}.png" width="${w}" height="${h}"><figcaption>1배</figcaption></figure>
      <figure><img class="pix" loading="lazy" src="/img/${i.sha}.png" width="${w * z4}" height="${h * z4}"><figcaption>4배</figcaption></figure>` : `<div class="why">${i.aiVerdict ? '그림이 저장돼 있지 않다 — object-gate enqueue/review 로 다시 받아야 결정할 수 있다.' : 'AI 판정(조언)이 아직 없다 — 판정이 끝나면 결정할 수 있다.'}</div>`;
    const refs = (i.refs || []).map(r => `<figure><img class="pix ref" data-src="/ref/${esc(i.styleKind)}/${esc(r)}.png"><figcaption>버들항 ${esc(r)} (4배)</figcaption></figure>`).join('');
    const dec = i.decision ? `<span class="status" style="color:${i.decision.decision === 'allow' ? '#7fd38f' : '#f08a8a'}">${i.decision.decision === 'allow' ? '허용됨' : '거절됨(최종)'} — ${esc(i.decision.decidedBy)} ${esc(i.decision.decidedAt.slice(0, 16))}${i.decision.note ? ' · ' + esc(i.decision.note) : ''}</span>` : '';
    const can = i.status === 'waiting' && i.hasImage;
    const tag = i.aiVerdict ? `<span class="tag t-${i.aiVerdict}">AI ${word(i.aiVerdict)}${i.aiVerdict === 'pass' && !i.calibrated ? '(미보정)' : ''}</span>` : '<span class="tag">AI 판정 없음</span>';
    return `<section class="card ${i.decision ? 'done' : ''}" data-sha="${i.sha}" data-kind="${esc(i.kind)}">
      <div class="title">${esc(i.label)} <span class="sub">· 종류 ${esc(i.kind)}</span></div>
      <div class="advice">${tag}<span class="sub">3/4 ${word(i.view34)} · 화풍 ${word(i.style)}${i.profileHash ? ' · 프로필 ' + esc(i.profileHash) : ''}</span>
        <div class="why">${(i.reasons || []).map(esc).join('<br>')}</div></div>
      <div class="sub">종류 뜻: ${esc(i.kindMeaning)} · 해시 ${i.sha}</div>
      <div class="row" style="margin-top:6px">${img}<div class="refs">${refs}<figure><img class="pix" loading="lazy" src="/guide/pairs.png" style="max-width:420px;height:auto"><figcaption>3/4 기준 쌍(초록 = 맞음, 빨강 = 틀림)</figcaption></figure></div></div>
      <div class="btns" style="margin-top:10px">${can ? `<button class="allow">허용</button><button class="reject">거절</button> 메모 <input type="text" class="note" size="30">` : ''}${dec}</div>
    </section>`;
  }).join('');
  for (const im of document.querySelectorAll('img.ref')) { im.onload = () => { im.width = im.naturalWidth * 4; im.height = im.naturalHeight * 4; }; im.src = im.dataset.src; }
  for (const card of document.querySelectorAll('.card')) for (const btn of card.querySelectorAll('button')) btn.onclick = () => decide(card, btn.classList.contains('allow') ? 'allow' : 'reject');
}
function needWho() { const v = who.value.trim(); if (!v) { alert('결정한 사람 이름을 먼저 적어 주세요.'); who.focus(); } return v; }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Holds-Csrf': csrf }, body: JSON.stringify(body) });
  const out = await r.json();
  if (!r.ok) { alert(out.error || '저장 실패'); return null; }
  return out;
}
async function decide(card, decision) {
  const decidedBy = needWho(); if (!decidedBy) return;
  if (decision === 'reject' && !confirm('거절은 최종이다. 이 그림(이 해시)은 다시 허용할 수 없다. 거절할까요?')) return;
  const note = card.querySelector('.note')?.value || '';
  if (await post('/api/decide', { sha: card.dataset.sha, kind: card.dataset.kind, decision, decidedBy, note })) await load();
}
async function allowBatch(b, ready) {
  const decidedBy = needWho(); if (!decidedBy) return;
  const phrase = `${ready.length}장 전부 허용`;
  const typed = prompt(`「${b.title}」 묶음의 대기 그림 ${ready.length}장을 모두 허용한다.\n그림마다 따로 서명 기록이 생기고, 모든 출구(번들·공용·스토어·공방)를 연다.\n확인하려면 「${phrase}」 을 그대로 입력하세요.`);
  if (typed === null) return;
  if (typed.trim() !== phrase) { alert('확인 문구가 달라 허용하지 않았다.'); return; }
  const note = prompt('메모(선택)') || '';
  const out = await post('/api/decide-batch', { batch: b.id, shas: ready.map(i => i.sha), decidedBy, confirm: typed.trim(), note });
  if (out) { alert(`${out.saved}장 허용 기록을 썼다.`); await load(); }
}
document.getElementById('decided').addEventListener('change', () => load());
document.getElementById('ai').addEventListener('change', render);
load();
</script>
</body>
</html>

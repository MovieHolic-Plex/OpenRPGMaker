# /etc/nginx/sites-available/store.openrpgmaker.com — certbot --nginx 로 443 블록을 붙인다.
server {
    listen 80;
    listen [::]:80;
    server_name store.openrpgmaker.com;

    # 팩 하나 최대 160MB, blob 하나 최대 32MB(STORE_LIMITS). 업로드는 blob 단위로 나뉘어 들어온다.
    client_max_body_size 40m;

    # Cloudflare 프록시 뒤(2026-10-06~): $remote_addr 를 CF-Connecting-IP 로 바꾼다. 앱의 IP 속도 제한이 이 값을 쓴다.
    # 서버 공용 파일이다 — 엣지 대역은 /usr/local/bin/refresh-cloudflare-ips.sh 가 매주 다시 쓴다(손으로 고치지 말 것).
    include /etc/nginx/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}

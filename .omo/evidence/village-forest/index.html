<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>소규모 마을 · 숲 수정 전후</title><style>body{margin:24px;background:#172019;color:#e8eedf;font:16px system-ui}button,input{font:inherit}button{padding:8px 16px;margin-right:8px}figure{margin:16px 0;max-width:1216px}img{width:100%;image-rendering:pixelated}p{line-height:1.6}</style><h1>겹치는 숲과 외곽 풀밭</h1><p>같은 집 배치를 유지하고 숲 생성 규칙을 수정했습니다.<br>수관·밑동 겹침 0 → 721칸 · 243 계열 풀밭 667 → 914칸</p><button id="before">수정 전</button><button id="after">수정 후</button><figure><img id="map" src="render/map-overview.png" alt="수정 후 마을"><figcaption id="caption">수정 후 — 나무가 앞뒤로 겹치고 풀밭이 외곽에 집중됩니다.</figcaption></figure><p>집 26채(단층 23채·다층 3채), 우물·장터·잔교 접근 검증. 실제 Supabase 저장 후 재로드한 맵입니다.</p><script>const map=document.querySelector('#map'),caption=document.querySelector('#caption');document.querySelector('#before').onclick=()=>{map.src='before.png';map.alt='수정 전 마을';caption.textContent='수정 전 — 나무 전체 사각형이 겹침을 막고 있었습니다.'};document.querySelector('#after').onclick=()=>{map.src='render/map-overview.png';map.alt='수정 후 마을';caption.textContent='수정 후 — 나무가 앞뒤로 겹치고 풀밭이 외곽에 집중됩니다.'};</script></html>

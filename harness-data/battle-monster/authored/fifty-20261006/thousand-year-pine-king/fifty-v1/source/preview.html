<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천년송왕 — 18자세 · 8동작</title>
<style>body{margin:24px;background:#222a31;color:#ede8d7;font:16px system-ui}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{padding:8px 12px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}figure{margin:0;padding:12px;border:1px solid #647169;border-radius:8px}figcaption{margin:0 0 12px}img{image-rendering:pixelated;width:256px;height:256px}figure.dark{background:#222a31}figure.light{background:#efe5ca;color:#27302b}figure.checker{background-color:#51595c;background-image:conic-gradient(#777c77 25%,transparent 0 50%,#777c77 0 75%,transparent 0);background-size:32px 32px}a{color:#b7dbc0}p{max-width:720px;line-height:1.6}</style>
<h1>천년송왕 — 18자세 · 8동작 저작본</h1><p>원본 128px · 18색. GIF는 원본 픽셀로 재생됩니다. 확대는 표시 크기만 바꿉니다.</p>
<nav><select id="bg" aria-label="배경"><option value="dark">어두운 배경</option><option value="light">밝은 배경</option><option value="checker">체커 배경</option></select><select id="scale" aria-label="표시 배율"><option value="256">2배</option><option value="128">원본 1배</option><option value="384">최근접 3배</option></select><button id="pause">정지</button></nav><main id="motions"></main>
<p><a href="png/all-light-1x.png">18자세 원본 시트</a> · <a href="png/all-checker-3x.png">체커 확대 시트</a> · <a href="png/gif-readback-1x.png">GIF 재읽기 순서</a> · <a href="AUTHORING.md">저작 기록</a> · <a href="TIMING.md">시간표</a></p>
<script>const motionNames=['idle','attack','hit','dead','skill','poison','stun','sleep'];const labels=['대기','공격','피격','쓰러짐','천근박','독','기절','수면'];const stills=['idle_a','attack','hit','dead','skill_b','poison_a','stun_a','sleep_a'];let paused=false;const main=document.querySelector('#motions');motionNames.forEach((n,i)=>{const figure=document.createElement('figure');figure.className='dark';const title=document.createElement('figcaption');title.textContent=labels[i];const img=document.createElement('img');img.src='gif/'+n+'.gif';img.alt=labels[i];img.dataset.motion=n;img.dataset.still=stills[i];figure.append(title,img);main.append(figure)});document.querySelector('#bg').onchange=e=>document.querySelectorAll('figure').forEach(f=>f.className=e.target.value);document.querySelector('#scale').onchange=e=>document.querySelectorAll('img').forEach(im=>{im.style.width=im.style.height=e.target.value+'px'});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'정지';document.querySelectorAll('img').forEach(im=>im.src=paused?'png/'+im.dataset.still+'.png':'gif/'+im.dataset.motion+'.gif')};</script></html>

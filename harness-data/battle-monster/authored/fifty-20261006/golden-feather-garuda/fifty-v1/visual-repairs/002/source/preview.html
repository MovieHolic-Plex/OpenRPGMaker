<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>금익대붕 원본 후보</title>
<style>body{margin:24px;background:#18202b;color:#efe9d6;font:16px system-ui}h1{font-size:24px}button{margin:0 8px 12px 0;padding:8px 14px}section{display:flex;flex-wrap:wrap;gap:18px}figure{margin:0;padding:12px;border:1px solid #64707c;border-radius:8px}figcaption{margin-bottom:8px}img{image-rendering:pixelated;display:block;width:calc(128px * var(--zoom,2));height:calc(128px * var(--zoom,2))}.light figure{background:#efe6d5;color:#222}.checker figure{background:conic-gradient(#bfc4ca 25%,#929ba5 0 50%,#bfc4ca 0 75%,#929ba5 0) 0 0/16px 16px;color:#17202b}a{color:inherit}h2{margin-top:32px;font-size:18px}</style>
<h1>금익대붕</h1><p>18자세 · 8동작</p><nav><button onclick="document.body.className=''">어두운 배경</button><button onclick="document.body.className='light'">밝은 배경</button><button onclick="document.body.className='checker'">체커 배경</button><button onclick="document.body.style.setProperty('--zoom',1)">1배</button><button onclick="document.body.style.setProperty('--zoom',2)">2배</button><button onclick="document.body.style.setProperty('--zoom',3)">3배</button></nav>
<h2>동작</h2><section id="motions"></section><h2>자세</h2><section id="poses"></section>
<script>
const motions=[['idle','대기'],['attack','공격'],['hit','피격'],['dead','쓰러짐'],['skill','금익폭'],['poison','독'],['stun','기절'],['sleep','수면']];
const poses=['idle_a','idle_b','idle_c','windup','move','attack','recover','hit','dead','skill_a','skill_b','skill_c','poison_a','poison_b','stun_a','stun_b','sleep_a','sleep_b'];
for(const [key,title]of motions){const f=document.createElement('figure');const c=document.createElement('figcaption');c.textContent=title;const i=document.createElement('img');i.src='gif/'+key+'.gif';i.alt=title;f.append(c,i);document.querySelector('#motions').append(f)}
for(const key of poses){const f=document.createElement('figure');const c=document.createElement('figcaption');c.textContent=key;const i=document.createElement('img');i.src='png/'+key+'.png';i.alt=key;f.append(c,i);document.querySelector('#poses').append(f)}
</script></html>

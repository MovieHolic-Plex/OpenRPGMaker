<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼고도깨비 · 원본 18자세</title>
<style>body{background:#202536;color:#ece7d9;font:16px system-ui;margin:24px}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,a{color:inherit;background:#303b54;border:1px solid #62748d;padding:9px 15px;border-radius:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:#2c3346;padding:16px;border-radius:8px}.image{background:#d9d5c8;display:flex;align-items:center;justify-content:center;min-height:210px}.image img{width:192px;height:192px;image-rendering:pixelated}body.dark .image{background:#1b1e2b}body.checker .image{background:conic-gradient(#9d9ea2 25%,#d0d1d3 0 50%,#9d9ea2 0 75%,#d0d1d3 0);background-size:32px 32px}h2{font-size:17px;margin:0 0 12px}.note{color:#b9c3d2;font-size:14px}figure{margin:0}select{padding:8px;background:#303b54;color:inherit}</style>
<h1>혼고도깨비</h1><p class="note">96px 원본 · 18자세 · 8동작. 사람 선택과 하네스 독립 검수는 별도입니다.</p>
<nav><button onclick="document.body.className=''">밝은 배경</button><button onclick="document.body.className='dark'">어두운 배경</button><button onclick="document.body.className='checker'">체커 배경</button><button id="pause" onclick="toggle()">정지</button><select onchange="document.querySelectorAll('.image img').forEach(i=>{i.style.width=i.style.height=this.value+'px'})"><option value="96">1배</option><option value="192" selected>2배</option><option value="288">3배</option></select><a href="native.png">18자세 1배</a><a href="contact-checker.png">18자세 확대</a><a href="gif-storyboard.png">GIF 프레임 순서</a></nav>
<div class="grid">
<section class="card"><h2>대기</h2><div class="image"><img src="idle.gif" data-motion="idle" data-still="idle_a" alt="대기 3자세"></div></section>
<section class="card"><h2>공격</h2><div class="image"><img src="attack.gif" data-motion="attack" data-still="attack" alt="준비 이동 접촉 회수"></div></section>
<section class="card"><h2>피격</h2><div class="image"><img src="hit.gif" data-motion="hit" data-still="hit" alt="피격 표정과 어깨"></div></section>
<section class="card"><h2>쓰러짐</h2><div class="image"><img src="dead.gif" data-motion="dead" data-still="dead" alt="옆으로 쓰러진 몸"></div></section>
<section class="card"><h2>혼고진</h2><div class="image"><img src="skill.gif" data-motion="skill" data-still="skill_b" alt="황금 핵과 두 소리 파문"></div></section>
<section class="card"><h2>독</h2><div class="image"><img src="poison.gif" data-motion="poison" data-still="poison_b" alt="턱과 배를 짚는 아픈 자세"></div></section>
<section class="card"><h2>기절</h2><div class="image"><img src="stun.gif" data-motion="stun" data-still="stun_b" alt="처진 머리와 북채"></div></section>
<section class="card"><h2>수면</h2><div class="image"><img src="sleep.gif" data-motion="sleep" data-still="sleep_a" alt="닫힌 눈과 앉은 자세의 호흡"></div></section>
</div><script>let stopped=false;function toggle(){stopped=!stopped;document.querySelectorAll('.image img').forEach(i=>i.src=(stopped?i.dataset.still+'.png':i.dataset.motion+'.gif'));document.getElementById('pause').textContent=stopped?'재생':'정지';}</script></html>

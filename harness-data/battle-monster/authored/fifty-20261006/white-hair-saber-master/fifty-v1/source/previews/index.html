<script>const bg=document.getElementById('bg'),scale=document.getElementById('scale');function style(){document.body.className=bg.value+' '+scale.value}bg.onchange=style;scale.onchange=style;let paused=false;document.getElementById('pause').onclick=e=>{paused=!paused;document.querySelectorAll('[data-motion]').forEach(i=>i.src=(paused?i.dataset.still+'.png':i.dataset.motion+'.gif'));e.target.textContent=paused?'재생':'일시 정지'};</script></html>

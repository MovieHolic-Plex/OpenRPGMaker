<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>적갑문지기 · 8동작</title>
<style>
:root{--bg:#eee5d1;--size:256px}*{box-sizing:border-box}body{margin:0;padding:24px;background:#202731;color:#ece7db;font:15px system-ui,sans-serif}h1{font-size:24px;margin:0 0 12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}button,a{color:inherit}button{background:#35404e;border:1px solid #647181;border-radius:5px;padding:8px 12px;cursor:pointer}.motions{display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:18px}.card{background:#29333e;border:1px solid #52606f;border-radius:8px;padding:12px}.card h2{font-size:17px;margin:0 0 12px}.art{width:100%;display:flex;justify-content:center;align-items:end;background:var(--bg);border-radius:4px;overflow:auto}.art img{width:var(--size);height:var(--size);image-rendering:pixelated;object-fit:contain;flex:none}.checker .art{background:repeating-conic-gradient(#afb6bb 0 25%,#7f8992 0 50%) 0/16px 16px}p{color:#c3c9cf;line-height:1.5}.sheet{max-width:100%;width:768px;image-rendering:pixelated}details{margin-top:24px}summary{cursor:pointer;font-size:18px;padding:12px 0}</style>
<h1>적갑문지기</h1><p>대기 · 창격 · 피격 · 쓰러짐 · 적문쇄 · 독 · 기절 · 수면</p>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPRN Studio</title>
    <!-- 첫 프레임 뼈대: 번들·로캘이 준비되기 전 빈 창이 보이지 않게 한다. 언어 무관(로고만)이라 번역 계층에 기대지 않는다.
         startScreen.ts 의 첫 마운트(host.replaceChildren)가 통째로 대체한다. -->
    <style>
      html { background: #111214; }
      .start-boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 12px; color: #ececee; font: 700 20px/1 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: -0.01em; }
      .start-boot svg { width: 28px; height: 28px; animation: start-boot-pulse 1.4s ease-in-out infinite; }
      @keyframes start-boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .start-boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <!-- 데스크톱 앱 첫 화면. 스크립트는 파일로만 싣는다 — app:// CSP 의 script-src 가 'self' 라 인라인은 막힌다. -->
    <main id="start-app" class="start-app">
      <div class="start-boot" data-start-boot role="status" translate="no" data-i18n-skip>
        <svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect width="28" height="28" rx="7" fill="#4a57d6" />
          <rect x="6" y="6" width="7" height="7" rx="1.5" fill="#fff" />
          <rect x="15" y="6" width="7" height="7" rx="1.5" fill="#fff" fill-opacity="0.55" />
          <rect x="6" y="15" width="7" height="7" rx="1.5" fill="#fff" fill-opacity="0.55" />
          <rect x="15" y="15" width="7" height="7" rx="1.5" fill="#fff" />
        </svg>
        <span>OPRN Studio</span>
      </div>
    </main>
    <script type="module" src="/src/start/startScreen.ts"></script>
  </body>
</html>

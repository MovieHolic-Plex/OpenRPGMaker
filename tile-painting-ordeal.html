<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타일 한 칸의 값 — 타일깔기 회고</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12161c; --panel2:#171c24; --line:#232b36;
    --fg:#e9edf3; --dim:#8b97a6; --dimmer:#5e6a79;
    --accent:#f2b544; --danger:#ff5470; --good:#4fd6a0; --cool:#62b8ff;
    --slide-w:1600px; --slide-h:900px;
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono","Cascadia Mono","D2Coding",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--sans);
    font-feature-settings:"tnum" 1; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  #slide{
    width:var(--slide-w); height:var(--slide-h);
    position:absolute; left:50%; top:50%;
    background:radial-gradient(120% 120% at 12% 0%, #151b24 0%, #0b0d10 62%);
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
    transform-origin:50% 50%;
  }
  .pad{position:absolute;inset:0;padding:64px 80px 74px;display:flex;flex-direction:column}
  .kicker{
    font-size:15px;font-weight:700;letter-spacing:.22em;color:var(--accent);
    text-transform:none;margin-bottom:16px;
  }
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--accent);vertical-align:5px;margin-right:12px}
  h1{font-size:56px;line-height:1.18;font-weight:800;letter-spacing:-.02em}
  .cover h1{font-size:86px}
  .split{display:grid;grid-template-columns:var(--lcol,42%) 1fr;gap:52px;flex:1;min-height:0;margin-top:30px;align-items:center}
  .stack{display:flex;flex-direction:column;gap:26px;flex:1;min-height:0;margin-top:30px;justify-content:center}
  ul.body{list-style:none;display:flex;flex-direction:column;gap:15px}
  ul.body li{
    font-size:23px;line-height:1.62;color:#d3dae4;padding-left:22px;position:relative;
    text-wrap:pretty; word-break:keep-all;
  }
  ul.body li::before{
    content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;
    background:var(--accent);border-radius:2px;
  }
  .cover ul.body li{font-size:25px}
  footer{
    position:absolute;left:80px;right:80px;bottom:26px;
    font-family:var(--mono);font-size:12.5px;color:var(--dimmer);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-top:1px solid #1b222c;padding-top:12px;
  }
  /* ---- chrome ---- */
  #bar{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:20;transition:width .18s ease}
  #count{
    position:fixed;right:18px;bottom:14px;z-index:20;font-family:var(--mono);
    font-size:13px;color:var(--dim);background:#0d1116cc;border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;
  }
  #hint{
    position:fixed;left:18px;bottom:14px;z-index:20;font-family:var(--mono);
    font-size:12px;color:var(--dimmer);
  }
  .zone{position:fixed;top:0;bottom:0;width:26%;z-index:10;cursor:pointer}
  .zone.l{left:0} .zone.r{right:0}
  /* ---- overview ---- */
  #ov{
    position:fixed;inset:0;background:#080a0d;z-index:40;display:none;
    padding:44px 48px;overflow:auto;
  }
  #ov.on{display:block}
  #ov h2{font-size:20px;color:var(--dim);font-weight:600;margin-bottom:22px;letter-spacing:.04em}
  #ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;
    cursor:pointer;transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .n{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .card .k{font-size:11.5px;color:var(--accent);letter-spacing:.12em;margin:7px 0 5px}
  .card .t{font-size:16px;font-weight:700;line-height:1.4;word-break:keep-all}
  /* ---- visuals ---- */
  .vwrap{min-width:0;min-height:0;width:100%}
  /* tiles */
  .tiles{display:flex;flex-wrap:wrap;gap:24px}
  .tcell{width:118px;text-align:center}
  .tile{
    width:112px;height:112px;image-rendering:pixelated;
    background-repeat:no-repeat;border:1px solid #2b3441;border-radius:3px;
    background-color:#0f1319;
  }
  .tile.sheet-interior{background-image:url("public/assets/easyrpg-chipset-interior.png")}
  .tile.sheet-town{background-image:url("public/assets/easyrpg-chipset-combined-town-transparent.png")}
  .tile.sheet-dungeon{background-image:url("public/assets/easyrpg-chipset-dungeon.png")}
  .tile{background-size:3360px 1792px}
  body.no-sheet .tile{
    background-image:none !important;display:grid;place-items:center;
    border-style:dashed;border-color:var(--danger);
  }
  body.no-sheet .tile::after{content:attr(data-tile);font-family:var(--mono);font-size:20px;color:var(--danger)}
  .tid{font-family:var(--mono);font-size:14px;color:var(--accent);margin-top:9px}
  .tlab{font-size:13.5px;line-height:1.4;color:var(--dim);margin-top:3px;word-break:keep-all}
  /* number wall */
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .cover .nums{grid-template-columns:repeat(4,1fr);gap:20px}
  .num{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;padding:22px 24px}
  .num b{display:block;font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .cover .num b{font-size:48px}
  .num span{display:block;font-size:14.5px;color:var(--dim);margin-top:11px;word-break:keep-all;line-height:1.45}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:17.5px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #1e2530;vertical-align:top}
  table.dense{font-size:16.5px}
  table.dense th,table.dense td{padding:5.5px 12px}
  th{font-size:13px;letter-spacing:.1em;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line)}
  td.m{font-family:var(--mono);color:var(--accent)}
  td.bad{color:var(--danger)} td.ok{color:var(--good)}
  .tag{font-size:12.5px;font-family:var(--mono);padding:2px 8px;border-radius:999px;border:1px solid}
  .tag.h{color:var(--danger);border-color:#43222c;background:#1b1116}
  .tag.w{color:var(--good);border-color:#1d3b30;background:#0f1a16}
  /* code */
  pre{
    background:#0d1117;border:1px solid var(--line);border-left:3px solid var(--cool);
    border-radius:7px;padding:24px 26px;font-family:var(--mono);font-size:18px;line-height:1.85;
    white-space:pre-wrap;color:#cfe0f0;
  }
  pre .c{color:var(--dimmer)} pre .k{color:var(--accent)}
  /* timeline */
  .tl{position:relative;padding-left:26px}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#242c38}
  .tlrow{display:grid;grid-template-columns:104px 96px 1fr;gap:14px;align-items:baseline;padding:7px 0;position:relative}
  .tlrow::before{content:"";position:absolute;left:-24px;top:16px;width:9px;height:9px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 3px #0b0d10}
  .tlrow.big::before{background:var(--danger)}
  .tlrow .d{font-family:var(--mono);font-size:14px;color:var(--fg)}
  .tlrow .h{font-family:var(--mono);font-size:13px;color:var(--dimmer)}
  .tlrow .w{font-size:15.5px;color:#cdd5e0;word-break:keep-all;line-height:1.45}
  /* diagrams */
  .dg{font-size:14px;color:var(--dim)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 15px}
  .box .bt{font-size:16px;font-weight:700;color:var(--fg);word-break:keep-all}
  .box .bs{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);margin-top:6px;line-height:1.5}
  .chain{display:flex;flex-direction:column;gap:9px}
  .chain .row{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center}
  .chain .idx{font-family:var(--mono);font-size:13px;color:var(--accent);text-align:right}
  .fan{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center}
  .fan .pills{display:flex;flex-direction:column;gap:9px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--mono);font-size:14.5px;color:#d6dee9}
  .pill em{color:var(--accent);font-style:normal}
  .hub{
    background:var(--panel2);border:1px solid var(--accent);border-radius:8px;
    padding:16px 10px;text-align:center;font-size:17px;font-weight:700;line-height:1.4;
  }
  .meanings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .meaning{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 15px}
  .meaning .ml{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em}
  .meaning .mv{font-size:17px;font-weight:700;margin-top:5px}
  .meaning.clash{border-color:#4a2532;background:#150f13}
  .meaning.clash .mv{color:var(--danger)}
  .blk{display:grid;grid-template-columns:repeat(3,86px);gap:6px}
  .blk div{
    height:66px;border:1px solid var(--line);border-radius:4px;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .blk .f{font-family:var(--mono);font-size:13px;color:var(--accent)}
  .blk .r{font-size:12px;color:var(--dim)}
  .blk div.off{background:#0e1116;border-style:dashed}
  .blk div.off .f{color:var(--dimmer)}
  .blk div.body{border-color:var(--accent)}
  .qsyn{display:flex;gap:32px;align-items:flex-start;margin-top:20px}
  .qgrp{display:flex;flex-direction:column;gap:8px;align-items:center}
  .qgrp .cap{font-size:13px;color:var(--dim);white-space:nowrap}
  .qtile{width:96px;height:96px;border:1px solid var(--line);border-radius:4px;display:grid;grid-template-rows:1fr 1fr;overflow:hidden}
  .qtile.v{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .qtile span{display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.3;text-align:center}
  .qtile span:first-child{background:#1b2230} .qtile span:last-child{background:#131923}
  @media print{
    body{overflow:visible;background:#fff}
    #stage{position:static;display:block}
    #slide{display:none}
    #bar,#count,#hint,.zone,#ov{display:none !important}
    #printroot{display:block}
    #printroot .pslide{
      width:100%;height:auto;page-break-after:always;background:#0b0d10;
      border:0;border-radius:0;position:relative;
    }
  }
  #printroot{display:none}
</style>
</head>

/* ---------- visual renderers ---------- */
function tileHTML(sheet, id, label){
  const col = id % COLS, row = Math.floor(id / COLS);
  const pos = `background-position:${-col*TILE_PX}px ${-row*TILE_PX}px`;
  return `<div class="tcell">
    <div class="tile sheet-${sheet}" data-tile="${id}" style="${pos}"></div>
    <div class="tid">${id}</div><div class="tlab">${label}</div></div>`;
}
const V = {
  none: () => "",
  tiles: v => `<div class="tiles">${v.items.map(i=>tileHTML(i[0],i[1],i[2])).join("")}</div>`,
  nums: v => `<div class="nums">${v.items.map(([n,c])=>`<div class="num"><b>${n}</b><span>${c}</span></div>`).join("")}</div>`,
  table: v => {
    const head = `<tr>${v.head.map(h=>`<th>${h}</th>`).join("")}</tr>`;
    const rows = v.rows.map(r=>`<tr>${r.map((c,i)=>{
      if (v.tagcol === i) return `<td><span class="tag ${c==="사람"?"h":"w"}">${c}</span></td>`;
      const cls = [ (v.mono||[]).includes(i)?"m":"", (v.bad||[]).includes(i)?"bad":"", (v.ok||[]).includes(i)?"ok":"" ].filter(Boolean).join(" ");
      return `<td class="${cls}">${c}</td>`;
    }).join("")}</tr>`).join("");
    return `<table class="${v.dense?"dense":""}"${v.big?' style="font-size:20px"':''}>${head}${rows}</table>`;
  },
  code: v => `<pre>${v.code}</pre>`,
  chain: v => `<div class="chain">${v.items.map(([t,s],i)=>
    `<div class="row"><div class="idx">${i+1}</div><div class="box"><div class="bt">${t}</div><div class="bs">${s}</div></div></div>`).join("")}</div>`,
  fan: v => `<div class="fan"><div class="hub">${v.hub}</div><div class="pills">${
    v.pills.map(p=>`<div class="pill">${p}</div>`).join("")}</div></div>
    <div class="dg" style="margin-top:18px">${v.note}</div>`,
  triple: () => `
    <div style="display:flex;gap:22px;align-items:center">
      ${tileHTML("interior",397,"397 — 위쪽 가로선 하나")}
      <div class="dg" style="max-width:250px">픽셀이 말해주는 것은<br>“위쪽에 선이 있다” 뿐이다.<br>나머지는 전부 계층의 해석이다.</div>
    </div>
    <div class="meanings">
      <div class="meaning clash"><div class="ml">저장 오토타일</div><div class="mv">edgeS — 아래 변</div></div>
      <div class="meaning clash"><div class="ml">렌더 쿼터</div><div class="mv">Q_EDGE_N — 위 변</div></div>
      <div class="meaning"><div class="ml">주택 셸</div><div class="mv">남측 트림</div></div>
      <div class="meaning"><div class="ml">문 알코브</div><div class="mv">문턱 / 계단</div></div>
    </div>
    <div class="dg" style="margin-top:14px">위 두 칸은 상하가 반대인 좌표계다 — 같은 셀을 서로 다르게 다시 해석한다.</div>`,
  block: () => {
    const cells = [
      ["T","외딴 점"],["T+1","미사용",1],["T+2","오목 코너"],
      ["T+30","NW"],["T+31","N"],["T+32","NE"],
      ["T+60","W"],["T+61","몸통",2],["T+62","E"],
      ["T+90","SW"],["T+91","S"],["T+92","SE"]
    ];
    return `<div class="blk">${cells.map(([f,r,k])=>
      `<div class="${k===1?"off":k===2?"body":""}"><div class="f">${f}</div><div class="r">${r}</div></div>`).join("")}</div>
      <div class="qsyn">
        <div class="qgrp">
          <div class="qtile"><span>N 상반</span><span>S 하반</span></div>
          <div class="cap">가로 1칸 런</div>
        </div>
        <div class="qgrp">
          <div class="qtile v"><span>W<br>좌반</span><span>E<br>우반</span></div>
          <div class="cap">세로 1칸 런</div>
        </div>
        <div class="dg" style="align-self:center;max-width:230px">전용 타일이 없으니, 렌더가 변 타일 두 장을 절반씩 붙여 만들어 준다</div>
      </div>
      <div class="dg" style="margin-top:14px">R = 30 (행폭) · 저장 타일은 변·코너 그대로, 합성은 렌더 전용</div>`;
  },
  timeline: v => `<div class="tl">${v.rows.map(([d,h,w,big])=>
    `<div class="tlrow${big?" big":""}"><div class="d">${d}</div><div class="h">${h}</div><div class="w">${w}</div></div>`).join("")}</div>`
};

function slideHTML(s, n){
  const vis = V[s.visual.type](s.visual);
  const bullets = `<ul class="body">${s.body.map(b=>`<li>${b}</li>`).join("")}</ul>`;
  const head = `<div class="kicker">${s.kicker}</div><h1>${s.title}</h1>`;
  let mid;
  if (s.visual.type === "none") {
    mid = `<div class="stack" style="justify-content:center;max-width:1180px">
      <ul class="body" style="gap:26px;font-size:30px">${s.body.map(b=>`<li style="font-size:30px">${b}</li>`).join("")}</ul></div>`;
  } else if (s.cover) {
    mid = `<div class="stack">${bullets}<div class="vwrap">${vis}</div></div>`;
  } else {
    mid = `<div class="split" style="--lcol:${s.lcol||"42%"}">${bullets}<div class="vwrap">${vis}</div></div>`;
  }
  return `<div class="pad${s.cover?" cover":""}">${head}${mid}
    <footer>${s.evidence}</footer></div>`;
}

/* ---------- runtime ---------- */
const slideEl = document.getElementById("slide");
const barEl = document.getElementById("bar");
const countEl = document.getElementById("count");
let idx = 0;

function fit(){
  const pad = 24;
  const k = Math.min((innerWidth - pad*2)/1600, (innerHeight - pad*2)/900);
  slideEl.style.transform = `translate(-50%,-50%) scale(${k})`;
}
function render(){
  const s = SLIDES[idx];
  slideEl.innerHTML = slideHTML(s, idx+1);
  countEl.textContent = `${String(idx+1).padStart(2,"0")} / ${SLIDES.length}`;
  barEl.style.width = ((idx+1)/SLIDES.length*100) + "%";
  if (location.hash !== "#"+(idx+1)) history.replaceState(null,"","#"+(idx+1));
  fit();
}
function go(n){ idx = Math.max(0, Math.min(SLIDES.length-1, n)); render(); }

addEventListener("resize", fit);
addEventListener("keydown", e => {
  const ov = document.getElementById("ov");
  if (e.key === "Escape") { ov.classList.remove("on"); return; }
  if (e.key === "o" || e.key === "O" || e.key === "?") { ov.classList.toggle("on"); return; }
  if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); go(idx+1); }
  else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); go(idx-1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(SLIDES.length-1);
});
document.getElementById("zl").onclick = () => go(idx-1);
document.getElementById("zr").onclick = () => go(idx+1);
addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1),10);
  if (!isNaN(n) && n-1 !== idx) go(n-1);
});

/* overview */
document.getElementById("ovgrid").innerHTML = SLIDES.map((s,i)=>
  `<div class="card" data-i="${i}"><div class="n">${String(i+1).padStart(2,"0")}</div>
   <div class="k">${s.kicker}</div><div class="t">${s.title}</div></div>`).join("");
document.getElementById("ovgrid").onclick = e => {
  const c = e.target.closest(".card"); if (!c) return;
  document.getElementById("ov").classList.remove("on");
  go(+c.dataset.i);
};

/* print: expand every slide */
addEventListener("beforeprint", () => {
  document.getElementById("printroot").innerHTML =
    SLIDES.map((s,i)=>`<div class="pslide" style="position:relative;width:1600px;height:900px">${slideHTML(s,i+1)}</div>`).join("");
});

/* chipset guard: if the sheets cannot load, show labeled placeholders */
(function guard(){
  const probe = new Image();
  probe.onerror = () => document.body.classList.add("no-sheet");
  probe.src = "public/assets/easyrpg-chipset-interior.png";
})();

const start = parseInt((location.hash||"").slice(1),10);
go(isNaN(start) ? 0 : start-1);
</script>

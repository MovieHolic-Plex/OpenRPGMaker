<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">OpenRPGMaker Community 에셋 상세 페이지 목업</title>
  <desc id="desc">체커보드 투명도 배경의 픽셀 타일셋 미리보기와 상세 정보, 다운로드 버튼이 있는 한국어 에셋 페이지</desc>
  <defs>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#171d29"/>
      <rect width="16" height="16" fill="#202839"/>
      <rect x="16" y="16" width="16" height="16" fill="#202839"/>
    </pattern>
    <pattern id="fineGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2a3350" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="panelShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#05070b" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="#0d1017"/>
  <rect width="1280" height="800" fill="url(#fineGrid)" opacity="0.16"/>

  <!-- Navigation -->
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="48" y="24" width="1184" height="64" rx="14" fill="#111722" stroke="#2a3350"/>
    <g transform="translate(72 42)">
      <rect width="28" height="28" rx="7" fill="#57e6b4"/>
      <rect x="6" y="6" width="6" height="6" fill="#0d1017"/>
      <rect x="16" y="6" width="6" height="6" fill="#0d1017"/>
      <rect x="6" y="16" width="16" height="6" fill="#0d1017"/>
      <text x="42" y="21" fill="#e8ecf5" font-size="17" font-weight="800">OpenRPGMaker</text>
      <text x="179" y="21" fill="#71809f" font-size="12" font-weight="700">COMMUNITY</text>
    </g>
    <g fill="#aeb8cc" font-size="14" font-weight="700">
      <text x="826" y="63">에셋</text>
      <text x="896" y="63">게임</text>
    </g>
    <rect x="964" y="38" width="106" height="36" rx="9" fill="#1b2233" stroke="#38435f"/>
    <text x="1017" y="61" text-anchor="middle" fill="#e8ecf5" font-size="13" font-weight="750">공유하기</text>
    <rect x="1082" y="38" width="126" height="36" rx="9" fill="#1b2233" stroke="#38435f"/>
    <text x="1145" y="61" text-anchor="middle" fill="#aeb8cc" font-size="13" font-weight="750">로그인</text>
  </g>

  <!-- Breadcrumb -->
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="650">
    <text x="64" y="124" fill="#71809f">에셋</text>
    <text x="102" y="124" fill="#46516d">/</text>
    <text x="118" y="124" fill="#71809f">맵 타일</text>
    <text x="171" y="124" fill="#46516d">/</text>
    <text x="187" y="124" fill="#c6cfde">초록숲 마을 타일셋</text>
  </g>

  <!-- Preview panel -->
  <g filter="url(#panelShadow)">
    <rect x="64" y="150" width="720" height="586" rx="16" fill="#1b2233" stroke="#2a3350"/>
    <rect x="80" y="166" width="688" height="50" rx="10" fill="#151b28" stroke="#2a3350"/>
    <text x="102" y="197" fill="#bac5d8" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="750">미리보기</text>
    <rect x="651" y="178" width="94" height="26" rx="7" fill="#20283a" stroke="#35405c"/>
    <text x="698" y="195" text-anchor="middle" fill="#9eabc0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="10" font-weight="700">100% 확대</text>
    <rect x="80" y="232" width="688" height="488" rx="10" fill="url(#checker)"/>
    <!-- Tileset canvas -->
    <g transform="translate(180 280)">
      <rect width="488" height="352" fill="#15201c" stroke="#3b4660" stroke-width="2"/>
      <!-- Terrain row -->
      <g>
        <rect x="0" y="0" width="80" height="80" fill="#38714b"/><rect x="8" y="8" width="12" height="12" fill="#4c8c5b"/><rect x="52" y="24" width="14" height="10" fill="#2b5e40"/><rect x="26" y="52" width="10" height="12" fill="#54a064"/>
        <rect x="80" y="0" width="80" height="80" fill="#a68752"/><rect x="88" y="12" width="64" height="10" fill="#c0a364"/><rect x="96" y="42" width="16" height="8" fill="#80653f"/><rect x="128" y="58" width="20" height="8" fill="#d1b574"/>
        <rect x="160" y="0" width="80" height="80" fill="#24526b"/><rect x="160" y="12" width="80" height="8" fill="#33738a"/><rect x="160" y="42" width="80" height="8" fill="#33738a"/><rect x="160" y="68" width="80" height="6" fill="#1c4057"/>
        <rect x="240" y="0" width="80" height="80" fill="#39404b"/><rect x="248" y="8" width="28" height="22" fill="#4e5662"/><rect x="284" y="8" width="28" height="22" fill="#303640"/><rect x="248" y="38" width="28" height="32" fill="#303640"/><rect x="284" y="38" width="28" height="32" fill="#525a66"/>
        <rect x="320" y="0" width="80" height="80" fill="#795a3f"/><rect x="320" y="12" width="80" height="8" fill="#a77a50"/><rect x="320" y="36" width="80" height="8" fill="#a77a50"/><rect x="320" y="62" width="80" height="8" fill="#a77a50"/>
        <rect x="400" y="0" width="88" height="80" fill="#263a2f"/><rect x="412" y="12" width="24" height="24" fill="#4f8c58"/><rect x="448" y="8" width="28" height="28" fill="#62a866"/><rect x="424" y="48" width="36" height="24" fill="#39794c"/>
      </g>
      <!-- Buildings row -->
      <g transform="translate(0 80)">
        <rect width="160" height="136" fill="#244b3e"/>
        <rect x="24" y="56" width="112" height="68" fill="#d4bd87"/>
        <path d="M12 62L80 10l68 52z" fill="#8b4e49"/>
        <rect x="64" y="84" width="32" height="40" fill="#5b3d35"/>
        <rect x="38" y="76" width="20" height="20" fill="#75bac9"/><rect x="102" y="76" width="20" height="20" fill="#75bac9"/>
        <rect x="160" width="160" height="136" fill="#244b3e"/>
        <rect x="186" y="46" width="108" height="78" fill="#bd9c6c"/>
        <path d="M174 54l66-46 66 46z" fill="#526b5d"/>
        <rect x="226" y="80" width="28" height="44" fill="#4c3b32"/>
        <rect x="198" y="68" width="18" height="18" fill="#ddb96f"/><rect x="264" y="68" width="18" height="18" fill="#ddb96f"/>
        <rect x="320" width="168" height="136" fill="#1c3e35"/>
        <rect x="346" y="74" width="116" height="14" fill="#79563d"/>
        <rect x="352" y="88" width="10" height="36" fill="#5c4536"/><rect x="446" y="88" width="10" height="36" fill="#5c4536"/>
        <rect x="370" y="36" width="66" height="50" fill="#bca46b"/>
        <path d="M360 42h86l-12-24h-62z" fill="#6d4350"/>
        <rect x="392" y="56" width="22" height="30" fill="#4b382f"/>
      </g>
      <!-- Props row -->
      <g transform="translate(0 216)">
        <rect width="488" height="136" fill="#213c33"/>
        <!-- trees -->
        <rect x="30" y="62" width="14" height="54" fill="#604638"/><rect x="8" y="30" width="58" height="54" fill="#39764d"/><rect x="18" y="12" width="38" height="34" fill="#55a864"/>
        <rect x="100" y="68" width="12" height="48" fill="#604638"/><rect x="80" y="40" width="52" height="48" fill="#39764d"/><rect x="90" y="22" width="32" height="30" fill="#55a864"/>
        <!-- well -->
        <rect x="170" y="64" width="62" height="46" fill="#59616d"/><rect x="164" y="56" width="74" height="14" fill="#7c8694"/><rect x="180" y="44" width="42" height="20" fill="#1b2730"/><rect x="174" y="18" width="8" height="42" fill="#75543c"/><rect x="220" y="18" width="8" height="42" fill="#75543c"/><rect x="168" y="16" width="66" height="8" fill="#9d714b"/>
        <!-- crates -->
        <rect x="274" y="58" width="48" height="48" fill="#a47347"/><path d="M280 64l36 36m0-36l-36 36" stroke="#66472f" stroke-width="6"/>
        <rect x="330" y="74" width="36" height="36" fill="#8b603d"/><path d="M334 78l28 28m0-28l-28 28" stroke="#5f412d" stroke-width="5"/>
        <!-- lamp and flowers -->
        <rect x="404" y="38" width="8" height="72" fill="#464b56"/><rect x="394" y="38" width="28" height="28" fill="#f5c869"/><rect x="400" y="44" width="16" height="16" fill="#fff0a5"/>
        <rect x="450" y="94" width="28" height="14" fill="#73513b"/><rect x="454" y="78" width="6" height="16" fill="#57e6b4"/><rect x="464" y="72" width="6" height="22" fill="#57e6b4"/><rect x="474" y="80" width="6" height="14" fill="#57e6b4"/>
      </g>
      <!-- Pixel separators -->
      <path d="M0 80H488M0 216H488M80 0v80M160 0v80M240 0v80M320 0v80M400 0v80M160 80v136M320 80v136" stroke="#172119" stroke-width="2" opacity="0.75"/>
    </g>
    <!-- Preview footer controls -->
    <rect x="96" y="674" width="132" height="30" rx="8" fill="#151b28" stroke="#303a54"/>
    <text x="162" y="694" text-anchor="middle" fill="#8996ad" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="10" font-weight="700">체커보드 배경</text>
    <rect x="642" y="674" width="110" height="30" rx="8" fill="#151b28" stroke="#303a54"/>
    <text x="697" y="694" text-anchor="middle" fill="#8996ad" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="10" font-weight="700">512 × 512 px</text>
  </g>

  <!-- Detail column -->
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
    <g transform="translate(832 156)">
      <text x="0" y="20" fill="#57e6b4" font-size="12" font-weight="800">맵 타일</text>
      <text x="0" y="66" fill="#e8ecf5" font-size="34" font-weight="900" letter-spacing="-1.4">초록숲 마을 타일셋</text>
      <text x="0" y="94" fill="#8e9bb2" font-size="13" font-weight="600">by 달빛공방</text>

      <g transform="translate(0 120)">
        <rect width="78" height="28" rx="7" fill="#17281f" stroke="#2e6b57"/>
        <text x="39" y="19" text-anchor="middle" fill="#8ef0cd" font-size="11" font-weight="750">RPG 타일</text>
        <rect x="88" width="68" height="28" rx="7" fill="#302b1d" stroke="#695b30"/>
        <text x="122" y="19" text-anchor="middle" fill="#f5c869" font-size="11" font-weight="750">16×16</text>
        <rect x="166" width="58" height="28" rx="7" fill="#20283a" stroke="#39445f"/>
        <text x="195" y="19" text-anchor="middle" fill="#bdc7d9" font-size="11" font-weight="750">PNG</text>
      </g>

      <text x="0" y="194" fill="#cbd3e1" font-size="14" font-weight="650">숲과 작은 마을을 빠르게 구성할 수 있는</text>
      <text x="0" y="219" fill="#cbd3e1" font-size="14" font-weight="650">픽셀 타일 모음입니다. 상업 프로젝트에도 사용할 수 있어요.</text>

      <!-- Meta table -->
      <rect x="0" y="250" width="384" height="198" rx="12" fill="#151b28" stroke="#2a3350"/>
      <text x="18" y="280" fill="#77859e" font-size="11" font-weight="700">라이선스</text>
      <text x="366" y="280" text-anchor="end" fill="#e8ecf5" font-size="12" font-weight="750">CC BY 4.0</text>
      <path d="M18 298H366" stroke="#2a3350"/>
      <text x="18" y="326" fill="#77859e" font-size="11" font-weight="700">파일 크기</text>
      <text x="366" y="326" text-anchor="end" fill="#e8ecf5" font-size="12" font-weight="750">842 KB</text>
      <path d="M18 344H366" stroke="#2a3350"/>
      <text x="18" y="372" fill="#77859e" font-size="11" font-weight="700">업데이트</text>
      <text x="366" y="372" text-anchor="end" fill="#e8ecf5" font-size="12" font-weight="750">2026. 07. 18.</text>
      <path d="M18 390H366" stroke="#2a3350"/>
      <text x="18" y="418" fill="#77859e" font-size="11" font-weight="700">호환 도구</text>
      <text x="366" y="418" text-anchor="end" fill="#e8ecf5" font-size="12" font-weight="750">MV · MZ · OpenRPGMaker</text>

      <!-- Download -->
      <rect x="0" y="470" width="384" height="58" rx="12" fill="#57e6b4"/>
      <path d="M28 486v16m-7-7l7 7 7-7M21 509h14" fill="none" stroke="#0d1017" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="505" fill="#0d1017" font-size="15" font-weight="900">무료로 다운로드</text>
      <text x="360" y="505" text-anchor="end" fill="#17362c" font-size="11" font-weight="800">1,284회</text>

      <rect x="0" y="540" width="184" height="44" rx="10" fill="#1b2233" stroke="#35405c"/>
      <path d="M24 557c-4-5-12-2-12 4 0 7 12 13 12 13s12-6 12-13c0-6-8-9-12-4z" fill="none" stroke="#aeb8cc" stroke-width="1.7"/>
      <text x="50" y="568" fill="#cbd3e1" font-size="12" font-weight="750">컬렉션에 담기</text>
      <rect x="200" y="540" width="184" height="44" rx="10" fill="#1b2233" stroke="#35405c"/>
      <path d="M224 554v14m-7-7h14M218 574h12" fill="none" stroke="#aeb8cc" stroke-width="1.7" stroke-linecap="round"/>
      <text x="250" y="568" fill="#cbd3e1" font-size="12" font-weight="750">링크 공유</text>
    </g>
  </g>
</svg>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조수 데크 — 제안 목업</title>
<style>
  /* ── 토큰 (제안) ─────────────────────────────────────────── */
  :root {
    --font-ui: system-ui, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    --ink-1: #0F172A; --ink-2: #475569; --ink-3: #64748B;
    --indigo: #4A57D6; --indigo-deep: #3B47B8; --indigo-soft: #EEF0FB; --indigo-line: rgba(74,87,214,.28);
    --amber: #B45309; --amber-soft: #FFF4E0; --amber-line: rgba(180,83,9,.30);
    --moss: #2F7D4F; --moss-soft: #E7F3EA;
    --rose: #B42318; --rose-soft: #FEE9E7;
    --line: rgba(15,23,42,.10); --line-soft: rgba(15,23,42,.06); --line-strong: rgba(15,23,42,.18);
    --well: #F1F5F9; --raised: #FFFFFF;
    --glass: rgba(255,255,255,.90);
    --shadow-deck: 0 28px 64px -28px rgba(15,23,42,.38), 0 2px 8px rgba(15,23,42,.06), 0 0 0 1px rgba(15,23,42,.06);
    --shadow-pop: 0 12px 32px -12px rgba(15,23,42,.30), 0 1px 3px rgba(15,23,42,.08);
    --r-deck: 20px; --r-card: 14px; --r-ctl: 10px; --r-pill: 999px;
    --deck-w: 760px; --deck-compact-w: 480px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; font-family: var(--font-ui); color: var(--ink-1); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  body.narrow { width: 1280px; height: 800px; }
  .stage { position: relative; width: 100%; height: 100%; background: url(bg-1440.png) 0 0 / 1440px 900px no-repeat; }
  body.narrow .stage { background-image: url(bg-1280.png); background-size: 1280px 800px; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 15px; height: 15px; }
  .mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: -.01em; }

  /* ── 데크 ───────────────────────────────────────────────── */
  .deck {
    position: absolute; right: 20px; bottom: 20px; width: var(--deck-w);
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.08); backdrop-filter: blur(20px) saturate(1.08);
    border-radius: var(--r-deck); box-shadow: var(--shadow-deck);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .deck.compact { width: var(--deck-compact-w); }
  body.narrow .deck { --deck-w: 640px; }
  body.narrow .log { max-height: 400px; justify-content: flex-end; position: relative; }
  body.narrow .log::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 44px; background: linear-gradient(rgba(255,255,255,.96), rgba(255,255,255,0)); z-index: 2; pointer-events: none; }
  body.narrow .shot { height: 118px; }
  .deck .progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--indigo) 0 40%, rgba(74,87,214,.15) 40% 100%); background-size: 200% 100%; animation: sweep 1.4s linear infinite; }
  @keyframes sweep { from { background-position: 100% 0 } to { background-position: -100% 0 } }

  /* 상태 레일 */
  .rail { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line-soft); }
  .rail .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.idle { background: #94A3B8; }
  .dot.run { background: var(--indigo); box-shadow: 0 0 0 4px rgba(74,87,214,.16); animation: pulse 1.2s ease-in-out infinite; }
  .dot.warn { background: var(--amber); box-shadow: 0 0 0 4px rgba(180,83,9,.16); }
  .dot.ok { background: var(--moss); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(74,87,214,.16) } 50% { box-shadow: 0 0 0 6px rgba(74,87,214,.08) } }
  .rail .ctx { color: var(--ink-2); font-weight: 400; }
  .rail .ctx::before { content: "·"; margin: 0 6px 0 0; color: var(--ink-3); }
  .rail .state { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; margin-left: 2px; }
  .rail .state.run { color: var(--indigo-deep); }
  .rail .state.warn { color: var(--amber); font-weight: 600; }
  .rail .state.ok { color: var(--moss); }
  .rail .sp { flex: 1; }
  .ibtn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2); border: 0; background: transparent; cursor: pointer; }
  .ibtn:hover { background: rgba(15,23,42,.06); color: var(--ink-1); }
  .ibtn.on { background: rgba(15,23,42,.06); color: var(--ink-1); }

  /* 트랜스크립트 */
  .log { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 14px; max-height: 660px; overflow: hidden; }
  .acts.closed .head { border-bottom: 0; }
  .acts.closed .act { display: none; }
  .turn-user { align-self: flex-end; max-width: 78%; background: var(--indigo-soft); color: var(--ink-1); border-radius: 16px 16px 6px 16px; padding: 9px 14px; font-size: 14px; }
  .turn-ai { color: var(--ink-1); font-size: 14px; padding-right: 8px; }
  .turn-ai p { margin: 0 0 6px; }
  .turn-ai p:last-child { margin: 0; }
  .turn-ai .caret { display: inline-block; width: 8px; height: 15px; background: var(--indigo); border-radius: 2px; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { opacity: 0 } }
  .ref { color: var(--indigo-deep); text-decoration: underline dotted rgba(74,87,214,.6); text-underline-offset: 3px; cursor: pointer; font-weight: 500; }
  .coord { font-family: var(--font-mono); font-size: 12.5px; background: var(--well); padding: 1px 5px; border-radius: 5px; color: var(--ink-2); }
  .meta { font-size: 12px; color: var(--ink-2); }

  /* 작업(툴) 타임라인 */
  .acts { border: 1px solid var(--line-soft); border-radius: var(--r-card); overflow: hidden; background: rgba(255,255,255,.55); }
  .acts .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--line-soft); }
  .acts .head .n { color: var(--ink-2); font-weight: 500; }
  .acts .head .sp { flex: 1; }
  .act { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; }
  .act + .act { border-top: 1px solid var(--line-soft); }
  .chip-map { width: 46px; height: 32px; border-radius: 7px; background: url(bg-1440.png) no-repeat; background-size: 1440px 900px; box-shadow: inset 0 0 0 1px rgba(15,23,42,.14); position: relative; image-rendering: pixelated; }
  .chip-map.icon { background: var(--well); display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
  .chip-map .pin { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--indigo); box-shadow: 0 0 0 2px #fff; }
  .act .what { display: flex; flex-direction: column; min-width: 0; }
  .act .label { font-weight: 600; color: var(--ink-1); font-size: 13px; line-height: 1.3; }
  .act .sum { color: var(--ink-2); font-size: 12.5px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .act .st.ok { color: var(--moss); }
  .act .st.run { color: var(--indigo-deep); }
  .act.running .label { color: var(--indigo-deep); }
  .shimmer { background: linear-gradient(90deg, var(--ink-2) 0%, #B6BFD9 50%, var(--ink-2) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 1.6s linear infinite; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(74,87,214,.25); border-top-color: var(--indigo); animation: rot .9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg) } }

  /* 변경 카드(영수증) */
  .card { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--raised); box-shadow: 0 1px 2px rgba(15,23,42,.04); overflow: hidden; }
  .card.attn { border-color: var(--amber-line); box-shadow: 0 0 0 3px rgba(180,83,9,.08); }
  .card .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .badge { font-size: 11.5px; font-weight: 700; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; background: var(--indigo-soft); color: var(--indigo-deep); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.ok { background: var(--moss-soft); color: var(--moss); }
  .card .title { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .card .top .sp { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: var(--r-pill); background: var(--well); color: var(--ink-2); border: 1px solid var(--line-soft); }
  .chip b { color: var(--ink-1); font-weight: 600; }
  .cmp { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 0; padding: 0 14px 12px; }
  .shot { position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: url(bg-1440.png) -530px -380px / 1440px 900px no-repeat; box-shadow: inset 0 0 0 1px rgba(15,23,42,.14); image-rendering: pixelated; }
  .shot .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 7px; border-radius: 5px; background: rgba(255,255,255,.92); color: var(--ink-2); box-shadow: 0 1px 2px rgba(15,23,42,.12); }
  .shot .tag.after { color: var(--indigo-deep); }
  .shot .well { position: absolute; left: 120px; top: 34px; width: 28px; height: 28px; border-radius: 6px; background: #6B7C8F; box-shadow: inset 0 0 0 4px #A9B8C8, 0 0 0 2px rgba(74,87,214,.9); }
  .shot .well::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #2D5BA5; }
  .shot .npc { position: absolute; width: 16px; height: 22px; border-radius: 5px 5px 3px 3px; background: #E7B26A; box-shadow: inset 0 -9px 0 #7A4C2B, 0 0 0 2px rgba(74,87,214,.9); }
  .shot .diff { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 15px, rgba(74,87,214,.18) 15px 16px), repeating-linear-gradient(90deg, transparent 0 15px, rgba(74,87,214,.18) 15px 16px); mask: radial-gradient(circle at 134px 48px, #000 0 34px, transparent 36px), radial-gradient(circle at 60px 96px, #000 0 20px, transparent 22px), radial-gradient(circle at 196px 104px, #000 0 20px, transparent 22px); -webkit-mask: radial-gradient(circle at 134px 48px, #000 0 34px, transparent 36px), radial-gradient(circle at 60px 96px, #000 0 20px, transparent 22px), radial-gradient(circle at 196px 104px, #000 0 20px, transparent 22px); }
  .arrow { display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .card .foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line-soft); }
  .card .foot .sp { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-ctl); font: inherit; font-size: 13px; font-weight: 600; border: 1px solid transparent; cursor: pointer; letter-spacing: -.01em; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-1); }
  .btn.ghost:hover { background: var(--well); }
  .btn.quiet { background: transparent; color: var(--ink-2); padding: 0 8px; }
  .btn.primary { background: var(--indigo); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 12px -6px rgba(74,87,214,.6); }
  .btn.primary:hover { background: var(--indigo-deep); }
  .btn.danger-quiet { background: transparent; color: var(--rose); }

  /* 계획 카드 */
  .plan .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 14px; font-size: 13.5px; }
  .plan .step + .step { border-top: 1px solid var(--line-soft); }
  .plan .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-strong); margin-top: 2px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .plan .box.done { background: var(--moss); border-color: var(--moss); }
  .plan .box.run { border-color: var(--indigo); }
  .plan .step .d { color: var(--ink-2); font-size: 12.5px; }
  .plan .bar { height: 4px; background: var(--well); border-radius: 2px; overflow: hidden; margin: 0 14px 8px; }
  .plan .bar i { display: block; height: 100%; width: 38%; background: var(--indigo); border-radius: 2px; }

  /* 빠른 답 · 제안 */
  .quick { display: flex; gap: 8px; flex-wrap: wrap; }
  .quick .q { height: 32px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--indigo-line); color: var(--indigo-deep); background: rgba(255,255,255,.7); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .quick .q:hover { background: var(--indigo-soft); }
  .next { display: flex; align-items: center; gap: 8px; padding: 6px 0 2px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .next .k { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-weight: 600; }
  .next .s { color: var(--indigo-deep); font-weight: 500; cursor: pointer; }
  .next .s + .s::before { content: "·"; color: var(--ink-3); margin-right: 8px; font-weight: 400; }

  /* 제안 행 (빈 대화 + 포커스) */
  .sugg { padding: 10px 10px 4px; border-bottom: 1px solid var(--line-soft); }
  .sugg .hint { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); padding: 4px 8px 8px; }
  .sugg .hint .k { color: var(--amber); font-weight: 700; font-size: 11.5px; letter-spacing: .02em; padding: 2px 7px; background: var(--amber-soft); border-radius: 5px; }
  .sugg .row { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 10px; font-size: 13.5px; color: var(--ink-1); cursor: pointer; }
  .sugg .row:hover { background: rgba(15,23,42,.05); }
  .sugg .row .ic { color: var(--indigo); }
  .sugg .row .why { margin-left: auto; color: var(--ink-2); font-size: 12px; }

  /* 컴포저 */
  .composer { padding: 10px 12px 12px; }
  .ta { min-height: 44px; padding: 10px 8px 4px; font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
  .ta.typing { color: var(--ink-1); }
  .ta .cur { display: inline-block; width: 1.5px; height: 17px; background: var(--indigo); vertical-align: -3px; margin-left: 1px; }
  .crow { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 2px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 9px; background: rgba(15,23,42,.06); gap: 2px; }
  .seg span { white-space: nowrap; height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; }
  .seg span.on { background: #fff; color: var(--ink-1); box-shadow: 0 1px 2px rgba(15,23,42,.10); }
  .ctxp { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; background: rgba(255,255,255,.6); }
  .ctxp.sel { border-color: var(--indigo-line); color: var(--indigo-deep); background: var(--indigo-soft); }
  .ctxp .x { color: var(--ink-3); margin-left: 2px; }
  .crow .sp { flex: 1; }
  .model { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; height: 28px; border-radius: 7px; }
  .model:hover { background: rgba(15,23,42,.05); color: var(--ink-2); }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--indigo); color: #fff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px -6px rgba(74,87,214,.7); border: 0; }
  .send.off { background: rgba(15,23,42,.10); color: rgba(15,23,42,.35); box-shadow: none; }
  .send.stop { background: var(--ink-1); }
  .kbd { font-size: 11.5px; color: var(--ink-3); }

  /* ⋯ 메뉴 */
  .menu { position: absolute; right: 14px; top: 46px; width: 248px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow-pop); border: 1px solid var(--line); padding: 6px; z-index: 5; }
  .menu .mi { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; font-size: 13.5px; color: var(--ink-1); cursor: pointer; }
  .menu .mi:hover { background: var(--well); }
  .menu .mi .ic { color: var(--ink-2); }
  .menu .mi .r { margin-left: auto; font-size: 11.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .menu .meter { width: 44px; height: 4px; border-radius: 2px; background: var(--well); overflow: hidden; }
  .menu .meter i { display: block; height: 100%; width: 34%; background: var(--indigo); }
  .menu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 6px 4px; }

  /* 접힘 알약 */
  .pill { position: absolute; right: 20px; bottom: 20px; height: 44px; padding: 0 16px 0 14px; border-radius: var(--r-pill); background: var(--glass); backdrop-filter: blur(16px) saturate(1.08); -webkit-backdrop-filter: blur(16px) saturate(1.08); box-shadow: var(--shadow-deck); display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .pill .cnt { min-width: 20px; height: 20px; border-radius: 10px; background: var(--amber); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .pill .lbl { color: var(--ink-2); font-weight: 500; }

  .note { position: absolute; left: 320px; top: 76px; font-size: 12px; color: rgba(15,23,42,.5); }
</style>
</head>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 1 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
  <symbol id="i-sel" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>

<div class="stage" id="stage"></div>

<script>
const I = (id, cls = "") => `<svg class="i ${cls}"><use href="#${id}"/></svg>`;
const S = (state) => {
  const rail = (dot, who, ctx, stateHtml, menuOn = false) => `
    <div class="rail">
      <div class="who"><span class="dot ${dot}"></span>조수<span class="ctx">${ctx}</span></div>
      ${stateHtml ? `<span class="state ${dot}">${stateHtml}</span>` : ""}
      <span class="sp"></span>
      <button class="ibtn" title="새 대화">${I("i-plus")}</button>
      <button class="ibtn" title="이전 대화">${I("i-clock")}</button>
      <button class="ibtn ${menuOn ? "on" : ""}" title="더보기">${I("i-more")}</button>
      <button class="ibtn" title="접기">${I("i-down")}</button>
    </div>`;
  const composer = (opts = {}) => `
    <div class="composer">
      <div class="ta ${opts.typing ? "typing" : ""}">${opts.text ?? "지시하거나 물어보세요"}${opts.typing ? '<span class="cur"></span>' : ""}</div>
      <div class="crow">
        <div class="seg"><span class="${opts.mode === "ask" ? "" : opts.mode === "plan" ? "" : "on"}">지시</span><span class="${opts.mode === "ask" ? "on" : ""}">질문</span><span class="${opts.mode === "plan" ? "on" : ""}">계획</span></div>
        ${opts.noMapPin ? "" : `<span class="ctxp">${I("i-pin", "sm")}시장 마을</span>`}
        ${opts.sel ? `<span class="ctxp sel">${I("i-sel", "sm")}8×6 선택 ${I("i-x", "sm")}</span>` : ""}
        <span class="sp"></span>
        ${opts.compactIcons ? `<button class="ibtn" title="이전 대화">${I("i-clock")}</button><button class="ibtn" title="더보기">${I("i-more")}</button>` : `<span class="model">Gemini 3.7 Flash ${I("i-down", "sm")}</span>`}
        ${opts.running ? `<button class="send stop" title="멈추기 (Esc)">${I("i-stop")}</button>` : `<button class="send ${opts.typing ? "" : "off"}" title="보내기 (Enter)">${I("i-up")}</button>`}
      </div>
    </div>`;
  const user = (t) => `<div class="turn-user">${t}</div>`;
  const ai = (html) => `<div class="turn-ai">${html}</div>`;
  const act = (bg, label, sum, st, extra = "") => `
    <div class="act ${extra}">
      <div class="chip-map ${bg ? "" : "icon"}" style="${bg ? `background-position:${bg}` : ""}">${bg ? '<span class="pin"></span>' : I("i-search", "sm")}</div>
      <div class="what"><span class="label">${label}</span><span class="sum">${sum}</span></div>
      <span class="st ${st === "ok" ? "ok" : st === "run" ? "run" : ""}">${st === "ok" ? I("i-check", "sm") : st === "run" ? '<span class="spin"></span>' : ""}${st === "ok" ? "" : st === "run" ? "" : st}</span>
    </div>`;
  const acts = (rows, head, closed = false) => `<div class="acts ${closed ? "closed" : ""}"><div class="head">${I(closed ? "i-right" : "i-down", "sm")} ${head}<span class="sp"></span>${closed ? `<span class="n">펼치기</span>` : ""}</div>${rows}</div>`;
  const cmp = (afterExtras = true) => `
    <div class="cmp">
      <div class="shot"><span class="tag">지금</span></div>
      <div class="arrow">${I("i-right", "sm")}</div>
      <div class="shot"><span class="tag after">적용 후</span>${afterExtras ? '<div class="diff"></div><span class="well"></span><span class="npc" style="left:52px;top:86px"></span><span class="npc" style="left:188px;top:94px"></span>' : ""}</div>
    </div>`;
  const receipt = (attn) => `
    <div class="card ${attn ? "attn" : ""}">
      <div class="top"><span class="badge ${attn ? "warn" : ""}">${attn ? "확인 필요" : "적용됨"}</span><span class="title">우물 1 · 상인 2 · 바닥 9칸</span><span class="sp"></span><span class="meta">시장 마을</span></div>
      <div class="chips"><span class="chip">타일 <b>9</b></span><span class="chip">이벤트 <b>+2</b></span><span class="chip">DB <b>1</b></span><span class="chip">되돌릴 수 있음</span></div>
      ${cmp(true)}
      <div class="foot">
        <button class="btn quiet">${I("i-expand", "sm")} 넓게 보기</button>
        <span class="sp"></span>
        ${attn ? `<button class="btn ghost">취소</button><button class="btn primary">이 맵에 넣기 ${I("i-right", "sm")}</button>` : `<button class="btn ghost">${I("i-undo", "sm")} 되돌리기</button>`}
      </div>
    </div>`;
  const next = (items) => `<div class="next"><span class="k">${I("i-spark", "sm")} 다음</span>${items.map((t) => `<span class="s">${t}</span>`).join("")}</div>`;
  const P1 = "-640px -285px", P2 = "-676px -536px", P3 = "-1084px -290px", P4 = "-1226px -390px";
  const deck = (inner, compact = false) => `<div class="deck ${compact ? "compact" : ""}">${inner}</div>`;

  switch (state) {
    case "idle":
      return deck(composer({ compactIcons: true }), true);
    case "focused":
      return deck(`
        <div class="sugg">
          <div class="hint"><span class="k">맵 진단</span>길이 끊긴 곳이 2군데 있어요 — 장소를 만들면 길이 이어져요</div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>광장 북쪽에 우물 놓기<span class="why">빈 자리 3×3</span></div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>상인 NPC 둘 세우고 상점 창 붙이기<span class="why">시장인데 상점 0</span></div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>끊긴 길 이어 붙이기<span class="why">동쪽 · 남쪽</span></div>
        </div>
        ${composer({ typing: true, text: "", compactIcons: true })}`, true);
    case "running":
      return deck(`
        <div class="progress"></div>
        ${rail("run", "조수", "시장 마을", '<span class="spin"></span> 4단계 중 3 · 상인 배치 중')}
        <div class="log">
          ${user("시장 광장 북쪽에 우물을 하나 놓고, 상인 두 명을 광장 주변에 세워줘")}
          ${acts(
            act(P1, "맵 읽기", "시장 마을 60×45 · 이벤트 18 · 바닥 잔디/돌길", "ok") +
            act(P2, "빈 자리 찾기", "광장 북쪽 3×3 <span class='mono'>(24,11)</span>", "ok") +
            act(P1, "우물 놓기", "타일 9칸 · 돌길과 맞닿게", "ok") +
            act(P3, "상인 배치", "<span class='shimmer'>하나 (22,14) 놓는 중 …</span>", "run", "running"),
            "작업 4단계 <span class='n'>· 1.8초</span>")}
          ${ai("<p>광장 북쪽 <span class='coord'>(24,11)</span> 에 우물을 놓았습니다. 상인 둘은 광장 양쪽에 마주보게<span class='caret'></span></p>")}
        </div>
        ${composer({ running: true, text: "다음 지시를 적어 두면 이어서 합니다" })}`);
    case "review":
      return deck(`
        ${rail("warn", "조수", "시장 마을", "확인 필요 · 이 맵에 넣을까요?")}
        <div class="log">
          ${user("시장 광장 북쪽에 우물을 하나 놓고, 상인 두 명을 광장 주변에 세워줘")}
          ${acts(
            act(P1, "맵 읽기", "시장 마을 60×45 · 이벤트 18", "ok") +
            act(P2, "빈 자리 찾기", "광장 북쪽 3×3 <span class='mono'>(24,11)</span>", "ok") +
            act(P1, "우물 · 상인 밑그림", "미리보기만 · 아직 맵은 그대로", "ok"),
            "작업 3단계 <span class='n'>· 2.3초</span>")}
          ${ai("<p>광장 북쪽 <span class='coord'>(24,11)</span> 에 우물을 두고, 상인 <span class='ref'>하나</span>·<span class='ref'>두리</span>를 광장 양쪽에 마주보게 세우는 안입니다. 우물은 돌길과 맞닿아 동선이 끊기지 않습니다.</p>")}
          ${receipt(true)}
        </div>
        ${composer({ text: "고칠 점이 있으면 여기 적어 주세요" })}`);
    case "done":
      return deck(`
        ${rail("ok", "조수", "시장 마을", "완료 · 2.3초")}
        <div class="log">
          ${user("시장 광장 북쪽에 우물을 하나 놓고, 상인 두 명을 광장 주변에 세워줘")}
          ${acts(
            act(P1, "맵 읽기", "시장 마을 60×45 · 이벤트 18 · 바닥 잔디/돌길", "ok") +
            act(P2, "빈 자리 찾기", "광장 북쪽 3×3 <span class='mono'>(24,11)</span>", "ok") +
            act(P1, "우물 놓기", "타일 9칸 · 돌길과 맞닿게", "ok") +
            act(P3, "상인 배치", "<span class='ref'>하나</span> (22,14) · <span class='ref'>두리</span> (27,15) · 마주보기", "ok"),
            "작업 4단계 <span class='n'>· 2.3초 · 맵 읽기 → 빈 자리 → 우물 → 상인</span>", true)}
          ${ai("<p>광장 북쪽 <span class='coord'>(24,11)</span> 에 우물을 놓고, 상인 <span class='ref'>하나</span>와 <span class='ref'>두리</span>를 광장 양쪽에 세웠습니다. 우물은 돌길과 맞닿아 동선이 끊기지 않습니다.</p>")}
          ${receipt(false)}
          ${next(["두리에게 상점 창 붙이기", "상인 둘에게 인사 대사 넣기", "광장에 벤치·가로등 소품"])}
        </div>
        ${composer({})}`);
    case "plan":
      return deck(`
        ${rail("idle", "조수", "시장 마을", "계획 확인 중")}
        <div class="log">
          ${user("마을 동쪽에 대장간 거리를 만들어줘. 대장간 하나, 무기점 하나, 길로 광장과 이어지게")}
          ${ai("<p>동쪽 빈 땅 <span class='coord'>(40~58, 8~30)</span> 에 세울 수 있습니다. 4단계로 나눴어요. 순서를 바꾸거나 빼도 됩니다.</p>")}
          <div class="card plan">
            <div class="top"><span class="badge">계획</span><span class="title">대장간 거리 · 4단계</span><span class="sp"></span><span class="meta">예상 변경 · 맵 1 · 이벤트 6 · DB 2</span></div>
            <div class="step"><span class="box"></span><div><div>길 내기 — 광장 동문에서 동쪽 끝까지 돌길</div><div class="d">타일 약 60칸 · 기존 길과 자연 연결</div></div><span class="meta">1</span></div>
            <div class="step"><span class="box"></span><div><div>대장간 짓기 — 2층 지붕, 앞마당에 모루</div><div class="d">외장 12×9 · 실내 맵 1 · 입구 이벤트</div></div><span class="meta">2</span></div>
            <div class="step"><span class="box"></span><div><div>무기점 짓기 + 상점 창</div><div class="d">외장 9×8 · 상인 NPC 1 · 품목 동검·나무 방패</div></div><span class="meta">3</span></div>
            <div class="step"><span class="box"></span><div><div>거리 소품 — 가로등 4, 간판 2, 통 3</div><div class="d">통행 막지 않는 자리만</div></div><span class="meta">4</span></div>
            <div class="foot"><button class="btn quiet">${I("i-list", "sm")} 단계 고치기</button><span class="sp"></span><button class="btn ghost">취소</button><button class="btn primary">4단계 시작 ${I("i-right", "sm")}</button></div>
          </div>
        </div>
        ${composer({ mode: "plan", text: "「3단계는 빼고」 처럼 말해도 됩니다" })}`);
    case "ask":
      return deck(`
        ${rail("idle", "조수", "시장 마을", "")}
        <div class="log">
          ${user("이 맵에 상점이 몇 개야? 파는 물건도 알려줘")}
          ${acts(act(P4, "상점 찾기", "이벤트 18개 중 상점 창 1", "ok"), "조회 1단계 <span class='n'>· 0.6초</span>")}
          ${ai("<p>상점은 <span class='ref'>두리의 무기점</span> 하나입니다. 광장 동쪽 <span class='coord'>(27,15)</span> 에 있고, 품목은 <b>동검</b>(120G)·<b>나무 방패</b>(80G) 둘이에요.</p><p>「시장 마을」인데 상점이 하나뿐이라 조금 비어 보일 수 있어요.</p>")}
          <div class="quick"><span class="q">${I("i-shop", "sm")} 잡화점 하나 더 만들기</span><span class="q">${I("i-eye", "sm")} 두리의 품목 보기</span><span class="q">아니, 이대로 둘게</span></div>
        </div>
        ${composer({ mode: "ask" })}`);
    case "menu":
      return deck(`
        ${rail("ok", "조수", "시장 마을", "완료 · 2.3초", true)}
        <div class="menu">
          <div class="mi"><span class="ic">${I("i-compress")}</span>맥락 압축<span class="r">34% <span class="meter"><i></i></span></span></div>
          <div class="mi"><span class="ic">${I("i-book")}</span>감독 지침<span class="r">3줄</span></div>
          <div class="mi"><span class="ic">${I("i-scroll")}</span>전체 기록</div>
          <div class="mi"><span class="ic">${I("i-export")}</span>대화 내보내기</div>
          <hr>
          <div class="mi"><span class="ic">${I("i-wrench")}</span>도구 목록<span class="r">190</span></div>
          <div class="mi"><span class="ic">${I("i-gear")}</span>설정<span class="r">Gemini 3.7 Flash</span></div>
        </div>
        <div class="log">
          ${user("시장 광장 북쪽에 우물을 하나 놓고, 상인 두 명을 광장 주변에 세워줘")}
          ${acts(
            act(P1, "맵 읽기", "시장 마을 60×45 · 이벤트 18 · 바닥 잔디/돌길", "ok") +
            act(P2, "빈 자리 찾기", "광장 북쪽 3×3 <span class='mono'>(24,11)</span>", "ok") +
            act(P1, "우물 놓기", "타일 9칸 · 돌길과 맞닿게", "ok") +
            act(P3, "상인 배치", "<span class='ref'>하나</span> (22,14) · <span class='ref'>두리</span> (27,15)", "ok"),
            "작업 4단계 <span class='n'>· 2.3초 · 맵 읽기 → 빈 자리 → 우물 → 상인</span>", true)}
          ${ai("<p>광장 북쪽 <span class='coord'>(24,11)</span> 에 우물을 놓고, 상인 <span class='ref'>하나</span>와 <span class='ref'>두리</span>를 광장 양쪽에 세웠습니다.</p>")}
          ${receipt(false)}
        </div>
        ${composer({})}`);
    case "collapsed":
      return `<div class="pill"><span class="dot idle"></span>조수</div>`;
    case "collapsed-run":
      return `<div class="pill"><span class="spin"></span>조수<span class="lbl">상인 배치 중 · 3/4</span></div>`;
    case "collapsed-attn":
      return `<div class="pill"><span class="dot warn"></span>조수<span class="lbl">확인 필요</span><span class="cnt">1</span></div>`;
    case "selection":
      return deck(`
        <div class="sugg">
          <div class="hint"><span class="k" style="background:var(--indigo-soft);color:var(--indigo-deep)">선택 8×6</span>선택한 자리에만 작업합니다 — 밖은 건드리지 않아요</div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>이 자리를 작은 광장으로 다듬기<span class="why">돌길 + 화단</span></div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>여기에 집 한 채<span class="why">문은 남쪽</span></div>
          <div class="row"><span class="ic">${I("i-spark", "sm")}</span>나무·바위로 자연스럽게 채우기<span class="why">통행 유지</span></div>
        </div>
        ${composer({ typing: true, text: "", compactIcons: true, sel: true, noMapPin: true })}`, true);
    default:
      return `<div class="note">unknown state: ${state}</div>`;
  }
};
const render = () => {
  const h = location.hash.replace("#", "") || "idle";
  const [state, mod] = h.split("@");
  document.body.classList.toggle("narrow", mod === "narrow");
  document.getElementById("stage").innerHTML = S(state);
};
addEventListener("hashchange", render); render();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OPRN Studio 목업</title>
<style>
  :root{
    --bg:#f3f4f8; --panel:#fff; --line:#e4e6ee; --text:#1c1e26; --muted:#6b7080;
    --accent:#4f5bd5; --accent-soft:#eceefc; --ok:#2f9e6a; --warn:#d98a1f; --bad:#c0392b; --r:10px;
    font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-size:13px;word-break:keep-all;overflow-wrap:anywhere}
  .app{display:grid;grid-template-rows:48px 1fr;height:100vh}

  /* ── 슬림 상단바 ── */
  .top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{font-weight:700;display:flex;align-items:center;gap:6px}
  .logo b{color:var(--accent)}
  .proj{font-weight:600}
  .proj small{color:var(--muted);font-weight:400;margin-left:6px}
  .save{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.warn{background:var(--warn)}
  .mode{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid #c9cdf5;border-radius:999px;padding:5px 12px;font-weight:600;font-size:12px}
  .mode .dot{background:var(--accent)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.gh{border-color:transparent;color:var(--muted)}
  .btn.sm{padding:3px 9px;font-size:11.5px;border-radius:6px}
  .btn.danger{color:var(--bad)}
  .kbd{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}

  /* ── 3칼럼 ── */
  .body{display:grid;grid-template-columns:var(--scenes,200px) 1fr var(--chat,340px);gap:10px;padding:10px;min-height:0}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* 장면 레일 */
  .rail-h{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;font-weight:700}
  .rail-h .n{color:var(--muted);font-weight:500}
  .rail-h .sp{margin-left:auto;display:flex;gap:4px}
  .icon{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted);border:1px solid transparent}
  .search{margin:0 12px 8px;background:#f0f1f6;border-radius:8px;padding:6px 10px;color:var(--muted);display:flex;gap:6px;align-items:center;font-size:12px}
  .tree{overflow:auto;padding:0 8px 8px;flex:1}
  .node{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px}
  .node.cur{background:var(--accent-soft)}
  .node .th{width:26px;height:22px;border-radius:4px;background:#8fc75d url(thumb.png) center/cover;flex:none}
  .node .th.in{background:#c7b8a2}
  .node .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .tag{font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px}
  .node .av{width:16px;height:16px;font-size:9px}
  .node.child{padding-left:26px}
  .node .car{color:var(--muted);width:10px}
  .av{width:22px;height:22px;border-radius:50%;background:#dfe3ff;color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
  .av.b{background:#ffe9cf;color:#b8690f}.av.c{background:#d9f3e6;color:#1f7a4e}.av.d{background:#ececf0;color:#6b7080}.av.dir{background:var(--accent);color:#fff}

  /* 모니터 */
  .mon{position:relative}
  .mon-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .mon-h .t{font-weight:700;font-size:14px}
  .chip{background:#f0f1f6;border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--muted)}
  .mon-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
  .zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .zoom span{padding:5px 9px;font-size:12px}
  .zoom span.v{border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--muted)}
  .canvas{flex:1;position:relative;background:#e8ecd9;overflow:hidden;min-height:0}
  .canvas img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
  .gh{position:absolute;left:44%;top:7%;width:30%;height:30%;border:2px dashed var(--accent);background:rgba(79,91,213,.18);border-radius:6px}
  .gh b{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
  .gh i{position:absolute;right:8px;bottom:8px;background:#fff;color:var(--text);font-size:11px;padding:3px 8px;border-radius:6px;font-style:normal}
  .fit-hint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
  .live{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
  .live div{width:96px;height:64px;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#8fc75d url(map-full.png) 60% 30%/400% no-repeat;position:relative;overflow:hidden}
  .live div span{position:absolute;left:0;right:0;bottom:0;background:rgba(28,30,38,.8);color:#fff;font-size:10px;padding:2px 6px}

  /* ── 하단 레인 보드 (에이전트별 작업판) ── */
  .deck{border-top:1px solid var(--line);height:var(--deck,244px);display:flex;flex-direction:column;background:#fff;flex:none;position:relative}
  .deck.mini{height:42px}
  .grab{position:absolute;left:50%;top:-1px;transform:translateX(-50%);width:44px;height:5px;border-radius:0 0 4px 4px;background:#d3d6e0}
  .deck-h{display:flex;align-items:center;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);height:40px}
  .deck-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:4px}
  .deck-h .cap{color:var(--muted);font-size:12px;margin-left:10px}
  .lanes{flex:1;overflow:auto}
  table.lt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:auto}
  .lt th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd;position:sticky;top:0}
  .lt td{padding:6px 10px;border-bottom:1px solid #f0f1f6;vertical-align:middle;white-space:nowrap}
  .lt tr.sel td{background:var(--accent-soft)}
  .lt tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .ag{display:flex;align-items:center;gap:8px}
  .ag .nm{font-weight:600}
  .ag small{display:block;color:var(--muted);font-size:11px;font-weight:400}
  .stb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px}
  .stb.busy{background:#fff4e5;color:var(--warn)}.stb.ready{background:#e6f7ee;color:var(--ok)}.stb.idle{background:#f0f1f6;color:var(--muted)}.stb.warn{background:#fdecea;color:var(--bad)}
  .bun small{display:block;color:var(--muted);font-size:11px}
  .prog{min-width:170px}
  .prog .nums{color:var(--muted);font-size:11.5px;display:flex;gap:8px}
  .prog .bar{margin-top:4px;height:5px}
  .last{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  .lt .acts{margin:0;gap:4px;justify-content:flex-end}
  .lt .acts .btn{flex:none}
  .deck-mini{display:flex;align-items:center;gap:10px;padding:0 12px;height:100%;color:var(--muted);font-size:12.5px}
  .deck-mini b{color:var(--text)}
  .deck-mini .sp{margin-left:auto;display:flex;gap:6px}

  /* 우측 스레드 칼럼 */
  .th-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .th-h b{font-size:13.5px}
  .th-h small{color:var(--muted);font-size:11.5px}
  .th-h .sp{margin-left:auto;display:flex;gap:4px}
  .back{color:var(--muted);font-size:12px;margin-right:2px}
  .badge{background:var(--accent);color:#fff;font-size:10px;border-radius:999px;padding:0 6px;line-height:16px}
  .badge.grey{background:#dfe1ea;color:var(--muted)}
  .tab{padding:8px 10px;color:var(--muted);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
  .tab.on{color:var(--accent);border-color:var(--accent)}
  .log{flex:1;overflow:auto;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px}
  .start{border:1px solid var(--line);border-radius:12px;padding:16px;background:linear-gradient(180deg,#fafbff,#fff)}
  .start h3{font-size:15px;margin-bottom:6px}
  .start p{color:var(--muted);font-size:12.5px;line-height:1.55;margin-bottom:12px}
  .ex{display:flex;flex-direction:column;gap:6px}
  .ex button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text)}
  .ex button::before{content:"↳ ";color:var(--accent)}
  .msg{max-width:92%;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.dir{background:#f0f1f6;border-bottom-left-radius:4px}
  .msg .who{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card .r{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .card .r b{flex:1}
  .card .r small{color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:#eceefc;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:25%;background:var(--accent)}
  .bar i.ok{background:var(--ok)}
  .steps{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .steps .done{color:var(--ok)}
  .steps .now{color:var(--text);font-weight:600}
  .steps code{font-family:ui-monospace,monospace;font-size:11px;background:#f0f1f6;border-radius:4px;padding:0 4px;color:var(--text)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
  .kv span{color:var(--muted)}
  .comp{border-top:1px solid var(--line);padding:10px 12px 12px}
  .ta{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:64px;color:var(--muted);font-size:13px;line-height:1.5;background:#fafbfd}
  .ta.filled{color:var(--text);background:#fff}
  .meta{display:flex;align-items:center;gap:6px;margin-top:8px}
  .meta .chip{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--line)}
  .meta .chip.to{background:var(--accent-soft);border-color:#c9cdf5;color:var(--accent);font-weight:600}
  .meta .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
  .send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
  .send.off{background:#dfe1ea;color:#fff}

  /* 접힌 레일 */
  .rail-mini{width:56px;align-items:center;padding:10px 0;gap:8px}
  .rail-mini .th{width:34px;height:28px;border-radius:6px;background:#8fc75d url(thumb.png) center/cover;border:2px solid transparent;position:relative}
  .rail-mini .th.cur{border-color:var(--accent)}
  .rail-mini .th.in{background:#c7b8a2}
  .rail-mini .th .av{position:absolute;right:-6px;top:-6px;width:14px;height:14px;font-size:8px;border:1px solid #fff}
  .rail-mini .more{font-size:11px;color:var(--muted)}
  .tip{position:absolute;background:#1c1e26;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap}
  .tip::before{content:"";position:absolute;left:-5px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:#1c1e26;border-left:0}

  /* 변경 썸네일 */
  .diff{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .diff div{aspect-ratio:4/3;border-radius:8px;background:#8fc75d url(map-full.png) 40% 10%/300% no-repeat;position:relative;border:1px solid var(--line)}
  .diff div span{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.9);font-size:10.5px;padding:2px 6px;border-radius:4px}
  .diff div.after::after{content:"";position:absolute;inset:18% 20% 40% 22%;border:2px dashed var(--accent);background:rgba(79,91,213,.2);border-radius:4px}
  .acts{display:flex;gap:6px;margin-top:8px}
  .acts .btn{flex:1;justify-content:center}

  .note{position:fixed;left:50%;top:11px;transform:translateX(-50%);background:#1c1e26;color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;opacity:.9}
</style>
</head>
<body>
<script>
const q=new URLSearchParams(location.search);
const V=q.get("v")||"entry";  // entry | work | lane | narrow
document.documentElement.style.setProperty("--scenes", V==="narrow"?"56px":"200px");
document.documentElement.style.setProperty("--chat", V==="narrow"?"320px":"340px");
document.documentElement.style.setProperty("--deck", V==="narrow"?"268px":"284px");
</script>

<div class="app">
  <header class="top">
    <div class="logo"><b>✦</b> OPRN Studio</div>
    <div class="proj">이슬 장터 <small>30분 전 편집 ⌄</small></div>
    <div class="save" id="save"><span class="dot"></span> 저장됨</div>
    <div class="mode"><span class="dot"></span> 스튜디오</div>
    <span class="btn quiet">🔍 <span class="kbd">Ctrl K</span></span>
    <span class="btn primary">▶ 테스트</span>
    <span class="btn">← 편집기로</span>
  </header>

  <div class="body">
    <aside class="col" id="rail"></aside>

    <main class="col mon">
      <div class="mon-h">
        <span class="t" id="montitle">이슬 장터 마을</span>
        <span class="chip">100×100</span><span class="chip">이벤트 20</span><span class="chip">바닥</span>
        <div class="sp">
          <span class="btn" title="맵 전체가 보이게">⤢ 맞춤</span>
          <span class="zoom"><span>−</span><span class="v">1x</span><span>+</span></span>
          <span class="btn">장면 설정 ⌄</span>
        </div>
      </div>
      <div class="canvas" id="canvas">
        <img src="map-full.png" alt="">
        <div class="fit-hint">진입 시 자동 맞춤 · 스크롤로 확대</div>
      </div>
      <div id="deckslot"></div>
    </main>

    <aside class="col" id="chat"></aside>
  </div>
</div>

<script>
const rail=document.getElementById("rail"), chat=document.getElementById("chat"), canvas=document.getElementById("canvas");
const houses=["민재의 집 내부","소라의 집 내부","대길의 집 내부","연화의 집 내부","준호의 집 내부","다솜의 집 내부","태식의 집 내부","보라의 집 내부","한결의 집 내부","미선의 집 내부","민재2의 집 내부","소라2의 집 내부"];
const outs=["달빛 숲","폐광 입구","종탑 사당"];
// 장면에 붙은 레인 (에이전트 이니셜) — 레일에도 같은 표식
const laneOn={"이슬 장터 마을":"A","달빛 숲":"B","폐광 입구":"C"};
const avCls={A:"",B:"b",C:"c",D:"d"};

function fullRail(withLanes){
  const mark=n=>withLanes&&laneOn[n]?`<span class="av ${avCls[laneOn[n]]}" title="레인 ${laneOn[n]}">${laneOn[n]}</span>`:"";
  const kids=[...outs.map(n=>`<div class="node child"><span class="car"></span><span class="th"></span><span class="nm">${n}</span>${mark(n)}</div>`),
              ...houses.map(n=>`<div class="node child"><span class="car"></span><span class="th in"></span><span class="nm">${n}</span></div>`)].join("");
  return `<div class="rail-h">장면 <span class="n">16</span><span class="sp"><span class="icon">＋</span><span class="icon" title="레일 접기">«</span></span></div>
    <div class="search">🔍 장면 찾기</div>
    <div class="tree">
      <div class="node cur"><span class="car">▾</span><span class="th"></span><span class="nm"><b>이슬 장터 마을</b></span><span class="tag">시작</span>${mark("이슬 장터 마을")}</div>
      ${kids}
    </div>`;
}
function miniRail(){
  const m=k=>`<span class="av ${avCls[k]}">${k}</span>`;
  return `<div class="rail-mini" style="display:flex;flex-direction:column;position:relative">
    <span class="icon" title="펼치기">»</span>
    <span class="th cur">${m("A")}</span><span class="th">${m("B")}</span><span class="th">${m("C")}</span><span class="th"></span>${houses.slice(0,6).map(()=>'<span class="th"></span>'.replace('class="th"','class="th in"')).join("")}
    <span class="more">+6</span>
  </div>`;
}

/* ── 레인 데이터: 스펙 §5 「동시 4~6 레인」 규모를 보이도록 4개 ── */
const lanes=[
  {k:"A",name:"시공A",prov:"Antigravity · gemini-3-pro",st:"busy",stl:"● 작업 중",bun:"이슬 장터 마을",bsub:"실내 12 포함",turn:"3/12턴",tool:"툴 27",time:"2분 10초",pct:25,
   last:"오두막 배치 및 문 이벤트 — place_event(18,7) 「오두막 문」",acts:'<span class="btn sm">중단</span><span class="icon" title="레인 스레드 열기">›</span>'},
  {k:"B",name:"시공B",prov:"OpenAI Codex · gpt-5-codex",st:"ready",stl:"✓ 결과 도착",bun:"달빛 숲",bsub:"실내 0",turn:"9/12턴",tool:"툴 61",time:"4분 12초",pct:100,
   last:"사당 앞 길 정비 + 횃불 2 · 통행 검사 통과. 적용 대기 중입니다.",acts:'<span class="btn sm primary">적용</span><span class="btn sm">버리기</span><span class="icon" title="레인 스레드 열기">›</span>'},
  {k:"C",name:"장식C",prov:"Antigravity · gemini-3-flash",st:"busy",stl:"● 작업 중",bun:"폐광 입구",bsub:"실내 0",turn:"6/10턴",tool:"툴 40",time:"3분 05초",pct:60,
   last:"광차 레일 타일 12칸 · 낡은 표지판 이벤트 추가 중",acts:'<span class="btn sm">중단</span><span class="icon" title="레인 스레드 열기">›</span>'},
  {k:"D",name:"검수D",prov:"OpenAI Codex · gpt-5-codex",st:"idle",stl:"○ 대기",bun:"—",bsub:"시공B 적용 후 검수 예약",turn:"0턴",tool:"툴 0",time:"—",pct:0,
   last:"시공B 결과가 적용되면 달빛 숲 통행·이벤트 검수를 시작합니다.",acts:'<span class="btn sm">장면 맡기기</span>'},
];
const laneRow=(l,sel)=>`<tr class="${sel?"sel":""}">
  <td><div class="ag"><span class="av ${avCls[l.k]}">${l.k}</span><div><span class="nm">${l.name}</span><small>${l.prov}</small></div></div></td>
  <td><span class="stb ${l.st}">${l.stl}</span></td>
  <td class="bun">${l.bun}<small>${l.bsub}</small></td>
  <td class="prog"><div class="nums"><span>${l.turn}</span><span>${l.tool}</span><span>${l.time}</span></div><div class="bar"><i class="${l.st==="ready"?"ok":""}" style="width:${l.pct}%"></i></div></td>
  <td class="last">${l.last}</td>
  <td><div class="acts">${l.acts}</div></td></tr>`;
const deckTabs=(on,b)=>["레인","변경","활동"].map(t=>`<span class="tab ${t===on?"on":""}">${t}${b[t]?`<span class="badge ${b[t].grey?"grey":""}">${b[t].n}</span>`:""}</span>`).join("");
function deck(sel){
  return `<div class="deck"><span class="grab" title="드래그해서 높이 조절"></span>
    <div class="deck-h">${deckTabs("레인",{"레인":{n:4},"변경":{n:2},"활동":{n:31,grey:1}})}
      <span class="cap">작업 중 2 · 결과 대기 1 · 대기 1</span>
      <div class="sp"><span class="btn sm">팀장에게 맡기기</span><span class="btn sm primary">＋ 새 레인</span><span class="icon" title="보드 접기">⌄</span></div></div>
    <div class="lanes"><table class="lt">
      <thead><tr><th>에이전트</th><th>상태</th><th>묶음 (장면)</th><th>턴 · 툴 · 경과</th><th>마지막 줄</th><th></th></tr></thead>
      <tbody>${lanes.map(l=>laneRow(l,l.k===sel)).join("")}</tbody></table></div></div>`;
}
const deckMini=()=>`<div class="deck mini"><span class="grab"></span><div class="deck-mini"><b>레인 0</b> 지시를 보내면 감독이 에이전트를 배정하고, 레인이 여기 한 줄씩 쌓입니다.
  <span class="sp"><span class="btn sm">팀장에게 맡기기</span><span class="btn sm primary">＋ 새 레인</span></span></div></div>`;

/* ── 우측: 받는 이가 감독이면 감독 스레드, 레인이면 그 레인 스레드 ── */
const composer=(to,ph,filled)=>`<div class="comp">
  <div class="ta ${filled?"filled":""}">${filled||ph}</div>
  <div class="meta"><span class="chip to">→ ${to}</span><span class="chip">📍 이슬 장터 마을</span><span class="sp"><span class="icon" title="모델 · 예산 · 자율성">⚙</span><span class="send ${filled?"":"off"}">↑</span></span></div>
</div>`;
const dirHead=()=>`<div class="th-h"><span class="av dir">감</span><div><b>감독</b><br><small>질문 · 계획 · 배정</small></div><span class="sp"><span class="icon">⋯</span><span class="icon" title="칼럼 접기">»</span></span></div>`;

function chatEntry(){
  return dirHead()+`<div class="log">
    <div class="start"><h3>이 마을에 무엇을 할까요?</h3>
      <p>한 문장으로 말하면 감독이 에이전트를 배정합니다. 배정된 에이전트는 아래 레인 보드에 한 줄씩 뜨고, 시공 과정은 맵 위에 실시간으로 표시됩니다.</p>
      <div class="ex"><button>마을 북쪽에 작은 숲과 오두막 추가</button><button>집 내부 12곳에 주인 NPC와 대화 채우기</button><button>길이 끊긴 곳·겹친 이벤트 전체 검사</button></div>
    </div>
  </div>`+composer("감독","예: 마을 북쪽에 작은 숲과 오두막을 추가해줘","");
}
function chatDirector(){
  return dirHead()+`<div class="log">
    <div class="msg me">마을 북쪽에 작은 숲과 오두막을 추가해줘. 달빛 숲 사당 앞도 정비하고, 폐광 입구는 분위기만 살려줘.</div>
    <div class="msg dir"><span class="who">감독</span>세 묶음으로 나눠 배정했습니다.<br>· <b>시공A</b> → 이슬 장터 마을 북쪽 숲 + 오두막<br>· <b>시공B</b> → 달빛 숲 사당 앞 길 정비<br>· <b>장식C</b> → 폐광 입구 장식<br>검수D 는 시공B 가 끝나면 붙입니다. 진행은 아래 레인 보드에서 보세요.</div>
    <div class="msg dir"><span class="who">감독</span><b>시공B</b> 결과가 도착했습니다. 보드에서 「적용」하거나, 행을 눌러 결과를 먼저 확인하세요.</div>
    <div class="msg dir"><span class="who">감독</span>오두막 주인 NPC 도 넣을까요? <u>넣기</u> · <u>건너뛰기</u></div>
  </div>`+composer("감독","감독에게 · 예: 시공A 는 오두막을 두 채로","");
}
function chatLane(){
  return `<div class="th-h"><span class="back">‹ 감독</span><span class="av b">B</span><div><b>시공B</b> <small>레인 스레드</small><br><small>OpenAI Codex · gpt-5-codex</small></div><span class="sp"><span class="icon">⋯</span><span class="icon">»</span></span></div>
  <div class="log">
    <div class="card"><div class="r"><b>레인 정보</b><span class="stb ready">✓ 결과 도착</span></div>
      <div class="kv"><span>묶음</span><div>달빛 숲 (실내 0)</div><span>지시</span><div>사당 앞 길을 정비하고 횃불을 놓아 밤에도 보이게</div><span>예산</span><div>12턴 · 10분 · 자율성 중</div><span>사용</span><div>9턴 · 툴 61 · 4분 12초</div></div></div>
    <div class="card"><div class="r"><b>과정</b><small>툴 호출 61</small></div>
      <div class="steps"><span class="done">✓ <code>map_read</code> 달빛 숲 40×30</span><span class="done">✓ <code>paint_tiles</code> 사당 앞 길 34칸</span><span class="done">✓ <code>place_event</code> 횃불 ×2 (자동 점등)</span><span class="done">✓ <code>check_walk</code> 통행 검사 통과</span><span class="done">✓ 결과 제출 (9/12턴)</span></div></div>
    <div class="card"><div class="r"><b>결과 · 달빛 숲</b><small>이 레인만 적용됩니다</small></div>
      <div class="diff" style="margin-top:8px"><div><span>이전</span></div><div class="after"><span>이후</span></div></div>
      <div class="acts"><span class="btn primary">적용</span><span class="btn">버리기</span><span class="btn">검수 붙이기</span></div>
      <div class="acts" style="margin-top:6px"><span class="btn quiet">지시 고쳐 다시</span><span class="btn quiet">모델 바꿔 다시</span></div></div>
  </div>`+composer("시공B","시공B 에게 후속 지시 · 예: 사당 문 앞에 돌계단 3칸","");
}

const ghostA='<div class="gh"><b>시공A · 북쓱 숲과 오두막</b><i>3/12턴</i></div>'.replace("북쓱","북쪽");
const liveThumbs='<div class="live"><div><span>B · 달빛 숲 ✓</span></div><div><span>C · 폐광 입구 ●</span></div></div>';

const notes={
  entry:"목업 1 · 1440×900 · 진입 직후 — 레인 0, 하단 보드는 한 줄로 접힘",
  work:"목업 2 · 1440×900 · 레인 4개 동시 — 하단 보드가 에이전트별 진행판, 우측은 감독 스레드",
  lane:"목업 3 · 1440×900 · 보드에서 시공B 행 선택 → 우측이 그 레인 스레드(과정·결과·이 레인만 적용)",
  narrow:"목업 4 · 1280×800 · 장면 레일 접힘, 보드는 4레인 그대로(268px)",
};
const slot=document.getElementById("deckslot");
if(V==="entry"){ rail.innerHTML=fullRail(false); chat.innerHTML=chatEntry(); slot.outerHTML=deckMini(); }
if(V==="work"){ rail.innerHTML=fullRail(true); chat.innerHTML=chatDirector(); slot.outerHTML=deck(null); canvas.insertAdjacentHTML("beforeend",ghostA+liveThumbs); }
if(V==="lane"){ rail.innerHTML=fullRail(true); chat.innerHTML=chatLane(); slot.outerHTML=deck("B"); canvas.insertAdjacentHTML("beforeend",ghostA+liveThumbs); }
if(V==="narrow"){ rail.innerHTML=miniRail(); rail.classList.add("rail-mini"); chat.innerHTML=chatDirector(); slot.outerHTML=deck(null); canvas.insertAdjacentHTML("beforeend",ghostA); document.getElementById("save").innerHTML='<span class="dot warn"></span> 오프라인 · 로컬 보관'; }
document.body.insertAdjacentHTML("beforeend",`<div class="note">${notes[V]}</div>`);
</script>
</body>
</html>

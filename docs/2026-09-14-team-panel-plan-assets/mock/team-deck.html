<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀 데크 목업</title>
<style>
  :root {
    --bg-raised: #FFFFFF; --bg-inset: #EEF1F4; --bg-hover: rgba(15,23,42,.05);
    --border-subtle: rgba(15,23,42,.08); --border-default: rgba(15,23,42,.127); --border-strong: rgba(15,23,42,.461);
    --text-1: #0F172A; --text-2: #475569; --text-3: #626E89; --text-disabled: #9AA3B5;
    --accent: #4A57D6; --accent-muted: rgba(74,87,214,.12); --accent-border: rgba(74,87,214,.45); --on-accent: #fff;
    --danger: #C6403D; --danger-muted: rgba(198,64,61,.12); --success: #18764F; --success-muted: rgba(24,118,79,.12);
    --warning: #8A5E00; --warning-muted: rgba(138,94,0,.13);
    --font-ui: system-ui, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --deck-glass: rgba(255,255,255,.86); --deck-line: rgba(15,23,42,.06); --deck-radius: 20px;
    --deck-shadow: 0 18px 48px rgba(15,23,42,.18), 0 2px 6px rgba(15,23,42,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-ui); color: var(--text-1); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; overflow: hidden; background: #dfe3e8 center/cover no-repeat; }
  .stage img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 팀 데크 ─────────────────────────────── */
  .team-deck {
    position: absolute; display: flex; flex-direction: column;
    background: var(--deck-glass); backdrop-filter: blur(20px) saturate(1.08);
    border-radius: var(--deck-radius); box-shadow: var(--deck-shadow);
    width: var(--deck-w, 640px); max-height: var(--deck-h, 72%); overflow: hidden;
  }
  .rail { position: relative; display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--deck-line); }
  .rail[data-state="run"]::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; border-radius: var(--deck-radius) var(--deck-radius) 0 0;
    background: linear-gradient(90deg, var(--accent) 0 40%, var(--accent-muted) 40% 100%); }
  .who { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-disabled); flex: none; }
  .dot[data-state="run"] { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-muted); }
  .dot[data-state="attention"] { background: var(--warning); box-shadow: 0 0 0 4px var(--warning-muted); }
  .dot[data-state="done"] { background: var(--success); }
  .ctx { color: var(--text-2); font-weight: 400; }
  .ctx::before { content: "·"; margin-right: 8px; color: var(--text-3); }
  .rail-state { color: var(--text-2); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-state.run { color: var(--accent); }
  .rail-state.attention { color: var(--warning); }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 2px; align-items: center; }
  .ibtn { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; font-size: 14px; }
  .ibtn.stop { color: var(--danger); }
  .ibtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  .tabs { display: flex; gap: 2px; padding: 8px 14px 0; }
  .tab { padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--text-2); border: 1px solid transparent; }
  .tab.on { background: var(--bg-raised); border-color: var(--border-default); color: var(--text-1); font-weight: 600; }
  .tab .n { color: var(--text-3); margin-left: 4px; font-weight: 400; }

  .body { display: grid; grid-template-columns: 200px minmax(0,1fr); min-height: 0; flex: 1 1 auto; }
  .members { border-right: 1px solid var(--deck-line); padding: 8px 6px 8px 10px; display: grid; gap: 4px; align-content: start; overflow: auto; }
  .member { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 7px 8px; border-radius: 10px; border: 1px solid transparent; }
  .member.on { background: var(--bg-raised); border-color: var(--border-default); }
  .member .head { display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--accent-muted); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .badge.lead { background: var(--accent-muted); color: var(--accent); }
  .badge.builder { background: var(--success-muted); color: var(--success); }
  .badge.reviewer { background: var(--warning-muted); color: var(--warning); }
  .member .name { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .member .where { font-size: 11px; color: var(--text-3); }
  .member .meta { font-size: 11px; color: var(--text-2); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
  .spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent-muted); border-top-color: var(--accent); display: inline-block; }
  .st-done { color: var(--success); }
  .st-fail { color: var(--danger); }
  .member.dim { opacity: .55; }

  .transcript { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .t-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; border-bottom: 1px solid var(--deck-line); }
  .t-head .name { font-weight: 600; white-space: nowrap; }
  .t-head .meta { color: var(--text-3); font-size: 11.5px; }
  .t-head .mapchip { margin-left: auto; width: 54px; height: 36px; border-radius: 6px; background:
     repeating-linear-gradient(90deg, #7bb661 0 6px, #86c46a 6px 12px), #7bb661; position: relative; overflow: hidden; border: 1px solid var(--border-default); }
  .t-head .mapchip::after { content: ""; position: absolute; left: 14px; top: 8px; width: 22px; height: 14px; background: #b9834a; border: 1px solid #7a4d22; }
  .t-list { padding: 8px 12px 10px; display: grid; gap: 4px; overflow: auto; align-content: start; }
  .task { background: var(--bg-inset); border-radius: 10px; padding: 7px 10px; font-size: 12px; color: var(--text-2); }
  .task b { color: var(--text-1); font-weight: 600; margin-right: 6px; }
  .turn { font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; padding: 6px 2px 0; }
  .act { display: grid; grid-template-columns: 22px minmax(0,1fr) 18px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; }
  .act:hover { background: var(--bg-hover); }
  .act .chip { width: 22px; height: 22px; border-radius: 6px; background: var(--bg-inset); display: grid; place-items: center; color: var(--text-2); font-size: 11px; }
  .act .what { min-width: 0; display: flex; gap: 6px; align-items: baseline; }
  .act .label { font-weight: 600; font-size: 12px; white-space: nowrap; }
  .act .sum { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .ok { color: var(--success); font-size: 13px; text-align: center; }
  .act .ng { color: var(--danger); font-size: 13px; text-align: center; }
  .act.live .sum { color: var(--accent); }
  .say { font-size: 12.5px; color: var(--text-1); padding: 4px 8px 4px 36px; position: relative; }
  .say::before { content: ""; position: absolute; left: 14px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .say.err { color: var(--danger); }
  .review { margin: 4px 0 0 30px; border-left: 2px solid var(--warning); padding: 4px 10px; background: var(--warning-muted); border-radius: 0 8px 8px 0; font-size: 12px; }
  .review ul { margin: 4px 0 0; padding-left: 16px; color: var(--text-2); }
  .done-line { margin: 6px 0 0 30px; font-size: 12px; color: var(--success); }

  .foot { border-top: 1px solid var(--deck-line); padding: 10px 14px 12px; display: grid; gap: 8px; }
  .foot.review { background: var(--warning-muted); grid-template-columns: 1fr auto; align-items: center; }
  .foot.review .title { grid-column: 1; }
  .foot.review .btns { grid-column: 2; grid-row: 1; }

  /* 결과 보고서 모달 */
  .backdrop { position: absolute; inset: 0; background: rgba(15,23,42,.42); backdrop-filter: blur(2px); }
  .report-modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 1180px; max-width: calc(100% - 80px); height: 780px; max-height: calc(100% - 80px);
    background: var(--bg-raised); border-radius: 18px; box-shadow: 0 30px 80px rgba(15,23,42,.35); display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
  .r-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px 12px; border-bottom: 1px solid var(--border-subtle); }
  .r-head .badge { font-size: 12px; padding: 2px 9px; background: var(--warning-muted); color: var(--warning); }
  .r-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-head .meta { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
  .r-head .close { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--text-2); font-size: 18px; }
  .r-tabs { display: flex; align-items: center; gap: 6px; padding: 10px 22px 0; }
  .r-tabs .mtab { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border-default); font-size: 12.5px; color: var(--text-2); background: var(--bg-raised); }
  .r-tabs .mtab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .r-tabs .mtab .d { margin-left: 6px; opacity: .8; font-weight: 400; }
  .r-tabs .modes { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .r-tabs .modes .m { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-default); }
  .r-tabs .modes .m.on { background: var(--bg-inset); color: var(--text-1); font-weight: 600; }
  .r-tabs .modes input[type=range] { width: 120px; accent-color: var(--accent); }

  /* 보고서 — 변경 지점 여러 곳 */
  .r-main { overflow: auto; padding: 12px 22px 18px; display: grid; gap: 14px; align-content: start; }
  .overview { display: flex; gap: 14px; padding: 10px 12px; background: var(--bg-inset); border-radius: 12px; align-items: flex-start; }
  .ov-map { display: grid; gap: 5px; }
  .ov-map .nm { font-size: 11.5px; color: var(--text-2); font-weight: 600; }
  .mini { position: relative; width: 150px; height: 96px; border-radius: 8px; border: 1px solid var(--border-default); background: #86c06a; overflow: hidden; }
  .mini .w { position: absolute; background: #7fa8d8; }
  .mini .rd { position: absolute; background: #d9cda8; }
  .mini .zone { position: absolute; border: 2px solid var(--accent); border-radius: 4px; background: rgba(74,87,214,.22); }
  .mini .num { position: absolute; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; transform: translate(-50%,-50%); }
  .ov-note { font-size: 12px; color: var(--text-3); max-width: 210px; line-height: 1.45; }
  .ov-note b { color: var(--text-1); }
  .pair { display: grid; gap: 7px; }
  .pair .ph { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .pair .ph .n { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .pair .ph .mp { color: var(--text-3); }
  .pair .ph .nm { font-weight: 600; }
  .pair .ph .co { color: var(--text-3); font-family: ui-monospace, monospace; font-size: 11.5px; }
  .pair .ph .chip-pill { margin-left: auto; }
  .pair .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .map-head { position: sticky; top: -12px; z-index: 2; background: var(--bg-raised); padding: 6px 0 4px; font-size: 12px; font-weight: 700; color: var(--text-2); border-bottom: 1px solid var(--border-subtle); }
  .ledger .e .pin { font-size: 10.5px; color: var(--accent); font-weight: 700; }
  .r-body { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 0; min-height: 0; }
  .shot-wrap { display: contents; }
  .shot { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-default); aspect-ratio: 4/3; background: #7bb661 var(--shot-bg) var(--shot-pos) / var(--shot-size) no-repeat; }
  .shot .lbl { position: absolute; left: 10px; top: 8px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: rgba(255,255,255,.9); color: var(--text-1); }
  .shot .lbl.after { background: var(--accent); color: #fff; }
  .smithy { position: absolute; background: #b9834a; border: 2px solid #6b4321; box-shadow: inset 0 14px 0 #8a4a2b; }
  .smithy::after { content: ""; position: absolute; left: 40%; bottom: -1px; width: 20%; height: 32%; background: #3a2412; }
  .path { position: absolute; background: repeating-linear-gradient(90deg, #cfc4a8 0 10px, #bfb397 10px 20px); border: 1px solid #a89b7d; }
  .glow { position: absolute; inset: 0; box-shadow: inset 0 0 0 3px rgba(74,87,214,.65); border-radius: 12px; pointer-events: none; }
  .r-shots .cap { grid-column: 1 / -1; color: var(--text-3); font-size: 12px; display: flex; gap: 10px; align-items: center; }
  .r-shots .cap .chip-pill { background: var(--bg-inset); }
  .r-side { border-left: 1px solid var(--border-subtle); padding: 14px 18px; display: grid; gap: 14px; align-content: start; overflow: auto; font-size: 12.5px; }
  .r-side h4 { margin: 0 0 6px; font-size: 11px; color: var(--text-3); letter-spacing: .05em; text-transform: uppercase; }
  .ledger { display: grid; gap: 4px; }
  .ledger .e { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 5px 8px; border-radius: 8px; background: var(--bg-inset); }
  .ledger .e .k { font-weight: 700; color: var(--success); }
  .ledger .e .k.c { color: var(--warning); }
  .ledger .e .k.r { color: var(--danger); }
  .ledger .e .a { color: var(--text-3); font-size: 11.5px; }
  .ledger .e .d { color: var(--text-2); font-size: 11.5px; }
  .ledger .e .d b { color: var(--text-1); font-weight: 500; }
  .findings { border-left: 2px solid var(--warning); padding: 6px 10px; background: var(--warning-muted); border-radius: 0 8px 8px 0; }
  .findings li { margin: 2px 0; color: var(--text-2); }
  .findings .fix { color: var(--success); margin-top: 4px; }
  .r-side .lead { color: var(--text-2); line-height: 1.5; }
  .r-foot { display: flex; align-items: center; gap: 8px; padding: 12px 22px 16px; border-top: 1px solid var(--border-subtle); background: var(--warning-muted); }
  .r-foot .note { flex: 1; font-size: 12.5px; color: var(--text-1); }
  .r-foot .btn { padding: 7px 18px; font-size: 13px; }
  .foot .title { font-size: 12.5px; }
  .preview { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preview .side { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-default); background: #7bb661; height: 64px; position: relative; }
  .preview .side::before { content: attr(data-l); position: absolute; left: 6px; top: 4px; font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,.85); }
  .preview .side.after::after { content: ""; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; background: #b9834a; border: 1px solid #7a4d22; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip-pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--bg-raised); border: 1px solid var(--border-default); color: var(--text-2); }
  .btns { display: flex; gap: 6px; justify-content: flex-end; }
  .btn { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--bg-raised); font-size: 12px; font-family: inherit; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .report { font-size: 12px; color: var(--text-2); }

  /* 접힘 알약 */
  .pill { position: absolute; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; height: 36px; border-radius: 999px;
    background: var(--deck-glass); backdrop-filter: blur(20px); box-shadow: var(--deck-shadow); font-size: 12.5px; font-weight: 600; }
  .pill .st { color: var(--accent); font-weight: 400; }
  .pill .cnt { background: var(--accent); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 0 6px; line-height: 16px; }

  /* 명단 탭 */
  .roster { padding: 10px 14px 12px; display: grid; gap: 8px; overflow: auto; }
  .roster .row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 7px 10px; }
  .roster .row input { margin: 0; accent-color: var(--accent); }
  .roster .row .name { font-weight: 600; }
  .roster .row .sum { color: var(--text-3); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster .row.off .name, .roster .row.off .sum { color: var(--text-disabled); }
  .roster .head { display: flex; gap: 6px; align-items: center; }
  .roster .head h3 { margin: 0; font-size: 11px; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; flex: 1; }
  .roster textarea { width: 100%; min-height: 54px; border-radius: 6px; border: 1px solid var(--border-default); font: inherit; font-size: 12.5px; padding: 6px 8px; resize: vertical; }
  .roster label.f { display: grid; gap: 3px; font-size: 11.5px; color: var(--text-2); }

  /* 조수 레일 위 새 「팀」 버튼 표시 + 슬림 카드 (합성 오버레이) */
  .callout { position: absolute; background: #FFEB9C; color: #3a2d00; border: 1px solid #d9b83a; border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-width: 260px; }
  .callout b { display: block; }
  .marker { position: absolute; border: 2px solid #E0A400; border-radius: 10px; box-shadow: 0 0 0 4px rgba(224,164,0,.25); }
  .slim { position: absolute; background: var(--bg-raised); border: 1px solid var(--accent-border); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
  .slim .badge { font-size: 11px; }
  .slim .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slim .ph { color: var(--accent); }
  .slim .open { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .team-btn { position: absolute; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-muted); display: grid; place-items: center; color: var(--accent); }
  .team-btn::after { content: ""; position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
  .team-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get("state") ?? "running";
const bg = q.get("bg") ?? "";
const W = Number(q.get("w") ?? 1440), H = Number(q.get("h") ?? 900);
const hostLeft = Number(q.get("hostLeft") ?? 300), inset = 16, topInset = 48;
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
if (bg) { const img = document.createElement("img"); img.className = "bg"; img.src = bg; stage.append(img); }

const ICON = {
  users: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 열기 목업</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, system-ui, sans-serif; background: #10131a; color: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% -20%, #27344d, #10131a 58%); }
    .scrim { width: min(100%, 980px); padding: 32px; }
    .window { overflow: hidden; border: 1px solid #3c4a63; border-radius: 22px; background: #171c26; box-shadow: 0 30px 90px #0009, inset 0 1px #ffffff0b; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 24px 28px 18px; border-bottom: 1px solid #2b3446; }
    h1 { margin: 0; font-size: 23px; letter-spacing: -.03em; } .sub { margin: 7px 0 0; color: #aab5c8; font-size: 13px; }
    .close { border: 0; border-radius: 10px; background: #252d3c; color: #b9c4d8; font-size: 20px; width: 36px; height: 36px; }
    .toolbar { display: flex; gap: 10px; padding: 18px 28px 14px; } .search { flex: 1; position: relative; }
    input { width: 100%; border: 1px solid #3b4960; border-radius: 11px; background: #10151e; color: #fff; padding: 12px 14px 12px 38px; outline: none; font-size: 14px; }
    .search span { position: absolute; left: 14px; top: 11px; color: #7f8da4; } select, .refresh { border: 1px solid #3b4960; border-radius: 11px; background: #202938; color: #dce4f2; padding: 0 13px; }
    main { padding: 0 28px 24px; } .section-label { display: flex; justify-content: space-between; color: #8694ab; font-size: 12px; margin: 10px 0; }
    .count { color: #b4c1d7; } .grid { display: flex; flex-direction: column; gap: 10px; }
    .card { display: flex; align-items: center; gap: 16px; border: 1px solid #334057; border-radius: 15px; background: #1d2431; padding: 12px 14px; transition: border-color .15s, transform .15s; }
    .card:hover { border-color: #7ea8ff; transform: translateX(2px); } .thumb { display: grid; place-items: center; flex: none; width: 92px; height: 68px; border-radius: 11px; background: linear-gradient(135deg, #4e7d9e, #263d61); box-shadow: inset 0 1px #ffffff33, 0 5px 14px #0004; font-size: 26px; font-weight: 850; color: #ffffffcc; } .card-copy { min-width: 0; flex: 1; } .card-top { display: flex; align-items: center; gap: 9px; }
    .project-name { font-weight: 700; font-size: 16px; } .folder { margin-top: 7px; color: #8695ac; font: 12px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { color: #77dda9; background: #1a4939; border-radius: 999px; padding: 4px 8px; font-size: 11px; white-space: nowrap; } .meta { display: flex; gap: 14px; color: #9eabc0; font-size: 12px; margin: 18px 0 14px; }
    .open { flex: none; border: 0; border-radius: 10px; padding: 11px 15px; background: #6d98ff; color: #091329; font-weight: 750; cursor: pointer; } .open:hover { background: #86aaff; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-top: 1px solid #2b3446; color: #8d9bb0; font-size: 12px; } .new { border: 1px solid #4c6389; background: transparent; color: #b9d0ff; border-radius: 9px; padding: 9px 13px; }
    @media (max-width: 680px) { .scrim { padding: 10px; } .grid { grid-template-columns: 1fr; } header, main, .toolbar, footer { padding-left: 17px; padding-right: 17px; } .toolbar { flex-wrap: wrap; } select { height: 42px; } }
  </style>
</head>
<body>
  <div class="scrim">
    <section class="window" aria-label="프로젝트 열기">
      <header><div><h1>프로젝트 열기</h1><p class="sub">이 서버에서 작업할 프로젝트를 선택하세요.</p></div><button class="close" aria-label="닫기">×</button></header>
      <div class="toolbar"><label class="search"><span>⌕</span><input placeholder="프로젝트 이름 또는 폴더 경로 검색" aria-label="프로젝트 검색"></label><select aria-label="정렬"><option>최근 사용순</option><option>이름순</option><option>최근 수정순</option></select><button class="refresh" aria-label="새로고침">↻</button></div>
      <main><div class="section-label"><span>서버 프로젝트</span><span class="count">3개</span></div><div class="grid">
        <article class="card"><div class="thumb">달</div><div class="card-copy"><div class="card-top"><div class="project-name">달빛 마을</div><span class="badge">사용 가능</span></div><div class="folder">/srv/oprn-projects/moon-village</div><div class="meta"><span>맵 12개</span><span>어제 18:42</span></div></div><button class="open">열기　→</button></article>
        <article class="card"><div class="thumb" style="background:linear-gradient(135deg,#5c79a8,#2f466c)">해</div><div class="card-copy"><div class="card-top"><div class="project-name">해안의 왕국</div><span class="badge">사용 가능</span></div><div class="folder">/srv/oprn-projects/coastal-kingdom</div><div class="meta"><span>맵 28개</span><span>9월 17일</span></div></div><button class="open">열기　→</button></article>
        <article class="card"><div class="thumb" style="background:linear-gradient(135deg,#4e9b80,#245646)">새</div><div class="card-copy"><div class="card-top"><div class="project-name">새 프로젝트</div><span class="badge">사용 가능</span></div><div class="folder">/srv/oprn-projects/new-project</div><div class="meta"><span>맵 1개</span><span>9월 12일</span></div></div><button class="open">열기　→</button></article>
      </div></main>
      <footer><span>접속 중: 192.168.0.24 · 프로젝트 호스트</span><button class="new">＋ 새 프로젝트 만들기</button></footer>
    </section>
  </div>
</body>
</html>
